kind: 'Fixed'
body: 'fixed the GitLab CI release job cutting no release in a repository with no `CHANGELOG.md`: the request body, put together by hand, read `"description": ,`, which the releases API refused while the job still passed. The body is now built with `jq`, which the job already installs, so every value is escaped and the description is empty when there are no notes'
