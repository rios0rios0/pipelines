inputs:
  python_version:
    required: false
    default: '3.14'
    description: 'Python version to use'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: 'Setup Python'
      uses: 'actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0' # v7.1.0
      with:
        python-version: "${{ inputs.python_version }}"

    - name: 'Install PDM and dependencies'
      run: |
        python -m pip install --only-binary :all: "pdm==2.29.3" "unearth==0.18.3"
        pdm install -v
      shell: 'bash'

    - name: 'Run Safety SCA scan'
      run: pdm run safety-scan
      shell: 'bash'
