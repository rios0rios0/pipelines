kind: 'Fixed'
body: 'fixed `require-checks` discarding every transport failure it raised. The fetch was piped into `jq -s ''.''`, a pipeline reports the status of its RIGHT-hand side, and `jq -s` answers `[]` on empty input -- so a missing token, an unreadable repository or a refused request all surfaced as "no successful check", i.e. as a commit whose tests had failed rather than as a job that was misconfigured. `pipefail` is not POSIX, so the pipeline is what went: the fetch writes to a file, its status is tested, and only then is the file folded into the array. The existing "names a missing token" assertion could not see this -- both paths exit 1 -- and is now paired with one that asserts the refusal is *not* worded as a red commit. **The fold is checked too, and that one is a fail-OPEN**: `jq -s` truncates its target before it fails, so a stream it cannot assemble leaves the checks file empty -- and an empty file did not make the gate refuse, it made the gate PASS, because `jq ... | length` prints nothing, the per-name test becomes `[ "" -eq 0 ]`, POSIX `sh` answers "Illegal number" with status 2, and `if` reads that as false and takes the branch that prints `OK`. Every required check reported as passing on a commit whose check runs were never read. The count now fails closed on anything that is not a number as well, because a gate whose failure mode is "approve everything" does not get to rely on one guard'
