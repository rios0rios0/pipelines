name: 'CodeQL'

# This repository's OWN code scanning, moved off GitHub's default setup.
#
# Default setup analyses `actions`, `go` and `python` here and needs no file to do it, which is
# exactly why it was the right choice until it was not: it gives the analysis no environment of
# its own. Its runner ships one Go and the CodeQL action sets `GOTOOLCHAIN=local` on purpose, so
# a module whose `go` directive has moved past that image cannot even be resolved -- ten
# consecutive red runs on `main` and on every pull request, reported as a *configuration error*
# rather than as a finding.
#
# There is no version knob in default setup and no file to put one in. Advanced setup is the
# knob. Nothing about the analysis is weakened by the move: the same three languages, the same
# default query suite, the same weekly cadence.
#
# **The action is referenced by LOCAL PATH, not `rios0rios0/pipelines/...@main`.** Two reasons,
# both of which cost a CI cycle to learn: `@main` resolves to the action as published on the
# default branch, so a pull request that changes the action tests the OLD copy and reports
# green on code nobody ran; and an external `uses:` has to be pinned to a commit SHA, which
# SonarCloud's `githubactions:S7637` flags as a high-severity finding when it is a branch name.
# A local path is neither -- it is this commit's own code, which is the thing under test.
#
# The local path is also why `actions/checkout` runs here: a `./`-referenced action has to exist
# on disk before the runner can resolve it, and the composite's own checkout happens too late to
# help. The second checkout inside the action is harmless.

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  # Default setup ran weekly. Keeping that cadence matters for a reason unrelated to this
  # repository's own code: CodeQL ships new queries continuously, so a scheduled run is what
  # finds a vulnerability class that was not modelled on the day the code was last touched.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: 'read'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  analyze:
    name: 'Analyze (${{ matrix.language }})'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      # `security-events: write` is what the SARIF upload needs, and it is granted to this job
      # rather than to the workflow so a step added later does not inherit it.
      security-events: 'write'
      actions: 'read'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two of the three default setup was configured with. `go` is absent on purpose and
        # the job below says so out loud -- see it for why, and for when it comes back.
        language: [ 'actions', 'python' ]
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - uses: './github/global/stages/20-security/codeql'
        with:
          codeql_language: '${{ matrix.language }}'
          # The only Go module here is the tor-proxy health probe, and its directive is what
          # decides the toolchain. A repository with its module at the root takes the default.
          go_version_file: 'global/containers/tor-proxy.latest/health/go.mod'

  # `go` IS NOT ANALYSED, AND THIS JOB EXISTS TO SAY SO RATHER THAN LET IT PASS QUIETLY.
  #
  # No RELEASED CodeQL bundle can read this repository's Go module. The extractor refuses a
  # language version newer than the Go it was itself built with:
  #
  #   health/main.go:1:1: package requires newer Go version go1.27 (application built with go1.26)
  #
  # and no toolchain step can fix that -- `actions/setup-go` does put Go 1.27.0 on PATH (verified:
  # "Successfully set up Go version 1.27.0", autobuilder reporting "environment has go1.27.0"),
  # but the extractor is a prebuilt binary inside the bundle. Upstream merged "Go 1.27 is now
  # supported" on 2026-06-25 and `go/extractor/go.mod` reads `go 1.27` on `main`; it is simply not
  # released yet -- `codeql-cli/v2.26.3`, the newest, still reads `go 1.26`.
  #
  # The two rejected alternatives, and why:
  #
  #   - leaving the leg in with `continue-on-error` produces a GREEN `Analyze (go)` check over an
  #     analysis that did not run, which is precisely the silent-pass shape the test suites in
  #     this repository exist to refuse;
  #   - lowering the module's `go` directive to suit the scanner would buy a green run by giving
  #     up what the module is entitled to use, and would have to be paid again every release.
  #
  # So the gap is declared instead. Expires 2026-11-01, enforced by
  # `.github/tests/test-go-module-toolchain.sh`, which fails `make test` once that date passes.
  go-analysis-waived:
    name: 'Analyze (go) — waived, CodeQL cannot read go 1.27 yet'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 'Announce the gap'
        run: |
          echo '::warning title=Go is not being analysed::CodeQL has no released bundle whose Go extractor can read a `go 1.27` module. Support is merged upstream but unreleased. Waiver expires 2026-11-01.'
          {
            echo '### Go code scanning is waived'
            echo ''
            echo 'No released CodeQL bundle can extract this repository'"'"'s Go module:'
            echo 'the extractor refuses a language version newer than the Go it was built'
            echo 'with, and `codeql-cli/v2.26.3` is built with `go 1.26`.'
            echo ''
            echo 'Upstream merged Go 1.27 support on 2026-06-25; it is not in a release yet.'
            echo ''
            echo '**Expires 2026-11-01.** To check whether it can be lifted:'
            echo ''
            echo '```'
            echo 'gh api repos/github/codeql/contents/go/extractor/go.mod?ref=codeql-cli/vX.Y.Z \'
            echo '  --jq .content | base64 -d | grep "^go "'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
