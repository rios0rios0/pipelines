# Flutter application delivered as downloadable artifacts: a web bundle and
# Android APK/AAB.
#
# GitHub's `ubuntu-latest` runners already ship the Android SDK and a JDK, so the
# Android target works out of the box -- unlike the GitLab equivalent, where the
# runner image is the consumer's choice and cannot be assumed to carry them.
#
# `ipa` is not built here: it needs a `macos-latest` runner and, to be
# installable, a signing identity and provisioning profile that belong to the
# consuming project rather than to a shared template. Add a job with
# `targets: ipa` when you have them -- and give it a SECOND input,
# `runs_on_macos`, defaulting to `'["macos-latest"]'`, rather than hardcoding the
# runner. `runs_on` carries one value for the whole workflow, so a job on another
# platform cannot share it; and `test-workflow-composition.sh` rejects a pinned
# runner outright, because a hard `runs-on` is what strands a consumer whose
# hosted minutes are gone. Resolving from a declared input is the contract, not
# resolving from that particular input.
on:
  workflow_call:
    inputs:
      flutter_version:
        required: false
        type: 'string'
        default: ''
      build_web:
        required: false
        type: 'boolean'
        default: true
      build_android:
        required: false
        type: 'boolean'
        default: true
      android_targets:
        required: false
        type: 'string'
        default: 'apk appbundle'
        description: "APK is sideloadable for QA; App Bundle is the only format Google Play accepts for new releases."
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: 'JSON array of runner labels (e.g. ''["self-hosted"]''). See dart.yaml.'
      test_build_targets:
        required: false
        type: 'string'
        default: ''
        description: |
          Forwarded to `dart.yaml`: build targets for `tests > test:build` (e.g. 'web'), empty
          auto-detecting from the project's shape. The GitHub spelling of the
          `DART_TEST_BUILD_TARGETS` the GitLab and Azure DevOps templates take.

          Forwarded rather than dropped for the reason the composition standard gives about
          `runs_on` -- an input a composed workflow does not declare is an input its consumers
          cannot reach at all, and the pipeline then looks identical to the base one while
          silently offering less.
      test_build_mode:
        required: false
        type: 'string'
        default: '--debug'
        description: "Forwarded to `dart.yaml`: Flutter build mode for `tests > test:build`."
      test_build_args:
        required: false
        type: 'string'
        default: ''
        description: 'Forwarded to `dart.yaml`: extra arguments for the `tests > test:build` build.'
      test_build_command:
        required: false
        type: 'string'
        default: ''
        description: |
          Forwarded to `dart.yaml`: escape hatch running this command instead of the shared build
          runner, for a build that is a command rather than a target.
      test_build_node_version:
        required: false
        type: 'string'
        default: ''
        description: 'Forwarded to `dart.yaml`: Node.js version for `test_build_command`, empty installing none.'

# `ubuntu-latest` carries the tools the Dart scripts need (see the same note in dart.yaml) AND
# the Android SDK and a JDK; a bare self-hosted runner selected through `runs_on` carries none of
# them. `delivery-android` is the job that makes this more than a provisioning chore: the Android
# SDK is not something a shared template will install ad hoc, because an unattended `sdkmanager`
# licence acceptance inside a CI job is a supply-chain decision belonging to the consuming
# project. Point `runs_on` at a runner that already has it, or leave the default.

jobs:
  dart:
    uses: 'rios0rios0/pipelines/.github/workflows/dart.yaml@main'
    with:
      flutter_version: ${{ inputs.flutter_version }}
      toolchain: 'flutter'
      runs_on: ${{ inputs.runs_on }}
      test_build_targets: ${{ inputs.test_build_targets }}
      test_build_mode: ${{ inputs.test_build_mode }}
      test_build_args: ${{ inputs.test_build_args }}
      test_build_command: ${{ inputs.test_build_command }}
      test_build_node_version: ${{ inputs.test_build_node_version }}

  # fourth stage
  delivery-release:
    name: 'delivery > release'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: 'release'
        uses: 'rios0rios0/pipelines/github/global/stages/40-delivery/release@main'
    needs: [ 'dart' ]
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, 'chore/bump-') || contains(github.event.head_commit.message, 'chore(bump)'))"

  delivery-web:
    name: 'delivery > delivery:web'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/dart/stages/40-delivery/build@main'
        with:
          flutter_version: ${{ inputs.flutter_version }}
          toolchain: 'flutter'
          targets: 'web'
    needs: [ 'dart' ]
    if: "inputs.build_web && !failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))"

  delivery-android:
    name: 'delivery > delivery:android'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/dart/stages/40-delivery/build@main'
        with:
          flutter_version: ${{ inputs.flutter_version }}
          toolchain: 'flutter'
          targets: ${{ inputs.android_targets }}
    needs: [ 'dart' ]
    if: "inputs.build_android && !failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))"
