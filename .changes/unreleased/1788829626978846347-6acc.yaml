kind: 'Added'
body: 'added a `Test Results` check run to the Dart/Flutter GitHub pipeline: `tests > test:all` in `dart.yaml` now publishes the suite through the same `dorny/test-reporter` that `go.yaml` and `yarn.yaml` use, every test listed and every failure annotated at the line its stack trace names. It reads a new `build/reports/test-results.json`, the package:test event stream that the runner''s `filter_test_events.py` strips of pub''s progress lines and flutter_tools'' array-shaped events (`flutter test --machine` shares stdout with both, ten such lines on one real run, and the action''s Dart parser fails the whole report on the first line it cannot parse), through the action''s native `dart-json` reporter rather than `java-junit` over `tojunit`''s XML, whose class names are the runner''s absolute path with the separators turned into dots and annotate nothing. The step is non-fatal, so a caller that grants no `checks: write`, or a pull request from a fork, sees a warning and keeps the JUnit in the `test-results` artifact; GitLab CI and Azure DevOps keep reading that JUnit as before'
time: '2026-09-08T01:07:06.978742597Z'
