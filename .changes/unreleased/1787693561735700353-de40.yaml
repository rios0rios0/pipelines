kind: 'Changed'
body: 'changed the changelog to [chlog](https://github.com/luizjhonata/chlog) fragments: a change now writes its own YAML file under `.changes/unreleased/` through `chlog new --kind <Kind> --body "..."`, and `CHANGELOG.md` is GENERATED from them at release time by `chlog batch auto && chlog merge`. That is the one thing a single shared file cannot do — two branches each adding an entry no longer touch the same lines, so a rebase that used to conflict on `CHANGELOG.md` now conflicts on nothing. The 87 entries standing under `[Unreleased]` were carried across one fragment each, word for word and in their original order; the migration was verified by compiling the fragments back with `chlog batch` and diffing the result against the file they came from, so the next release renders the same document. The 4 entries marked `**BREAKING CHANGE:**` carry `breaking: true`, which under SemVer is the only thing that bumps the major — a kind never does. AutoBump already reads the fragments directly, so the release flow is unchanged.'
