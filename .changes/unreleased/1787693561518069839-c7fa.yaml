kind: 'Security'
body: '**a consumer''s pin now reaches the scripts, not just the templates.** All three `scripts-repo` abstracts cloned the default branch with no ref, so a consumer pinning `uses: rios0rios0/pipelines/...@4.23.0` got the workflow file from the tag and every SCRIPT it executed from `main`. Pinning the entry point while the payload floats is worse than not pinning, because it reads as covered. The GitHub action follows `github.action_ref`; GitLab and Azure DevOps take a `PIPELINES_REF` variable (still defaulting to `main`, so nothing changes for a consumer who has not opted in). All three accept a branch, a tag **or a commit SHA** -- `git init` + `git fetch <ref>` rather than `git clone --branch`, which rejects a raw SHA -- and each prints the commit it resolved, so a job log alone answers "which scripts did this run execute?"'
