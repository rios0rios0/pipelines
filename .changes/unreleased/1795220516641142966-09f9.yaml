kind: 'Added'
body: 'added `test_shards` to `yarn.yaml`, and to `yarn-cloudflare.yaml`, `yarn-docker.yaml` and `yarn-library.yaml`, which pass it on: above 1, the tests stage runs the suite as that many `tests > test:all (shard <i>/<n>)` jobs of `yarn test:ci:shard --shard=<i>/<n>`, each handing its `coverage/coverage-final.json` on as an artifact, and `tests > test:all` waits for every shard, fails when one did, merges their coverage with `yarn test:ci:merge` and reports it as before; `1`, the default, keeps the single job. `tests > test:all` keeps its name in both modes, so required checks and `deployment_required_checks` entries keep working, and it runs after a failed shard in order to fail, since a skipped job would pass a required check. The project defines both scripts (README.md, "Splitting `test:all` Across Runners"). It is GitHub Actions only, and `make test ONLY=yarn-test-shards` holds it'
