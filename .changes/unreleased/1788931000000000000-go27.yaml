kind: 'Changed'
body: 'upgraded Go to 1.27.1 everywhere this repository pins a toolchain, and the Go dependencies with it. The trigger was a real breakage rather than housekeeping: `test-go-script` began failing on every pull request because `github.com/wadey/gocovmerge` predates modules, so `go install` must resolve `golang.org/x/tools/cover` unpinned -- and `golang.org/x/tools@v0.50.0`, published between 2026-09-08 and 2026-09-09, requires go >= 1.26.0 while `ci.yaml` pinned `go-version: 1.25` and CI runs `GOTOOLCHAIN=local`, so it could not fetch another. Nothing in the repository changed; the newest resolvable version of an unpinned transitive dependency did. Bumped: this repository''s own GitHub runners (`ci.yaml` 1.25, `terra.yaml` 1.24 twice), the Azure DevOps `GoTool` (1.27.0), the GitLab images (`golang:1.26.4-bookworm` and `golang:1.26.6-bookworm` in the Go abstract and the binary delivery job, `golang:1.24` in the terra abstract) each re-pinned to a freshly resolved digest, and the `health` module (`go 1.27.0` -> `go 1.27.1`, `sirupsen/logrus` v1.10.1 -> v1.10.2, `golang.org/x/sys` v0.47.0 -> v0.48.0). The `tor-proxy.latest` builder moved to `golang:1.27.1-alpine3.24` IN THE SAME CHANGE, because `test-go-module-toolchain.sh` enforces exactly that pairing -- a `go` directive is a minimum language version and every toolchain older than it refuses the module before parsing, which is the failure that kept `Build & Push tor-proxy:latest` broken for three weeks. Also took `govulncheck` v1.7.0 -> v1.8.0, the one Go pin the repository''s own `check-dependency-updates` flagged. `global/containers/golang.1.26-awscli` is deliberately NOT bumped: its version is in the published tag `ghcr.io/rios0rios0/pipelines/golang:1.26-awscli`, so moving it renames an artifact three files consume -- one of them by a digest that cannot be computed until CI has built and pushed the new image -- and that is a migration of its own rather than a version bump'
