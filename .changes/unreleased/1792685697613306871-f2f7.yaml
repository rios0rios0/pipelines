kind: 'Fixed'
body: 'fixed `require-checks` refusing a branch deploy whose checks had all passed when GitHub had not yet finalized one of their check runs: during the 2026-10-22 GitHub Actions incident a finished CodeQL job kept an `in_progress` check run for almost an hour after the job waiting on it had started, so the gate read a pending check and failed the deploy. The gate takes an optional `needs` input, and every `<toolchain>-<provider>.yaml` passes `toJSON(needs)`: a branch run verifying its own commit requires each job the deployment needs to have finished `success` and reads no check runs. A tag still reads check runs, because there the checks are skipped and the workflow holding them reports `success` regardless, and so does a run verifying another commit or one that passes no `needs`'
time: '2026-10-22T16:14:57.613243762Z'
