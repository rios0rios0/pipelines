stages:
  - stage: 'management'
    displayName: 'management'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    jobs:
      - template: '../../../global/stages/35-management/sonarqube.yaml'
        parameters:
          COVERAGE_ARTIFACT_TARGET_PATH: "$(Build.SourcesDirectory)/build/reports"

      # NOTE: there is no `report:dependency-track` job for Dart.
      # Dependency-Track ingests CycloneDX, and pub has no native CycloneDX
      # generator — `package:sbom` emits SPDX, and `cdxgen` would drag a whole
      # Node.js toolchain into a Dart job — so the BOM was produced by
      # `trivy fs --format cyclonedx`. Trivy has been removed from this
      # repository, so the job was removed rather than left calling a script
      # that no longer exists. `sca:osv-scanner` still covers the
      # vulnerability scanning; only the BOM upload is gone.
