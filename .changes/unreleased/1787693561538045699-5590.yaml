kind: 'Fixed'
body: 'fixed the three remaining Azure DevOps jobs that could not start at all -- `style:tflint`, `test:all` and `test:validate` on the `terra` template -- each failing with `The step name Scripts appears more than once. Step names must be unique within a job.` All three included `global/abstracts/scripts-repo.yaml` directly *and* `abstracts/terra.yaml`, which already brings it, so each declared the step `Scripts` twice. This is a COMPILE-time rejection, so nothing in the job ran and the error named the job rather than the include that caused it. Same defect as the `sca:govulncheck` fix above, and the reason it keeps recurring is that neither file is wrong on its own -- the defect exists only in their combination, which no single file shows'
time: '2026-08-25T21:32:41.537999037Z'
