kind: 'Changed'
body: 'replaced the Claude review''s plugin invocation with three deterministic tag-mode jobs -- `claude-review`, `security-review` and `design-review` -- under the one reusable workflow, modelled on OneRedOak/claude-code-workflows. Research across public GitHub found no CI workflow using the `code-review` plugin, and the upstream tracker holds the explanation: the Action ends the session mid-turn while the plugin''s subagents are still running (anthropics/claude-code-action#1515, measured at 30-43% of runs; #1646), and a prompt-level instruction was already shown upstream not to prevent it. Every observed silent run here had orphaned subagents; every run whose subagents completed posted. Tag mode reviews inline (no subagents to orphan) and its tracking comment is created by the action before Claude runs, so a dead run is visible instead of silent. The prompts keep the plugin''s two valuable ideas as in-session methodology -- the 4-agent pipeline as sequential passes and the >=80 confidence filter with dropped findings listed -- plus the post-on-every-run and verify-previous-findings disciplines. Full forensics recorded in `.docs/claude-review.md`, which the workflow references.'
