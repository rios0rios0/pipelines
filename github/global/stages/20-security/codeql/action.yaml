inputs:
  codeql_language:
    description: 'CodeQL language to analyze (e.g., go, python, java-kotlin, javascript-typescript, csharp)'
    required: true
  go_version_file:
    description: |
      Path to the `go.mod` whose `go` directive decides which Go the Go analysis runs with.
      Only consulted when `codeql_language` is `go`.

      **A FILE, not a version, and that is the whole point.** The `go` directive is a MINIMUM
      LANGUAGE VERSION, and every `go` invocation refuses a directive newer than itself --
      before parsing, so `go mod tidy`, `go get` and the extractor's own `packages.Load` all
      die identically on `go.mod requires go >= X (running go Y; GOTOOLCHAIN=local)`. The
      CodeQL runner ships one Go and sets `GOTOOLCHAIN=local` deliberately, so it cannot fetch
      another: a module that has moved ahead of that image is not analysed at all, and CodeQL
      reports it as a *configuration error* rather than as a finding -- which reads like a
      broken scanner rather than a module the scanner could not open.

      Pinning a version here would only move the drift somewhere else. Reading the module's own
      directive means the toolchain follows the requirement automatically: a bump to the next
      Go needs no change in this file, and the analysis can never be older than the code.

      Set to an empty string to skip the toolchain step entirely and take whatever Go the
      runner image happens to carry, which is what this action did before.
    required: false
    default: 'go.mod'
  upload:
    description: |
      Whether to upload the SARIF results to code scanning ('always', 'failure-only' or 'never').
      The upload is best-effort and never decides the job: it runs after the gate, even when the
      gate failed, and a refused upload -- code scanning needs GitHub Advanced Security on a
      private repository -- fails nothing. 'failure-only' uploads only when the job is failing,
      and 'never' skips the upload, which is the sensible setting where code scanning cannot take
      it. Whatever this says, the job fails on every finding the repository's
      `.codeql-false-positives` does not list, exactly as `make codeql` does.
    required: false
    default: 'always'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: 'Load Custom Configuration'
      if: inputs.codeql_language == 'go'
      run: |
        INIT_SCRIPT="config.sh"
        if [ -f "$INIT_SCRIPT" ]; then
          env_before=$(mktemp)
          env | sort > "$env_before"
          . ./"$INIT_SCRIPT"
          env | sort | comm -13 "$env_before" - >> "$GITHUB_ENV"
          rm -f "$env_before"
        else
          echo "The '$INIT_SCRIPT' file was not found, skipping..."
        fi
      shell: 'bash'

    # BEFORE `init`, because the extractor resolves `go` from PATH at build time and the
    # database is initialised against whatever is there. A toolchain installed afterwards is a
    # toolchain nothing used.
    #
    # A MISSING file is not an error: a consumer whose module lives elsewhere sets
    # `go_version_file`, and failing here would turn "your go.mod moved" into a broken security
    # scan -- which is the failure mode this step exists to remove, not to reproduce.
    - name: 'Resolve the Go toolchain the module requires'
      id: 'go_toolchain'
      if: "inputs.codeql_language == 'go' && inputs.go_version_file != ''"
      run: |
        resolved=''
        if [ -f "$GO_VERSION_FILE" ]; then
          resolved="$GO_VERSION_FILE"
        else
          # The named file is absent, so LOOK for the module rather than shrugging. A consumer
          # calling this through `go.yaml` may never pass a path, so without this a repository
          # whose module sits one directory down would silently take the runner's Go and hit the
          # very failure this step exists to prevent, with nothing in the log saying why.
          #
          # `vendor/` is excluded because a vendored tree carries its own `go.mod` files that
          # are not the module being built; `.git` because a packfile is not a module.
          found="$(find . -name go.mod -not -path './.git/*' -not -path '*/vendor/*' 2> /dev/null | sort)"
          count="$(printf '%s' "$found" | grep -c . || true)"
          if [ "$count" -eq 1 ]; then
            resolved="$(printf '%s' "$found" | sed 's|^\./||')"
            echo "No '$GO_VERSION_FILE'; found exactly one module and using it: $resolved"
          elif [ "$count" -eq 0 ]; then
            echo "No '$GO_VERSION_FILE' and no go.mod anywhere; taking the runner's own Go."
          else
            # Refusing to guess is the point: picking one of several modules would set the
            # toolchain from a module that is not the one under analysis, which is a wrong
            # answer wearing the costume of a right one.
            echo "::warning title=Go toolchain not resolved::Found $count go.mod files and none at '$GO_VERSION_FILE'. Set 'go_version_file' to the module CodeQL should analyse, or the runner's own Go is used and a module requiring a newer one cannot be extracted."
            printf '%s\n' "$found"
          fi
        fi

        if [ -n "$resolved" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "file=$resolved" >> "$GITHUB_OUTPUT"
          echo "Go analysis will use the toolchain '$resolved' asks for:"
          grep -E '^(go|toolchain) ' "$resolved" || true
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi
      shell: 'bash'
      env:
        GO_VERSION_FILE: "${{ inputs.go_version_file }}"

    - name: 'Set up Go'
      if: "steps.go_toolchain.outputs.present == 'true'"
      uses: 'actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e' # v7.0.0
      with:
        go-version-file: "${{ steps.go_toolchain.outputs.file }}"
        # The analysis compiles the module once and the runner is thrown away; a cache keyed on
        # a lockfile this action never resolves would cost more to warm than it saves.
        cache: false

    # `make codeql` hands a project's `codeql-config.yml` to `database create`, so the analysis here
    # reads it too: a gate that scanned what the project excludes locally would fail on findings
    # nobody can reproduce. An empty output is no configuration, which `init` reads as unset.
    - name: 'Find the Project CodeQL Configuration'
      id: 'codeql_config'
      run: |
        if [ -f 'codeql-config.yml' ]; then
          echo 'Using project CodeQL config: codeql-config.yml'
          echo 'file=./codeql-config.yml' >> "$GITHUB_OUTPUT"
        fi
      shell: 'bash'

    - name: 'Initialize CodeQL'
      uses: 'github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d' # v4.38.3
      with:
        languages: ${{ inputs.codeql_language }}
        # The suite `run.sh` analyses with (`<language>-security-and-quality.qls`), so this job
        # fails on what `make codeql`, GitLab CI and Azure DevOps fail on. The action's default
        # suite keeps only high-precision security queries and would pass findings a local scan
        # reports -- a medium-precision rule such as `go/log-injection` is never even run.
        queries: 'security-and-quality'
        config-file: "${{ steps.codeql_config.outputs.file }}"

    - name: 'Autobuild'
      uses: 'github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d' # v4.38.3

    # Analysis only. The upload is a step of its own below, so code scanning being unavailable can
    # never be what fails this one; the database upload is skipped where nothing may be uploaded.
    - name: 'Perform CodeQL Analysis'
      id: 'analyze'
      uses: 'github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d' # v4.38.3
      with:
        category: "/language:${{ inputs.codeql_language }}"
        output: "${{ runner.temp }}/codeql-sarif"
        upload: 'never'
        upload-database: "${{ inputs.upload != 'never' }}"

    # The verdict. `analyze` fails only when the analysis itself fails, never on a finding, so
    # before this step a job whose results went nowhere -- `upload: 'never'`, or an upload code
    # scanning refused -- passed whatever CodeQL found. The script is the gate `make codeql`, GitLab
    # CI and Azure DevOps run, reached through this action's own path so it is always the revision
    # the action was resolved at: the checkout under test for a `./` reference, and for `@<ref>` the
    # archive the runner unpacked this file from.
    - name: 'Gate on Findings'
      env:
        SARIF_DIRECTORY: "${{ steps.analyze.outputs.sarif-output }}"
      run: "\"$GITHUB_ACTION_PATH/../../../../../global/scripts/tools/codeql/gate.sh\" \"$SARIF_DIRECTORY\""
      shell: 'bash'

    # Best effort, and only once the gate has decided: it also runs when the gate failed, so code
    # scanning shows what failed the job wherever it exists, and `continue-on-error` keeps a refused
    # upload -- no code scanning on a private repository without GitHub Advanced Security, or a
    # processing error -- from failing a job whose scan passed.
    - name: 'Upload Results to Code Scanning'
      if: "always() && steps.analyze.outcome == 'success' && (inputs.upload == 'always' || (inputs.upload == 'failure-only' && failure()))"
      continue-on-error: true
      uses: 'github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d' # v4.38.3
      with:
        sarif_file: "${{ steps.analyze.outputs.sarif-output }}"
        category: "/language:${{ inputs.codeql_language }}"
