kind: 'Added'
body: 'added the `integration_env` input to `go.yaml`, `go-docker.yaml`, `go-flyio.yaml` and `go-render.yaml`: dotenv-style `KEY=value` lines that the Go test action hands to `run.sh` as `GO_TEST_INTEGRATION_ENV`, which exports them into the integration phase''s `go test` only -- the go command, the compiler and the test binaries inherit them, the unit phase does not. It is meant for `GOMEMLIMIT`, `GOGC` and `GOMAXPROCS`: one test package with hundreds of files can need more memory to compile than the runner allows the job, and a `GOMEMLIMIT` keeps the compiler under that ceiling at the cost of more GC CPU. Each value reaches the environment verbatim and is never parsed as shell, blank and `#` lines are skipped, and a line that is not `NAME=value` fails the job before the unit phase runs, naming its line number but not its text. Empty, the default, changes nothing. On GitLab CI and Azure DevOps a `GO_TEST_INTEGRATION_ENV` variable (or an entry of the Azure DevOps `TEST_ENV` parameter) reaches the runner without any template change'
