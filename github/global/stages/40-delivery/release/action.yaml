inputs:
  tag_prefix:
    required: false
    default: ''
    description: 'Tag prefix to use for this release (e.g., "v", "app/"). Leave empty for no prefix.'
  promote:
    required: false
    default: 'false'
    description: |
      `true` dispatches the CALLING workflow on the tag this action has just created, so the tag
      run -- a production deploy, a versioned image, whatever the caller does only on a tag --
      starts without anyone pushing the tag by hand. The tag is created with the job's
      `GITHUB_TOKEN`, and GitHub starts no run from an event that token caused; `workflow_dispatch`
      is the exception it carves out, and the run it starts has `github.ref_type == 'tag'` exactly
      as a pushed tag's would. Needs `on: workflow_dispatch:` in the calling workflow and
      `actions: write` on the calling job. Never dispatches from a tag ref: that run IS the
      promotion. See `global/scripts/shared/promote-release.sh`.

outputs:
  tag_name:
    description: 'The tag name created by the release'
    value: ${{ steps.extract.outputs.tag_name }}

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - id: 'extract'
      name: 'Extract Release Version'
      shell: 'bash'
      run: |
        set -eu

        VERSION=""

        # Recovery / reconciliation path: when the workflow is triggered by a
        # version tag push, derive the version straight from the tag ref. This
        # lets a bump whose main-branch run failed the quality gate be re-cut by
        # simply (re-)pushing its version tag — the gate jobs skip on tags, so
        # only this delivery step runs. Handles "v"-prefixed tags and the
        # four-segment fork variant (X.Y.Z.N / X.Y.Z-N).
        case "${GITHUB_REF:-}" in
          refs/tags/*)
            VERSION="$(printf '%s' "${GITHUB_REF_NAME:-}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([.-][0-9]+)?' | head -n 1)"
            ;;
        esac

        # Delivery path: extract the version from the bump commit merged to main.
        # GitHub PR merge format: "Merge pull request #XX from repository/chore/bump-X.X.X"
        # Conventional commit format: "chore(bump): bumped version to X.X.X"
        if [ -z "$VERSION" ]; then
          COMMIT_MESSAGE="$(git log -1 --pretty=%B)"
          if echo "$COMMIT_MESSAGE" | grep -Eq "chore/bump-[0-9]+\.[0-9]+\.[0-9]+"; then
            VERSION=$(echo "$COMMIT_MESSAGE" | grep -oE "chore/bump-[0-9]+\.[0-9]+\.[0-9]+" | head -n 1 | sed 's/chore\/bump-//')
          elif echo "$COMMIT_MESSAGE" | grep -Eq "chore\(bump\):.*version to [0-9]+\.[0-9]+\.[0-9]+"; then
            VERSION=$(echo "$COMMIT_MESSAGE" | grep -oE "version to [0-9]+\.[0-9]+\.[0-9]+" | head -n 1 | sed 's/version to //')
          fi
        fi

        if [ -n "$VERSION" ]; then
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT
        else
          echo "$(date "+%Y-%m-%d %H:%M:%S") - Commit is not a bump and ref is not a version tag, not creating a release..."
          echo "skip_release=true" >> $GITHUB_OUTPUT
        fi

    # The tag is pushed from THIS checkout, so it points at the commit this run verified --
    # `github.sha`, the bump merge -- and not at wherever `main` is by the time this job runs.
    # `action-gh-release` alone creates the tag through the Releases API, which defaults the
    # target to the default branch's CURRENT head, and the release job runs after the whole
    # quality gate. Measured on medhub-life/frontend on 2026-09-14: a second pull request merged
    # during the 36 minutes the gate took, the 0.3.0 tag landed on it, the promotion dispatched
    # on that commit, and `require-checks` refused it because its own `main` run had not even
    # started -- nothing shipped, and the tag labelled an unreleased change.
    #
    # Pinning through the API's `target_commitish` was rejected: with the job's `GITHUB_TOKEN`
    # a release against a commit that is no longer the branch head answers
    # `403 Resource not accessible by integration` (softprops/action-gh-release#411), which is
    # exactly the case this step exists for. A `git push` of the tag has no such rule, and the
    # checkout above already carries the token.
    #
    # A tag that already exists is kept, wherever it points: that is the recovery path (a tag
    # pushed by hand before the run, a re-run after the tag was cut), and `action-gh-release`
    # attaches the release to it exactly as before. Any other refusal fails here, by name,
    # rather than falling through to a tag on the wrong commit. Only from a branch ref: on a
    # tag ref the tag is the trigger.
    - name: 'Create Tag'
      shell: 'bash'
      run: |
        set -eu
        git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
        if git push origin "refs/tags/$RELEASE_TAG"; then
          echo "Tag '$RELEASE_TAG' created on $GITHUB_SHA."
        elif remote_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)" && [ -n "$remote_sha" ]; then
          echo "Tag '$RELEASE_TAG' already exists on ${remote_sha}; the release attaches to it as it is."
        else
          echo "::error::could not push tag '$RELEASE_TAG' to $GITHUB_REPOSITORY. The job needs 'contents: write', and no ruleset may reserve tag creation to other actors." >&2
          exit 1
        fi
      env:
        RELEASE_TAG: '${{ inputs.tag_prefix }}${{ steps.extract.outputs.tag_name }}'
      if: "steps.extract.outputs.skip_release != 'true' && startsWith(github.ref, 'refs/heads/')"

    - name: 'Create Release'
      uses: 'softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64' # v3.0.3
      with:
        draft: false
        prerelease: false
        tag_name: "${{ inputs.tag_prefix }}${{ steps.extract.outputs.tag_name }}"
        generate_release_notes: true
      if: "steps.extract.outputs.skip_release != 'true'"

    # Both steps run only when the caller opted in, and only from a branch ref: on a tag ref this
    # run IS the promotion (the recovery path above), and dispatching it again would loop. The
    # scripts checkout is deferred to here so a caller that does not promote pays nothing for it.
    - name: 'Get Scripts'
      uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'
      if: "inputs.promote == 'true' && steps.extract.outputs.skip_release != 'true' && startsWith(github.ref, 'refs/heads/')"

    - name: 'Promote Release'
      shell: 'bash'
      run: $SCRIPTS_DIR/global/scripts/shared/promote-release.sh
      env:
        PROMOTE_TAG: '${{ inputs.tag_prefix }}${{ steps.extract.outputs.tag_name }}'
        GH_TOKEN: '${{ github.token }}'
      if: "inputs.promote == 'true' && steps.extract.outputs.skip_release != 'true' && startsWith(github.ref, 'refs/heads/')"
