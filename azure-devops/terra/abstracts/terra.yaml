# Installs the terra CLI (https://github.com/rios0rios0/terra) which wraps
# Terraform and Terragrunt. After installation, `terra install` pulls the
# correct versions of both tools automatically.
steps:
  # `scripts-repo` is what puts $(Scripts.Directory) in scope for the installer
  # below, which replaces the vendor's `curl ... | sh` one-liner.
  - template: '../../global/abstracts/scripts-repo.yaml'

  - script: |
      $(Scripts.Directory)/global/scripts/languages/terraform/terra/install.sh
      terra install
      terra version
    displayName: 'Install terra CLI + dependencies'
