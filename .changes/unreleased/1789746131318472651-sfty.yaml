kind: 'Fixed'
body: 'fixed the `sca:safety` step never receiving `SAFETY_API_KEY` once the variable is marked secret (`azure-devops/python/stages/20-security/pdm.yaml`). The step ran `pdm run safety-scan` as a bare script with no `env:` block, and `safety` reads its credential from the ambient environment. Azure Pipelines injects non-secret variables there automatically but never secret ones, so the scan authenticated only for as long as the key was stored in PLAINTEXT -- and marking it secret, which is what it is, silently turned the scan unauthenticated rather than failing it, because the job is `continueOnError: true`. Three projects were blocked from fixing their own hygiene finding by this one step. The key now arrives through an explicit `env:` mapping, matching `SONAR_TOKEN`, `PUB_TOKEN`, `NVD_API_KEY` and the deploy family. The step also discards the literal `$(SAFETY_API_KEY)` that Azure substitutes for an UNDEFINED variable, the same guard `dependency-check/run.sh` applies to `NVD_API_KEY`: without it the mapping would regress every project that has no key at all, turning "no credential" into "a bogus credential" and breaking a scan that used to degrade quietly. Added `make test-azure-secret-env`, which holds the contract repository-wide -- it derives what each step''s scripts read, carries a declared table for tools that read the environment directly (the case no grep can find, and the reason this survived review), and requires every credential-shaped variable to be explicitly mapped, declared, or exempted with a reason'
