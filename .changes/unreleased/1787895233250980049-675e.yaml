kind: 'Changed'
body: 'scoped the Claude review''s Bash permissions by prefix instead of by subcommand, and corrected what `--allowedTools` actually governs. It is the complete BASH allowlist and the selector for which GitHub MCP servers are installed -- not the complete tool set: `Read`, `Grep`, `Glob`, `Task` and `TodoWrite` are permitted by default and never needed listing, which the first agent-mode run showed by executing `Read` five times and spawning seven subagents while absent from a four-entry list, with all 22 denials being `Bash`. `Bash(gh:*)` and `Bash(git:*)` now replace eleven enumerated subcommands plus five redundant structured-tool entries, joined by the read-only text utilities `grep`, `cat`, `wc`, `head` and `tail` -- every segment of a pipe must match, so without those the agent could run `gh pr diff` and still not size or filter its output, and `Read`/`Grep` cannot consume a commands stdout. `sed`, `awk`, `find`, `sort` and `uniq` are deliberately excluded because each can write a file or execute. The list still refuses `curl`, `rm`, `bash -c` and every other binary. Removing the input entirely remains unsafe in a way that is easy to miss -- there is no curated default underneath, so both `gh`/`git` and every MCP server disappear and the review can neither read the diff nor post.'
