parameters:
  - name: 'DEPENDS_ON'
    type: object
    default: ''

stages:
  - stage: 'security'
    displayName: 'security (sca/sast)'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    ${{ if ne(parameters.DEPENDS_ON, '') }}:
      dependsOn: ${{ parameters.DEPENDS_ON }}
    jobs:
      - template: '../../../global/stages/20-security/semgrep.yaml'
        parameters:
          SEMGREP_LANGUAGE: 'golang'

      - template: '../../../global/stages/20-security/gitleaks.yaml'

      - template: '../../../global/stages/20-security/codeql.yaml'
        parameters:
          CODEQL_LANGUAGE: 'go'
          # CodeQL's Go extraction builds the module with the `go` on PATH, and this job set none
          # up: a Microsoft-hosted agent carries Go 1.24 to 1.26 and reaches a newer module only by
          # downloading its toolchain, and an agent with no Go, or no route to proxy.golang.org,
          # failed the analysis -- quietly, since that step is `continueOnError`. The same pinned
          # Go as the other Go jobs here.
          PRE_STEPS:
            - task: 'GoTool@0'
              inputs:
                version: '1.27.3'
                architecture: 'amd64'
              displayName: 'Setup Go'

      - template: '../../../global/stages/20-security/hadolint.yaml'

      - job: 'sca_govulncheck'
        displayName: 'sca:govulncheck'
        variables:
          GOPATH: "$(Pipeline.Workspace)/.go"
        steps:
          - template: '../../abstracts/go.yaml'

          # Delegates to the shared runner instead of inlining `go install`, which is
          # what GitHub Actions already did and what this repository's architecture
          # says ("templates call scripts"). Inlining it kept a third copy of the
          # pinned version -- the runner reads it from
          # global/scripts/shared/pinned-versions.sh -- and three copies of a version
          # drift one bump at a time. The runner also resolves the install directory
          # from `go env GOBIN` rather than assuming `GOPATH/bin`, and writes a JSON
          # report, which is why the artifact step below can exist at all.
          - script: $(Scripts.Directory)/global/scripts/languages/golang/govulncheck/run.sh
            displayName: 'Run govulncheck'

          - task: 'PublishPipelineArtifact@1'
            inputs:
              artifactName: 'govulncheck'
              targetPath: 'build/reports/govulncheck'
            condition: always()
            displayName: 'Publish govulncheck report'
        # No job-level `continueOnError`: it let every later stage run whatever the scan found, so
        # a known vulnerability blocked nothing. A failing scan now fails the stage, as on the
        # other two platforms. See CLAUDE.md, "A Failing Check Fails the Run".
