parameters:
  # Steps injected before the Terraform `test-all` runner invokes
  # `terraform init` + `terraform test` on each module. Consumers whose
  # modules pin private `source = "git@..."` paths pass the setup steps
  # that configure SSH so that `terraform init` can resolve those
  # references from the tests job. Mirrors the `PRE_STEPS` hook already
  # accepted by the `20-security` stage — the same consumer-provided
  # list covers both stages.
  - name: 'PRE_STEPS'
    type: 'stepList'
    default: []

  # Opt in to the `test:validate` job, which runs `terraform validate` over
  # every root module. Off by default, and deliberately so: it is the only tier
  # that needs the network (to download providers) and, for private module
  # sources, credentials — so enabling it for everyone would turn a currently
  # offline stage into one with new prerequisites. It also surfaces reference
  # errors that have always been there, which is the point, but is a consumer's
  # decision to take rather than something to impose on their next build.
  - name: 'ENABLE_VALIDATE'
    type: 'boolean'
    default: false

  # Directories searched for root modules, space-separated. Only read when
  # `ENABLE_VALIDATE` is true. Defaults to the conventional `stacks`.
  - name: 'VALIDATE_ROOTS'
    type: 'string'
    default: 'stacks'

stages:
  - stage: 'tests'
    displayName: 'tests'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    variables:
      REPORT_PATH: 'build/reports'
    jobs:
      # Single unified job that orchestrates both tiers of Terraform testing
      # behind one `test:all` entry: native `terraform test` over
      # `modules/*/tests/*.tftest.hcl` (tier 1) followed by the Go Terratest
      # suite under `tests/terratest/` (tier 2). The runner auto-detects
      # which tiers the consumer has, runs only those, and exits 0 when
      # neither is present — so stack-only repos (no `modules/` tests, no
      # `tests/terratest/`) pass the stage without a bespoke opt-out.
      - job: 'test_all'
        displayName: 'test:all'
        steps:
          # `abstracts/terra.yaml` clones rios0rios0/pipelines into a temp dir
          # and exposes its path as `$(Scripts.Directory)`, which the `run.sh`
          # invocation below needs — without it the variable resolves to empty,
          # the command becomes `/global/scripts/...`, and the job fails with
          # exit `127` ("command not found").
          #
          # `scripts-repo` was ALSO included directly here. That declared two
          # steps named `Scripts`, which Azure rejects before running anything.
          - template: '../../abstracts/terra.yaml'

          # Run consumer-provided pre-steps (e.g. configuring SSH for
          # private-git module sources) before `test-all/run.sh` calls
          # `terraform init` per module. Without this hook, modules that
          # reference `source = "git@..."` in their bodies fail init from
          # the tests job with `ssh: Could not resolve hostname`. The
          # sibling `20-security` stage threads the same parameter into
          # its SAST tools — consumers already maintain one `PRE_STEPS`
          # list; we just reuse it here. The `each` loop splices each
          # step into the job's `steps:` list — injecting the parameter
          # as a single list item (`- ${{ parameters.PRE_STEPS }}`)
          # breaks when the list is empty and is inconsistent with the
          # pattern used elsewhere in this repo.
          - ${{ each step in parameters.PRE_STEPS }}:
              - ${{ step }}

          # Pin a Go toolchain high enough to satisfy consumer `go.mod`
          # directives. `GOTOOLCHAIN=auto` (the Go 1.21+ default) will
          # transparently fetch a newer toolchain when `go.mod` requires
          # it, so this pin is a lower bound, not a hard version.
          - task: 'GoTool@0'
            displayName: 'Use Go (toolchain auto-upgrades per go.mod)'
            inputs:
              version: '1.26'

          # Delegate to the shared unified runner so `make test` and the CI
          # flow exercise identical logic: run terra-test, run terratest if
          # present, merge JUnit + coverage, propagate failures.
          - script: $(Scripts.Directory)/global/scripts/languages/terraform/test-all/run.sh
            displayName: 'Run Terraform tests (terra-test + terratest)'
            env:
              REPORT_PATH: $(REPORT_PATH)

          # Publish the merged JUnit so the Tests tab surfaces every case
          # from both tiers in one place. `condition: always()` so a red
          # tier still publishes the green tier alongside it — the runner
          # propagates the non-zero exit, so the job fails regardless.
          - task: 'PublishTestResults@2'
            displayName: 'Publish Terraform test results (merged)'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(REPORT_PATH)/junit-terra-all.xml'
              testRunTitle: 'terra-all'
              failTaskOnFailedTests: true

          # Render the Code Coverage tab in the build summary. Emitted by
          # the terra-test tier as a Cobertura XML where each module is one
          # `<class>` with one `<line>` (covered iff the module has a
          # `tests/*.tftest.hcl`). The ADO tab then shows
          # `tested_modules / total_modules` as a percentage. The task
          # no-ops gracefully when the file is missing (stack-only repo).
          - task: 'PublishCodeCoverageResults@2'
            displayName: 'Publish Terra module coverage'
            condition: always()
            inputs:
              summaryFileLocation: '$(REPORT_PATH)/terra-coverage.xml'
              pathToSources: 'modules'

          # Publish the whole reports directory — the coverage Markdown,
          # the JSON summary, the per-module JUnit files, and the merged
          # JUnit. Downstream stages (SonarQube, Dependency-Track, custom
          # dashboards) can grab them by name from the `terra-coverage`
          # artifact.
          - task: 'PublishPipelineArtifact@1'
            displayName: 'Publish Terra coverage report'
            condition: always()
            inputs:
              targetPath: '$(REPORT_PATH)'
              artifactName: 'terra-coverage'
              publishLocation: 'pipeline'

      # Third tier — repo-convention assertions the consumer owns. Runs
      # `tests/structural.sh` if it exists, publishes the resulting JUnit.
      # The script itself is deliberately not shipped here — every
      # repo has its own conventions (customer dir naming, bootstrap
      # self-containedness, shared root.hcl presence) that can't live
      # upstream. The runner is just the glue.
      #
      # `dependsOn: []` makes this job start in parallel with `test:all`;
      # the shell tier is offline, deps-free, and finishes in under a
      # second, so there's no reason to wait. A consumer without
      # `tests/structural.sh` sees the job run, emit a skip message, and
      # exit 0 — no spurious failure.
      # Fourth tier — the only one that RESOLVES references rather than parsing
      # them. `terra-test` covers reusable modules that have a test file,
      # `terratest` parses HCL offline, and `structural` asserts conventions in
      # bash; none of them has an evaluation context, so a root module can
      # reference a module, variable or resource that does not exist and all
      # three stay green. That defect then fails every plan and apply of the
      # root module, for every target, before a resource is touched.
      #
      # `dependsOn: []` so it starts alongside the other jobs. It is the slowest
      # tier — one `terraform init` per root module — so serialising it behind
      # them would add its full runtime to the stage.
      #
      # `PRE_STEPS` is spliced in for the same reason `test:all` needs it: `init`
      # resolves module sources, and private ones need credentials configured
      # first. Without it, `init` fails on the first root module that pins one.
      - ${{ if parameters.ENABLE_VALIDATE }}:
          - job: 'test_validate'
            displayName: 'test:validate'
            dependsOn: []
            steps:
              # `abstracts/terra.yaml` brings `scripts-repo` with it, so
              # $(Scripts.Directory) is in scope below. Including it directly as
              # well declared two steps named `Scripts`, which Azure rejects
              # before running anything.
              - template: '../../abstracts/terra.yaml'

              - ${{ each step in parameters.PRE_STEPS }}:
                  - ${{ step }}

              - script: $(Scripts.Directory)/global/scripts/languages/terraform/validate/run.sh
                displayName: 'Run terraform validate over root modules'
                env:
                  REPORT_PATH: $(REPORT_PATH)
                  VALIDATE_ROOTS: ${{ parameters.VALIDATE_ROOTS }}

              - task: 'PublishTestResults@2'
                displayName: 'Publish validate results'
                condition: always()
                inputs:
                  testResultsFormat: 'JUnit'
                  testResultsFiles: '$(REPORT_PATH)/junit-validate.xml'
                  testRunTitle: 'validate'
                  failTaskOnFailedTests: true
                  mergeTestResults: false

      - job: 'test_structural'
        displayName: 'test:structural'
        dependsOn: []
        steps:
          - template: '../../../global/abstracts/scripts-repo.yaml'

          - script: $(Scripts.Directory)/global/scripts/languages/terraform/structural/run.sh
            displayName: 'Run repo-convention structural tests'
            env:
              REPORT_PATH: $(REPORT_PATH)

          - task: 'PublishTestResults@2'
            displayName: 'Publish structural test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(REPORT_PATH)/junit-structural.xml'
              testRunTitle: 'structural'
              failTaskOnFailedTests: true
              mergeTestResults: false
