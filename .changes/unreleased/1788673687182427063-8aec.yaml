kind: 'Added'
body: 'added a `working_directory` input to the Bundler, npm and Yarn reusable workflows (and their `-library`/`-docker` variants and the shared JavaScript `format`/`knip` stages), so a repository whose project lives in a subfolder can call them instead of copying their jobs: it scopes every install, tool run, report and artifact path to that directory and points `actions/setup-node` at the project''s own lockfile, while Gitleaks, Semgrep, CodeQL, Hadolint and basic-checks deliberately keep scanning from the repository root; `bundler.yaml` gained a `ruby_version` input that defaults to reading `<working_directory>/.ruby-version` or `.tool-versions` and falls back to the previously hardcoded `3.3`, and `make test-working-directory` holds all of it'
time: '2026-09-06T05:48:07.18223774Z'
