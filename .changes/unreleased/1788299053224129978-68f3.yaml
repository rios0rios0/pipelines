kind: 'Fixed'
body: 'stopped the changelog gate from failing every Dependabot pull request. `basic-checks` classifies a branch by name and exempted `chore/bump-*`, `bump/*` and the autoupdate prefix; a `dependabot/*` branch fell into the default case, which hard-requires a new fragment (or a `CHANGELOG.md` edit on the legacy path), and Dependabot never writes one. Every repository running the stage was therefore red on Dependabot — `rios0rios0/backstage-plugin-code-health#68` shows exactly that — and the repository lost the only mechanism that advances its action pins, which is a security regression wearing a documentation rule''''s clothes. Dependabot is exempted **outright**, unlike autoupdate''''s conditional exemption, because it is the only one that cannot comply: its branches carry a read-only token, so nothing running on them can commit a fragment back, and auto-appending one would mean a `pull_request_target` job with a write credential on a bot branch — a privileged-execution surface bought for a changelog line. AutoBump''''s updater is not a substitute either: it deliberately skips SHA pins, which is exactly what these repositories pin with. This records established practice rather than relaxing policy — before the gate reached them, every merged Dependabot pull request carried no changelog entry at all. Applied to all four implementations of the rule (the three platform templates and `global/scripts/shared/changelog-check.sh`), with ten new assertions in `test-basic-checks.sh` covering both paths, the human-branch counter-case, and four-way parity'
