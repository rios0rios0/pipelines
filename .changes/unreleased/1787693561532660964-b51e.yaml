kind: 'Fixed'
body: 'fixed the `yq` install in the Azure DevOps Go code-check stage and the GitLab Debian scripts-repo abstract, both of which ran `apt-get install -y yq` -- **the kislyuk package, which is the one flavour these pipelines cannot use**. The Azure step even announced itself as "Install yq for golangci-lint config merging", the exact job it could not do. Nothing anywhere consumed them: `run.sh` provisions its own resolved binary, and it is the only consumer of `yq` in the repository, so both installs were removed rather than corrected'
