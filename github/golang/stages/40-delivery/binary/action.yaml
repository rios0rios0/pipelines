inputs:
  binary_name:
    type: 'string'
    required: true
    description: 'Binary name to be used as default source'
  binary_path:
    type: 'string'
    required: false
    default: '.'
    description: 'Path to the main package (e.g. ./cmd/terra). Defaults to auto-detection.'
  tag_name:
    type: 'string'
    required: true
    description: 'Tag name to use for the release'
  gpg_sign:
    type: 'string'
    required: false
    default: 'false'
    description: 'When ''true'', import the GPG key from gpg_private_key (decrypted with gpg_passphrase) and expose its fingerprint to GoReleaser as GPG_FINGERPRINT. Required for projects whose `.goreleaser.yaml` has a `signs:` block (e.g., Terraform providers that must publish a signed `SHA256SUMS.sig`).'
  gpg_private_key:
    type: 'string'
    required: false
    default: ''
    description: 'Armored GPG private key used to sign release artifacts. Only consumed when gpg_sign is ''true'' and scoped to the GPG import step so it is not inherited by GoReleaser or other inner steps.'
  gpg_passphrase:
    type: 'string'
    required: false
    default: ''
    description: 'Passphrase for the GPG key in gpg_private_key. Only consumed when gpg_sign is ''true'' and scoped to the GPG import step.'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0
      with:
        fetch-depth: 0

    - name: 'Fetch tags'
      run: git fetch --force --tags
      shell: 'bash'

    - name: 'Setup Go'
      uses: 'actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16' # v6.5.0
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: 'go.sum'
        # Skipped on a self-hosted runner, where GOMODCACHE and GOCACHE persist on local
        # disk between jobs. There the restore is not merely redundant -- it untars the archive
        # over files that already exist, `tar` exits 2 with `Cannot open: File exists`, the
        # action logs `Failed to restore`, and the entire download is discarded. Measured on a
        # 12-vCPU self-hosted runner: 2.3-2.5 GB pulled at ~8 MB/s, 344-702s PER JOB across four
        # jobs of the same run, against 1s when that job happens to miss the cache.
        #
        # This is the reasoning the codeql stage already applies, read the other way round: it
        # skips the cache because its runner is thrown away, and these skip it because theirs
        # is not.
        #
        # `!= 'self-hosted'` rather than `== 'github-hosted'` so an empty context keeps
        # today's behaviour instead of silently disabling the cache for hosted consumers.
        cache: ${{ runner.environment != 'self-hosted' }}

    - name: 'Setup Zig'
      uses: 'mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29' # v2.2.1

    - uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    - name: 'Prepare GoReleaser config'
      run: |
        "$SCRIPTS_DIR/global/scripts/languages/golang/goreleaser/prepare.sh" \
          "${{ inputs.binary_name }}" \
          "${{ inputs.binary_path }}"
      shell: 'bash'

    - name: 'Validate GPG inputs'
      if: "inputs.gpg_sign == 'true'"
      shell: 'bash'
      env:
        GPG_PRIVATE_KEY: "${{ inputs.gpg_private_key }}"
        GPG_PASSPHRASE: "${{ inputs.gpg_passphrase }}"
      run: |
        if [ -z "${GPG_PRIVATE_KEY}" ]; then
          echo "::error::gpg_sign is 'true' but gpg_private_key is empty. Pass it via the gpg_private_key input (typically wired from a workflow_call secret in the wrapper workflow)."
          exit 1
        fi
        if [ -z "${GPG_PASSPHRASE}" ]; then
          echo "::error::gpg_sign is 'true' but gpg_passphrase is empty. Pass it via the gpg_passphrase input (typically wired from a workflow_call secret in the wrapper workflow)."
          exit 1
        fi

    - name: 'Import GPG key'
      id: 'import_gpg'
      if: "inputs.gpg_sign == 'true'"
      uses: 'crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd' # v7.0.0
      with:
        gpg_private_key: "${{ inputs.gpg_private_key }}"
        passphrase: "${{ inputs.gpg_passphrase }}"

    - name: 'Run GoReleaser'
      uses: 'goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94' # v7.2.3
      with:
        distribution: 'goreleaser'
        version: '~> v2'
        args: 'release --clean'
      env:
        GITHUB_TOKEN: '${{ github.token }}'
        GORELEASER_CURRENT_TAG: '${{ inputs.tag_name }}'
        GPG_FINGERPRINT: '${{ steps.import_gpg.outputs.fingerprint }}'
