parameters:
  - name: 'DOWNLOAD_COVERAGE_ARTIFACT'
    type: 'boolean'
    default: false
  - name: 'COVERAGE_ARTIFACT_NAME'
    type: 'string'
    default: 'coverage'
  - name: 'COVERAGE_ARTIFACT_TARGET_PATH'
    type: 'string'
    default: "$(Build.SourcesDirectory)"

stages:
  - stage: 'management'
    displayName: 'management'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    jobs:
      - template: '../../../global/stages/35-management/sonarqube.yaml'
        parameters:
          # Forwarded from the pipeline parameters. The default is `false`:
          # Terraform consumers usually produce no `coverage` artifact, so the
          # download would emit `##[error]Artifact coverage was not found` and
          # turn the job yellow. A consumer that does produce one opts in.
          DOWNLOAD_COVERAGE_ARTIFACT: ${{ parameters.DOWNLOAD_COVERAGE_ARTIFACT }}
          COVERAGE_ARTIFACT_NAME: ${{ parameters.COVERAGE_ARTIFACT_NAME }}
          COVERAGE_ARTIFACT_TARGET_PATH: ${{ parameters.COVERAGE_ARTIFACT_TARGET_PATH }}

      # NOTE: there is no `report:dependency-track` job for Terraform.
      # Dependency-Track ingests CycloneDX, and the BOM here was produced by
      # `trivy fs --format cyclonedx` — the only CycloneDX generator that reads
      # `.terraform.lock.hcl` provider pins and module `source =` references.
      # Trivy has been removed from this repository, and no replacement
      # Terraform BOM generator has been wired yet, so the job was removed
      # rather than left calling a script that no longer exists.
