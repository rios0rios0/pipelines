kind: 'Fixed'
body: 'fixed `Build & Push tor-proxy:latest`, which had been failing since 2026-07-16 with `github.com/mholt/caddy-l4@v0.1.2 requires go >= 1.25.1 (running go 1.21.3; GOTOOLCHAIN=local)`. The `--with` had no version, so xcaddy resolved the plugin''s newest release on build day and handed a 2026 module to the Go 1.21.3 that `caddy:2.7.4-builder-alpine` ships. Both halves are now pinned and both matter: the builder is `caddy:2.11.4-builder-alpine` (Go 1.26.8, `CADDY_VERSION=v2.11.4`) and the plugin is `@v0.1.2`, whose `go.mod` requires exactly `caddyserver/caddy/v2 v2.11.4` -- so builder and plugin agree on one Caddy instead of one silently downgrading the other. `config/caddy.json` was checked against that ref rather than assumed: `layer4`, `layer4.matchers.socks5`, `layer4.matchers.http` and `layer4.handlers.proxy` keep their module IDs and JSON shapes, so it needed no change'
time: '2026-09-06T03:20:00.060293526Z'
