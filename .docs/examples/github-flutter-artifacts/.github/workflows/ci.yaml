name: 'CI/CD Pipeline'

on:
  push:
    branches: [ 'main' ]
    tags: [ '*' ]
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: 'write' # required for releases
  checks: 'write' # required for test results
  # NOTE: no `security-events: write` here, unlike the Go/Python/Java examples.
  # That permission exists for CodeQL, which has no Dart extractor and is
  # therefore not part of the Dart pipeline. See the workflow's own header.

jobs:
  pipeline:
    # Pinned to a full commit SHA, with the release it corresponds to in the
    # trailing comment -- the same form this library uses for every
    # third-party action it consumes. A branch ('@main') means every run
    # executes whatever was merged that morning; a tag is better but is still
    # a label the publisher can move, and only the SHA names the bytes.
    # '@4.23.0' or '@v4' are readable alternatives if you accept that.
    uses: 'rios0rios0/pipelines/.github/workflows/flutter-artifacts.yaml@1d6da2555acf159773e642c57bcd97ff07d637e2' # 4.23.0
    with:
      # Omit to track the current stable release; pin for reproducible builds.
      flutter_version: '3.47.0'
      build_web: true
      build_android: true
      android_targets: 'apk appbundle'
