kind: 'Security'
body: 'moved Go from `1.27.3` to `1.27.4` everywhere this repository builds with it -- the pin in `pinned-versions.sh`, every `go-version:` in the workflows, the Azure DevOps `GoTool@0` inputs, the GitLab CI Go and Terra images, the `golang.1.27-awscli` image and the `tor-proxy` builder, each image re-pinned to the digest its new tag resolves to -- fixing GO-2026-6859 in `net/http`, where a race on the request header in `MaxBytesReader` could crash an HTTP/1 server, and which `govulncheck` reported in every Go pipeline'
time: '2026-11-11T14:33:53.354458963Z'
