kind: 'Added'
body: 'added a `node_version` input to `npm.yaml`, the twin of the one `yarn.yaml` has carried since Node 20 reached end of life. All four `actions/setup-node` steps and the Prettier stage hardcoded `20`, so an npm consumer had no way onto a supported runtime short of abandoning the shared workflow and re-declaring every job in its own repository -- which is the drift this library exists to prevent. It defaults to `''20''`, so a consumer that does not set it sees no change at all. What makes the gap invisible rather than loud is npm itself: a project whose `engines` say `>=24` still installs on Node 20, because `npm ci` only WARNS `EBADENGINE` unless `engine-strict` is set, so the mismatch surfaces two jobs later as a test run that dies on an API the runtime does not have. `javascript/stages/10-code-check/knip` gained the same input, defaulting to the `''20''` it used to hardcode, and both `npm.yaml` and `yarn.yaml` forward it: without that a consumer naming a supported major would have got every job on it except `quality:knip`, which is `continue-on-error` on both workflows, so the one job left on an end-of-life runtime would have reported as a red square nobody has a reason to open. The README''s workflow-input table now names `node_version` beside the `working_directory` it already listed'
