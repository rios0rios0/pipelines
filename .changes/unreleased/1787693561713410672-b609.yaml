kind: 'Added'
body: 'added `make test-javascript-pipeline` (`.github/tests/test-javascript-pipeline.sh`), 32 assertions over the runner''s decisions and its wiring on all three platforms. Thirteen are proven to fire against a deliberate violation, and the ones that matter most say the job can actually stop a build: three that it is not `continue-on-error` / `allow_failure` / `continueOnError` -- its sibling IS advisory, so "make it consistent with the job next to it" is a plausible-sounding edit that would silently restore the exact hole this closes -- and two that on GitHub Actions it is named in every downstream `needs:`. That second pair exists because the first version of this shipped WITHOUT it: GitHub has no implicit stage barrier, so an unwired job goes red beside a security stage, a test stage and a delivery stage that all ran to completion on unformatted code. `dart.yaml` had the convention right and this did not. The behavioural half runs offline against a stubbed Prettier -- what is under test is this repository''s dispatch and exit codes, not Prettier''s opinion about a semicolon'
