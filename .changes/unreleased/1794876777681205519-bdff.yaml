kind: 'Added'
body: 'added the `PYTHON_VERSION` parameter to the Azure DevOps PDM pipeline (`azure-devops/python/pdm-docker.yaml`), forwarded to the code check, security, tests and management stages and from them to every job that sets up Python, the CodeQL analysis included, so a project chooses the Python its pipeline runs on in one place (`PYTHON_VERSION: ''3.15''`) and tests on the Python its image ships. The default stays `3.14`, so a project that does not set it runs as before, apart from one `.venv` cache miss: the cache key now names the Python, because PDM reuses the interpreter of a restored virtualenv, and a cache saved under the old Python would have kept every job on it. `abstracts/pdm-python3.14.yaml` keeps its name, since consumers include it by path, and takes the same parameter; `make test ONLY=python-version` holds every hop'
time: '2026-11-17T00:52:57.68115386Z'
