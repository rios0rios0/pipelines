# Terra CLI pipeline — uses the terra CLI (https://github.com/rios0rios0/terra)
# which wraps Terraform and Terragrunt. Provides code check, security, tests,
# management, and release stages. Delivery is intentionally excluded because it
# is project-specific (plan/apply targets, environment handling, stack ordering).
#
# The `release` stage only cuts a tag for a version-bump commit merged to
# `main`; every other commit is a no-op. Consumers keep the `delivery` stage id
# free for their own apply stage.
#
# Usage in your azure-pipelines.yml:
#   resources:
#     repositories:
#       - repository: 'pipelines'
#         type: 'github'
#         name: 'rios0rios0/pipelines'
#         endpoint: 'YOUR_GITHUB_SERVICE_CONNECTION'
#
#   stages:
#     - template: 'azure-devops/terra/terra.yaml@pipelines'
#     # Add your project-specific delivery stage here:
#     - template: '.ci/stages/40-delivery/terra.yaml'

parameters:
  # Steps injected before the Terraform SAST scanner (`sast:semgrep`) runs.
  # Consumers with private Terraform modules pass the setup steps that
  # configure SSH so the scanner's Terraform parser can resolve
  # `source = "git@..."` references.
  - name: 'PRE_STEPS'
    type: 'stepList'
    default: []

  # Forwarded to the tests stage. Opt in to `terraform validate` over every root
  # module — the only tier that resolves references rather than parsing them.
  # Off by default because it needs the network and, for private module sources,
  # credentials; see the tests stage for the full rationale.
  - name: 'ENABLE_VALIDATE'
    type: 'boolean'
    default: false

  - name: 'VALIDATE_ROOTS'
    type: 'string'
    default: 'stacks'

stages:
  - template: 'stages/10-code-check/terra.yaml'
  - template: 'stages/20-security/terra.yaml'
    parameters:
      PRE_STEPS: ${{ parameters.PRE_STEPS }}
  - template: 'stages/30-tests/terra.yaml'
    parameters:
      PRE_STEPS: ${{ parameters.PRE_STEPS }}
      ENABLE_VALIDATE: ${{ parameters.ENABLE_VALIDATE }}
      VALIDATE_ROOTS: ${{ parameters.VALIDATE_ROOTS }}
  - template: 'stages/35-management/terra.yaml'
  - template: 'stages/40-delivery/release.yaml'
