kind: 'Fixed'
body: 'made every report upload in the GitHub Actions stages `continue-on-error` -- the SAST, SCA, lint, coverage, JUnit and deployment reports of 20 composite stages and of the seven reusable workflows that upload inline -- so an upload GitHub refuses no longer fails a job whose tool already passed. Once an account has spent its monthly Actions storage allowance and its budget stops further usage, every `actions/upload-artifact` call answers `Failed to CreateArtifact: Artifact storage quota has been hit`, and deleting artifacts does not bring uploads back: the allowance is storage-time accrued over the billing month, so it only returns when the next month starts. On medhub-life that turned `quality:knip`, `quality:analyze`, `quality:unused-code`, `style:order-check`, `sast:semgrep`, `sast:gitleaks`, `sast:hadolint` and `sca:govulncheck` red on every run from 2026-09-17 with nothing found, and because every later stage `needs` them, `test:all`, `test:build` and every deployment job were SKIPPED in four repositories for a week. Findings still fail their job exactly as before; only the upload is optional. The six stages that uploaded with `if-no-files-found: error` (Semgrep, Gitleaks, govulncheck, Knip, ProGuard, Vulture) relied on it to fail a scan that exited 0 without writing its report, so each gained a `Verify Report` step that keeps that failure. `dart/stages/40-delivery/build` is deliberately unchanged, because the build output it uploads is what the job exists to deliver. `.github/tests/test-report-uploads.sh` (`make test-report-uploads`) holds all three rules. GitLab CI and Azure DevOps publish through their own artifact stores, which this allowance does not meter, and are unchanged'
