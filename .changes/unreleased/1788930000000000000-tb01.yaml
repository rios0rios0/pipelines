kind: 'Added'
body: 'added `tests > test:build` to the GitHub Actions Dart/Flutter pipeline, closing the one platform gap in a job the family already had: `test:build` has shipped in `gitlab/dart/stages/30-tests/dart.yaml` and `azure-devops/dart/stages/30-tests/dart.yaml` all along -- delegating to `global/scripts/languages/dart/build/run.sh` in `--debug` mode and taking its targets from `DART_TEST_BUILD_TARGETS` -- while `dart.yaml` had no such job, so a consumer migrating from GitLab silently lost its compile check with no job, no warning and a green pipeline. The new `github/dart/stages/30-tests/build` action calls the SAME runner with the same defaults rather than forking a second implementation, and `test_build_targets`, `test_build_mode` and `test_build_args` are the GitHub spellings of the variables the other two templates take, so the three platforms stay one contract. It runs as a sibling of `tests > test:all` -- identical `needs:`, so the two run in parallel and a pull request gets both verdicts at once -- and is always on, because gating it on configuration is what would let that silent loss happen again; the runner already answers what building means for a project, and a library builds nothing and exits 0. It covers what neither neighbour can: `quality:analyze` resolves and type-checks but never runs a compiler back end, and `test:all` runs the suite on the Dart VM and never reaches dart2js, dart2wasm or the AOT compiler. Skipped on tags like every other job in `dart.yaml`, which is a deliberate GitHub divergence from the GitLab template: a tag points at a commit whose verdict already exists and `require-checks` re-asserts it there. Also added `DART_TEST_BUILD_COMMAND` to the GitLab and Azure DevOps templates and `test_build_command` to GitHub -- one escape hatch, spelled the same way everywhere, for a build that is a command rather than a target: flags derived from an environment, a generated file written beside the bundle, an artifact assertion that runs against what was just built. All five inputs are declared and forwarded by `dart-cloudflare.yaml`, `dart-docker.yaml`, `dart-library.yaml` and `flutter-artifacts.yaml`, for the reason the composition standard gives about `runs_on`'
