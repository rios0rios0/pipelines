kind: 'Changed'
body: 'changed the shared makefiles to one target per task. `terra.mk`''s `make test` now runs every test tier through one script, `terraform/test-all/run.sh` -- `terraform test`, Terratest, the repository''s own `tests/structural.sh` and, with `ENABLE_VALIDATE=true`, `terraform validate` -- where it used to skip the last two, and `make test ONLY=structural` runs some; CI''s `test:all` job pins `TERRA_TEST_TIERS: ''terra-test terratest''` on all three platforms, because those two tiers run as jobs of their own there. **BREAKING CHANGE:** removed `test-terra-test`, `test-terratest`, `test-structural`, `test-validate`, `coverage` and `validate` from `terra.mk` (`make test` covers them, reports and coverage included), `test-gen` from `terraform.mk` (the smoke-suite generator is a script you run once, `global/scripts/languages/terraform/tftest-gen/run.sh`, since generating tests is not testing), and `analyze` and `unused` from `dart.mk` (`make lint` runs both); a consumer Makefile or pipeline calling one of them now fails with `No rule to make target`'
breaking: true
time: '2026-10-30T21:19:02.219785798Z'
