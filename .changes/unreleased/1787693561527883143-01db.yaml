kind: 'Security'
body: 'pinned **every third-party GitHub Action to a full commit SHA** (184 references across 46 files), with the human-readable version kept in a trailing `# vX.Y.Z` comment so the pin stays auditable and Dependabot/Renovate can still propose bumps. A tag is a label the publisher can move at any time, so `@v6` was a promise rather than a pin: a compromised maintainer account or a retagged release would have run inside every consumer''s pipeline at once, with the job''s token in scope. Same-repository `rios0rios0/pipelines/...@main` references are deliberately untouched -- they share the repository''s own trust boundary, `test-workflow-composition.sh` Test 7 requires them, and pinning them is a chicken-and-egg because the SHA cannot exist before the commit that needs it'
