kind: 'Added'
body: 'added `global/scripts/tools/dependency-updates/`, which reports every pinned third-party dependency that has a newer version upstream, and `.github/workflows/dependency-updates.yaml`, which runs it **twice a week** (Monday and Thursday, 06:00 UTC) and **fails the build** when anything is stale. Pinning is only half a policy: it stops a dependency moving without a decision, but a pin never announces that it is three CVEs behind, so the missing half is something that tells a human when to decide. It covers all four pinned surfaces -- GitHub Actions (newer release for the action), container images (the pinned tag now resolves elsewhere), binaries and packages (newer version upstream), and the handful of versions written a second time in a template that has no `SCRIPTS_DIR` to read the manifest from. `make check-dependency-updates` runs the same check by hand; `make test-dependency-updates` validates the checker offline against fixture upstreams'
time: '2026-08-25T21:32:41.708568938Z'
