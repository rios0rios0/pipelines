kind: 'Fixed'
body: 'fixed Dependency-Track refusing the whole CycloneDX BOM of a Go project with HTTP 400 (`The uploaded BOM is invalid`, `license.id: does not have a value in the enumeration`) when one module''s license was a deprecated SPDX id: cyclonedx-gomod v1.12.0 writes the license go-license-detector v4.3.1 matched into `license.id` verbatim, and the detector names a deprecated license after its SPDX license-list file (`deprecated_GPL-2.0+` for `github.com/golang/freetype`), an id no SPDX list holds; no newer release of either tool writes it differently. `golang/cyclonedx/run.sh` now runs `cyclonedx/licenses`, a standard-library Go helper built from the checkout, on every BOM it writes: `deprecated_<id>` becomes `<id>`, any other id the list does not hold becomes the license''s `name`, a BOM with nothing to rewrite is left byte for byte, and no license is dropped (`-licenses` stays). The list is CycloneDX''s `spdx.schema.json` for SPDX 3.27.0, embedded verbatim with its SHA-256 pinned by a test: the one Dependency-Track 4.13.6 to 4.14.3 and 5.0.x validate with, while later releases accept every id it holds; `make test ONLY=cyclonedx-licenses` holds the wiring'
time: '2026-11-26T05:20:23.326817445Z'
