kind: 'Added'
body: 'added the `quality:gitignore` check to every pipeline''s pull requests: it runs `global/scripts/tools/gitignore/ci.sh`, which compares a project''s generated `.gitignore` block with the shared ignore rules (`make gitignore-check`) and, by default, reports a stale or missing block as a warning without failing, since a block goes stale through changes here rather than in the pull request, and the weekly config-and-docs refresh of `rios0rios0/config-automation` regenerates it. It is a second job in the Azure DevOps and GitLab CI basic-checks templates, which fetches the scripts while `quality:basic-checks` itself still does not, and a step of the GitHub Actions basic-checks action. `GITIGNORE_CHECK=enforce` (the `gitignore_check` input on GitHub Actions) makes a stale or missing block fail, and `off` skips the check'
