.pdm:
  image: 'ghcr.io/rios0rios0/pipelines/python:3.10-pdm-bookworm@sha256:b97e547f1be082d057b5e41533cb08b292ca5def63e0222570cdda87ac0096b0'
  cache: # relative to the project directory ($CI_PROJECT_DIR)
    key: "$CI_JOB_NAME"
    paths:
      - '.venv'
    when: 'always'
  before_script:
    - pdm install
  tags:
    - 'dev-gitlab-runner-onprem'
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.pdm-prod:
  extends: '.pdm'
  cache:
    key: "$CI_JOB_NAME-prod"
    paths:
      - '.venv'
    when: 'always'
  before_script:
    - pdm install --prod
