# Go, delivered as a container image and deployed to Fly.io.
#
# `go-docker.yaml` plus one deployment job, exactly the shape `go-render.yaml` takes — which is
# itself `go.yaml` plus the delivery jobs, one file per stage. A consumer that ships a Go service
# to Fly.io calls this and writes no pipeline of its own.
#
# **The deploy is a job with `needs:`, never a second workflow.** The alternative a consumer reaches
# for is `on: workflow_run: workflows: [ '<name>' ]`, which couples two files by a DISPLAY NAME and
# fails silently when that name changes: a `workflow_run` naming a workflow that does not exist is
# not an error, it simply never fires. One consumer renamed its CI workflow while adopting this
# library and went four days without deploying, with every pipeline green the whole time. A `needs:`
# edge cannot drift, and a deploy that does not run is a skipped job rather than silence.
#
# The deployment itself is the same `50-deployment/flyio` action GitLab and Azure DevOps reach
# through their own templates, so the behaviour is one shared script (`global/scripts/deploy/flyio/
# run.sh`) on all three platforms. This file is the GitHub convenience layer over it, not a second
# implementation of it.
#
# **The deploy ships the image `delivery > docker` pushed, not a second build of it.** The deploy
# copies that image's linux/amd64 build from GHCR into `registry.fly.io` with `crane`, registry to
# registry, and deploys it by digest, so the artifact CI produced is the one that runs and Fly's
# builder is not involved at all. Rebuilding the Dockerfile there took about two of the two and a half
# minutes a deploy spent, and produced an image with a different digest. `fly_build_from_source`
# restores that build (`--remote-only`). Neither path needs a Docker daemon in the deployment job.
#
# Consumers pin this workflow to a FULL 40-character commit SHA (an abbreviated one is rejected
# before any job starts, with an error that reads like the commit is missing rather than like the
# ref is the wrong shape); internal `rios0rios0/pipelines/...@main` references below deliberately
# follow the latest first-party implementation, per the Workflow Composition Standard.
on:
  workflow_call:
    inputs:
      sonar_host:
        description: 'SonarQube/SonarCloud host URL (leave empty to skip SonarQube)'
        required: false
        type: string
        default: ''
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: 'JSON array of runner labels (e.g. ''["self-hosted"]''). See go.yaml.'
      codeql_runs_on:
        type: 'string'
        required: false
        default: ''
        description: 'Runner labels for the CodeQL job alone; empty runs it on `runs_on`. See go.yaml.'
      go_version_file:
        type: 'string'
        required: false
        default: 'go.mod'
        description: |
          Path to the `go.mod` whose `go` directive decides which Go the CodeQL analysis runs
          with. Leave it alone unless this repository has SEVERAL modules: the shared action
          finds a single module wherever it lives, and only an ambiguous tree needs telling.

          It is a file rather than a version on purpose. The `go` directive is a minimum
          language version, and the CodeQL runner sets `GOTOOLCHAIN=local`, so a module ahead
          of the runner's Go cannot be extracted at all -- reading the module's own directive
          means the analysis can never be older than the code it analyses.
      codeql_upload:
        type: 'string'
        required: false
        default: 'always'
        description: "CodeQL SARIF upload mode ('always', 'failure-only' or 'never'). See go.yaml."
      database_image:
        type: 'string'
        required: false
        default: ''
        description: 'Database image to run the tests against (e.g. ''postgres:18-alpine''). See go.yaml.'
      database_url_env:
        type: 'string'
        required: false
        default: ''
        description: 'Environment variable the composed connection URL is exported into. See go.yaml.'
      coverage_threshold:
        type: 'number'
        required: false
        default: 0
        description: 'Minimum total coverage percentage; 0 disables the gate. See go.yaml.'
      integration_parallel:
        type: 'number'
        required: false
        default: 1
        description: 'How many integration test binaries run concurrently (`go test -p`). See go.yaml.'
      openapi_sync_path:
        type: 'string'
        required: false
        default: ''
        description: 'Committed OpenAPI document to regenerate and diff. See go.yaml.'
      openapi_sync_command:
        type: 'string'
        required: false
        default: 'make swagger'
        description: 'Command that regenerates the document named by `openapi_sync_path`.'
      # A caller derives this from the ref, which is what keeps one repository's two apps apart
      # and what stops a stale hardcoded name from deploying the wrong app. The example lives in
      # this comment rather than in `description:` below because GitHub EVALUATES a `${{ }}` sequence
      # inside an input description, where no context is available -- an expression naming
      # `github` there does not document the input, it makes the whole file fail to compile, on
      # every push, as a run with no jobs named after the file path:
      #
      #     fly_app_name: "api-${{ github.ref_type == 'tag' && 'production' || 'staging' }}"
      fly_app_name:
        type: 'string'
        required: false
        default: ''
        description: |
          Fly application name the deploy targets. Optional when the committed `fly.toml` already
          declares `app`, but prefer passing it derived from the ref when one repository deploys
          two apps: concatenate a fixed prefix with `production` on a tag and `staging` otherwise,
          so the value reads `api-staging` on a branch and `api-production` on a tag. Deriving it
          beats hardcoding, because a stale name deploys the WRONG app and reports success. The
          literal expression cannot appear here — GitHub evaluates this field in the trigger block,
          where no context exists — so it is written out in the comment above the input.

          Named, never identified by a stored id: the name is a value the workflow already knows,
          while a stored id is one more secret to rotate — and a stale id is the worse failure of
          the two, because it deploys the WRONG app and reports success. This is the same contract
          `render_service_name` carries in `go-render.yaml`.
      fly_org:
        type: 'string'
        required: false
        default: ''
        description: |
          Fly.io organization slug. Setting it lets the deployment CREATE the app when it does not
          exist yet, so standing up a new environment does not depend on somebody running
          `flyctl apps create` by hand first -- `flyctl deploy` does not create apps, so without
          this the first run of every new environment is red.

          It is OPT-IN because of what it costs in token scope. An app-scoped deploy token
          (`flyctl tokens create deploy --app <app>`) cannot create apps, so auto-creation needs an
          ORG-SCOPED token (`flyctl tokens create org --org <org>`) that can manage EVERY app in the
          organisation. Leave this empty to keep the tighter app-scoped token, one per environment,
          and create the apps deliberately.
      fly_app_name_var:
        type: 'string'
        required: false
        default: ''
        description: |
          Name of a caller VARIABLE holding the app name, read inside the deployment job — pass
          `FLY_APP_NAME` to resolve `vars.FLY_APP_NAME`. Takes effect only when `fly_app_name` is
          empty; the literal input always wins.

          This exists for the same constraint `build_env_vars` documents in the Cloudflare
          workflows: a job that calls a reusable workflow **cannot declare `environment:`**, so its
          `with:` block is evaluated with no environment selected and `vars.FLY_APP_NAME` in a
          caller resolves to the REPOSITORY-level variable rather than to staging's. Anything
          scoped per environment therefore cannot be passed as an input at all — it has to be named
          here and read in the job that declares the environment.

          What it buys: one repository deploying two apps stops spelling their names in a workflow
          file. Renaming an app becomes editing an environment variable, not committing code — and
          Fly app names are globally unique, so a rename is a thing that genuinely happens.

          A name that resolves to nothing FAILS the job rather than deploying somewhere else: a
          variable set on one environment and forgotten on the other is the failure this must not
          make silent.
      fly_org_var:
        type: 'string'
        required: false
        default: ''
        description: |
          Name of a caller VARIABLE holding the organization slug, resolved exactly as
          `fly_app_name_var` is, and used only when `fly_org` is empty. Separate orgs per
          environment are a stronger isolation story than one org holding both, and this is what
          makes that expressible without a literal in the workflow.

          Unlike the app name, an unresolvable name is NOT a failure here: an empty org is the
          documented "do not auto-create" state. It is not SILENT either, which is a different
          thing — a name that resolves to nothing warns, because "opted in and got nothing" is not
          the same state as "did not opt in", and #645 exists to keep that distinction loud.
      fly_machine_count:
        type: 'string'
        required: false
        default: ''
        description: |
          Exact number of machines the app runs after a successful deploy, enforced with
          `flyctl scale count`. `1` additionally passes `--ha=false`, so the deploy does not
          create the spare machine Fly adds by default when it first fills a process group.

          Set it when the app is NOT safe to run twice — an in-process event bus, an in-memory
          rate limiter, background workers with no leader election. That app is silently
          *wrong* on two machines rather than broken, so nothing reports it, and
          `min_machines_running` in `fly.toml` is a floor that cannot express the ceiling.

          Leave empty to let Fly manage the count.
      fly_machine_count_var:
        type: 'string'
        required: false
        default: ''
        description: |
          Name of a caller VARIABLE holding the machine count, resolved exactly as
          `fly_app_name_var` is and used only when `fly_machine_count` is empty. This is the
          form to prefer: raising the ceiling once an app becomes safe to run twice is then a
          GitHub environment variable, not a commit — and it can differ per environment, so
          production can stay pinned while staging is widened first.

          An unresolvable name is not a failure: it means the same thing as not setting it.
      fly_config:
        type: 'string'
        required: false
        default: 'fly.toml'
        description: 'Path to the Fly configuration file the deploy reads.'
      fly_strategy:
        type: 'string'
        required: false
        default: ''
        description: |
          Deployment strategy (`rolling`, `immediate`, `canary`, `bluegreen`). Left unset, Fly
          picks its own default for the app's layout.
      fly_build_from_source:
        type: 'boolean'
        required: false
        default: false
        description: |
          Build the Dockerfile from source on Fly's builder (`flyctl deploy --remote-only`) instead
          of deploying the image `delivery > docker` pushed in this run. Off by default.

          By default the deploy copies that image's linux/amd64 build from GHCR into
          `registry.fly.io` and deploys it by digest: the artifact this run built and pushed is the
          one that runs, and Fly builds nothing. Until this default, every deploy rebuilt the
          Dockerfile on Fly's builder, which took most of the deploy's time and produced an image
          with another digest than the one CI had pushed.

          That changes WHAT is deployed wherever `fly.toml` describes a different build. The
          delivery job builds `.ci/stages/40-delivery/app.Dockerfile` with the repository root as
          context. A `fly.toml` whose `[build]` names that same file deploys the same image either
          way -- the one consumer known when the default changed builds it in both places -- but a
          `fly.toml` naming another Dockerfile, a build target or build arguments of its own now
          deploys the delivery job's image instead. Set this to keep deploying what `fly.toml`
          builds.
      version_build_arg:
        type: 'string'
        required: false
        default: ''
        description: |
          Name of the Dockerfile `ARG` that receives the app's version (e.g. `VERSION`). Handed to
          the image `go-docker.yaml` pushes to the registry, which is what the deploy ships, so the
          app reports the release this run cuts, the tag on a tag build, or the commit's first 7
          characters otherwise. With `fly_build_from_source`, Fly's builder makes its own image
          from source and is handed the same value, so an error tracker files a deploy under one
          release wherever it was built. Empty passes nothing, which is the default.
      deployment_environment:
        type: 'string'
        required: false
        default: ''
        description: |
          GitHub environment the deploy runs under, which is what scopes the credentials and what
          can restrict the refs allowed to deploy. Defaults to `production` on a tag and `staging`
          otherwise.
      deployment_required_checks:
        type: 'string'
        required: false
        default: ''
        description: |
          Newline-separated check names that must have SUCCEEDED before deploying.

          Needed for TAG builds and not much else: `go.yaml` skips lint, the suite and the whole
          security stage on a tag — they already ran when the commit landed on the default branch —
          so the `needs:` edge below is satisfied by a run that verified nothing. On a branch the
          dependency is real and this can stay empty.

          Set, it costs a branch run no API call: there the gate requires every job the deployment
          `needs:` to have finished `success`, the same run's checks, instead of reading check runs,
          which GitHub records separately and can record late.

          Write the names bare (`tests > test:all`). The gate matches a whole trailing ` / `
          segment, so it does not matter that GitHub records them prefixed with the calling jobs.
      promote_release:
        type: 'boolean'
        required: false
        default: false
        description: |
          Start this workflow again on the tag `delivery > release` cuts from a bump merge, so the
          tag run -- the one `deployment > flyio` resolves `production` on -- starts without anyone
          pushing the tag by hand. Forwarded to `go-docker.yaml`, whose release job does the
          dispatch; see the input there for why a dispatch is needed at all and what the caller
          must grant (`on: workflow_dispatch:`, and `actions: write` beside `contents: write`).
          Off by default.
    secrets:
      sonar_token:
        required: false
        description: 'SonarQube/SonarCloud token. See go.yaml.'
      fly_api_token:
        required: false
        description: |
          Fly.io API token. Prefer an APP-SCOPED deploy token, one per app/environment
          (`flyctl tokens create deploy --app <app>`), over an org-scoped `flyctl auth token`:
          the deploy needs to manage one app, and a token for `api-staging` cannot touch
          `api-production` even though every workflow in the calling repository can read it.

          The ONE exception is `fly_org`. An app-scoped token cannot create apps, so a caller that
          wants the deployment to create its app on first run must pass an org-scoped token
          (`flyctl tokens create org --org <org>`) instead, which manages every app in the
          organisation. That is a deliberate trade of blast radius for not having to provision an
          app by hand; make it knowingly, and never pass a personal `flyctl auth token`, which is
          wider than both.

          Hold it as a REPOSITORY secret in the caller and pass it explicitly. Environment-scoped
          secrets cannot reach a reusable workflow in another repository — not with
          `secrets: inherit`, not explicitly, and not via the `environment:` the job below
          declares — and the failure is silent: the credential arrives empty and surfaces as a
          rejected token rather than as a scoping problem. Declared `required: false` so the
          runtime check below can name that cause instead of failing workflow validation.

jobs:
  go-docker:
    uses: 'rios0rios0/pipelines/.github/workflows/go-docker.yaml@main'
    with:
      go_version_file: "${{ inputs.go_version_file }}"
      sonar_host: ${{ inputs.sonar_host }}
      runs_on: ${{ inputs.runs_on }}
      codeql_runs_on: ${{ inputs.codeql_runs_on }}
      codeql_upload: ${{ inputs.codeql_upload }}
      database_image: ${{ inputs.database_image }}
      database_url_env: ${{ inputs.database_url_env }}
      coverage_threshold: ${{ inputs.coverage_threshold }}
      integration_parallel: ${{ inputs.integration_parallel }}
      openapi_sync_path: ${{ inputs.openapi_sync_path }}
      openapi_sync_command: ${{ inputs.openapi_sync_command }}
      promote_release: ${{ inputs.promote_release }}
      version_build_arg: ${{ inputs.version_build_arg }}
    secrets:
      sonar_token: ${{ secrets.sonar_token }}

  # fifth stage
  deployment-flyio:
    name: 'deployment > flyio'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # The ref picks the environment, which is what keeps two environments' credentials apart: a run
    # not entitled to `production` cannot read its secrets, and `production` can refuse every ref
    # that is not a tag.
    environment: ${{ inputs.deployment_environment != '' && inputs.deployment_environment || (github.ref_type == 'tag' && 'production' || 'staging') }}
    # Only what is used, and only read. A called workflow can never hold more than its caller
    # grants, so requesting anything spare turns a working consumer into a permissions error --
    # `deployments: write` is the one to resist here, since nothing in the Fly path touches that
    # API. `checks: read` IS required and is not in the restricted default set.
    #
    # `packages: read` is what lets this job's token pull the image `delivery > docker` pushed to
    # GHCR, which is private unless somebody made it public. It asks no caller for anything new:
    # that job pushes with `github.token`, which takes `packages: write`, and this job `needs:` it,
    # so a caller granting no `packages` at all could never have delivered the image this deploys.
    permissions:
      contents: 'read'
      checks: 'read'
      packages: 'read'
    steps:
      # Skipped entirely when the caller passes nothing. Handed `needs`, a branch run is decided by
      # the jobs this one needs -- the same run's checks, as the scheduler reported them -- and reads
      # no check runs, which GitHub records separately and can record late. A tag still reads them:
      # there the checks are skipped, and the workflow that skipped them still reports `success`.
      - if: "inputs.deployment_required_checks != ''"
        uses: 'rios0rios0/pipelines/github/global/stages/50-deployment/require-checks@main'
        with:
          required_checks: "${{ inputs.deployment_required_checks }}"
          needs: "${{ toJSON(needs) }}"

      # Refused here rather than by the deploy script, whose message is about a missing token and
      # not about why it is missing.
      #
      # Empty almost always means one thing: the credential is an ENVIRONMENT secret in the calling
      # repository. Those cannot reach this workflow by any route -- not `secrets: inherit` (which
      # only carries secrets within one organization, and this library is a different owner), not an
      # explicit `${{ secrets.X }}` (evaluated in the caller's `uses:` job, which cannot declare an
      # environment), and not the `environment:` on the job below, which applies for protection
      # rules and the deployment record but brings no secrets across a repository boundary.
      # Environment VARIABLES do cross, which is what makes this so easy to misread.
      - run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::fly_api_token did not reach this job. Hold the token as a REPOSITORY secret and pass it explicitly. Environment-scoped secrets cannot reach a reusable workflow in another repository -- not with 'secrets: inherit', not explicitly, and not via the environment declared on this job."
            exit 1
          fi
        shell: 'bash'
        env:
          FLY_API_TOKEN: "${{ secrets.fly_api_token }}"

      # Resolved HERE because this is the first job with an environment to resolve against --
      # see `fly_app_name_var` for why a caller cannot pass an environment-scoped value at all.
      #
      # `vars[<name>]` indexes the context in the expression, which is enough for a single value;
      # the Cloudflare workflows need python only because their input carries a LIST of names.
      # The context is the caller's, merged organization < repository < environment, so a slug
      # shared by both environments stays a single repository variable.
      #
      # Failing here rather than letting an empty name through is the point: `flyctl deploy` with
      # no app resolves to whatever `fly.toml` declares, which for a repository deploying two apps
      # is deliberately nothing -- so the alternative to this error is a confusing failure two
      # steps later, or, for a repository that does declare `app`, a deploy to the WRONG one.
      #
      # Both values reach the shell through `env:`, never spliced into the script text, per the
      # convention `terra.yaml` records: an input interpolated into a `run:` body is pasted in
      # before bash parses it, so `$(…)` or a backtick in a caller-controlled value executes in the
      # job that holds FLY_API_TOKEN. Wiring `fly_app_name_var` to a `workflow_dispatch` input is
      # the natural way to make the app selectable, which is exactly how a value stops being
      # literal. A plain apostrophe is enough to mangle the message with no attacker at all.
      #
      # `!vars[...]` rather than `== ''`: falsy covers an unset name (null) and an empty value
      # alike, so nothing here depends on how the expression language casts null in a comparison.
      - if: "inputs.fly_app_name == '' && inputs.fly_app_name_var != '' && !vars[inputs.fly_app_name_var]"
        run: |
          echo "::error::fly_app_name_var names '$APP_NAME_VAR', which is not set for this deployment. Set it as a variable on the '$DEPLOY_ENVIRONMENT' environment (or on the repository, if both environments share one app)."
          exit 1
        shell: 'bash'
        env:
          APP_NAME_VAR: "${{ inputs.fly_app_name_var }}"
          DEPLOY_ENVIRONMENT: ${{ inputs.deployment_environment != '' && inputs.deployment_environment || (github.ref_type == 'tag' && 'production' || 'staging') }}

      # The org half is a WARNING, not a failure -- an org is genuinely optional, and a caller that
      # never opts in is inert. But "opted in and got nothing" is a different state from "did not
      # opt in", and #645 exists to stop the first one being silent: `run.sh` already warns when
      # FLY_ORG is set and no app name resolves, and this is the mirror of that. Without it, a
      # consumer that sets FLY_ORG on staging and forgets it on production resolves an app name
      # (so the guard above stays quiet), resolves an empty org, skips creation, and the first
      # production tag dies on an app nobody created -- with nothing anywhere naming the variable.
      - if: "inputs.fly_org == '' && inputs.fly_org_var != '' && !vars[inputs.fly_org_var]"
        run: echo "::warning::fly_org_var names '$ORG_VAR', which is not set for this deployment, so app auto-creation is disabled here."
        shell: 'bash'
        env:
          ORG_VAR: "${{ inputs.fly_org_var }}"

      # The default ships the image `delivery > docker` pushed in this run, and a run that reached
      # this job without one has nothing to ship. Refused rather than built on Fly's builder
      # instead: that would deploy an image this run never pushed -- the state the default exists
      # to end -- and nothing would say so. `delivery-docker` runs on every event this job does,
      # so this only fires when the two have drifted apart.
      - if: "!inputs.fly_build_from_source && needs.go-docker.outputs.image == ''"
        run: |
          echo "::error::delivery > docker reported no image for this run, so there is nothing to deploy. Set fly_build_from_source: true to build the Dockerfile on Fly's builder instead."
          exit 1
        shell: 'bash'

      - uses: 'rios0rios0/pipelines/github/global/stages/50-deployment/flyio@main'
        with:
          fly_api_token: "${{ secrets.fly_api_token }}"
          app_name: "${{ inputs.fly_app_name != '' && inputs.fly_app_name || vars[inputs.fly_app_name_var] }}"
          org: "${{ inputs.fly_org != '' && inputs.fly_org || vars[inputs.fly_org_var] }}"
          machine_count: "${{ inputs.fly_machine_count != '' && inputs.fly_machine_count || vars[inputs.fly_machine_count_var] }}"
          config: "${{ inputs.fly_config }}"
          strategy: "${{ inputs.fly_strategy }}"
          # The image `delivery > docker` pushed in this run, by digest. Empty when the caller opts
          # out, which makes the deploy build from source on Fly's builder.
          image: "${{ !inputs.fly_build_from_source && needs.go-docker.outputs.image || '' }}"
          # Read only by that build from source: the image above was built with its version in it.
          version_build_arg: "${{ inputs.version_build_arg }}"
          # The release this run cut, when it cut one. The deploy that follows a bump merge runs
          # on the branch, where the version would otherwise fall back to the commit while the
          # image pushed beside it reports the release.
          version: "${{ needs.go-docker.outputs.tag_name }}"
          environment: ${{ inputs.deployment_environment != '' && inputs.deployment_environment || (github.ref_type == 'tag' && 'production' || 'staging') }}
    needs: [ 'go-docker' ]
    # `!failure()` rather than `success()` so a skipped upstream job does not take the deploy with
    # it, matching how `delivery-docker` gates itself one level down. `!cancelled()` beside it
    # because a cancelled job is not a failed one: without it a run superseded by
    # `cancel-in-progress` still deploys a commit whose checks never finished. A pull request
    # never deploys.
    if: "!cancelled() && !failure() && github.event_name != 'pull_request' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))"
