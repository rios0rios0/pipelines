stages:
  - stage: 'management'
    displayName: 'management'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    jobs:
      - template: '../../../global/stages/35-management/sonarqube.yaml'
        parameters:
          # Terraform consumers don't produce a `coverage` artifact, so the
          # default download step emits `##[error]Artifact coverage was not
          # found` and turns the job yellow. Skip it.
          DOWNLOAD_COVERAGE_ARTIFACT: false

      - job: 'report_dependency_track'
        displayName: 'report:dependency-track'
        # A pull-request validation build must not create a project.
        # `(name, version)` IS a project's identity in Dependency-Track, so a PR
        # whose version file is already bumped would mint that version's project
        # before the merge — and keep it if the merge never happens. The shared
        # `run.sh` refuses the upload anyway; this only saves spinning the job.
        #
        # `Build.Reason` rather than a default-branch comparison: Azure DevOps
        # publishes NO variable carrying the repository's default branch
        # (`Build.Repository.*` has Name, Uri, Provider, ID, LocalPath, Clean,
        # Tfvc.Workspace and Git.SubmoduleCheckout, and nothing else), so a
        # `Build.Repository.DefaultBranch` comparison would test against an empty
        # string and silently disable every upload.
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        variables:
          REPORT_PATH: 'build/reports'
        steps:
          # TODO: see https://www.reddit.com/r/Terraform/comments/1g9go7p/what_do_you_use_to_generate_sbom_for_terraform/
          - script: echo "$(date "+%Y-%m-%d %H:%M:%S") - Missing CycloneDX for Terraform..."

          - template: '../../../global/abstracts/scripts-repo.yaml'
          - script: $(Scripts.Directory)/global/scripts/tools/dependency-track/run.sh
            # Explicit mapping so the secret `$(DEPENDENCY_TRACK_TOKEN)`
            # reaches the shell as `$DEPENDENCY_TRACK_TOKEN`. Azure
            # Pipelines gates secret variables from the process
            # environment; without this block the script sends an empty
            # `X-Api-Key` header and DT returns `HTTP 401`.
            env:
              DEPENDENCY_TRACK_TOKEN: $(DEPENDENCY_TRACK_TOKEN)
              DEPENDENCY_TRACK_HOST_URL: $(DEPENDENCY_TRACK_HOST_URL)
        continueOnError: true
