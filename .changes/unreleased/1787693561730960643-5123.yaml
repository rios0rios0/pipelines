kind: 'Added'
body: '**verified the uploader against Dependency-Track `5.0.5` and it needs no version branching.** Read from the `5.0.5` tag rather than inferred from the documentation site: `BomResource` is still `@Path("/v1/bom")`, the multipart parameters are byte-identical (`project`, `autoCreate`, `projectName`, `projectVersion`, `projectTags`, `parentName`, `parentVersion`, `parentUUID`, `isLatest`, `bom`), and authentication is still the `X-Api-Key` header. v5 does add a `resources/v2` package, but it holds no BOM resource. One model change DOES land and is recorded in the script for anything that READS a project back: the `ACTIVE` column became `INACTIVE_SINCE`, a nullable timestamp, with `isActive()` kept as a derived accessor. The v5 tree also moved to `apiserver/src/main/java/...`, which is why these files look absent at the 4.x path'
time: '2026-08-25T21:32:41.730906751Z'
