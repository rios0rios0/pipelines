kind: 'Fixed'
body: 'fixed `global/scripts/tools/sonarqube/run.sh` analyzing test files as production code, which failed the "Duplication on New Code" condition of the SonarCloud gate on repositories whose duplicated lines were all test scaffolding: when `sonar-project.properties` classifies nothing, the runner now derives `sonar.sources=.`, `sonar.tests=.`, `sonar.test.inclusions` for the Go, Python, JavaScript/TypeScript, Java, .NET and Ruby test conventions, the same patterns plus `vendor`, `node_modules`, `build`, `dist`, `coverage` and `.pipelines` in `sonar.exclusions`, and `sonar.test.exclusions` -- every key a default the repository overrides by declaring it, and no inclusions when it names its own `sonar.tests`'
time: '2026-09-05T20:24:18.228683926Z'
