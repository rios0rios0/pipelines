variables:
  SEMGREP_LANG: 'javascript'
  CODEQL_LANGUAGE: 'javascript'

include:
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/stages/20-security/semgrep.yaml'
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/stages/20-security/gitleaks.yaml'
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/stages/20-security/codeql.yaml'
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/stages/20-security/hadolint.yaml'
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/javascript/abstracts/yarn.yaml'

# The shared `sast:codeql` (included above) keeps its image, script and report. The JavaScript
# extractor parses TypeScript by running the TypeScript compiler on Node.js, which the CodeQL bundle
# does not ship, so the job installs Node.js from the image's own distribution as well. It needs a
# Node, not the project's: nothing is built and no dependency is installed (the GitHub Actions job
# installs none either). Not the Node image of the other JavaScript jobs: `.yarn` runs it as the
# unprivileged `node` user, so `apt-get` cannot install `jq` there. Debian 13's own `nodejs`
# (20.19.2) has the distribution's regular security support -- it is not on the
# `debian-security-support` list of packages whose support is limited or ends early.
sast:codeql:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git jq curl nodejs
    - !reference [ .scripts-repo, before_script ]

sca:yarn-audit:
  extends: '.yarn'
  stage: 'security (sca/sast)'
  script:
    - yarn npm audit --recursive --severity high
  allow_failure: true
