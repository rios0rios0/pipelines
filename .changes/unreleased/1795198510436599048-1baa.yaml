kind: 'Fixed'
body: 'fixed the CodeQL scan passing while it analysed nothing: a Go checkout or worktree kept below a directory whose `go.work` did not list it was built inside that workspace, which loaded no package, so the database held the `go.mod` alone, every query ran over nothing and the gate passed the empty report, in `make sast` and on CI. `global/scripts/tools/codeql/run.sh` now builds Go with the repository''s own `go.work`, or with `GOWORK=off` when it has none, whenever the workspace `go` would join lies outside the source root, and keeps a `go.work` the repository holds; and on GitLab CI, Azure DevOps and `make codeql` it fails a scan whose report says the database holds no line of the language''s code (its `<language>/summary/lines-of-code` metric is 0, missing or not a number), listing the extractor''s errors, instead of passing it as clean. The GitHub Actions job, which analyses with `github/codeql-action`, does not run that check; `make test ONLY=codeql-extraction` holds both'
