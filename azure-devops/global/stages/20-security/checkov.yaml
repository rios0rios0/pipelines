# Checkov, the IaC misconfiguration scanner, installs from PyPI into a virtualenv
# (it ships no binary), so the agent needs `python3` with its venv module.
#
# Advisory by default, in the script itself: findings are reported and the step
# passes unless the pipeline variable `CHECKOV_BLOCKING` is `'true'`, which every
# script step receives as an environment variable. `continueOnError` matches the
# sibling SAST jobs here, so even a blocking scan turns the job "succeeded with
# issues" rather than failing the run. `CHECKOV_DIRECTORIES` (space-separated,
# `.` by default) narrows the scan the same way.
jobs:
  - job: 'sast_checkov'
    displayName: 'sast:checkov'
    steps:
      - template: '../../abstracts/scripts-repo.yaml'
      - script: $(Scripts.Directory)/global/scripts/tools/checkov/run.sh
        continueOnError: true

      - task: 'PublishPipelineArtifact@1'
        inputs:
          artifactName: 'checkov'
          targetPath: 'build/reports/checkov'
