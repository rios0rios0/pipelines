kind: 'Added'
body: 'added the test-pyramid check (`tests > test:pyramid`, `test:pyramid` on GitLab CI and Azure DevOps) to every pipeline with a test stage, on pull requests only: it classifies the test cases of the merge base and of the pull request into unit, integration, functional and e2e tiers -- deterministically, by what a test file declares (a build tag, a test category, a marker) or crosses (a browser driver, an in-process HTTP client, a container), then by its path -- for Go, Python, Java, JavaScript, PHP, Ruby, .NET, Dart and Terraform, and reports when the pull request worsens the shape: a tier outgrowing every tier below it, or a share growing past the reference mix (Software Engineering at Google''s 80/15/5 by default); advisory until the target branch''s `.test-pyramid` says `blocking true`, a policy a pull request cannot loosen for itself; `make test-pyramid` runs it locally'
