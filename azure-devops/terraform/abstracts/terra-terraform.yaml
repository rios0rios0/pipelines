steps:
  - task: 'TerraformInstaller@1'
    inputs:
      terraformVersion: '1.15.9'
    displayName: 'Install Terraform'

  - script: |
      set -uo pipefail

      # Kept in step with global/scripts/shared/pinned-versions.sh. Declared
      # inline because this abstract runs before any scripts-repo checkout, so
      # there is no $(Scripts.Directory) to source the manifest from yet.
      TERRAGRUNT_VERSION="1.1.3"
      TERRAGRUNT_SHA256="d5da6a66741f4ee752aa3b502b57e47fd6d5c178942861b2507f14f083e7606e"

      # Retried because the asset download can still drop mid-transfer from a
      # shared CI egress IP. The release LOOKUP that used to be retried
      # alongside it is gone -- the version is pinned, so there is no
      # unauthenticated GitHub API call left to be throttled.
      #
      # Previously neither the lookup nor the download was checked, so a
      # throttled response left `url` empty, `curl` wrote no usable binary, and
      # `chmod +x` handed the resulting text file to the shell -- surfacing as
      # `./terragrunt: line 1016: syntax error: unexpected end of file`, which
      # says nothing about the real cause. Each attempt now has to match the
      # committed checksum AND produce a working `terragrunt --version` before
      # it counts as success.
      attempts=3

      for attempt in $(seq 1 "$attempts"); do
        echo "Installing Terragrunt (attempt ${attempt}/${attempts})..."

        # PINNED and CHECKSUM-VERIFIED. This resolved `releases/latest` through
        # the GitHub API on every run, so the Terragrunt that plans and applies
        # this project's infrastructure was whichever version upstream had
        # published that morning -- a moving target in the one job that holds
        # cloud credentials -- and the binary it fetched was never verified.
        # Fixing the version also removes the reason the URL had to be scraped
        # out of an API response at all, which is what the deleted comment
        # about matching `terragrunt_linux_amd64` against three assets was
        # working around.
        url="https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"

        if ! curl -fsSL --proto '=https' --proto-redir '=https' -o terragrunt "$url"; then
          echo "Attempt ${attempt}: download failed from ${url}" >&2
        elif ! echo "${TERRAGRUNT_SHA256}  terragrunt" | sha256sum -c -; then
          echo "Attempt ${attempt}: CHECKSUM MISMATCH for ${url} -- refusing to run it." >&2
          rm -f terragrunt
        else
          chmod +x terragrunt
          if ./terragrunt --version; then
            exit 0
          fi
          echo "Attempt ${attempt}: downloaded file did not execute as Terragrunt." >&2
        fi

        if [ "$attempt" -lt "$attempts" ]; then
          sleep $((attempt * 10))
        fi
      done

      echo "ERROR: could not install Terragrunt after ${attempts} attempts." >&2
      exit 1
    displayName: 'Install Terragrunt'
