on:
  workflow_call:
    inputs:
      install_run_scripts:
        type: 'boolean'
        required: false
        default: false
        description: 'Run dependency lifecycle scripts after installing. See the toolchain workflow.'
      sonar_host:
        description: 'SonarQube/SonarCloud host URL (leave empty to skip SonarQube)'
        required: false
        type: string
        default: ''
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: 'JSON array of runner labels (e.g. ''["self-hosted"]''). See npm.yaml.'
      codeql_upload:
        type: 'string'
        required: false
        default: 'always'
        description: "CodeQL SARIF upload mode ('always', 'failure-only' or 'never'). See npm.yaml."
    secrets:
      sonar_token:
        description: 'SonarQube authentication token'
        required: false

jobs:
  npm:
    uses: 'rios0rios0/pipelines/.github/workflows/npm.yaml@main'
    with:
      install_run_scripts: ${{ inputs.install_run_scripts }}
      sonar_host: ${{ inputs.sonar_host }}
      runs_on: ${{ inputs.runs_on }}
      codeql_upload: ${{ inputs.codeql_upload }}
    secrets:
      sonar_token: ${{ secrets.sonar_token }}

  # fourth stage
  delivery-release:
    name: 'delivery > release'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: 'release'
        uses: 'rios0rios0/pipelines/github/global/stages/40-delivery/release@main'
    needs: [ 'npm' ]
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, 'chore/bump-') || contains(github.event.head_commit.message, 'chore(bump)'))"

  delivery-docker:
    name: 'delivery > docker'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/40-delivery/docker@main'
        with:
          tag_name: "${{ needs.delivery-release.outputs.tag_name }}"
    needs: [ 'npm', 'delivery-release' ]
    if: "!failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))"
