kind: 'Added'
body: 'added `build/reports/terra-coverage-generic.xml`, a second Terraform coverage report in SonarQube''s language-agnostic generic format, emitted by the `terra-test` tier beside the existing Cobertura file and now auto-detected by `global/scripts/tools/sonarqube/run.sh`, which wires it to `sonar.coverageReportPaths` -- the only channel Terraform coverage can reach SonarQube through, since there is no `sonar.terraform.coverage.reportPaths`. Where `terra-coverage.xml` answers "does this module have a `tests/` directory?" with one synthetic line per module, the new report answers "which declarations does a test actually look at?": it statically resolves every `resource`, `data`, `module`, `output` and `check` block to its real file and line and marks it covered only when a test assertion references it, resolving `locals` and `output` indirection transitively so an assertion reaching a block through a chain of local values still counts, and counting `expect_failures`, `precondition`, `postcondition` and `check` blocks as assertions too. The mere presence of a block in a plan deliberately does NOT count -- every module that compiles appears in its own plan, so plan presence would score 100% on a repository with no assertions at all. The denominator is `modules/` only (stacks are out of scope), and `.terraform` and `.terragrunt-cache` copies are pruned from both the denominator and the successes so a vendored copy of a module cannot inflate or deflate the number. `terra-coverage.xml` is byte-for-byte unchanged and still feeds the Azure DevOps Code Coverage tab via `PublishCodeCoverageResults`. One caveat worth knowing: the granularity is the block, not the line, so a 220-line `resource` counts as fully covered off a single attribute assertion'
