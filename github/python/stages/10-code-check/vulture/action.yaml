inputs:
  python_version:
    required: false
    default: '3.13'
    description: 'Python version to use'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0

    - name: 'Setup Python'
      uses: 'actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1' # v6.3.0
      with:
        python-version: '${{ inputs.python_version }}'

    - name: 'Install PDM and dependencies'
      run: |
        python -m pip install "pdm==2.28.1"
        pdm install -v
      shell: 'bash'

    - uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    - run: $SCRIPTS_DIR/global/scripts/languages/python/vulture/run.sh
      shell: 'bash'

    - name: 'Upload Report'
      uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
      with:
        name: 'vulture'
        path: 'build/reports/vulture/'
        if-no-files-found: 'error'
        overwrite: 'true'
        retention-days: 10
      if: always()
