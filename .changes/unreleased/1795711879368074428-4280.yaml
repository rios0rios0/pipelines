kind: 'Fixed'
body: 'fixed Go repositories with no `go.mod` at their root and several below it, such as Lambda functions side by side, getting no BOM at all (KI-08): `cyclonedx-gomod` ran at the root and failed. The generator now writes one BOM per module, at `modules/<module directory>/bom.json` (nested modules included; hidden directories, `vendor/`, `testdata/` and `node_modules/` skipped; a module without a `main` package described as a library). The uploader sends each as the project its module path names, with its own version and `isLatest`, under a versionless, component-free project for the repository, which it creates first: named after `Build.Repository.Name`, `CI_PROJECT_NAME` or the repository part of `GITHUB_REPOSITORY`, or `DEPENDENCY_TRACK_PROJECT_NAME`, and created under `DEPENDENCY_TRACK_PARENT_NAME` when set. A repository project turned into a collection project keeps working, and unnamed or duplicate module paths fail before the first upload. README.md, "One project per Go module", documents the convention; `make test ONLY="cyclonedx-main-detection dependency-track"` holds it'
time: '2026-11-26T16:51:19.364624474Z'
