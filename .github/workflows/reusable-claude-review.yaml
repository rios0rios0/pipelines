name: 'Claude Review'

on:
  workflow_call:
    inputs:
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: 'JSON array of runner labels (e.g. ''["self-hosted"]''). See go.yaml.'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: 'OAuth token used by the Claude Code action'

jobs:
  claude-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: 'read'
      pull-requests: 'write'
      issues: 'write'
      id-token: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0
        with:
          fetch-depth: 1

      - name: 'Run Claude Code Review'
        id: 'claude-review'
        uses: 'anthropics/claude-code-action@70fec183852c4f82f3f1969faed7dd60c5149ca7' # v1.0.207
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # `track_progress` forces tag mode (detector.ts checks it before the prompt check),
          # and tag mode builds its own tool list including `mcp__github_comment__update_claude_comment`,
          # so Claude can post without being handed an `--allowedTools` list. Agent mode -- what a
          # bare `prompt:` selects -- derives its tools from `claude_args` alone and would leave
          # Claude with no way to publish the review.
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          show_full_output: true
          display_report: true
        env:
          # Sets the model without touching `claude_args`: parse-sdk-options.ts resolves
          # `model: options.model || modelFromClaudeArgs`, where `options.model` is this
          # variable -- so it wins over `--model` and leaves the tool wiring alone.
          ANTHROPIC_MODEL: 'claude-opus-5'
