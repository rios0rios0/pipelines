parameters:
  - name: 'DEPENDS_ON'
    type: object
    default: ''
  # The Python every job of this stage sets up; see `abstracts/pdm-python3.14.yaml`.
  - name: 'PYTHON_VERSION'
    type: 'string'
    default: '3.14'

stages:
  - stage: 'tests'
    displayName: 'tests'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    ${{ if ne(parameters.DEPENDS_ON, '') }}:
      dependsOn: ${{ parameters.DEPENDS_ON }}
    jobs:
      # Does this pull request worsen the shape of the test suite? Pull requests only; advisory
      # unless the target branch's `.test-pyramid` says `blocking true`. See
      # azure-devops/global/stages/30-tests/test-pyramid.yaml and README.md, "Test Pyramid".
      - template: '../../../global/stages/30-tests/test-pyramid.yaml'
        parameters:
          LANGUAGE: 'python'

      - job: 'test_all'
        displayName: 'test:all'
        steps:
          - template: '../../abstracts/pdm-python3.14.yaml'
            parameters:
              PYTHON_VERSION: ${{ parameters.PYTHON_VERSION }}
          - script: |
              pdm run test
            displayName: 'Run Tests'

          - task: 'PublishTestResults@2'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'build/reports/junit.xml'
            displayName: 'Publish JUnit XML Results'

          - task: 'PublishCodeCoverageResults@2'
            inputs:
              summaryFileLocation: 'build/reports/cobertura.xml'
            displayName: 'Publish Cobertura XML Results'

          - task: 'PublishPipelineArtifact@1'
            inputs:
              artifactName: 'coverage'
              targetPath: 'build/reports'
            displayName: 'Publish Coverage Files'

        continueOnError: false
