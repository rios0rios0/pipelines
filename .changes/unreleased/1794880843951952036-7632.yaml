kind: 'Fixed'
body: 'fixed the release job of all three platforms tagging a commit that is not a bump: the bump patterns were matched against every line of the message, so an Azure DevOps merge whose pull request description held a line such as `chore(bump): bumped version to 1.2.0`, a squash merge whose commit list held a bump, or a GitHub merge commit whose pull request title read like one was released under that version. Only the subject, the message''s first line, is read now, at HEAD and in the batched-run walk of the Azure DevOps job, and the GitLab and Azure DevOps pattern for a pull request merge accepts the `owner/` a GitHub merge commit puts before the branch, which only the conventional title in its body used to cover. A bump pull request merged with a GitHub merge commit is found by its `chore/bump-` branch, as documented, never by its title'
