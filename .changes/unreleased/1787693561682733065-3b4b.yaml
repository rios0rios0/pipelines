kind: 'Fixed'
body: 'fixed every GitHub Actions cache in this library that restores into a `$HOME` path being not merely useless on a self-hosted runner but **actively expensive**, because `$HOME` survives every job on that host and the restore therefore untars an archive over files that are already there. Both observed shapes are one defect wearing different errnos: Go''s module cache is deliberately read-only, so `tar` reports `Cannot open: File exists`; Dart''s unpacked SDK directory is already present and not writable, so it reports `Cannot mkdir: Permission denied`. Either way `tar` exits 2, the action logs `Failed to restore`, and the entire download is discarded **after** it has been paid for. Nothing anywhere reports this as a problem -- every job stays GREEN and the only symptom is a pipeline that is slow for no stated reason. Measured on a 12-vCPU self-hosted runner, one workflow run per language: Go pulls 263-286 MB for 47-68s of restore plus 33-78s of post-job save in each of four jobs; **Dart pulls 1.67 GB for 214-358s of restore plus 87-102s of save in each of five**, which on `style:format` is 314s of cache around 17.6s of work, and roughly 31 minutes of runner time thrown away per pipeline run. The Go half landed first (#608) and covered five of its six call sites; this completes it with `40-delivery/binary` and the three in `terra.yaml`, and extends the same gate to all seven Dart cache steps'
