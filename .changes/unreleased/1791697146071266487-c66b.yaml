kind: 'Added'
body: 'added Go toolchain tracking to the dependency-update checks: Go is pinned per release line (`# upstream: go-toolchain golang.org/toolchain track=1.27`), resolved from the module proxy that serves `GOTOOLCHAIN` and checked against both the standard library''s and the `go` command''s advisories, so a vulnerable Go is forced out like any other pin; every copy follows the pin of its line -- `go-version:`, the Azure DevOps `GoTool@0` `version:`, and `golang:<release>` images, which move to the new release''s tag at its digest after a scan against the old image, while a variant not published for that release is handed to a person'
time: '2026-10-11T05:39:06.071185967Z'
