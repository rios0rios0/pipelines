kind: 'Fixed'
body: 'made `reusable-claude-review.yaml` actually run the `code-review` plugin it declares, by dropping `track_progress: true`. That input forces tag mode, where `prompt` is injected into the action''s own template as context rather than executed -- so the plugin installed, appeared in `slash_commands` and never ran (one review reported `subagent_stats.spawned: 0` against a command that mandates roughly seven), and the review that shipped was an unbounded free-form agent: seven reviews on one pull request in seventy minutes, the last of them about three files that pull request never touched. Agent mode executes the command, so the review now inherits the plugin''s multi-agent pipeline, its confidence filter, its exclusion of pre-existing issues and of untouched lines, and its guard that stops once Claude has already commented. The `--allowedTools` string from the action''s own PR-review examples is passed alongside it, because in agent mode that list is the only thing that installs a GitHub MCP server -- without it Claude reviews the pull request and cannot post, which four pull requests here did as green jobs with no comment. The trade-off agent mode carries (no tracking comment, and `use_sticky_comment` unreachable, so one comment per push) is documented in the workflow and in README.md.'
