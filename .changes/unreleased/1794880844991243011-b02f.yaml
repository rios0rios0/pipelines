kind: 'Fixed'
body: 'fixed the GitHub Actions release step failing the job on a tag that names no version (`latest`, `stable`): the runner''s bash runs with `pipefail`, so grep finding no version in the tag ref failed the `extract` step, on every library workflow whose release job runs on any tag push. Such a tag is now a clean skip, and a tag run no longer reads its commit at all, so a bump under a tag that names no version is not released under a tag that run never pushes'
time: '2026-11-17T02:00:44.991142645Z'
