kind: 'Added'
body: 'added `dependency-updates-verify.yaml` (`security > verify:dependency-updates`), which proves from the diff of any pull request that moves a pin -- the scheduled one, a commit pushed onto it, or a bump written by hand -- that every moved dependency is safe to merge: no new advisory or malicious release, past the cooldown or fixing a known vulnerability, every digest the asset upstream published, every action commit the one its tag names and a descendant of the old pin, every vendored file exactly the upstream change merged onto the local adjustments, every image digest a manifest of its repository, and every pin within its bounds. The verdict is posted as one comment updated on every push; make the check required to turn the proof into a gate. A pull request that moves no pin asks the network nothing, so an outage of the advisory database never blocks one, and a gateway error or dropped connection is retried twice before any lookup counts as failed'
