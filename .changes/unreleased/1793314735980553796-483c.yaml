kind: 'Fixed'
body: 'moved the GitLab CI `.npm`, `.yarn` and `.maven` images off Debian 11, whose packages no longer install since its security updates left the Debian mirrors, which had stopped `report:dependency-track` and the Maven `sca:dependency-check` at their `apt-get install` with a 404: `.maven` now runs the same Maven 3.8 and JDK 11 on `maven:3.8.8-eclipse-temurin-11`, and `.npm` and `.yarn` run on Debian 13 with the move to Node 24; also pinned `.yarn`''s image by digest, which it had not been, pinned the GitLab CI SonarQube scanner, which ran `sonar-scanner-cli:latest`, to the build the other platforms run, and made `make test-supply-chain` read an image given as a mapping (`name:`), where both unpinned images had sat unseen'
time: '2026-10-29T22:58:55.980456238Z'
