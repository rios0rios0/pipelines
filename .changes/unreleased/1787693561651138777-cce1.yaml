kind: 'Fixed'
body: 'fixed the shared preamble in `global/scripts/shared/cleanup.sh`, which tested whether `~/.local/bin` was on `PATH` at all rather than whether it came FIRST. On a persistent or self-hosted runner that directory is very often already on `PATH` -- from a login profile, a service unit, or a tool that ran earlier -- and when it sits AFTER a directory holding a system-wide copy of the same tool, the membership test passed, the preamble did nothing, and the pinned version installed into `~/.local/bin` was silently shadowed by whatever copy happened to be there first. Every tool script that installs there documents the opposite guarantee ("our copy wins over a system-wide one"), and thirteen of them depend on it, so the pin was decorative on exactly the hosts where a stale system-wide install is most likely. The guard now tests precedence and prepends unless the directory is already leading; a duplicate left further along `PATH` is harmless, since lookup stops at the first match. An ephemeral runner starting from a clean `PATH` is unaffected -- it never had the directory in the first place, so the old guard and the new one both prepend it'
