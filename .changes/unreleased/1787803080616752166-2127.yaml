kind: 'Added'
body: 'added shared ignore rules for the files the pipeline writes into a consumer''s working tree. `global/gitignore/` holds the canonical lists -- `common` plus one fragment for each language that writes outside the default `build/reports/`: `golang`, `dart` and `python`, which point `REPORT_PATH` at `./reports`, and `terra` and `terraform`, which do not but whose `terraform init` vendors provider binaries into `modules/*/.terraform/` and `stacks/*/.terraform/` and fills `build/.terraform-plugin-cache/` -- and `make gitignore` generates them into a delimited block in the consumer''s own `.gitignore`, while `make gitignore-check` fails when that block is stale. Consumers previously had to know those filenames and track them by hand, so a script that started writing a new report leaked it into every repository at once, silently: across the 17 repositories consuming these makefiles, not one ignored everything the pipeline generates, and `.codeql-db/` was unignored in all 17. The rules are GENERATED rather than referenced because Git has no `include` directive for ignore files and refuses to follow a symlinked `.gitignore`; the two mechanisms that do accept an external file, `core.excludesFile` and `$GIT_DIR/info/exclude`, are local to a clone and therefore invisible to CI, to a fresh checkout, and to any bot running `git add -A`. The block sits first in the file because gitignore resolves last-match-wins, so a project''s own entries below it -- including a `!` negation -- still override it. A `.gitignore` whose markers are not a single well-formed pair is refused rather than rewritten: the removal would otherwise read the rest of the file as block content and discard the project''s own entries'
