runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0

    - name: 'Detect build tool'
      id: 'build_tool'
      shell: 'bash'
      run: |
        if [ -f 'gradlew' ]; then
          echo 'cache=gradle' >> "$GITHUB_OUTPUT"
        elif [ -f 'pom.xml' ]; then
          echo 'cache=maven' >> "$GITHUB_OUTPUT"
        else
          echo 'cache=' >> "$GITHUB_OUTPUT"
        fi

    - name: 'Setup Java'
      uses: 'actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961' # v5.7.0
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: ${{ steps.build_tool.outputs.cache }}

    - uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    - run: $SCRIPTS_DIR/global/scripts/languages/java/proguard/run.sh
      shell: 'bash'

    - name: 'Upload Report'
      uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
      with:
        name: 'proguard'
        path: 'build/reports/proguard/'
        if-no-files-found: 'error'
        overwrite: 'true'
        retention-days: 10
      if: always()
