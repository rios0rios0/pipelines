kind: 'Fixed'
body: 'added `make test-go-module-toolchain` (`.github/tests/test-go-module-toolchain.sh`), which fails when any `go.mod` declares a directive its own builder image cannot read, and reports the pair rather than leaving the reader to work out which two numbers disagree. Fixing the versions once would not have held: the builder image is ours and its failure is loud, but the analyser''s toolchain belongs to GitHub, is declared nowhere here, and moves on their schedule -- so the suite also asserts that the Go analysis still installs its own toolchain, reads it from a module file rather than a pin, does so before `init`, and names a `go.mod` that actually exists. Both historical failures were replayed against it and each fires, and the comparator is exercised at its boundaries so nothing can pass by answering "fine" to everything'
