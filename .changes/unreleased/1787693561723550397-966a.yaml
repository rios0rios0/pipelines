kind: 'Added'
body: 'added `code-check > style:format` to the JavaScript pipelines on all three platforms -- a Prettier gate, and the first one this library has ever had for JavaScript. `style:eslint` runs the project''s `lint:ci`, and almost every JavaScript project also installs `eslint-config-prettier`, whose entire job is to switch OFF every ESLint rule that overlaps with Prettier. So the two halves cancelled out: ESLint was deliberately silent about formatting and Prettier never ran, which is not a gate with a gap in it -- it is no gate. The repository that surfaced this had a committed `.prettierrc`, a `.prettierignore` curated with reasoning, **348 unformatted files** and a green pipeline. `dart.yaml` has had a blocking `style:format` since it landed, and the runner comment beside it already named JavaScript as "prettier + eslint"; only the eslint half was ever wired'
time: '2026-08-25T21:32:41.723495933Z'
