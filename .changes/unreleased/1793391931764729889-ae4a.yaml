kind: 'Changed'
body: 'changed every GitHub Actions toolchain workflow to run its stages one after another: each security job now needs EVERY code-check job (the changelog gate and the opt-in checks included, where the Go one waited for golangci-lint alone and the Terraform one for `terra-format` alone), each tests job every security job and the management job every tests job, and every job past the first stage gates on `!cancelled() && !failure()`, so a check skipped by design (`basic-checks` outside a pull request, an opt-in check left off) no longer skips the stages after it while a failed one stops them. The Go cross-compile check is one job, `code-check > quality:cross-compile`, which type-checks the six targets in parallel processes, at most as many at once as the runner has CPUs (`CROSS_COMPILE_JOBS`), each target''s output printed whole and every failing one named, instead of a matrix of six one-target jobs. This repository''s own CI is one staged pipeline too (`ci.yaml`: validate and ShellCheck, then CodeQL, then `make test`; `codeql.yaml` folded in), and `make test-workflow-composition` gained Test 18, which fails on a job that can start before the stage it follows has finished or that keeps the implicit `success()` behind a skippable check. **BREAKING CHANGE:** the six `code-check > quality:cross-compile (<os>/<arch>)` checks are replaced by one `code-check > quality:cross-compile`, so a required status check or `require-checks` entry naming one of the six must be renamed, and a pull request whose changelog gate (`basic-checks`) fails no longer runs its security, tests or management stage'
breaking: true
