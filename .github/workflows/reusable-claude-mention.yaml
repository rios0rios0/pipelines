name: 'Claude Mention'

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: 'OAuth token used by the Claude Code action'

jobs:
  claude:
    if: |
      (github.event.comment != null &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event.review != null &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event.issue != null &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      pull-requests: 'write'
      issues: 'write'
      id-token: 'write'
      actions: 'read'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0
        with:
          fetch-depth: 1

      - name: 'Run Claude Code'
        id: 'claude'
        uses: 'anthropics/claude-code-action@70fec183852c4f82f3f1969faed7dd60c5149ca7' # v1.0.207
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
        env:
          # Sets the model without touching `claude_args`: parse-sdk-options.ts resolves
          # `model: options.model || modelFromClaudeArgs`, where `options.model` is this
          # variable -- so it wins over `--model` and leaves the tool wiring alone.
          ANTHROPIC_MODEL: 'claude-opus-5'
