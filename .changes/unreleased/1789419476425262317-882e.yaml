kind: 'Fixed'
body: 'pinned the tag `delivery > release` cuts to the commit the run verified (`github.sha`, the bump merge) by pushing it from the job''s own checkout before `action-gh-release` creates the release. The Releases API tagged the default branch''s CURRENT head instead, and the release job runs after the whole quality gate: on medhub-life/frontend on 2026-09-14 a second pull request merged during the 36 minutes the gate took, the 0.3.0 tag landed on it, the promotion dispatched on that commit and `require-checks` refused it because its own `main` run had not started -- nothing shipped, and the tag labelled an unreleased change. `target_commitish` was not the fix: with the job''s `GITHUB_TOKEN` a release against a commit that is no longer the branch head answers `403 Resource not accessible by integration` (softprops/action-gh-release#411). A tag that already exists is kept wherever it points, so a tag pushed by hand before the run remains the recovery path; any other refused push fails the step by name instead of tagging the wrong commit'
