parameters:
  - name: 'WORKING_DIRECTORY'
    type: 'string'
    default: ''
  - name: 'RUN_BEFORE_MANAGEMENT'
    type: 'string'
    default: 'echo "No before script"'
  - name: 'RUN_AFTER_MANAGEMENT'
    type: 'string'
    default: 'echo "No after script"'
  - name: 'LCOV_DOWNLOAD_SUBPATH'
    type: 'string'
    default: ''

steps:
  - task: 'Cache@2'
    inputs:
      # TODO: this key should be better according to sonar version
      key: "$(Agent.JobName)|${{ parameters.WORKING_DIRECTORY }}/yarn.lock"
      path: "$(SONAR_USER_HOME)"
    displayName: 'Cache for SonarQube'
    continueOnError: true

  - task: 'DownloadPipelineArtifact@2'
    inputs:
      artifactName: 'coverage-cobertura'
      targetPath: "${{ parameters.WORKING_DIRECTORY }}/coverage"
    displayName: 'Download Cobertura Coverage File'
    continueOnError: true

  - ${{ if ne(parameters.LCOV_DOWNLOAD_SUBPATH, '') }}:
    - task: 'DownloadPipelineArtifact@2'
      inputs:
        artifactName: 'coverage-lcov'
        targetPath: "${{ parameters.WORKING_DIRECTORY }}/${{ parameters.LCOV_DOWNLOAD_SUBPATH }}"
      displayName: 'Download LCOV Coverage File'
      continueOnError: true

  # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
  # through `env:` and running it with `eval` keeps it DATA at template-expansion
  # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
  # so a value containing a newline or a quote used to be able to terminate this
  # step and append steps of its own. Through `env:` the shell only expands it at
  # run time, which is the same fix already applied to `pipelines_ref` in
  # .github/workflows/terra.yaml.
  - bash: 'eval "$PIPELINES_HOOK"'
    workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"
    displayName: 'Run Before'
    env:
      PIPELINES_HOOK: ${{ parameters.RUN_BEFORE_MANAGEMENT }}

  - script: yarn sonar
    workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"
    displayName: 'Run SonarQube'
    # Explicit mapping so the secret `$(SONAR_TOKEN)` reaches the shell as
    # `$SONAR_TOKEN`. Azure Pipelines withholds secret variables from the
    # process environment; without this block the scanner sends no
    # credentials and the server returns `HTTP 401`.
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)
      SONAR_HOST_URL: $(SONAR_HOST_URL)

  # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
  # through `env:` and running it with `eval` keeps it DATA at template-expansion
  # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
  # so a value containing a newline or a quote used to be able to terminate this
  # step and append steps of its own. Through `env:` the shell only expands it at
  # run time, which is the same fix already applied to `pipelines_ref` in
  # .github/workflows/terra.yaml.
  - bash: 'eval "$PIPELINES_HOOK"'
    workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"
    displayName: 'Run After'
    env:
      PIPELINES_HOOK: ${{ parameters.RUN_AFTER_MANAGEMENT }}
