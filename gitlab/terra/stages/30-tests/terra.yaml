include:
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/terra/abstracts/terra.yaml'
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/abstracts/scripts-repo.yaml'

# Single unified job that orchestrates both tiers of Terraform testing
# behind one `test:all` entry: native `terraform test` over
# `modules/*/tests/*.tftest.hcl` (tier 1) followed by the Go Terratest
# suite under `tests/terratest/` (tier 2). The runner auto-detects which
# tiers the consumer has, runs only those, and exits 0 when neither is
# present — so stack-only repos (no `modules/` tests, no `tests/terratest/`)
# pass the stage without a bespoke opt-out.
test:all:
  extends: '.terra'
  stage: 'tests'
  variables:
    REPORT_PATH: 'build/reports'
  script:
    - "$SCRIPTS_DIR/global/scripts/languages/terraform/test-all/run.sh"
  artifacts:
    when: 'always'
    paths:
      - "${REPORT_PATH}/"
    reports:
      junit: "${REPORT_PATH}/junit-terra-all.xml"
      # GitLab renders a coverage percentage from the Cobertura file when
      # the terra-test tier ran; missing-file is not an error for GitLab.
      coverage_report:
        coverage_format: 'cobertura'
        path: "${REPORT_PATH}/terra-coverage.xml"

# Fourth tier — the only one that RESOLVES references rather than parsing
# them. `terra-test` covers reusable modules that carry a test file,
# `terratest` reads HCL offline, and `structural` asserts conventions in
# bash; none of them has an evaluation context, so a root module can
# reference a module, variable or resource that does not exist and all
# three stay green. That defect then fails every plan and apply of the
# root module, for every target, before a resource is touched.
#
# Opt-in: set `ENABLE_VALIDATE: "true"` in the consumer's `.gitlab-ci.yml`
# or project CI/CD variables. Off by default because, unlike its siblings,
# this tier needs the network (to download providers) and — for private
# module sources — credentials. `VALIDATE_ROOTS` overrides the directories
# searched for root modules (default `stacks`).
#
# Extends `.terra` rather than `.scripts-repo` because it needs Terraform
# itself; the structural tier below deliberately does not.
#
# `VALIDATE_PRE_SCRIPT` mirrors the `SAST_PRE_SCRIPT` hook used by the
# security stage: `terraform init` resolves module sources, and private
# ones need SSH (or a token) configured first, or init fails on the first
# root module that pins one.
test:validate:
  extends: '.terra'
  stage: 'tests'
  rules:
    - if: '$ENABLE_VALIDATE == "true"'
  variables:
    REPORT_PATH: 'build/reports'
  before_script:
    - !reference [.terra, before_script]
    - if [ -n "$VALIDATE_PRE_SCRIPT" ]; then eval "$VALIDATE_PRE_SCRIPT"; fi
  script:
    - "$SCRIPTS_DIR/global/scripts/languages/terraform/validate/run.sh"
  artifacts:
    when: 'always'
    paths:
      - "${REPORT_PATH}/"
    reports:
      junit: "${REPORT_PATH}/junit-validate.xml"

# Third tier — repo-convention assertions the consumer owns. Runs
# `tests/structural.sh` if it exists and publishes the resulting JUnit.
# The script is deliberately not shipped here; every repo has its own
# conventions (customer dir naming, bootstrap self-containedness, shared
# root.hcl presence) that can't live upstream. Skipped silently when the
# consumer has no structural script.
#
# Extends `.scripts-repo` (not `.terra`) because the shell runner is
# deps-free: no terra CLI, no Terraform, no Go. Uses a minimal
# `alpine/git` image instead of `golang:1.24` so the job starts cold in
# seconds and costs nothing to schedule. The `terra` alias was tempting
# for symmetry with `test:all`, but pulling a full Go toolchain just to
# run `sh tests/structural.sh` contradicts the offline / deps-free
# intent documented above.
test:structural:
  extends: '.scripts-repo'
  stage: 'tests'
  image: 'alpine/git:2.54.0@sha256:4f9488b7295baec153a9953479690f835ad4699b1d9f11e3897a4485c224fc3e'
  variables:
    REPORT_PATH: 'build/reports'
  script:
    - "$SCRIPTS_DIR/global/scripts/languages/terraform/structural/run.sh"
  artifacts:
    when: 'always'
    paths:
      - "${REPORT_PATH}/"
    reports:
      junit: "${REPORT_PATH}/junit-structural.xml"
