name: 'Container Images'

on:
  push:
    branches:
      - 'main'
    paths:
      - 'global/containers/**'
  workflow_dispatch:
    inputs:
      container_folder:
        description: >-
          Container folder name to build (e.g. "golang.1.26-awscli").
          Leave empty to build ALL containers.
        required: false
        default: ''
        type: 'string'
      push:
        description: >-
          Publish the result to ghcr.io. Turn this OFF to VERIFY a Dockerfile
          from a branch: both architectures are still built, and nothing is
          pushed over the tag `main` publishes.
        required: false
        default: true
        type: 'boolean'

permissions:
  contents: 'read'
  packages: 'write'

jobs:
  detect-changes:
    name: 'Detect Changed Containers'
    runs-on: 'ubuntu-latest'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
      # Resolved once, here, so the matrix job reads a plain 'true'/'false'
      # instead of repeating the trigger test in two places. The `inputs`
      # context is populated only for `workflow_dispatch` and `workflow_call`;
      # on a `push` to main `inputs.push` is simply empty, and that absence has
      # to mean PUBLISH -- the behaviour this workflow has always had. So the
      # event test comes first, and `||` returns it without needing the input.
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}

    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Detect changed container folders'
        id: 'set-matrix'
        run: |
          INPUT_FOLDER="${{ github.event.inputs.container_folder }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger: use the provided folder or enumerate all
            if [ -n "$INPUT_FOLDER" ]; then
              CHANGED_DIRS="$INPUT_FOLDER"
            else
              CHANGED_DIRS=$(ls -d global/containers/*/ 2>/dev/null | \
                awk -F'/' '{print $3}' | sort -u)
            fi
          else
            # Push trigger: detect changes via git diff
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            # Handle initial push where 'before' is all zeros
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # Initial push: build all containers rather than relying on a missing parent commit
              CHANGED_DIRS=$(ls -d global/containers/*/ 2>/dev/null | \
                awk -F'/' '{print $3}' | sort -u)
            else
              CHANGED_DIRS=$(git diff --name-only "$BEFORE" "$AFTER" -- 'global/containers/' | \
                awk -F'/' '{if ($3 != "") print $3}' | sort -u)
            fi
          fi

          if [ -z "$CHANGED_DIRS" ]; then
            echo "No container changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          # Build the matrix JSON from folder names (convention: NAME.TAG)
          MATRIX_JSON='{"include":['
          FIRST=true
          for DIR in $CHANGED_DIRS; do
            # Split on the first dot: everything before is NAME, everything after is TAG
            NAME="${DIR%%.*}"
            TAG="${DIR#*.}"

            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              MATRIX_JSON+=','
            fi
            MATRIX_JSON+="{\"name\":\"${NAME}\",\"tag\":\"${TAG}\"}"
          done
          MATRIX_JSON+=']}'

          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          echo "Detected container changes: ${MATRIX_JSON}"

  build-and-push:
    name: 'Build & Push ${{ matrix.name }}:${{ matrix.tag }}'
    needs: 'detect-changes'
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Set up QEMU'
        uses: 'docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a' # v4.3.0

      - name: 'Set up Docker Buildx'
        uses: 'docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e' # v4.3.0

      # Skipped for a verification build. Nothing is published, so nothing needs
      # the token -- and a build-only run that never authenticates cannot
      # publish by accident, whatever the recipe below turns out to do.
      - name: 'Login to GitHub Container Registry'
        if: ${{ needs.detect-changes.outputs.push == 'true' }}
        uses: 'docker/login-action@dbcb813823bdd20940b903addbd779551569679f' # v4.6.0
        with:
          registry: 'ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build ${{ matrix.name }}:${{ matrix.tag }}'
        env:
          # Through `env:` rather than interpolated into `run:`, which would let
          # a crafted value inject shell at YAML-parse time. Compared as a
          # string because a job output always is one.
          PUSH: ${{ needs.detect-changes.outputs.push }}
        run: |
          # `build` and `build-and-push` share one buildx recipe; the only
          # difference is whether its output is pushed or discarded.
          target='build-and-push'
          if [ "$PUSH" != 'true' ]; then
            target='build'
            echo "::notice::Verification build -- linux/amd64 and linux/arm64 are built, nothing is published."
          fi

          make "$target" \
            NAME="${{ matrix.name }}" \
            TAG="${{ matrix.tag }}" \
            CONTAINER_REGISTRY="ghcr.io/${{ github.repository }}"
