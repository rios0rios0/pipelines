include:
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/abstracts/scripts-repo-debian.yaml'
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/golang/abstracts/go.yaml'

# No `allow_failure`: a failed lint fails the pipeline, as it does on GitHub Actions and Azure
# DevOps. With it, a lint that could not even run passed unnoticed. See CLAUDE.md, "A Failing
# Check Fails the Run".
style:golangci-lint:
  extends: '.scripts-repo-debian'
  image: !reference [ .go, image ]
  stage: 'code check (style/quality)'
  script:
    - $SCRIPTS_DIR/global/scripts/languages/golang/golangci-lint/run.sh

# A merge request whose new goose migration is not newer than the newest one on its target branch
# passes review and the tests, then stops the first deploy after the merge: goose refuses to apply
# a migration older than the version the database has reached. Merge requests only, because the
# verdict is relative to the target branch, which the script reads from
# CI_MERGE_REQUEST_TARGET_BRANCH_NAME. The Go image is used for its git and shell alone: the check
# compiles nothing. A repository without goose migrations passes in seconds.
quality:migration-order:
  extends: '.scripts-repo'
  image: !reference [ .go, image ]
  stage: 'code check (style/quality)'
  script:
    - $SCRIPTS_DIR/global/scripts/languages/golang/migration-order/run.sh
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
