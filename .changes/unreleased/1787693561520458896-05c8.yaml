kind: 'Security'
body: '**removed every `curl | sh` install.** A remote script piped into a shell hands the runner to whatever that URL returns at that moment, with no pin, no checksum and no opportunity to review -- the supply-chain shape this repository''s own SAST stage exists to flag. Eleven call sites are gone: TFLint (five, fetched from the `master` BRANCH on all three platforms), the terra CLI (four, fetched from `main`), GitLab''s secure-files installer inside the job that holds the project''s signing material, and `golangci-lint`. `make setup` no longer pipes `clone.sh` either -- it was the first command a new developer ran, and `clone.sh` only ever did `git clone` / `git pull --ff-only`, so it now does exactly that and fetches no remote script at all'
