kind: 'Fixed'
body: 'fixed the scheduled dependency update, which could not move the GitLab CI and Azure DevOps JavaScript jobs off the exact Node.js release they name: an image tag naming one release stops being rebuilt once the next ships, so its digest never moved again, and no `UseNode@1` input was read at all; both now follow a `NODE_PINNED_VERSION` pin held to Node 24 (`track=24`) with advisories from OSV''s Bitnami feed, so a new release is proposed once it is a week old and one fixing a known vulnerability at once; an `# image:` pin now keeps the variant its copies'' tags carry (`-trixie`), takes only the images of its `track=` line, which leaves the deployment templates'' rolling `node:22-alpine` to the digest check, and reports an exact tag of a line no pin holds; the pin and its copies name 24.22.1, the security release that fixed the advisories of 24.22.0, because 24.22.2 was published on 2026-10-28, inside the 7-day cooldown, and fixes nothing more'
time: '2026-10-30T01:29:27.703016723Z'
