on:
  workflow_call:
    inputs:
      sonar_host:
        description: 'SonarQube/SonarCloud host URL (leave empty to skip SonarQube)'
        required: false
        type: string
        default: ''
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: 'JSON array of runner labels (e.g. ''["self-hosted"]''). See go.yaml.'
      codeql_runs_on:
        type: 'string'
        required: false
        default: ''
        description: 'Runner labels for the CodeQL job alone; empty runs it on `runs_on`. See go.yaml.'
      extra_test_command:
        type: 'string'
        required: false
        default: ''
        description: 'One more test run, as its own job in the tests stage (e.g. ''go test -race -count=1 ./...''). See go.yaml.'
      extra_test_name:
        type: 'string'
        required: false
        default: 'extra'
        description: 'Names the extra test job `tests > test:<extra_test_name>`. See go.yaml.'
      extra_test_runs_on:
        type: 'string'
        required: false
        default: ''
        description: 'Runner labels for the extra test job alone; empty runs it on `runs_on`. See go.yaml.'
      go_version_file:
        type: 'string'
        required: false
        default: 'go.mod'
        description: |
          Path to the `go.mod` whose `go` directive decides which Go the CodeQL analysis runs
          with. Leave it alone unless this repository has SEVERAL modules: the shared action
          finds a single module wherever it lives, and only an ambiguous tree needs telling.

          It is a file rather than a version on purpose. The `go` directive is a minimum
          language version, and the CodeQL runner sets `GOTOOLCHAIN=local`, so a module ahead
          of the runner's Go cannot be extracted at all -- reading the module's own directive
          means the analysis can never be older than the code it analyses.
      codeql_upload:
        type: 'string'
        required: false
        default: 'always'
        description: "CodeQL SARIF upload mode ('always', 'failure-only' or 'never'). See go.yaml."
      database_image:
        type: 'string'
        required: false
        default: ''
        description: 'Database image to run the tests against (e.g. ''postgres:18-alpine''). See go.yaml.'
      database_url_env:
        type: 'string'
        required: false
        default: ''
        description: 'Environment variable the composed connection URL is exported into. See go.yaml.'
      coverage_threshold:
        type: 'number'
        required: false
        default: 0
        description: 'Minimum total coverage percentage; 0 disables the gate. See go.yaml.'
      integration_parallel:
        type: 'number'
        required: false
        default: 1
        description: 'How many integration test binaries run concurrently (`go test -p`). See go.yaml.'
      integration_timeout:
        type: 'string'
        required: false
        default: '30m'
        description: '`go test -timeout` for each integration test binary, a Go duration. See go.yaml.'
      openapi_sync_path:
        type: 'string'
        required: false
        default: ''
        description: 'Committed OpenAPI document to regenerate and diff. See go.yaml.'
      openapi_sync_command:
        type: 'string'
        required: false
        default: 'make swagger'
        description: 'Command that regenerates the document named by `openapi_sync_path`.'
      promote_release:
        type: 'boolean'
        required: false
        default: false
        description: |
          Start the calling workflow again on the tag `delivery > release` cuts from a bump
          merge, so whatever that workflow does only on a tag -- `go-flyio.yaml`'s and
          `go-render.yaml`'s production deploy -- runs without anyone pushing the tag by hand.

          The release job creates the tag with its own `GITHUB_TOKEN`, and GitHub starts no
          workflow run from an event that token caused. `workflow_dispatch` is the one event
          exempt from that rule, so the release job dispatches the CALLING workflow on
          `refs/tags/X.Y.Z`: `github.ref_type` is `tag` in the run that starts, and every gate
          keyed on it behaves exactly as on a pushed tag; only `github.event_name` differs.

          The caller must declare `on: workflow_dispatch:` and grant the job that calls this
          workflow `actions: write`, beside the `contents: write` the release itself needs. Off by
          default: a caller that has not granted `actions: write` would fail the release job.
      version_build_arg:
        type: 'string'
        required: false
        default: ''
        description: |
          Name of the Dockerfile `ARG` that receives the image's version (e.g. `VERSION`), so a
          binary built with `-ldflags "-X <package>.Version=..."` reports the build it came from
          instead of the `ARG`'s default. The version is the release this run cuts, the tag on a
          tag build, and the commit's first 7 characters otherwise. Empty passes nothing, which
          is the default: the name is the consumer's to pick, since a project may already use
          `ARG VERSION` for something else.
    secrets:
      sonar_token:
        description: 'SonarQube authentication token'
        required: false
    outputs:
      tag_name:
        description: |
          The release version `delivery > release` cut in this run, empty when it cut none.
          Exposed so a composed workflow can hand a deploy the same version this run's image
          carries.
        value: ${{ jobs.delivery-release.outputs.tag_name }}
      image:
        description: |
          The image `delivery > docker` pushed in this run, by digest:
          `ghcr.io/<owner>/<repository>@sha256:<digest>`, the digest being the multi-platform
          index's. Empty when the job pushed nothing. Exposed so a composed workflow deploys the
          artifact this run built instead of building it a second time.
        value: ${{ jobs.delivery-docker.outputs.image }}

jobs:
  go:
    uses: 'rios0rios0/pipelines/.github/workflows/go.yaml@main'
    with:
      go_version_file: "${{ inputs.go_version_file }}"
      sonar_host: ${{ inputs.sonar_host }}
      runs_on: ${{ inputs.runs_on }}
      codeql_runs_on: ${{ inputs.codeql_runs_on }}
      extra_test_command: ${{ inputs.extra_test_command }}
      extra_test_name: ${{ inputs.extra_test_name }}
      extra_test_runs_on: ${{ inputs.extra_test_runs_on }}
      codeql_upload: ${{ inputs.codeql_upload }}
      database_image: ${{ inputs.database_image }}
      database_url_env: ${{ inputs.database_url_env }}
      coverage_threshold: ${{ inputs.coverage_threshold }}
      integration_parallel: ${{ inputs.integration_parallel }}
      integration_timeout: ${{ inputs.integration_timeout }}
      openapi_sync_path: ${{ inputs.openapi_sync_path }}
      openapi_sync_command: ${{ inputs.openapi_sync_command }}
    secrets:
      sonar_token: ${{ secrets.sonar_token }}

  # fourth stage
  delivery-release:
    name: 'delivery > release'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: 'release'
        uses: 'rios0rios0/pipelines/github/global/stages/40-delivery/release@main'
        with:
          promote: ${{ inputs.promote_release }}
    needs: [ 'go' ]
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, 'chore/bump-') || contains(github.event.head_commit.message, 'chore(bump)'))"

  delivery-docker:
    name: 'delivery > docker'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      image: ${{ steps.docker.outputs.image }}
    steps:
      - id: 'docker'
        uses: 'rios0rios0/pipelines/github/global/stages/40-delivery/docker@main'
        with:
          tag_name: "${{ needs.delivery-release.outputs.tag_name }}"
          version_build_arg: "${{ inputs.version_build_arg }}"
    needs: [ 'go', 'delivery-release' ]
    if: "!cancelled() && !failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))"
