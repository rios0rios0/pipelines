kind: 'Fixed'
body: 'fixed released versions never reaching Dependency-Track from Azure DevOps: every `management` stage skipped tag builds outright, so the BOM of a tag, the release, was never uploaded. The golang, python, javascript, dotnet and terraform `management` stages now run on a tag build for their `report:dependency-track` job, asking only that nothing before them failed or was cancelled, as the delivery stage does, and the uploader claims `isLatest` for the tag. `report:sonarqube` stays off tags, because a tag build runs no tests stage to give it coverage, and pull requests still upload nothing. GitLab CI already uploaded from tags; GitHub Actions has no Dependency-Track upload. `make test ONLY=dependency-track` holds the wiring'
