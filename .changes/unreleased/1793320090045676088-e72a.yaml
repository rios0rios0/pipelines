body: 'changed the Node.js the GitLab CI and Azure DevOps JavaScript jobs run on to Node 24.22.1 (Krypton, supported until 2028-04-30): GitLab CI''s `.npm` and `.yarn` ran Node 16 and Node 18, both past their end of life, and now run `node:24.22.1-trixie` pinned by digest; Azure DevOps'' `UseNode@1` and the GitHub Actions CodeQL analysis moved from Node 20, which ended on 2026-04-30; `quality:knip` runs again on GitLab CI, which Node 18 stopped at `EBADENGINE` (KI-05); a project script that runs `node --test` over a directory has to name its files, as Node 21 and later require'
