kind: 'Added'
body: 'gave `reusable-claude-mention.yaml` the same no-build contract, which required `track_progress: true` alongside its new prompt: a `prompt:` on a comment or issue event selects agent mode (`src/modes/detector.ts`), where the action template that reads the `@claude` and answers it is replaced by the custom prompt -- so a bare prompt would have silently stopped the responder answering, with every job green. Tag mode carries an event constraint worth knowing before rewiring a caller: `validateTrackProgressEvent` accepts only `pull_request`, `issues`, `issue_comment`, `pull_request_review_comment` and `pull_request_review`, and throws on anything else. The responder tool surface was deliberately not widened to match the review (it holds `contents: write` and checks a fork branch out into the workspace), so its prompt states what tag mode grants -- `git add`, `git commit`, `git rm`, the push wrapper, `Read`/`Grep`/`Glob`/`LS`, the comment tool and the CI tools -- and says that `gh`, `git diff` and `git log` are absent.'
