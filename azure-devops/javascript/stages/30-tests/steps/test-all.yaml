parameters:
  - name: 'WORKING_DIRECTORY'
    type: 'string'
    default: ''
  - name: 'RUN_BEFORE_TESTS'
    type: 'string'
    default: 'echo "No before script"'
  - name: 'RUN_AFTER_TESTS'
    type: 'string'
    default: 'echo "No after script"'
  - name: 'JUNIT_RELATIVE_PATH'
    type: 'string'
    default: 'junit.xml'
  - name: 'COBERTURA_RELATIVE_PATH'
    type: 'string'
    default: 'cobertura.xml'
  - name: 'LCOV_RELATIVE_PATH'
    type: 'string'
    default: ''

steps:
  # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
  # through `env:` and running it with `eval` keeps it DATA at template-expansion
  # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
  # so a value containing a newline or a quote used to be able to terminate this
  # step and append steps of its own. Through `env:` the shell only expands it at
  # run time, which is the same fix already applied to `pipelines_ref` in
  # .github/workflows/terra.yaml.
  - bash: 'eval "$PIPELINES_HOOK"'
    workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"
    displayName: 'Run Before'
    env:
      PIPELINES_HOOK: ${{ parameters.RUN_BEFORE_TESTS }}

  - script: yarn test:coverage
    workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"
    displayName: 'Run Tests'

  # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
  # through `env:` and running it with `eval` keeps it DATA at template-expansion
  # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
  # so a value containing a newline or a quote used to be able to terminate this
  # step and append steps of its own. Through `env:` the shell only expands it at
  # run time, which is the same fix already applied to `pipelines_ref` in
  # .github/workflows/terra.yaml.
  - bash: 'eval "$PIPELINES_HOOK"'
    workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"
    displayName: 'Run After'
    env:
      PIPELINES_HOOK: ${{ parameters.RUN_AFTER_TESTS }}

  - task: 'PublishTestResults@2'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: "${{ parameters.WORKING_DIRECTORY }}/${{ parameters.JUNIT_RELATIVE_PATH }}"
    displayName: 'Publish JUnit XML Results'

  - task: 'PublishCodeCoverageResults@2'
    inputs:
      summaryFileLocation: "${{ parameters.WORKING_DIRECTORY }}/${{ parameters.COBERTURA_RELATIVE_PATH }}"
      failIfCoverageEmpty: true
    displayName: 'Publish Cobertura XML Results'

  - task: 'PublishPipelineArtifact@1'
    inputs:
      artifactName: 'coverage-junit'
      targetPath: "${{ parameters.WORKING_DIRECTORY }}/${{ parameters.JUNIT_RELATIVE_PATH }}"
    displayName: 'Publish JUnit File'

  - task: 'PublishPipelineArtifact@1'
    inputs:
      artifactName: 'coverage-cobertura'
      targetPath: "${{ parameters.WORKING_DIRECTORY }}/${{ parameters.COBERTURA_RELATIVE_PATH }}"
    displayName: 'Publish Cobertura File'

  - ${{ if ne(parameters.LCOV_RELATIVE_PATH, '') }}:
    - task: 'PublishPipelineArtifact@1'
      inputs:
        artifactName: 'coverage-lcov'
        targetPath: "${{ parameters.WORKING_DIRECTORY }}/${{ parameters.LCOV_RELATIVE_PATH }}"
      displayName: 'Publish LCOV File'
