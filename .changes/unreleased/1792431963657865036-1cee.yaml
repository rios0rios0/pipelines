kind: 'Fixed'
body: 'fixed the terra CLI install failing with `Text file busy` when jobs on one machine install it at the same time. The agents of a self-hosted Azure DevOps machine share one `$HOME`, and the parallel jobs of a pipeline reach the install together; `terra/install.sh` staged the download at the fixed `/tmp/terra.tar.gz` and `/tmp/terra`, so one job truncated, deleted or moved the files another was still verifying, unpacking or writing. It now downloads into a directory of its own beside `$HOME/.local/bin` and renames terra into place, as the golangci-lint and OSV-Scanner installs do. Its pin check read `terra version` from stdout, where terra prints nothing, so every job reinstalled terra and jobs collided on every run, not only after a version bump; it now reads stderr, and a machine that already has the pinned terra downloads nothing. The Azure DevOps install step gained `set -e`, so a failed install fails the step instead of passing when its last line does. `make test-terra-install` covers all three'
