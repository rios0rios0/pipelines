kind: 'Changed'
body: 'moved the GitLab CI PDM template (`gitlab/python/abstracts/pdm.yaml`) from Python `3.10`, which reached end of life on 2026-10-01, to Python `3.14` on Debian 13 trixie: its jobs now run on the new `ghcr.io/rios0rios0/pipelines/python:3.14-pdm-trixie` image, the release the Azure DevOps PDM template already runs. A project that cannot run on Python `3.14` -- a `requires-python` that excludes it, or a dependency with no `3.14` support -- fails its GitLab CI jobs until it is moved. The image also drops what the 3.10 image added on top of Python: `gcc`, the `python3-dev`, `libglib2.0-dev` and `libpq-dev` headers, and the Pango and HarfBuzz libraries. They brought in most of its known vulnerabilities, and no consumer could be found that needs them. A project that compiles a C extension with no wheel, or renders with Pango, needs an image that adds them. Its unprivileged user is `app_user`, as in the 3.13 image; the 3.10 image named it `themaker`'
breaking: true
time: '2026-10-21T16:07:42.060934453Z'
