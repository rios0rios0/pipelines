kind: 'Fixed'
body: 'fixed the Semgrep pin check in `global/scripts/tools/semgrep/run.sh`, which verified the pin by parsing `semgrep --version` -- not a reliable report of what is installed. The entry point dispatches either to the OCaml CLI or to the legacy Python one, and on 1.173.0 the two disagree: a clean virtualenv holding `semgrep==1.173.0`, on a machine with no other Semgrep and none on `PATH`, answers **`1.162.0`** to `semgrep --version` while `pip show semgrep`, `importlib.metadata.version("semgrep")`, `semgrep.__VERSION__` and `semgrep-core -version` all answer `1.173.0`. The pin could therefore never be satisfied for that release, and every run failed claiming another Semgrep was shadowing the install -- for a version that was installed correctly and was the only one present. The check now asserts two things that are this script''s own to assert and do not route through the CLI: `semgrep` on `PATH` resolves to the launcher this script symlinks, and the distribution installed in this script''s virtualenv is the pinned version. A genuinely wrong version still fails, which was verified alongside the fix'
