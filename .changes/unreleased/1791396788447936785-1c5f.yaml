kind: 'Added'
body: 'added `TERRA_TEST_ROOTS` to the terra-test tier: an opt-in, space-separated list of directories (e.g. `stacks`) searched at any depth for root modules that own a `tests/*.tftest.hcl`, whose `terraform test` suites no tier ran before; each root is initialised `-backend=false` and without the `-upgrade` the module loop uses, so a committed lock file decides its providers and is never rewritten, writes a JUnit named after its path that `terra-tests.xml` and `junit-terra-all.xml` both pick up, fails the job on a failing case and stays out of the module breadth figures; `test-all/run.sh` asks the same `roots.sh` selection, which ignores `tests/e2e/` and vendored `.terraform/` and `.terragrunt-cache/` copies, so a repository whose only tests sit under those roots is detected; empty by default, so nothing changes for a consumer that does not set it, and `make test-terra-test-roots` covers it'
