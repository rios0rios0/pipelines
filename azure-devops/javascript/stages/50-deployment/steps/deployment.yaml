parameters:
  - name: 'RUN_BEFORE_DEPLOYMENT'
    type: 'string'
    default: 'echo "No before script"'
  - name: 'RUN_AFTER_DEPLOYMENT'
    type: 'string'
    default: 'echo "No after script"'

steps:
  # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
  # through `env:` and running it with `eval` keeps it DATA at template-expansion
  # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
  # so a value containing a newline or a quote used to be able to terminate this
  # step and append steps of its own. Through `env:` the shell only expands it at
  # run time, which is the same fix already applied to `pipelines_ref` in
  # .github/workflows/terra.yaml.
  - bash: 'eval "$PIPELINES_HOOK"'
    displayName: 'Run Before'
    env:
      PIPELINES_HOOK: ${{ parameters.RUN_BEFORE_DEPLOYMENT }}

  - task: 'Kubernetes@1'
    inputs:
      connectionType: 'Kubernetes Service Connection'
      kubernetesServiceEndpoint: "$(K8S_ENDPOINT)"
      namespace: "$(K8S_NAMESPACE)"
      command: 'patch'
      arguments: >
        deployment $(K8S_DEPLOYMENT_NAME) --patch-file "$(Build.SourcesDirectory)/kubernetes/k8s-patch.json"
    displayName: 'Patch Deployment Using JSON Patch File'

  - task: 'Kubernetes@1'
    inputs:
      connectionType: 'Kubernetes Service Connection'
      kubernetesServiceEndpoint: "$(K8S_ENDPOINT)"
      namespace: "$(K8S_NAMESPACE)"
      command: 'patch'
      arguments: >
        deployment $(K8S_DEPLOYMENT_NAME)
        --type=strategic
        -p '{"spec":{"template":{"metadata":{"labels":{"app.kubernetes.io/version":"$(Build.SourceVersion)"}}}}}'
    displayName: 'Patch Deployment with Commit SHA'

  - task: 'Kubernetes@1'
    inputs:
      connectionType: 'Kubernetes Service Connection'
      kubernetesServiceEndpoint: "$(K8S_ENDPOINT)"
      namespace: "$(K8S_NAMESPACE)"
      command: 'rollout'
      arguments: "status deployment/$(K8S_DEPLOYMENT_NAME) --timeout=300s"
    displayName: 'Wait for Rollout'

  # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
  # through `env:` and running it with `eval` keeps it DATA at template-expansion
  # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
  # so a value containing a newline or a quote used to be able to terminate this
  # step and append steps of its own. Through `env:` the shell only expands it at
  # run time, which is the same fix already applied to `pipelines_ref` in
  # .github/workflows/terra.yaml.
  - bash: 'eval "$PIPELINES_HOOK"'
    displayName: 'Run After'
    env:
      PIPELINES_HOOK: ${{ parameters.RUN_AFTER_DEPLOYMENT }}
