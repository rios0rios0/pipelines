variables:
  GORELEASER_VERSION: "1.21.2"

delivery:qa:
  stage: 'delivery'
  image: 'golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36'
  script:
    - |
      set -eux
      apt-get update && apt-get install -y musl-tools

      # Both downloads below are now verified before anything runs them, via
      # the shared helper the tool installers use.
      . "$SCRIPTS_DIR/global/scripts/shared/pinned-versions.sh"
      . "$SCRIPTS_DIR/global/scripts/shared/verify-download.sh"

      # Install goreleaser. The version was already pinned; the package was not
      # verified, and `dpkg -i` installs as root and runs the package's
      # maintainer scripts, so an unverified .deb is root-level code execution
      # on the build agent.
      download_verified \
        "https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}/goreleaser_${GORELEASER_VERSION}_amd64.deb" \
        /tmp/goreleaser.deb \
        "$GORELEASER_SHA256_AMD64_DEB"
      dpkg -i /tmp/goreleaser.deb

      # Load repository secure files.
      #
      # This fetched GitLab's installer from the `main` BRANCH and piped it
      # straight into bash -- in the job that holds this project's signing
      # secure files. It is pinned to a release tag and checksum-verified, then
      # executed from disk, so the bytes that run are the bytes that were
      # reviewed.
      download_verified \
        "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/${SECURE_FILES_INSTALLER_VERSION}/installer" \
        /tmp/secure-files-installer \
        "$SECURE_FILES_INSTALLER_SHA256"
      bash /tmp/secure-files-installer

      # Prepare GoReleaser config (skips if project already has one)
      "$SCRIPTS_DIR/global/scripts/languages/golang/goreleaser/prepare.sh" \
        "${CI_PROJECT_NAME}" \
        "${BINARY_PATH:-.}"

      # Build the Go project and create the .deb package
      goreleaser --skip=publish,validate --clean

      # Define variables
      export BUILD_ARTIFACT="${CI_PROJECT_NAME}_latest_linux_amd64.deb"
      export PACKAGE_REGISTRY_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/latest"

      # Save variables to a file
      echo "BUILD_ARTIFACT=${BUILD_ARTIFACT}" > artifacts.env
      echo "PACKAGE_REGISTRY_URL=${PACKAGE_REGISTRY_URL}" >> artifacts.env

      # Upload the .deb file to the GitLab package registry
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file build/dist/*.deb ${PACKAGE_REGISTRY_URL}/${BUILD_ARTIFACT}
  artifacts:
    paths:
      - 'build/dist/*.deb'
      - 'artifacts.env'
    expire_in: '1 week'
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

delivery:prod:
  extends: 'delivery:qa'
  variables:
    TAG: "$CI_COMMIT_TAG"
  rules:
    - if: "$CI_COMMIT_TAG"
