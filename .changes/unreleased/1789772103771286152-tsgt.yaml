kind: 'Added'
body: 'added `.github/tests/test-sast-gate.sh` and the `make test-sast-gate` target, which assert the property the SAST targets exist for: that they can fail. It runs the real `makefiles/` against stub tool runners with scripted exit codes and checks that each target propagates its runner''s code (including the 123 `xargs` reports for a ShellCheck finding and the 143 of a terminated Semgrep), that `sast` still runs every tool after one has already failed, that it then exits non-zero naming them, that the CodeQL skip stays a skip rather than a failure, that a language fragment''s `SAST_TOOLS_EXTRA` joins the same suite in either include order, that `make -n sast` still prints each tool''s real command, and that no recipe reintroduces `-` or `|| true`. Verified in both directions -- 41 assertions pass against the fix and 19 fail against the code it replaces'
