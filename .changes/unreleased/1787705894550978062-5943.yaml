kind: 'Fixed'
body: 'fixed a consumer pinning `.github/workflows/yarn.yaml` still executing mutable Semgrep code. The workflow resolved the Semgrep composite from `@main`, and that composite resolved `scripts-repo` from `@main` again, so rerunning one unchanged consumer SHA could execute different action wiring and scripts. Both edges now use GitHub''s `$/path/to/action` self-repository syntax, introduced in runner 2.336.0, which resolves each nested action from the exact repository and commit of the running reusable workflow or composite without a circular hard-coded SHA. The supply-chain and workflow-composition contracts now distinguish intentional moving `@main` references from exact-running-commit `$/` references and hold both Semgrep edges against regression. GitHub Enterprise Server does not support this syntax; GitHub.com consumers need runner 2.336.0 or newer'
time: '2026-08-26T00:58:14.550935214Z'
