parameters:
  # Steps forwarded to the Terraform SAST job (`sast:semgrep`) so consumers
  # can configure SSH for private Terraform module cloning.
  - name: 'PRE_STEPS'
    type: 'stepList'
    default: []

  # The pool this stage's jobs run on, as the mapping a `pool:` takes. Empty by
  # default, which declares no pool, so the jobs keep the pipeline's own; see
  # `azure-devops/terra/terra.yaml`, which forwards it.
  - name: 'POOL'
    type: 'object'
    default: {}

stages:
  - stage: 'security'
    displayName: 'security (sca/sast)'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    ${{ if gt(length(parameters.POOL), 0) }}:
      pool: ${{ parameters.POOL }}
    jobs:
      - template: '../../../global/stages/20-security/semgrep.yaml'
        parameters:
          SEMGREP_LANGUAGE: 'terraform'
          PRE_STEPS: ${{ parameters.PRE_STEPS }}

      - template: '../../../global/stages/20-security/gitleaks.yaml'

      - template: '../../../global/stages/20-security/hadolint.yaml'

      - template: '../../../global/stages/20-security/checkov.yaml'
