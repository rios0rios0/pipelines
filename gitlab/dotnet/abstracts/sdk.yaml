.sdk:
  image: 'mcr.microsoft.com/dotnet/sdk:8.0@sha256:1b955f179b02df4f0eb5fadedaa898cbe44d620a64aab52eec72c8e91d1355b5'
  cache: # relative to the project directory ($CI_PROJECT_DIR)
    key: "$CI_JOB_NAME"
    paths:
      - 'packages'
    when: 'always'
  before_script:
    - export PATH="$PATH:/root/.dotnet/tools"
    - export SLN_FILE=$(find . -name "*.sln" -print -quit)
    - dotnet restore --packages packages $SLN_FILE
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
