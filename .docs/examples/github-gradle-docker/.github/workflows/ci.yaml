name: 'CI/CD Pipeline'

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]

permissions:
  security-events: write  # Required for CodeQL
  contents: write          # Required for releases
  packages: write          # Required for container registry

jobs:
  pipeline:
    # Pinned to a full commit SHA, with the release it corresponds to in the
    # trailing comment -- the same form this library uses for every
    # third-party action it consumes. A branch ('@main') means every run
    # executes whatever was merged that morning; a tag is better but is still
    # a label the publisher can move, and only the SHA names the bytes.
    # '@4.23.0' or '@v4' are readable alternatives if you accept that.
    uses: 'rios0rios0/pipelines/.github/workflows/gradle-docker.yaml@1d6da2555acf159773e642c57bcd97ff07d637e2' # 4.23.0
