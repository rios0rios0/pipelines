body: 'fixed two inline copies of `pinned-versions.sh` values that had drifted unreported: the Azure DevOps ProGuard job still downloaded `7.6.1` (now `7.10.0`) and the Azure DevOps Terragrunt abstract `1.1.3` (now `1.1.4`), each with its old SHA-256. The drift check only knew five copy patterns; it now covers versions AND digests -- GoReleaser, ProGuard, Terragrunt and stoml included -- in YAML and Dockerfiles, and `make test-dependency-updates` fails when a pattern stops matching the copy it was written for'
