include:
  # Pinned to a release tag rather than 'main'. A branch is a moving target:
  # 'main' means every pipeline run fetches whatever this library happened to
  # merge that morning, including changes nobody here reviewed. Bump this
  # deliberately. A commit SHA works in the same position for full immutability.
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/4.23.0/gitlab/terraform/terra.yaml'

# Optional: Override variables
# variables:
#   SONAR_HOST_URL: 'https://sonar.example.com'
