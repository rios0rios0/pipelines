parameters:
  - name: 'SEMGREP_LANGUAGE'
    type: 'string'
  # Steps injected before Semgrep runs. Useful for consumers that need extra
  # setup (e.g., configuring SSH to clone private Terraform modules so the
  # Semgrep Terraform parser can resolve `source = "git@..."` references).
  - name: 'PRE_STEPS'
    type: 'stepList'
    default: []
  # Whether a failing scan fails the job. `false` (the default) keeps the scan advisory, as it is
  # for every Azure DevOps toolchain; a consumer whose security stage gates its merges sets it
  # through its language stage. See README.md, "Making the Security Stage Blocking".
  - name: 'ENABLE_SECURITY_GATE'
    type: 'boolean'
    default: false

jobs:
  - job: 'sast_semgrep'
    displayName: 'sast:semgrep'
    steps:
      - template: '../../abstracts/scripts-repo.yaml'

      - ${{ each step in parameters.PRE_STEPS }}:
          - ${{ step }}

      # Passed through `env:` rather than interpolated into the script text --
      # see the note in the sibling codeql.yaml.
      - script: $(Scripts.Directory)/global/scripts/tools/semgrep/run.sh "$SEMGREP_LANGUAGE" # it takes the first param as the main language
        env:
          SEMGREP_LANGUAGE: ${{ parameters.SEMGREP_LANGUAGE }}
        continueOnError: ${{ not(parameters.ENABLE_SECURITY_GATE) }}

      - task: 'PublishPipelineArtifact@1'
        inputs:
          artifactName: 'semgrep'
          targetPath: 'build/reports/semgrep'
        condition: always()
