kind: 'Added'
body: 'added `make test-azure-step-names` (`.github/tests/test-azure-step-names.sh`), which EXPANDS every Azure DevOps template -- following `template:` includes and unwrapping the `${{ if }}` / `${{ each }}` blocks a naive walk skips -- and asserts three things at once. First, that every template PARSES and every include RESOLVES: a template that does not parse expands to no jobs, so the other two assertions would find nothing wrong and pass for the worst possible reason, which is the same silent-pass shape this test exists to prevent. Second, that no job declares a step `name:` twice; that defect has now shipped four times and nothing in CI could see it, because the YAML is valid, ShellCheck does not read it, and no pipeline in this repository ever runs, so the first execution is always in a consumer''s project. Second, that every job referencing `$(Scripts.Directory)` actually checks the scripts out -- the opposite failure, an empty variable and an exit `127`, whose obvious fix is to add the include that creates the duplicate. Those two have to hold together or fixing one reintroduces the other. Every assertion was proven to fire against a deliberate violation, and none trips on another''s'
time: '2026-08-25T21:32:41.595688136Z'
