body: 'changed this repository''s `Makefile` to one target per task: `make test` runs `.github/tests/run.sh`, which finds every `.github/tests/test-<name>.sh` itself and then runs the Go helpers'' unit tests, keeps going after a failure and names every suite that failed, with `make test ONLY="workflow-composition supply-chain"` to run some; `make lint` replaces `lint-go-helpers`. The 61 per-suite targets and the list `test` had to keep in step with them are gone, so a new suite is a new script and nothing else'
