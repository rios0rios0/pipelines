kind: 'Added'
body: 'added a `working_directory` input to the Bundler, npm and Yarn reusable workflows (and their `-library`/`-docker` variants and the shared JavaScript `format`/`knip` stages), so a repository whose project lives in a subfolder can call them instead of copying their jobs: it scopes every install, tool run, report and artifact path to that directory, points `actions/setup-node` at the project''s own lockfile and tells the SonarQube runner where the coverage landed through `SONAR_PROJECT_DIR`, while Gitleaks, Semgrep, CodeQL, Hadolint, basic-checks and the Sonar scan itself deliberately keep reading the whole repository; `bundler.yaml` gained a `ruby_version` input that defaults to reading `<working_directory>/.ruby-version` and falls back to the previously hardcoded `3.3`, and `make test-working-directory` holds all of it'
time: '2026-09-06T05:48:07.18223774Z'
