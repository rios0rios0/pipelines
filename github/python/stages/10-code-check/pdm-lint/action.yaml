inputs:
  python_version:
    required: false
    default: '3.14'
    description: 'Python version to use'
  command:
    required: true
    description: 'PDM command to run (e.g., "isort --check-only .", "black --check .")'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: 'Setup Python'
      uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' # v7.0.0
      with:
        python-version: "${{ inputs.python_version }}"

    - name: 'Install PDM and dependencies'
      run: |
        python -m pip install --only-binary :all: "pdm==2.29.2"
        pdm install -v
      shell: 'bash'

    # The command is shell words for `pdm run`, quoting included, so `eval` parses it exactly as
    # the shell did when it was spliced into this script, while `env:` keeps it out of the text.
    # Not `PDM_*`: PDM reads those variables as its own configuration.
    - name: 'Run lint command'
      run: eval "pdm run $LINT_COMMAND"
      shell: 'bash'
      env:
        LINT_COMMAND: "${{ inputs.command }}"
