kind: 'Fixed'
body: 'guarded the four unchecked `cd` calls in `.github/tests/test-go-validation.sh` (SC2164). That script sets no `set -e`, so a `cd` into a scenario directory that failed to be created carried straight on in the previous working directory and every Go coverage assertion after it measured the wrong tree while still reporting a pass. Also moved the stderr redirection to the end of the examples `find` in `.github/tests/test-supply-chain.sh` (SC2227), where it reads as belonging to the command rather than to the expression, and deleted the unused `YELLOW` colour constant from `.github/tests/test-lambda-templates.sh` (SC2034). The remaining SC2034 reports on `RC_OUT`, `ARGV` and `STDOUT` are false positives -- those variables are read inside the condition string `assert_true` passes to `eval`, which ShellCheck cannot follow -- so each assignment now carries its own suppression with the reason, narrow enough that a genuinely dead variable added later is still reported. The non-constant `.` in `.github/tests/test-sonarqube-auto-derive.sh` (SC1090) names its target through a `source-path=SCRIPTDIR` directive instead. The ShellCheck stage reported ten warnings for long enough that they had become the expected output; at zero, the next one is visible.'
