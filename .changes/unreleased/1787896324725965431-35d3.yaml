kind: 'Changed'
body: 'told the Claude review to post a comment on every run, including when no finding survives its confidence filter. The plugin''s command contradicts itself here -- step 6 says "if there are no issues that meet this criteria, do not proceed", while its output-format section supplies a template for the no-issues case -- and both behaviours were observed on the same wiring. Resolving it toward silence made a clean review and a crashed workflow the same observation, a green job with no comment, which cost two debugging cycles before the real cause was found. The review now opens with a short summary of what the pull request changes, so a reader can tell the diff was actually read rather than that a job ran, and on a clean review names what it checked and lists every finding it raised and then dropped with the reason -- a rejected finding is evidence the filter ran, an omitted one is indistinguishable from a check that never happened.'
