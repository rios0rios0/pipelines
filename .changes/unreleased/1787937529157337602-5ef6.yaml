kind: 'Added'
body: 'added test coverage for the Fly.io app-name resolution and lookup-failure fixes, and replaced an assertion that could not fail. The `command.txt` check read the recorded deploy command, but `run_provider` always exports `DEPLOY_DRY_RUN=true` and the creation is gated on `! deploy_is_dry_run`, so `apps create` is unreachable under that harness and the file could never hold it however the creation were written — an assertion that reads as functional and is vacuous reports coverage the feature does not have, so it is now structural like its neighbours. The four new assertions cover an app name declared in `fly.toml` resolving, that name not leaking into the deploy argv, the warning when no name resolves, and the lookup status being read separately from `grep`. All five were proven to fire against deliberate violations'
time: '2026-08-28T17:18:49.157273003Z'
