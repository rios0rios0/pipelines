kind: 'Fixed'
body: 'fixed `global/scripts/tools/semgrep/run.sh` reporting a cause it had never checked. Its post-install failure said "Another Semgrep earlier on PATH is shadowing ..." for every reason the check can fail, and shadowing is only one of them -- the version-reporting mismatch above, a virtualenv that could not be created, or a `pip install` that failed all produce exactly the same message, which then sends the reader hunting through `PATH` for something that is not there. The two install steps are now checked (a distribution without the venv module and a failed wheel install each fail with their own message, and pip''s output is captured so a failure can say why in its own words), and the failure reports what was OBSERVED -- the path `semgrep` actually resolves to, the path it was expected to resolve to, and the version the virtualenv actually holds'
time: '2026-08-25T21:32:41.645583943Z'
