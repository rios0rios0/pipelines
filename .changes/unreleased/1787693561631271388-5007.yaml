kind: 'Security'
body: 'dropped root from the `mssql-tools18` image, which only invokes `sqlcmd` against a remote server. The `awscli`, `golang-awscli` and `bfg` images deliberately still run as root and say why in a comment: the first two are GitLab CI job containers, where the runner clones into `/builds` and a non-root build container cannot write there without runner-side configuration, and `bfg` rewrites a git repository bind-mounted at `/code`'
