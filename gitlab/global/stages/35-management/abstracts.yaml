include:
  # `.dependency-track` below references `.scripts-repo`, so this file must
  # carry the definition rather than hope a caller happened to include it.
  # GitLab de-duplicates identical `include: remote:` URLs, so a caller that
  # already includes it pays nothing.
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/abstracts/scripts-repo.yaml'

.sonarqube:
  image:
    name: 'sonarsource/sonar-scanner-cli:latest'
    entrypoint: [ '' ]
  stage: 'management'
  variables:
    GIT_DEPTH: '0' # tells git fetching all the branches of the project, required by the analysis task
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # defines the location of the analysis task cache
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - '.sonar/cache'
    when: 'always'
  script:
    - |
      # Auto-derive sonar.projectKey and sonar.projectName
      if ! grep -Eq '^[[:space:]]*sonar\.projectKey[[:space:]]*=' sonar-project.properties 2>/dev/null; then
        key="${SONAR_PROJECT_KEY:-$(printf '%s' "$CI_PROJECT_PATH" | tr '[:space:]/' '_' | tr -c '[:alnum:]._:-' '_')}"
        echo "sonar.projectKey=$key" >> sonar-project.properties
        echo "Auto-derived sonar.projectKey=$key"
      fi
      if ! grep -Eq '^[[:space:]]*sonar\.projectName[[:space:]]*=' sonar-project.properties 2>/dev/null; then
        name="${SONAR_PROJECT_NAME:-$CI_PROJECT_NAME}"
        echo "sonar.projectName=$name" >> sonar-project.properties
        echo "Auto-derived sonar.projectName=$name"
      fi
    - |
      # Check if any coverage files exist; if not, clear coverage properties
      # so sonar-scanner doesn't fail looking for files that don't exist
      COVERAGE_FOUND=false
      for pattern in coverage.out coverage/*.xml coverage/*.json coverage/*.lcov build/reports/coverage* build/reports/cobertura.xml; do
        if ls $pattern 1>/dev/null 2>&1; then COVERAGE_FOUND=true; break; fi
      done
      if [ "$COVERAGE_FOUND" = "false" ]; then
        echo "No coverage files found. Running SonarQube without coverage data."
        echo "sonar.coverage.jacoco.xmlReportPaths=" >> sonar-project.properties
        echo "sonar.javascript.lcov.reportPaths=" >> sonar-project.properties
        echo "sonar.python.coverage.reportPaths=" >> sonar-project.properties
        echo "sonar.go.coverage.reportPaths=" >> sonar-project.properties
      fi
    - sonar-scanner
  tags:
    - 'dev-gitlab-runner-onprem'
  rules: # TODO: this could be not duplicated using !reference
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

# Uploads the CycloneDX BOM to Dependency-Track.
#
# This used to be an inline `curl` that DIVERGED from the shared
# `global/scripts/tools/dependency-track/run.sh` every other platform calls, in
# two ways that both produced real portfolio damage:
#
#   - It did not apply the shared script's `sed 's|/|-|g'` name normalisation,
#     so a scoped npm package uploaded as `@org/app` here and `@org-app` from
#     Azure DevOps — TWO projects for one application, for the life of the repo.
#   - It sent no `isLatest` at all, so a GitLab-built application never had a
#     latest version and a collection parent aggregating it reported nothing.
#
# Neither failed a job, which is why both survived. There is now exactly one
# implementation and this abstract calls it.
#
# `!reference [ .scripts-repo, before_script ]` inside `script:` rather than
# `extends: '.scripts-repo'` is deliberate and load-bearing: GitLab's `extends`
# REPLACES `before_script`, it does not concatenate, so extending the
# scripts-repo abstract here would silently wipe the `before_script` that
# `.go` uses to set `GOPATH` and `.pdm` uses to prepare its virtualenv. This is
# the same idiom the sibling `report:sonarqube` jobs already use.
.dependency-track:
  stage: 'management'
  script:
    - !reference [ .scripts-repo, before_script ]
    - $SCRIPTS_DIR/global/scripts/tools/dependency-track/run.sh
  tags:
    - 'dev-gitlab-runner-onprem'
  # Merge-request pipelines no longer upload.
  #
  # `(name, version)` IS a project's identity in Dependency-Track, so an upload
  # from a branch whose version file has already been bumped creates that
  # version's project BEFORE the merge — and if the merge never happens, the
  # project stays forever. Uploading only from the default branch and from tags
  # means the portfolio contains released versions and nothing else.
  rules: # TODO: this could be not duplicated using !reference
    - if: "$CI_COMMIT_TAG"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
