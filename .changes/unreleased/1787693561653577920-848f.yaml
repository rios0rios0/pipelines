kind: 'Fixed'
body: 'fixed every `Enable Corepack` step writing its shims to a FIXED `$RUNNER_TEMP/corepack`, which on a self-hosted runner is a shared directory two different users write to. `$RUNNER_TEMP` is `_work/_temp`, and a consumer''s CONTAINER job -- a Playwright image for an end-to-end suite, say -- reaches the same directory through the runner''s bind mount and writes there as **root**. The shim it leaves behind points at the corepack inside THAT image (`../../../__t/node/...`), which resolves to nothing on the host, and the runner cannot wipe `_temp` at the next job''s start because the files are root-owned while it runs as the runner user. corepack then probes the leftover with `fs.existsSync`, which FOLLOWS symlinks and answers false for a dangling one, so it skips its own unlink and calls `symlink()` on a path that is already there: `Internal Error: EEXIST: file already exists, symlink ''../../../../../../usr/share/nodejs/corepack/dist/yarn.js'' -> ''.../_work/_temp/corepack/yarn''`. Every job that reached the step failed there, on every branch, for code that was fine -- and nothing in the message names a container job as the cause, so it reads as a broken runner and stayed broken until somebody with shell access deleted the directory by hand. The install directory is now `mktemp -d "$RUNNER_TEMP/corepack.XXXXXX"`: a fresh directory owned by whoever runs it, which cannot inherit a previous job''s leftover from inside a container or outside one, and which replaces the `mkdir -p` the fixed path needed because `--install-directory` is resolved with `realpath` and does not create what it is given. Six sites, all of them the same block: the four in `yarn.yaml`, the deploy `build_command` in `yarn-cloudflare.yaml`, and the knip composite action'
