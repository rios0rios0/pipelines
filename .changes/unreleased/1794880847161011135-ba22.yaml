kind: 'Fixed'
body: 'fixed `reconcile-releases.sh` resolving a missing version to a fork''s four-segment bump of it: the `($|[^0-9])` boundary after the version let a `.` or `-` through, so `3.8.0` matched a later `chore/bump-3.8.0.5` or `version to 3.8.0-1` commit, the one its tag would then be pushed on. A version now matches only as a whole, the next character neither a digit nor a `.` or `-` followed by one'
time: '2026-11-17T02:00:47.160930533Z'
