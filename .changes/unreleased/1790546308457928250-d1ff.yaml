kind: 'Fixed'
body: 'gated every GitHub Actions delivery and deployment job on `!cancelled()` as well as `!failure()` -- the 19 gates in the ten `-docker` workflows, `go-binary.yaml`, the three `-cloudflare` workflows, `go-flyio.yaml`, `go-render.yaml` and `flutter-artifacts.yaml` -- so a run superseded by `cancel-in-progress` no longer builds, publishes or deploys a commit whose checks never finished. A cancelled job is not a failed one, and an `if:` that calls a status function loses the implicit `success()`, so `!failure() && (...)` stayed true on a cancelled run: on medhub-life/backend run 36349435394 every lint, test and SAST job was cancelled at 21:20:24Z, `delivery > docker` started seven seconds later and published an image of that unverified commit while keeping a runner slot busy for ~23 minutes, and `deployment > flyio` then started as well and was stopped only by the consumer''s `deployment_required_checks` gate. `!failure()` stays, because it is what lets delivery run past a `delivery-release` skipped on a non-bump commit and a deploy run past a base pipeline that skips every job on a tag. The `dart-build` deliverable upload in `github/dart/stages/40-delivery/build` moved from `always()` to `!cancelled()` for the same reason; the other `always()` steps upload reports or clean up and are unchanged. `test-workflow-composition.sh` gained a fifteenth assertion that splits every job-level `if:` into its `||` clauses and requires each clause of a status-gated job to carry `!cancelled()` or `success()` as a conjunct of its own. GitLab CI delivery and deployment jobs run on the default `on_success` and are unchanged'
