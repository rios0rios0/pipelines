kind: 'Fixed'
body: 'fixed the Go SBOM generator failing on Azure DevOps with `git: core.repositoryformatversion does not support extension: worktreeconfig`. The checkout task runs `git sparse-checkout disable` on every job, which leaves `extensions.worktreeConfig=true` in `.git/config` while `core.repositoryformatversion` stays `0` -- a pairing git itself reads happily but go-git, which cyclonedx-gomod uses to resolve the main module version, rejects outright. `cyclonedx-gomod app` treated it as fatal and wrote no BOM at all, so the Dependency-Track upload had nothing to send and `report:dependency-track` failed on every build of every single-entry-point Go repository, taking the whole run to partiallySucceeded; `cyclonedx-gomod mod` only warned but published the module with an empty version, leaving Dependency-Track tracking an unversioned project. The generator now clears the vestigial extension before it runs, and only when `git sparse-checkout list` confirms the worktree is not sparse, so a genuinely sparse worktree keeps the extension it depends on'
time: '2026-09-18T18:48:48.094124324Z'
