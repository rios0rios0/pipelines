# Quality, security and test stages for a Dart or Flutter project.
#
# The toolchain is detected from the project's own `pubspec.yaml`, so this one
# workflow serves both a pure Dart package and a Flutter app; force it with the
# `toolchain` input when the detection is wrong for your layout.
#
# NOTE ON THE SECURITY STAGE -- there is no `security-sast_codeql` job here, and
# its absence is deliberate. CodeQL has no Dart extractor (dart-lang/sdk#52953,
# open since 2023), so a CodeQL job could only fail. Semgrep IS present and does
# run, because the shared runner skips the unpublished `p/dart` registry pack
# instead of failing on it and picks up the Dart ruleset this repository ships at
# `global/scripts/tools/semgrep/rules/dart.yaml`. Without that ruleset the scan
# would be language-agnostic packs only -- the registry publishes no Dart rules
# at all.
#
# see the bottom of the file for more information¹
# the parent workflow is responsible for setting up the call events²
on:
  workflow_call:
    inputs:
      flutter_version:
        required: false
        type: 'string'
        default: ''
        description: 'Pin an exact Flutter version (e.g. 3.47.0). Defaults to the current stable release.'
      dart_sdk_version:
        required: false
        type: 'string'
        default: 'latest'
        description: 'Pin an exact Dart SDK version. Only used for pure Dart projects.'
      toolchain:
        required: false
        type: 'string'
        default: 'auto'
        description: "Force the toolchain: 'dart', 'flutter', or 'auto'."
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: |
          JSON array of runner labels (e.g. '["self-hosted"]'). `runs-on` is a hard selector --
          GitHub matches it against the runner labels and never substitutes, so there is no
          fallback to a self-hosted runner when the hosted minutes are exhausted. A JSON array
          rather than a plain string because a reusable-workflow input cannot be typed as a
          list, and multi-label runners need more than one value.
      fatal_infos:
        required: false
        type: 'boolean'
        default: false
        description: 'Fail the analyze job on INFO-level diagnostics (this is where lints land).'
      test_args:
        required: false
        type: 'string'
        default: ''
        description: |
          Extra arguments appended to `dart test` / `flutter test`. A project that commits
          specifications ahead of the code -- BDD `.feature` files for screens not written yet,
          tagged `@pending` -- runs green locally with `--exclude-tags pending` and permanently
          red here, because the shared workflow ran the suite bare and had no way to be told
          otherwise.
      coverage_minimum:
        required: false
        type: 'string'
        default: ''
        description: 'Fail the test job when line coverage falls below this percentage.'
      coverage_exclude:
        required: false
        type: 'string'
        default: ''
        description: |
          Whitespace- or comma-separated glob patterns whose files are dropped from the coverage
          report and the `coverage_minimum` gate (e.g. '*.g.dart *.freezed.dart'). `build_runner`,
          `freezed` and `json_serializable` make generated sources near-universal in Dart, and a
          generator that emits one string literal per line moves the total by tens of points
          without saying anything about whether the project is tested -- a floor a code generator
          can move is not measuring what it was put there to protect.

# `ubuntu-latest` carries `curl`, `unzip`, `xz-utils`, `git`, `python3` and `jq`; a bare
# self-hosted runner selected through `runs_on` carries none of them and must be provisioned
# before these jobs will pass. The SDK itself is not among them -- the Dart scripts download it
# from `storage.googleapis.com` -- but every tool that fetches, unpacks and reports on it is:
# `curl` retrieves the archive, `jq` resolves the current release from the Flutter manifest,
# `unzip` and `xz-utils` unpack the Dart zip and the Flutter tarball respectively, `git` is
# required by the Flutter SDK itself (it is a git checkout and shells out to git on almost every
# invocation), and `python3` runs the report converters. The GitLab abstract installs exactly
# this list, for exactly this reason.
jobs:
  # first stage
  code_check-basic_checks:
    name: 'code-check > quality:basic-checks'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/10-code-check/basic-checks@main'
        with:
          target_branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
    if: "github.event_name == 'pull_request'"

  code_check-style_format:
    name: 'code-check > style:format'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/dart/stages/10-code-check/format@main'
        with:
          flutter_version: ${{ inputs.flutter_version }}
          dart_sdk_version: ${{ inputs.dart_sdk_version }}
          toolchain: ${{ inputs.toolchain }}
    if: "!startsWith(github.ref, 'refs/tags/')"

  code_check-quality_analyze:
    name: 'code-check > quality:analyze'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/dart/stages/10-code-check/analyze@main'
        with:
          flutter_version: ${{ inputs.flutter_version }}
          dart_sdk_version: ${{ inputs.dart_sdk_version }}
          toolchain: ${{ inputs.toolchain }}
          fatal_infos: ${{ inputs.fatal_infos }}
    if: "!startsWith(github.ref, 'refs/tags/')"

  code_check-quality_unused_code:
    name: 'code-check > quality:unused-code'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/dart/stages/10-code-check/unused@main'
        with:
          flutter_version: ${{ inputs.flutter_version }}
          dart_sdk_version: ${{ inputs.dart_sdk_version }}
          toolchain: ${{ inputs.toolchain }}
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  # second stage
  security-sast_semgrep:
    name: 'security > sast:semgrep'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/semgrep@main'
        with:
          semgrep_lang: 'dart'
    needs: [ 'code_check-style_format', 'code_check-quality_analyze', 'code_check-quality_unused_code' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_gitleaks:
    name: 'security > sast:gitleaks'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/gitleaks@main'
    needs: [ 'code_check-style_format', 'code_check-quality_analyze', 'code_check-quality_unused_code' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_hadolint:
    name: 'security > sast:hadolint'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/hadolint@main'
    needs: [ 'code_check-style_format', 'code_check-quality_analyze', 'code_check-quality_unused_code' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sca_osv_scanner:
    name: 'security > sca:osv-scanner'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/dart/stages/20-security/osv-scanner@main'
        with:
          flutter_version: ${{ inputs.flutter_version }}
          dart_sdk_version: ${{ inputs.dart_sdk_version }}
          toolchain: ${{ inputs.toolchain }}
    needs: [ 'code_check-style_format', 'code_check-quality_analyze', 'code_check-quality_unused_code' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  # third stage
  tests-test_all:
    name: 'tests > test:all'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/dart/stages/30-tests/all@main'
        with:
          flutter_version: ${{ inputs.flutter_version }}
          dart_sdk_version: ${{ inputs.dart_sdk_version }}
          toolchain: ${{ inputs.toolchain }}
          test_args: ${{ inputs.test_args }}
          coverage_minimum: ${{ inputs.coverage_minimum }}
          coverage_exclude: ${{ inputs.coverage_exclude }}
          # The commit the change is measured against, so the summary can name the coverage of
          # the files this pull request touches. Empty on a push, where there is nothing to diff
          # against and the section is omitted.
          coverage_diff_base: ${{ github.event.pull_request.base.sha }}

      # The suite as a check run -- every test listed, every failure annotated at the line its
      # stack trace names -- which is what `go.yaml` and `yarn.yaml` publish through this same
      # action and Dart never had. GitLab CI and Azure DevOps read `junit.xml` for the same purpose;
      # this reads the runner's FILTERED event stream through the action's own Dart parser rather
      # than that JUnit through its `java-junit` one, because `tojunit` records each suite's class
      # name as the runner's absolute path with every separator turned into a dot
      # (`.opt.actions_runner.1._work...test.chat_datetime`), which the JUnit parser can neither
      # read as a file nor show as a name, while the Dart parser takes the suite's real path and the
      # failing line straight from the stream. Filtered, because `flutter test --machine` shares
      # stdout with pub's progress lines and flutter_tools' array-shaped events and the parser fails
      # the whole report on the first line it cannot parse -- `filter_test_events.py` says what it
      # dropped, and writes nothing when nothing is left, which is what the `hashFiles` guard reads.
      #
      # Needs `checks: write` from the CALLER -- see the permissions note at the foot of this file --
      # and does not fail the job without it, for the reason the coverage comment below gives: a
      # pull request from a fork has a read-only token whatever the caller grants, and a check that
      # could not be published is a yellow step, never a red `tests > test:all`. The action's own
      # `fail-on-error` still marks the check run failed when the suite is, which is the signal a
      # reader wants; the job's verdict comes from the tests themselves, one step up.
      - name: 'Test Results'
        if: "always() && hashFiles('build/reports/test-results.json') != ''"
        continue-on-error: true
        uses: 'dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2' # v3.0.0
        with:
          name: 'Test Results'
          path: 'build/reports/test-results.json'
          reporter: 'dart-json'

      # The coverage table on EVERY run's summary page, pull request or not. The runner writes the
      # Markdown beside its JUnit, Cobertura and LCOV, from the same parse the `coverage_minimum`
      # gate evaluates -- see `lcov_to_markdown.py` for why it is rendered there rather than by an
      # action reading the raw tracefile.
      #
      # `always()`, like every reporting step in this repository: a red suite is exactly when
      # someone needs to see what the coverage was. The `hashFiles` guard is what keeps a project
      # with no tests, or a suite that never produced a tracefile, from failing on a missing file
      # here rather than on the cause.
      - name: 'Coverage Summary'
        if: "always() && hashFiles('build/reports/coverage.md') != ''"
        run: 'cat build/reports/coverage.md >> "$GITHUB_STEP_SUMMARY"'
        shell: 'bash'

      # The same table as one sticky comment per pull request, updated in place on every push --
      # the parity `yarn.yaml` and `npm.yaml` have carried through `vitest-coverage-report-action`
      # since their coverage landed. Dart emits LCOV only, and no LCOV comment action fits this
      # library (an `lcov` binary the runner cannot `apt-get`, or a Docker action the fleet cannot
      # start), so the rendering is the runner's and only the posting is a third party's.
      #
      # Needs `pull-requests: write` from the CALLER to post -- see the permissions note at the foot
      # of this file -- and does NOT fail the job without it. Two reasons, and the second is the one
      # no consumer can fix: `marocchino/sticky-pull-request-comment` turns a refused post into
      # `setFailed`, where the JavaScript pipelines' `vitest-coverage-report-action` only warns on a
      # 403, so a hard failure here would not be the parity it looks like; and on a pull request
      # FROM A FORK GitHub makes `GITHUB_TOKEN` read-only for every scope regardless of what the
      # caller grants, so the post is refused on a green suite with nothing anyone can change. The
      # comment is a report, like the summary above it: a refused post is a yellow step with the
      # cause in its log, never a red `tests > test:all`. That is also what keeps this change
      # additive -- a consumer that grants nothing sees a warning and no comment, not a failing
      # required check.
      - name: 'Coverage Report'
        if: "always() && github.event_name == 'pull_request' && hashFiles('build/reports/coverage.md') != ''"
        continue-on-error: true
        uses: 'marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88' # v3.0.5
        with:
          header: 'coverage'
          path: 'build/reports/coverage.md'
    needs: [ 'security-sast_semgrep', 'security-sast_gitleaks', 'security-sast_hadolint', 'security-sca_osv_scanner' ]
    if: "!startsWith(github.ref, 'refs/tags/')"


  # NOTE: there is no `management > report:sbom` job. Dependency-Track ingests
  # CycloneDX, and pub has no native CycloneDX generator -- `package:sbom` emits
  # SPDX, and `cdxgen` would drag a whole Node.js toolchain into a Dart job --
  # so the BOM was produced by `trivy fs --format cyclonedx`. Trivy has been
  # removed from this repository, so the job (and its `enable_sbom` input) was
  # removed rather than left calling an action that no longer exists.
  # `sca:osv-scanner` still covers the vulnerability scanning.


# 1 - this file MUST be inside ".github/workflows" because of GitHub Actions limitations
# 2 - the recommended events to trigger this workflow and permissions are:
#   on:
#     push:
#       branches:
#         - 'main'
#       tags:
#         - '*'
#     pull_request:
#       branches:
#         - 'main'
#     workflow_dispatch:
#
# permissions:
#   contents: 'read'
#   checks: 'write' # tests-test_all (test results annotations)
#   pull-requests: 'write' # tests-test_all (coverage report comment)
#
# There is no `security-events: write` requirement here, unlike the other
# language workflows: that permission exists for CodeQL, which does not support
# Dart and is therefore not part of this pipeline.
