parameters:
  - name: 'SELF_HOSTED_POOL' # optional parameter for heavy workloads within JS language
    type: 'string'
    default: "$(SELF_HOSTED_POOL)"
  - name: 'WORKING_DIRECTORY'
    type: 'string'
    default: ''
  - name: 'RUN_BEFORE_TESTS'
    type: 'string'
    default: 'echo "No before script"'
  - name: 'RUN_AFTER_TESTS'
    type: 'string'
    default: 'echo "No after script"'

steps:
  # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
  # through `env:` and running it with `eval` keeps it DATA at template-expansion
  # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
  # so a value containing a newline or a quote used to be able to terminate this
  # step and append steps of its own. Through `env:` the shell only expands it at
  # run time, which is the same fix already applied to `pipelines_ref` in
  # .github/workflows/terra.yaml.
  - bash: 'eval "$PIPELINES_HOOK"'
    displayName: 'Run Before'
    env:
      PIPELINES_HOOK: ${{ parameters.RUN_BEFORE_TESTS }}

  - script: yarn cy:parallel
    displayName: 'Run Tests'

  # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
  # through `env:` and running it with `eval` keeps it DATA at template-expansion
  # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
  # so a value containing a newline or a quote used to be able to terminate this
  # step and append steps of its own. Through `env:` the shell only expands it at
  # run time, which is the same fix already applied to `pipelines_ref` in
  # .github/workflows/terra.yaml.
  - bash: 'eval "$PIPELINES_HOOK"'
    displayName: 'Run After'
    env:
      PIPELINES_HOOK: ${{ parameters.RUN_AFTER_TESTS }}

  - task: 'PublishTestResults@2'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: "${{ parameters.WORKING_DIRECTORY }}/**/junit.xml"
    displayName: 'Publish Test Results'

  - task: 'PublishCodeCoverageResults@2'
    inputs:
      summaryFileLocation: "${{ parameters.WORKING_DIRECTORY }}/cobertura.xml"
    displayName: 'Publish Code Coverage Results'
