include:
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/abstracts/default-variables.yaml'
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/stages/30-tests/test-pyramid.yaml'

test:all:
  extends: '.test:all'
  stage: 'tests'
  script:
    - gradle test
    - gradle jacobo
    - echo $(cat "$PREFIX$REPORT_PATH/jacoco/test/html/index.html" | grep -o "<tfoot>.*</tfoot>") || exit 0
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: 'always'
    paths:
      - "$PREFIX$REPORT_PATH/jacoco/test"
    reports:
      junit: "${PREFIX}build/test-results/test/**/TEST-*.xml"
      coverage_report:
        coverage_format: 'cobertura'
        path: "$PREFIX$REPORT_PATH/cobertura.xml"

test:build:
  extends: '.test:build'
  stage: 'tests'
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: "$CI_COMMIT_TAG"

# Does this merge request worsen the shape of the test suite? Merge requests only; advisory
# unless the target branch's `.test-pyramid` says `blocking true`. See
# gitlab/global/stages/30-tests/test-pyramid.yaml and README.md, "Test Pyramid".
test:pyramid:
  extends: '.test-pyramid'
  variables:
    TEST_PYRAMID_LANGUAGE: 'java'
