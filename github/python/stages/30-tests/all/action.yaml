inputs:
  python_version:
    required: false
    default: '3.14'
    description: 'Python version to use'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: 'Setup Python'
      uses: 'actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0' # v7.1.0
      with:
        python-version: "${{ inputs.python_version }}"

    - name: 'Install PDM and dependencies'
      run: |
        python -m pip install --only-binary :all: "pdm==2.29.3" "unearth==0.18.3"
        pdm install -v
      shell: 'bash'

    - name: 'Run tests'
      run: pdm run test
      shell: 'bash'

    - name: 'Upload test results'
      uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
      with:
        name: 'test-results'
        path: 'build/reports/'
        if-no-files-found: 'warn'
        overwrite: true
        # Never past the repository's own retention: a longer request is cut to it anyway, with a
        # warning on every run (`.github/tests/test-report-uploads.sh`).
        retention-days: "${{ github.retention_days < 10 && github.retention_days || 10 }}"
      if: always()
      # A refused upload (e.g. `Artifact storage quota has been hit`) must not fail the job:
      # the report is evidence, and the step above already decided pass or fail.
      continue-on-error: true
