.sdk:
  image: 'mcr.microsoft.com/dotnet/sdk:8.0@sha256:ff39a765f04619c8d146796fc09b38499ae5984f4a2a4c3a0a57d0022855daee'
  cache: # relative to the project directory ($CI_PROJECT_DIR)
    key: "$CI_JOB_NAME"
    paths:
      - 'packages'
    when: 'always'
  before_script:
    - export PATH="$PATH:/root/.dotnet/tools"
    - export SLN_FILE=$(find . -name "*.sln" -print -quit)
    - dotnet restore --packages packages $SLN_FILE
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
