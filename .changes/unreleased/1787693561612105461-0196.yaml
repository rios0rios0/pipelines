kind: 'Security'
body: '**checksum-verified the `yq` download, and closed the assertion that could not see it was missing.** `golangci-lint/run.sh` fetched golangci-lint through `download_verified` and `yq` through a bare `curl` a hundred lines above it, with the version hard-coded rather than declared in `pinned-versions.sh` -- so the one binary that parses every consumer''s `.golangci.yml` was the one binary nothing checked. The supply-chain assertion reported the file as compliant throughout, because it was a per-FILE `grep -q download_verified`: one verified download anywhere cleared every other download in the same file. It now checks per URL, and is proven to fire against exactly that shape. `YQ_PINNED_VERSION` and four digests (linux and darwin, amd64 and arm64 -- this is the one tool here also resolved on a developer''s Mac) join the manifest, read from the `checksums` file published with the release'
time: '2026-08-25T21:32:41.612059466Z'
