kind: 'Added'
body: 'added `extra_test_command`, `extra_test_name` and `extra_test_runs_on` to `go.yaml` and every Go workflow composed on it, which run one more test command -- the race detector, the suite on Windows, packages the coverage run does not reach -- as `tests > test:<extra_test_name>` in the tests stage, gated like `test:all` and waited for by delivery, through the new `github/golang/stages/30-tests/command` action. A consumer could only declare such a job beside its call, where it started at once, beside the first stage, because a caller job can only `needs:` a reusable workflow as a whole. Also added `cross_compile` to `go-binary.yaml` (off by default, as GoReleaser still builds every target at delivery) and `make test-go-cross-compile`'
