name: 'CI/CD Pipeline'

on:
  push:
    branches: [ 'main' ]
    tags: [ '*' ]
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: 'write' # required for releases
  checks: 'write' # required for test results
  # NOTE: no `security-events: write` here, unlike the Go/Python/Java examples.
  # That permission exists for CodeQL, which has no Dart extractor and is
  # therefore not part of the Dart pipeline. See the workflow's own header.

jobs:
  pipeline:
    # Pinned to a release tag rather than '@main'. A branch is a moving
    # target: '@main' means every pipeline run executes whatever this
    # library happened to merge that morning, including changes nobody here
    # reviewed. Bump this deliberately. For maximum immutability pin the
    # 40-character commit SHA instead; '@v4' tracks the major and still
    # receives patches automatically.
    uses: 'rios0rios0/pipelines/.github/workflows/flutter-artifacts.yaml@4.23.0'
    with:
      # Omit to track the current stable release; pin for reproducible builds.
      flutter_version: '3.47.0'
      build_web: true
      build_android: true
      android_targets: 'apk appbundle'
