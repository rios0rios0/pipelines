.sdk:
  image: 'mcr.microsoft.com/dotnet/sdk:8.0@sha256:f7e28a0a3f6f9235929ec19274fd0ddf8534e9159f99fac602ac73304f1ce99f'
  cache: # relative to the project directory ($CI_PROJECT_DIR)
    key: "$CI_JOB_NAME"
    paths:
      - 'packages'
    when: 'always'
  before_script:
    - export PATH="$PATH:/root/.dotnet/tools"
    - export SLN_FILE=$(find . -name "*.sln" -print -quit)
    - dotnet restore --packages packages $SLN_FILE
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
