name: 'default'

# This repository's own pipeline, run as stages one after another like every pipeline it ships:
#
#   code-check  `quality:validate`           required files, YAML syntax, script permissions
#               `style:shellcheck`           the ShellCheck runner this repository ships to consumers
#   security    `sast:codeql`                this repository's own code scanning, one job per language
#               `verify:dependency-updates`  the proof that the pins a pull request moves are safe
#   tests       `test:all`                   every validation suite (`make test`)
#   delivery    `release`                    the tag and GitHub Release a bump merge cuts, and `vN`
#               `container (<name>:<tag>)`   the images under `global/containers/` a push changed
#
# Every job of a stage needs every job of the stage before it, so a failed lint stops the scans, a
# failed scan stops the suites, and nothing is released or published from a commit that did not pass
# them all. It is the ONE workflow this repository runs on a push or a pull request: the dependency
# verification, the release and the container images were three more, each starting the moment the
# event arrived and none waiting for the validation. The scheduled run is CodeQL's alone: the
# checking jobs skip it, so every job after them gates on `!cancelled() && !failure()` (Test 18 of
# `make test ONLY=workflow-composition`).
#
# The dependency verification and the release are reusable workflows consumers call too, so this file
# calls them rather than carrying a second copy of either, and they report as
# `dependency-updates / security > verify:dependency-updates` and `release / delivery > release`.
# The default branch's ruleset requires the first by that name.
on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  # CodeQL ships new queries continuously, so a weekly scan finds a vulnerability class that was
  # not modelled on the day the code was last touched. Only `security > sast:codeql` runs on it.
  schedule:
    - cron: '17 3 * * 1'
  # A dispatch runs the whole pipeline and then builds the container images it names; the inputs
  # are the container delivery's.
  workflow_dispatch:
    inputs:
      container_folder:
        description: >-
          Container folder name to build (e.g. "golang.1.27-awscli").
          Leave empty to build ALL containers.
        required: false
        default: ''
        type: 'string'
      push:
        description: >-
          Publish the result to ghcr.io. Left OFF, a dispatch only VERIFIES the
          Dockerfile: both architectures are still built, and nothing is pushed
          over the tag `main` publishes. Turn it ON to republish an image by
          hand.
        required: false
        default: false
        type: 'boolean'

permissions:
  contents: 'read'

# A newer push to a pull request supersedes its older run. Every other run -- a push to main above
# all -- gets a group of its own, because it carries the delivery stage: a group shared by every run
# on `main` would hold the second of three quick merges as pending and cancel it when the third
# arrived, and the release or image that merge was owed would never be cut.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  # first stage
  code_check-quality_validate:
    name: 'code-check > quality:validate'
    runs-on: 'ubuntu-latest'
    if: "github.event_name != 'schedule'"
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Check required files'
        run: |
          echo "Checking required files..."
          for f in CONTRIBUTING.md CHANGELOG.md README.md Makefile clone.sh; do
            test -f "$f" && echo "  ✓ $f" || { echo "  ✗ $f is missing"; exit 1; }
          done
          for f in .github/tests/test-go-validation.sh .github/tests/test-go-tool-staleness.sh .github/tests/test-govulncheck-verdict.sh .github/tests/test-lambda-templates.sh .github/tests/test-sonarqube-auto-derive.sh .github/tests/test-release-tag-idempotency.sh .github/tests/test-docker-multi-arch.sh .github/tests/test-dart-pipeline.sh; do
            test -f "$f" && echo "  ✓ $f" || { echo "  ✗ $f is missing"; exit 1; }
          done

      # Parsed with mikefarah/yq, resolved the way every script here resolves it (the one on PATH,
      # else the pinned release, downloaded and verified). It reads GitLab CI's custom tags such as
      # `!reference` as tagged nodes, so no loader has to be taught them.
      - name: 'Validate YAML syntax'
        run: |
          echo "Validating YAML files across all providers..."
          . global/scripts/shared/pinned-versions.sh
          . global/scripts/shared/verify-download.sh
          . global/scripts/shared/resolve-yq.sh
          resolve_yq "$RUNNER_TEMP/yq" || exit 1
          errors=0
          for template in $(find github gitlab azure-devops global .github/workflows .docs/examples -name '*.yaml' -o -name '*.yml' 2>/dev/null); do
            if "$YQ" eval 'true' "$template" > /dev/null 2>&1; then
              echo "  ✓ $template"
            else
              echo "  ✗ $template -- invalid YAML"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors YAML validation error(s)"
            exit 1
          fi

      - name: 'Validate script permissions'
        run: |
          echo "Checking script permissions..."
          errors=0
          for script in $(find global/scripts -name "run.sh" -type f); do
            if [ ! -x "$script" ]; then
              echo "  ✗ $script is not executable"
              errors=$((errors + 1))
            else
              echo "  ✓ $script"
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors permission error(s) -- run: chmod +x <script>"
            exit 1
          fi

  code_check-style_shellcheck:
    name: 'code-check > style:shellcheck'
    runs-on: 'ubuntu-latest'
    if: "github.event_name != 'schedule'"
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      # This repository lints itself with the same runner it ships to consumers, rather than
      # with a second implementation maintained here. That closes two gaps at once.
      #
      # SCOPE: the loop this replaces iterated `find global/scripts`, so `.github/tests/` --
      # the largest body of shell in the repository -- was never linted by CI at all. Ten
      # warnings accumulated there unread, visible only to somebody invoking the runner by
      # hand. The runner scans from the repository root, excluding `.git`, `node_modules`,
      # `vendor` and `.codeql-db`.
      #
      # VERSION: `apt-get install shellcheck` took whatever the Ubuntu image shipped that day.
      # The runner installs a version pinned in `pinned-versions.sh` and checksum-verified by
      # `verify-download.sh` -- which is this repository's own supply-chain rule, and the
      # reason the runner gives for pinning applies exactly here: a new ShellCheck release
      # adds checks, so an unchanged script could pass in the morning and fail in the
      # afternoon with nothing in the diff to explain it.
      #
      # Severity is unchanged (`--severity=warning`), and the runner already exits non-zero on
      # a finding, so the gate keeps failing the build the way the loop did.
      - name: 'Run ShellCheck'
        run: ./global/scripts/tools/shellcheck/run.sh
        env:
          SCRIPTS_DIR: ${{ github.workspace }}


  # second stage
  #
  # This repository's OWN code scanning, moved off GitHub's default setup: default setup gives the
  # analysis no environment of its own -- its runner ships one Go and the CodeQL action sets
  # `GOTOOLCHAIN=local`, so a module ahead of that Go cannot even be resolved (ten red runs before
  # the move). It runs the `security-and-quality` suite `make codeql` uses and fails on any finding
  # `.codeql-false-positives` does not list; this repository's root `codeql-config.yml` and
  # `.codeql-false-positives` are read by this analysis alone. The SARIF category is the language
  # (`/language:<language>`), set by the action, so code scanning sees the same analyses as before
  # they moved here from `codeql.yaml`.
  #
  # **The action is referenced by LOCAL PATH, not `rios0rios0/pipelines/...@main`:** `@main` would
  # test the copy on the default branch, so a pull request changing the action would report green
  # on code nobody ran, and an external `uses:` on a branch name is SonarCloud's high-severity
  # `githubactions:S7637`. A `./` action has to be on disk before the runner resolves it, which is
  # why this job checks out first; the action's own checkout after it is harmless.
  security-sast_codeql:
    name: "security > sast:codeql (${{ matrix.language }})"
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      # `security-events: write` is what the SARIF upload needs, and it is granted to this job
      # rather than to the workflow so a step added later does not inherit it.
      security-events: 'write'
      actions: 'read'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `actions` and `go`. `python` left the list on 2026-10-29 with the last Python file here:
        # the helpers are Go or POSIX shell, `make test ONLY=no-python` keeps it that way, and a Python
        # leg with no Python to extract fails rather than reporting nothing. Every CodeQL bundle
        # from `codeql-bundle-v2.26.4` carries a Go extractor built with go1.27, and
        # `make test ONLY=go-module-toolchain` (section 4) fails if `go` leaves this list.
        language: [ 'actions', 'go' ]
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - uses: './github/global/stages/20-security/codeql'
        with:
          codeql_language: "${{ matrix.language }}"
          # Two Go modules live here: the Go helpers at the root and the tor-proxy health probe.
          # Autobuild extracts both from the repository root under ONE Go, set up from this file
          # with `GOTOOLCHAIN=local`, so it must be the module with the newer `go` directive --
          # the health probe's, whose Go reads the root module too. `make test ONLY=go-module-toolchain`
          # (section 3) fails if another module's directive overtakes the one named here.
          #
          # Autobuild runs `make` first, as CodeQL's Go autobuilder does wherever a Makefile
          # exists. Here the default goal is `login`, a `docker login` that fails without a
          # terminal; the autobuilder logs that and goes on to fetch and extract both modules.
          go_version_file: 'global/containers/tor-proxy.latest/health/go.mod'
    needs: [ 'code_check-quality_validate', 'code_check-style_shellcheck' ]
    if: '!cancelled() && !failure()'


  # The verification consumers call is the one this repository runs: a copy here would be a second
  # verifier to keep in step with the first. Only a pull request has a base to compare against, so
  # it runs on pull requests alone.
  dependency-updates:
    uses: './.github/workflows/dependency-updates-verify.yaml'
    permissions:
      contents: 'read'
      # Posts the verification on the pull request; see the called workflow.
      pull-requests: 'write'
    needs: [ 'code_check-quality_validate', 'code_check-style_shellcheck' ]
    if: "!cancelled() && !failure() && github.event_name == 'pull_request'"


  # third stage
  tests-test_all:
    name: 'tests > test:all'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Setup Go 1.27.3'
        uses: 'actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e' # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: 'go.sum'
          # See `github/golang/stages/10-code-check/golangci-lint/action.yaml` for the measured
          # reason this is gated: on a self-hosted runner GOMODCACHE and GOCACHE persist on local
          # disk, the restore untars over files that already exist, `tar` exits 2 and the entire
          # download is discarded. `runs-on` is hard-coded to a hosted runner in this file, so the
          # expression is a no-op today. It is written anyway so the rule `make
          # test-runner-cache-gating` enforces needs no exemption list, and so that adding a
          # `runs_on` input here later cannot silently reintroduce the defect.
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: 'Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: 'Run all validation tests'
        run: make test
    needs: [ 'security-sast_codeql', 'dependency-updates' ]
    if: "!cancelled() && !failure() && github.event_name != 'schedule'"

  # fourth stage
  #
  # The tag and GitHub Release a bump merge cuts, plus the floating `vN` tag that consumers pinning a
  # major version follow -- which is why this repository, unlike its consumers, turns that one on.
  release:
    uses: './.github/workflows/release.yaml'
    with:
      update_major_tag: true
    permissions:
      contents: 'write'
    needs: [ 'tests-test_all' ]
    if: "!cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'"

  # The images under `global/containers/`, rebuilt for the folders a push to main changed, or for the
  # one a dispatch names. Behind `release` as well as the tests: every shipping job waits for every
  # reusable call in the file (Test 18), and a release that failed is a reason to publish nothing.
  delivery-containers_detect:
    name: 'delivery > containers:detect'
    runs-on: 'ubuntu-latest'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
      # Resolved once, here, so the matrix job reads a plain 'true'/'false'
      # instead of repeating the trigger test in two places. The `inputs`
      # context is populated only for `workflow_dispatch` and `workflow_call`;
      # on a `push` to main `inputs.push` is simply empty, and that absence has
      # to mean PUBLISH -- the behaviour this delivery has always had. So the
      # event test comes first, and `||` returns it without needing the input.
      #
      # That short-circuit is also why the input DEFAULTS TO FALSE: `main` never
      # reads it, so the default governs the dispatch form ALONE, and there the
      # two mistakes are not the same size. Publishing a branch over a released
      # tag cannot be undone; forgetting to tick the box costs one re-dispatch.
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Detect changed container folders'
        id: 'set-matrix'
        # The logic lives in a script so `.github/tests/test-containers-detect.sh`
        # can exercise it; it drops folders that were deleted or renamed in the
        # push, which otherwise fail the build with a missing-context error.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FOLDER: ${{ github.event.inputs.container_folder }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          ./global/scripts/tools/containers/detect-changed-folders.sh >> "$GITHUB_OUTPUT"
    needs: [ 'tests-test_all', 'release' ]
    if: "!cancelled() && !failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')"

  delivery-containers:
    name: "delivery > container (${{ matrix.name }}:${{ matrix.tag }})"
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      packages: 'write'
    strategy:
      matrix: ${{ fromJson(needs.delivery-containers_detect.outputs.matrix) }}
      fail-fast: false
      # Each image is a two-architecture buildx build under QEMU. Four at a time keeps a dispatch
      # that rebuilds every folder from taking the account's whole runner allowance at once.
      max-parallel: 4
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Set up QEMU'
        uses: 'docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1' # v4.4.0

      - name: 'Set up Docker Buildx'
        uses: 'docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069' # v4.4.1

      # Skipped for a verification build. Nothing is published, so nothing needs
      # the token -- and a build-only run that never authenticates cannot
      # publish by accident, whatever the recipe below turns out to do.
      - name: 'Login to GitHub Container Registry'
        if: ${{ needs.delivery-containers_detect.outputs.push == 'true' }}
        uses: 'docker/login-action@dbcb813823bdd20940b903addbd779551569679f' # v4.6.0
        with:
          registry: 'ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build ${{ matrix.name }}:${{ matrix.tag }}"
        env:
          # Through `env:` rather than interpolated into `run:`, which would let
          # a crafted value inject shell at YAML-parse time. Compared as a
          # string because a job output always is one.
          PUSH: ${{ needs.delivery-containers_detect.outputs.push }}
        run: |
          # `build` and `build-and-push` share one buildx recipe; the only
          # difference is whether its output is pushed or discarded.
          target='build-and-push'
          if [ "$PUSH" != 'true' ]; then
            target='build'
            echo "::notice::Verification build -- linux/amd64 and linux/arm64 are built, nothing is published."
          fi

          make "$target" \
            NAME="${{ matrix.name }}" \
            TAG="${{ matrix.tag }}" \
            CONTAINER_REGISTRY="ghcr.io/${{ github.repository }}"
    needs: [ 'delivery-containers_detect' ]
    if: "!cancelled() && !failure() && needs.delivery-containers_detect.outputs.has_changes == 'true'"
