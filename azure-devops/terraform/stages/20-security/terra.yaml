parameters:
  # Steps forwarded to the Terraform SAST job (`sast:semgrep`) so consumers
  # can configure SSH for private Terraform module cloning before the
  # scanner's parser walks `source = "git@..."` references.
  # Mirrors the `PRE_STEPS` hook already accepted by `azure-devops/terra/`.
  - name: 'PRE_STEPS'
    type: 'stepList'
    default: []

stages:
  - stage: 'security'
    displayName: 'security (sca/sast)'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    jobs:
      - template: '../../../global/stages/20-security/semgrep.yaml'
        parameters:
          SEMGREP_LANGUAGE: 'terraform'
          PRE_STEPS: ${{ parameters.PRE_STEPS }}

      - template: '../../../global/stages/20-security/gitleaks.yaml'

      - template: '../../../global/stages/20-security/hadolint.yaml'
