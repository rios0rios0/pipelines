runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      with:
        # Full history is required so `gitleaks detect` can walk every commit
        # of the current branch, and so `origin/<base>` resolves on pull
        # request builds (the run script scopes the scan to `<base>..HEAD`
        # when a PR context is detected).
        fetch-depth: 0

    - name: 'Get Scripts'
      uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    - name: 'Execute'
      shell: 'bash'
      run: $SCRIPTS_DIR/global/scripts/tools/gitleaks/run.sh

    # The upload below is `continue-on-error`, so it cannot be what fails a scan that exited 0
    # without writing its report. This step keeps that failure.
    - name: 'Verify Report'
      shell: 'bash'
      env:
        REPORT_DIR: 'build/reports/gitleaks'
      run: |
        if [ -z "$(find "$REPORT_DIR" -type f -print -quit 2> /dev/null)" ]; then
          echo "::error::The scan exited 0 without writing a report to $REPORT_DIR/"
          exit 1
        fi

    - name: 'Upload Report'
      uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
      with:
        name: 'gitleaks'
        path: 'build/reports/gitleaks/'
        if-no-files-found: 'warn'
        overwrite: 'true'
        retention-days: 10
      if: always()
      # A refused upload (e.g. `Artifact storage quota has been hit`) must not fail the job:
      # the report is evidence, and the step above already decided pass or fail.
      continue-on-error: true
