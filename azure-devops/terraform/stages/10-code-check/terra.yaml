stages:
  - stage: 'code_check'
    displayName: 'code check (style/quality)'
    condition: not(startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
    variables:
      REPORT_PATH: 'build/reports'
    jobs:
      - template: '../../../global/stages/10-code-check/basic-checks.yaml'

      - job: 'style_terraform_fmt'
        displayName: 'style:terraform-fmt'
        steps:
          - template: '../../abstracts/terra-terraform.yaml'

          - script: terraform fmt -check -recursive
            displayName: 'Run Terraform format check'

          - script: ./terragrunt hcl format --check
            displayName: 'Run Terragrunt HCL format check'

          # `scripts-repo` is what puts $(Scripts.Directory) in scope -- the
          # same pattern the order-check job below already uses.
          - template: '../../../global/abstracts/scripts-repo.yaml'

          - script: $(Scripts.Directory)/global/scripts/languages/terraform/tflint/install.sh
            displayName: 'Install TFLint (pinned, checksum-verified)'

          - script: tflint --chdir . --recursive
            displayName: 'Run TFLint'

      # Enforces the team's file-ordering standard (dependency/inputs in
      # root.hcl, .HCL/.ENV grouping in variables.tf, heaviest->lightest
      # providers.tf, main.tf-ordered outputs.tf). The checker is a Go helper
      # built from the pipelines checkout, so the job installs Go and reuses
      # scripts-repo without the terra CLI or Terraform. Run
      # `order-check/run.sh --fix` locally to auto-sort.
      - job: 'style_order_check'
        displayName: 'style:order-check'
        steps:
          - template: '../../../global/abstracts/scripts-repo.yaml'

          # At least the `go` directive of the pipelines repository's `go.mod`,
          # which the checker is built against: an older Go refuses the module.
          - task: 'GoTool@0'
            displayName: 'Use Go (order-check is a Go helper)'
            inputs:
              version: '1.27.3'

          - script: $(Scripts.Directory)/global/scripts/languages/terraform/order-check/run.sh
            displayName: 'Check file ordering (deps/variables/providers/outputs)'
            env:
              REPORT_PATH: $(REPORT_PATH)

          - task: 'PublishTestResults@2'
            displayName: 'Publish order-check results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: "$(REPORT_PATH)/junit-order-check.xml"
              testRunTitle: 'order-check'
              failTaskOnFailedTests: true
