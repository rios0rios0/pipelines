kind: 'Added'
body: 'added the `GO_TEST_INTEGRATION_PARALLEL` variable to the Go test runner (`global/scripts/languages/golang/test/run.sh`): it feeds `go test`''s `-p` flag for the integration phase, so a consumer whose integration fixtures allocate per-instance resources (for example an embedded PostgreSQL on an OS-assigned port) can run integration packages concurrently and cut the phase''s wall time. The default stays `1`, keeping the serial behavior byte-identical for every consumer that does not opt in. The runner reads it from the environment of the job that runs it, which on GitLab CI and Azure DevOps a pipeline variable already is; **on GitHub Actions it is not**, because a workflow that `uses:` a reusable workflow can pass only `inputs` and `secrets` across that boundary, so an `env:` at the call site would silently never arrive. GitHub consumers therefore get an `integration_parallel` input, threaded through `go.yaml`, `go-docker.yaml` and `go-render.yaml` into the test action exactly as `coverage_threshold` already is'
