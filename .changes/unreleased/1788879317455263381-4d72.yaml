kind: 'Fixed'
body: 'fixed the test suites that could run against the repository under test instead of against a fixture. `test-basic-checks.sh` built its throwaway git repositories in a hardcoded `/tmp/basic-checks-test-<name>` and did not check the `cd` into them; `/tmp` is not guaranteed to exist, and where it does it is not guaranteed to be writable by whoever runs `make test` -- on Termux/Android it is owned by another user at mode 771. None of these suites sets `-e`, by design, so the failed `cd` did not stop anything: `setup_repo` runs inside a command substitution, and its subshell carried on in the directory it inherited, which is this repository. On 2026-09-08 the `git init`, `git config` and `git commit` calls meant for a fixture therefore ran here -- `CHANGELOG.md` was truncated from 1332 lines to a 9-line stub in a commit authored by `test <test@test>`, the clone''s `user.name` and `user.email` were rewritten to match, and every later commit inherited that identity until a rebase, an amend and a force-push undid it. Both suites that build scratch trees (`test-basic-checks.sh`, `test-go-validation.sh`) now root them in `mktemp -d`, which follows `TMPDIR`, and clean up only what they created rather than globbing a shared directory; `setup_repo` checks its `git init`, its `git clone` and its `cd`, and every caller reads the fixture path as `${WORK_DIR:?}` because `cd ""` succeeds in bash and would have sailed past a bare guard. The remaining 21 unguarded `cd` calls across 12 other suites are guarded too'
