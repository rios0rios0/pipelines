inputs:
  blocking:
    required: false
    default: 'false'
    description: 'Whether findings fail the job: `true` or `false`. Advisory (`false`) by default, so the scanner reports without blocking until a project has triaged what it finds.'
  directories:
    required: false
    default: '.'
    description: 'Space-separated directories Checkov scans, recursively. Every Terraform root below the repository root by default.'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: 'Get Scripts'
      uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    # Inputs reach the script through `env:`, never interpolated into `run:`, so a value
    # cannot become shell.
    - name: 'Execute'
      shell: 'bash'
      env:
        CHECKOV_BLOCKING: ${{ inputs.blocking }}
        CHECKOV_DIRECTORIES: ${{ inputs.directories }}
      run: $SCRIPTS_DIR/global/scripts/tools/checkov/run.sh

    # No `Verify Report` step: in advisory mode a scan that could not complete exits 0 without a
    # report, by design, and a step that failed on the missing report would break that promise.
    # In blocking mode the script itself fails when the report is missing.
    - name: 'Upload Report'
      uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
      with:
        name: 'checkov'
        path: 'build/reports/checkov/'
        if-no-files-found: 'warn'
        overwrite: 'true'
        retention-days: 10
      if: always()
      # A refused upload (e.g. `Artifact storage quota has been hit`) must not fail the job:
      # the report is evidence, and the step above already decided pass or fail.
      continue-on-error: true
