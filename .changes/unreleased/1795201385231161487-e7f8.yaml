kind: 'Fixed'
body: 'fixed the CodeQL scan passing while it analysed nothing: a Go checkout or worktree kept below a directory whose `go.work` did not list it was built inside that workspace, which loaded no package, so the database held the `go.mod` alone, every query ran over nothing and the gate passed the empty report, in `make sast` and on CI. The Go build now runs with the repository''s own `go.work`, or with `GOWORK=off` when it has none, whenever the workspace `go` would join lies outside the source root, keeps a `go.work` the repository holds, and names in a warning each `go.work` below the source root that `GOWORK=off` leaves unread (`global/scripts/tools/codeql/go-workspace.sh`, sourced by `run.sh` and by the GitHub Actions `20-security/codeql` composite before its autobuild, for a self-hosted runner). `global/scripts/tools/codeql/extraction.sh` reads each report''s `<language>/summary/lines-of-code` metric and fails a scan whose database held no line of the language''s code, listing the extractor''s errors: strictly in `run.sh` (`make codeql`, GitLab CI, Azure DevOps), where a report without the metric fails too, and in the composite only when the metric is there and says 0, a missing metric (the `actions` language has none) or report being a warning annotation; `make test ONLY=codeql-extraction` holds both. **BREAKING CHANGE:** a CodeQL scan whose database holds no line of the language''s code now fails instead of passing: on GitHub Actions, on GitLab CI, in `make codeql` and `make sast`, and on Azure DevOps with `ENABLE_SECURITY_GATE` (without it the step succeeds with issues)'
breaking: true
