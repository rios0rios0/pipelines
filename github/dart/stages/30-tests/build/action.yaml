# Compiles the project as a CHECK, the third-stage twin of `test:build` in the GitLab and Azure
# DevOps Dart templates.
#
# `dart analyze` resolves and type-checks but never runs a compiler back end, and `test:all` runs
# the suite on the Dart VM -- so a defect only the AOT or web compiler rejects (a const evaluation
# failure, a deferred-loading mistake, a tree-shaking error on a non-constant icon, a plugin with
# no implementation for the target) passes both and fails at release time. That is the same
# reasoning `gitlab/dart/stages/30-tests/dart.yaml` and
# `azure-devops/dart/stages/30-tests/dart.yaml` already carry, and this closes the gap that left
# GitHub Actions the one platform of the three without the job.
#
# It therefore delegates to the SAME runner they do,
# `global/scripts/languages/dart/build/run.sh`, in the same `--debug` mode: debug keeps the check
# fast, and the `40-delivery` stage builds the real release artifact. Targets are the runner's --
# empty auto-detects (`apk` for a Flutter app, `exe` for a package with `bin/`, nothing at all for
# a library) -- so a consumer moving between platforms keeps one contract rather than learning a
# second one here.
#
# `build_command` is the ESCAPE HATCH, and the reason it exists is that some builds are a command
# rather than a target: flags derived from an environment, a generated file written beside the
# bundle, an artifact assertion that runs against what was just built. `DART_TEST_BUILD_COMMAND`
# is the same hatch on the other two platforms. Set it and the runner is not called at all.
inputs:
  flutter_version:
    required: false
    default: ''
    description: 'Pin an exact Flutter version (e.g. 3.47.0). Defaults to the current stable release.'
  dart_sdk_version:
    required: false
    default: 'latest'
    description: 'Pin an exact Dart SDK version. Only used for pure Dart projects.'
  toolchain:
    required: false
    default: 'auto'
    description: "Force the toolchain: 'dart', 'flutter', or 'auto' to detect it from pubspec.yaml."
  targets:
    required: false
    default: ''
    description: >-
      Space-separated build targets (e.g. 'web'), the GitHub spelling of `DART_TEST_BUILD_TARGETS`.
      Empty auto-detects from the project's own shape, exactly as it does on GitLab and Azure.
  build_mode:
    required: false
    default: '--debug'
    description: >-
      Flutter build mode flag. `--debug` here rather than the `--release` of `40-delivery/build`:
      this is a compile CHECK on every pull request, and the delivery stage builds the artifact
      that ships.
  build_args:
    required: false
    default: ''
    description: 'Extra arguments appended to the build command.'
  build_command:
    required: false
    default: ''
    description: >-
      Escape hatch: run this command instead of the shared build runner, with the toolchain on
      `PATH` and dependencies resolved. For a build that is a command rather than a target. The
      equivalent of `DART_TEST_BUILD_COMMAND` on GitLab and Azure DevOps.
  node_version:
    required: false
    default: ''
    description: >-
      Install Node.js before the build when the command needs it. Empty installs nothing rather
      than relying on whatever the runner happens to ship, which on a self-hosted fleet is not
      knowable from here.

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    # Skipped on a self-hosted runner for the reason `30-tests/all` and `40-delivery/build`
    # record at length: there every path below lives in `$HOME` and persists between jobs, the
    # restore cannot write over an unpacked SDK, and the download it exists to avoid is faster
    # than the restore itself.
    - name: 'Cache the Dart/Flutter SDK and pub packages'
      if: "runner.environment != 'self-hosted'"
      uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
      with:
        path: |
          ~/.local/share/flutter
          ~/.local/share/dart-sdk
          ~/.pub-cache
        key: "dart-${{ runner.os }}-${{ inputs.flutter_version }}-${{ inputs.dart_sdk_version }}-${{ hashFiles('**/pubspec.lock') }}"
        restore-keys: "dart-${{ runner.os }}-${{ inputs.flutter_version }}-${{ inputs.dart_sdk_version }}-"

    - name: 'Setup Node.js'
      if: "inputs.node_version != ''"
      uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
      with:
        node-version: '${{ inputs.node_version }}'

    # THE DEFAULT PATH: the same runner, the same mode and the same target semantics as the
    # GitLab and Azure templates. It installs the SDK and resolves dependencies itself.
    - name: 'Compile the project'
      if: "inputs.build_command == ''"
      run: $SCRIPTS_DIR/global/scripts/languages/dart/build/run.sh
      shell: 'bash'
      env:
        FLUTTER_VERSION: '${{ inputs.flutter_version }}'
        DART_SDK_VERSION: '${{ inputs.dart_sdk_version }}'
        DART_TOOLCHAIN: '${{ inputs.toolchain }}'
        DART_BUILD_TARGETS: '${{ inputs.targets }}'
        DART_BUILD_MODE: '${{ inputs.build_mode }}'
        DART_BUILD_ARGS: '${{ inputs.build_args }}'
        DART_BUILD_NUMBER: '${{ github.run_number }}'

    # THE ESCAPE HATCH, and the SDK is exported through `$GITHUB_PATH` for it rather than left for
    # the command to arrange. `dart_ensure_sdk` prepends to `PATH` in the shell it runs in, and a
    # composite action's steps are separate shells, so a consumer's command finds no `flutter` at
    # all unless the two share one. Exporting instead of merging the two steps is what keeps
    # `build_command` a plain command rather than a fragment spliced into somebody else's script.
    - name: 'Install the toolchain'
      if: "inputs.build_command != ''"
      shell: 'bash'
      run: |
        . "$SCRIPTS_DIR/global/scripts/languages/dart/common.sh"
        dart_ensure_sdk
        dart_pub_get
        # Each guarded with `if`, never `cmd && dir >> file`: this step runs under `set -e`, where
        # a `&&` list whose left side is false exits 1 and fails the job -- precisely when a
        # toolchain is legitimately absent, which is every pure Dart project for `flutter`.
        if command -v flutter > /dev/null 2>&1; then
          dirname "$(command -v flutter)" >> "$GITHUB_PATH"
        fi
        if command -v dart > /dev/null 2>&1; then
          dirname "$(command -v dart)" >> "$GITHUB_PATH"
        fi
        printf '%s\n' "$HOME/.local/bin" "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
      env:
        FLUTTER_VERSION: '${{ inputs.flutter_version }}'
        DART_SDK_VERSION: '${{ inputs.dart_sdk_version }}'
        DART_TOOLCHAIN: '${{ inputs.toolchain }}'

    - name: 'Build'
      if: "inputs.build_command != ''"
      shell: 'bash'
      run: '${{ inputs.build_command }}'
