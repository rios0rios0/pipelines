kind: 'Fixed'
body: 'moved this repository''s own code scanning from GitHub''s default setup to `.github/workflows/codeql.yaml`, which is what makes the above reachable: default setup gives the analysis no environment of its own, has no version knob and no file to put one in, so a module that has moved past its runner image cannot be analysed at all. The workflow calls the repository''s own composite action -- by LOCAL PATH, because `@main` resolves to the copy on the default branch, so a pull request changing that action would test the old one and report green on code nobody ran, and an external `uses:` on a branch name is a high-severity SonarCloud finding (`githubactions:S7637`) besides. It keeps the same three languages (`actions`, `go`, `python`), the same default query suite and the same weekly cadence, so nothing about the coverage narrows. **Merging it requires disabling default setup in the repository''s code-security settings** -- GitHub refuses SARIF from an advanced configuration while default setup is enabled'
