kind: 'Fixed'
body: 'fixed `golangci-lint/run.sh` obtaining its binary: a `./bin/golangci-lint` that reports the pinned version is reused instead of downloaded again, the download and extraction happen in a private `mktemp -d` directory removed when the run ends (two runs on one host used to share fixed paths under the system temp directory and delete each other''s files mid-install), and the binary is renamed into place. A Go toolchain on a newer minor line than the one the binary was built with now stops the run before linting, naming both versions, and a run that fails with `could not load export data` ends with a message naming it a tooling mismatch and saying to bump the pin, instead of leaving `typecheck` errors on the standard library to read as findings'
time: '2026-10-11T21:31:22.613624575Z'
