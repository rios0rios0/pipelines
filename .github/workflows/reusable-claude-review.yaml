name: 'Claude Review'

on:
  workflow_call:
    inputs:
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: |
          JSON array of runner labels (e.g. '["self-hosted"]'); see the `runs_on` input in
          go.yaml for the shape's rationale.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: 'OAuth token used by the Claude Code action'

# A bare self-hosted runner selected through `runs_on` must be provisioned before these jobs pass
# -- and NOT with host Node: the Actions runner ships its own (`externals/node*`) and executes
# every JavaScript action with it, on self-hosted hosts too. What a minimal host lacks is what
# `anthropics/claude-code-action` shells OUT to. Every step of that composite declares
# `shell: bash`; `oven-sh/setup-bun` unpacks Bun through `@actions/tool-cache`, which resolves
# `unzip` and throws when it is absent; Bun installs into `$HOME/.bun/bin`, so `$HOME` must be
# writable; `bun install --production` then resolves the action's dependencies from the npm
# registry; and the checkout -- plus the plugin marketplace cloned below -- needs `git`. So:
# `bash`, `git` and `unzip` on `PATH`, a writable `$HOME`, and egress to `github.com`,
# `registry.npmjs.org`, `api.github.com` and `api.anthropic.com`. A missing one does not fail at
# job selection -- it fails minutes in, inside the action, with an error that never names the
# runner.
jobs:
  claude-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: 'read'
      pull-requests: 'write'
      issues: 'write'
      id-token: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0
        with:
          fetch-depth: 1

      - name: 'Run Claude Code Review'
        id: 'claude-review'
        # The provisioning list in the comment above `jobs:` (and README.md's "Claude Review and
        # Claude Mention" section) describes THIS pin's install chain -- `oven-sh/setup-bun`,
        # `@actions/tool-cache` resolving `unzip`, `$HOME/.bun/bin`, `bun install --production`.
        # `dependency-updates.yaml` exists to make this SHA move; re-read both when it does.
        uses: 'anthropics/claude-code-action@a60f3e1db3edbceed2b1e6c6a9d34c36b8a15eba' # v1.0.209
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # AGENT MODE, deliberately. There is no `track_progress` here and adding one would
          # silently undo everything below -- read this before you do.
          #
          # `detectMode` returns tag mode whenever `track_progress` is set on an entity event,
          # and agent mode when a `prompt` is given without it. The difference is not
          # cosmetic: agent mode EXECUTES the prompt, tag mode injects it into the action's own
          # template as CONTEXT. So the slash command below is a real invocation here and is
          # inert there -- under `track_progress` the plugin still installs and still appears
          # in `slash_commands`, it just never runs. That is not theoretical: a tag-mode review
          # on this repository's PR #636 reported `subagent_stats.spawned: 0` against a command
          # that mandates roughly seven, and logged its own reading of the prompt as "Custom
          # instructions say /code-review:code-review ...".
          #
          # What running the plugin buys, and what it costs -- the two are exclusive, so the
          # choice is about WHICH runaway you want bounded:
          #
          #   agent mode (here)  the plugin's command runs, so the review inherits its
          #                      multi-agent pipeline, its >=80 confidence filter, its
          #                      false-positive list (pre-existing issues, and real issues on
          #                      lines the pull request did not modify, are both excluded), and
          #                      its step-1 guard, which STOPS when Claude has already commented
          #                      on the pull request. That guard is one-and-done: it gives no
          #                      second round that verifies the first, and it is a Haiku
          #                      judgement call rather than a hard gate.
          #                      COST: no tracking comment (`claudeCommentId: undefined`), and
          #                      `use_sticky_comment` does nothing -- `createInitialComment` is
          #                      its only consumer and is called only from `src/modes/tag/index.ts`,
          #                      so it is not merely unused here, it is unreachable. A pull
          #                      request therefore accumulates one comment per push, bounded by
          #                      the plugin's guard rather than by comment re-use.
          #
          #   tag mode           `use_sticky_comment: true` re-uses the one `claude[bot]`
          #                      comment, so the pile stays at one -- but the plugin is inert and
          #                      NOTHING bounds the findings. This repository ran that shape and
          #                      got seven reviews on one pull request in seventy minutes, at
          #                      6 -> 4 -> 4 -> 6 -> 5 findings, the last of them about three
          #                      files that pull request never touched.
          #
          # `--allowedTools` is the complete BASH allowlist, and the selector for which GitHub
          # MCP servers get installed. It is NOT the complete tool set: `Read`, `Grep`, `Glob`,
          # `Task` and `TodoWrite` are permitted by default and never needed listing -- measured,
          # not assumed, on the first agent-mode run here, where `Read` executed five times and
          # `Task` spawned seven subagents while absent from a four-entry list, and where all 22
          # permission denials were `Bash` and nothing else.
          #
          # What Bash gets is nothing at all by default, which is the part with no safe fallback:
          # drop this input and there is no curated list underneath, so `gh` and `git` are both
          # denied AND no MCP server is installed, leaving the review unable to read the diff or
          # to post. Four pull requests in this repository did exactly that -- full Opus runs,
          # green jobs, zero comments -- and the first agent-mode run repeated it from the other
          # side, ending after 18 turns with `stop_reason: end_turn` having never read the diff.
          #
          # Prefixes rather than subcommands, deliberately. `Bash(gh:*)` and `Bash(git:*)` cover
          # everything the plugin's agents do -- the diff, `gh pr comment`, the blame and history
          # pass -- without enumerating eleven subcommands that drift the moment the plugin adds a
          # twelfth. They still refuse every other binary: `curl`, `rm`, `bash -c`, a package
          # manager. That is the line worth holding; the subcommand list was never the thing
          # providing the safety.
          #
          # EVERY segment of a compound command must match, which is why the read-only text
          # utilities are here: `gh pr diff` alone was allowed on the first run and
          # `gh pr diff | wc -l` was still refused with "This Bash command contains multiple
          # operations", so the agent could never size or filter the diff. `Read` and `Grep`
          # cover reading a FILE, but neither can consume the stdout of a command, which is what
          # a review of `gh pr diff` output actually needs.
          #
          # The five chosen are the ones that cannot write or execute -- `grep` and `cat` (8 and 6
          # denials on that run), plus `wc`, `head` and `tail`. Deliberately NOT included, and do
          # not add them without re-reading this: `sed` writes in place with `-i`, `awk` writes
          # with `print >`, `find` executes with `-exec`, and `sort`/`uniq` both take an output
          # file as an argument. Those are edits and execution wearing the costume of a filter.
          #
          # A redirect (`> /tmp/x`) is refused by the working-directory sandbox rather than by
          # this list, so no entry here enables one -- which is also what keeps `cat` harmless.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh:*),Bash(git:*),Bash(grep:*),Bash(cat:*),Bash(wc:*),Bash(head:*),Bash(tail:*)"
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # No `--comment` flag: that belongs to the BUILT-IN `code-review` skill, which is a
          # different command that also resolves under this name. The plugin's command takes the
          # pull request as its argument and posts by itself through `gh pr comment`.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          show_full_output: true
          display_report: true
        env:
          # Sets the model without spending a `claude_args` slot on `--model`:
          # parse-sdk-options.ts resolves `model: options.model || modelFromClaudeArgs`, where
          # `options.model` is this variable -- so it wins either way, and `claude_args` above
          # stays purely about which tools exist.
          ANTHROPIC_MODEL: 'claude-opus-5'
