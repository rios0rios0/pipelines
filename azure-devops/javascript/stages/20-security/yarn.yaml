parameters:
  - name: 'DEPENDS_ON'
    type: object
    default: ''

stages:
  - stage: 'security'
    displayName: 'security (sca/sast)'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    ${{ if ne(parameters.DEPENDS_ON, '') }}:
      dependsOn: ${{ parameters.DEPENDS_ON }}
    jobs:
      - template: '../../../global/stages/20-security/semgrep.yaml'
        parameters:
          SEMGREP_LANGUAGE: 'javascript'

      - template: '../../../global/stages/20-security/gitleaks.yaml'

      - template: '../../../global/stages/20-security/codeql.yaml'
        parameters:
          CODEQL_LANGUAGE: 'javascript'
          # The JavaScript extractor parses TypeScript by running the TypeScript compiler on the
          # `node` on PATH, which the CodeQL bundle does not ship, and this job set none up: on an
          # agent without one the extraction stops at `Could not start Node.js. It is required for
          # TypeScript extraction.` -- quietly, since that step is `continueOnError`. The same
          # pinned Node.js as the other JavaScript jobs here
          # (`abstracts/corepack-node-no-cache.yaml`).
          PRE_STEPS:
            - task: 'UseNode@1'
              inputs:
                version: '24.22.1'
              displayName: 'Use Node.js 24.22.1'

      - template: '../../../global/stages/20-security/hadolint.yaml'

      - job: 'sca_yarn_audit'
        displayName: 'sca:yarn-audit'
        steps:
          - template: '../../abstracts/corepack-node-no-cache.yaml'
          - script: yarn npm audit --recursive --severity high
            displayName: 'Run yarn npm audit'
        continueOnError: true
