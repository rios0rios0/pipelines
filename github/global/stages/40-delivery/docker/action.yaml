inputs:
  github_token:
    description: 'GitHub token for GHCR authentication (defaults to automatic GITHUB_TOKEN)'
    type: 'string'
    required: false
    default: ''
  tag_name:
    description: 'Release version (e.g., 1.2.3). When provided, computes semver Docker tags directly instead of using docker/metadata-action.'
    type: 'string'
    required: false
    default: ''
  tags:
    description: 'Docker image tags (computed automatically via docker/metadata-action if not provided)'
    type: 'string'
    required: false
    default: ''
  platforms:
    description: |
      Target platforms for the build, as a comma-separated list. Defaults
      to `linux/amd64,linux/arm64` so the published manifest is a
      multi-arch list and the image runs on both AMD and ARM Kubernetes
      worker pools — `code-guru` rolling out to an AKS cluster with
      `aks-workersarm-*` workers crashlooped with `exec format error`
      because the previous single-arch `linux/amd64` image could not
      execute on those nodes. Override with a single platform (e.g.
      `linux/amd64`) when a consumer explicitly does not need ARM and
      wants to skip the QEMU emulation cost on the build.
    type: 'string'
    required: false
    default: 'linux/amd64,linux/arm64'
  version_build_arg:
    description: |
      Name of the Dockerfile `ARG` that receives the image's version (e.g.
      `VERSION`), passed as a build argument. The version is `tag_name` when
      the release job has just cut one, the tag on a tag build, and the
      commit's first 7 characters otherwise -- resolved by the same helper the
      Fly.io deploy uses, so one commit built by both reports one version.
      Empty, the default, passes nothing: the name is the consumer's to pick,
      since a project may already use `ARG VERSION` for something else.
    type: 'string'
    required: false
    default: ''

outputs:
  image:
    description: |
      The image this action pushed, by digest: `ghcr.io/<owner>/<repository>@sha256:<digest>`,
      lower-cased as the push spells it. For a multi-platform build (the default) the digest is the
      image index's, so it names every platform at once. A deploy that ships this reference ships
      the artifact this job built instead of building it again. Empty when the caller passed its
      own `tags`, since the action does not choose the name then.
    value: "${{ steps.image.outputs.image }}"

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    # The version is resolved BEFORE the registry login and the builder setup, so
    # a malformed name stops the job before anything is built. Nothing downstream
    # would stop it: a build argument no `ARG` declares is ignored rather than
    # refused, so `VERSION ` (a trailing space) would push an image still
    # reporting its default -- the state opting in exists to end. Both steps are
    # skipped when the caller does not opt in, so they cost such a caller nothing.
    - name: 'Get Scripts'
      uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'
      if: "inputs.version_build_arg != ''"

    - name: 'Resolve the build version'
      id: 'version'
      shell: 'bash'
      run: |
        . "$SCRIPTS_DIR/global/scripts/shared/build-version.sh"

        if ! build_arg_name_is_valid "$VERSION_BUILD_ARG"; then
          echo "::error::version_build_arg must name a Dockerfile ARG (letters, digits and underscores, not starting with a digit), got '$VERSION_BUILD_ARG'. Nothing has been built."
          exit 1
        fi

        if ! VERSION=$(build_version "$TAG_NAME"); then
          echo "::error::version_build_arg is set, but no version could be resolved from the release version, the tag or the commit. Nothing has been built."
          exit 1
        fi

        # Warned, not refused: the check reads the file line by line.
        if [ -f "$DOCKERFILE" ] && ! build_arg_is_declared "$DOCKERFILE" "$VERSION_BUILD_ARG"; then
          echo "::warning::$DOCKERFILE declares no 'ARG $VERSION_BUILD_ARG', so the version passed to it reaches nothing."
        fi

        echo "Build version: $VERSION_BUILD_ARG=$VERSION"
        echo "build_args=$VERSION_BUILD_ARG=$VERSION" >> "$GITHUB_OUTPUT"
      env:
        VERSION_BUILD_ARG: "${{ inputs.version_build_arg }}"
        TAG_NAME: "${{ inputs.tag_name }}"
        DOCKERFILE: '.ci/stages/40-delivery/app.Dockerfile'
      if: "inputs.version_build_arg != ''"

    - name: 'Compute tags from release version'
      id: 'release-tags'
      shell: 'bash'
      run: |
        MAJOR_MINOR="${TAG_NAME%.*}"
        {
          echo 'tags<<EOF'
          echo "${IMAGE}:latest"
          echo "${IMAGE}:${TAG_NAME}"
          echo "${IMAGE}:${MAJOR_MINOR}"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
      env:
        TAG_NAME: "${{ inputs.tag_name }}"
        IMAGE: "ghcr.io/${{ github.repository }}"
      if: "inputs.tags == '' && inputs.tag_name != ''"

    - name: 'Extract Docker metadata'
      id: 'meta'
      uses: 'docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302' # v6.2.0
      with:
        images: "ghcr.io/${{ github.repository }}"
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
      if: "inputs.tags == '' && inputs.tag_name == ''"

    - name: 'Login to Registry'
      uses: 'docker/login-action@dbcb813823bdd20940b903addbd779551569679f' # v4.6.0
      with:
        registry: 'ghcr.io'
        username: "${{ github.actor }}"
        password: "${{ inputs.github_token || github.token }}"

    # `setup-qemu-action` registers `binfmt_misc` handlers so the GitHub
    # `ubuntu-latest` runner (amd64) can execute ARM binaries during the
    # `RUN` steps of an `arm64` build. Without it, multi-arch builds
    # that invoke an architecture-specific binary inside a `RUN` step
    # (e.g. `apk add`, `apt-get install`, a `curl`-then-bash installer
    # like `claude.ai/install.sh`) fail at the foreign-arch interpreter
    # exec rather than producing a working image.
    - name: 'Set up QEMU'
      uses: 'docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1' # v4.4.0

    # `setup-buildx-action` swaps the default Docker builder for the
    # buildx driver, which is what `docker/build-push-action` requires
    # to produce a multi-platform manifest list. The default builder
    # silently ignores `platforms:` and emits a single-arch manifest —
    # the exact failure mode that bit `code-guru` and motivated this
    # change.
    - name: 'Set up Docker Buildx'
      uses: 'docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069' # v4.4.1

    - name: 'Build and Push'
      id: 'build'
      uses: 'docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc' # v7.4.0
      with:
        file: '.ci/stages/40-delivery/app.Dockerfile'
        context: '.'
        push: true
        platforms: "${{ inputs.platforms }}"
        tags: "${{ inputs.tags || steps.release-tags.outputs.tags || steps.meta.outputs.tags }}"
        build-args: "${{ steps.version.outputs.build_args }}"

    # The pushed image, named by the digest the build just reported, so a deploy
    # can ship exactly these bytes. The name is `ghcr.io/<repository>` as both
    # tagging steps above spell it, lower-cased because `docker/metadata-action`
    # lower-cases it before tagging -- and a registry reference cannot hold an
    # upper-case letter, so the release step's raw spelling only ever pushes when
    # it is lower-case already. Skipped for a caller's own `tags`, whose name this
    # action does not know.
    - name: 'Name the pushed image'
      id: 'image'
      shell: 'bash'
      run: |
        if [ -z "$DIGEST" ]; then
          echo "::warning::docker/build-push-action reported no digest, so this action outputs no image."
          exit 0
        fi
        echo "image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')@$DIGEST" >> "$GITHUB_OUTPUT"
      env:
        IMAGE: "ghcr.io/${{ github.repository }}"
        DIGEST: "${{ steps.build.outputs.digest }}"
      if: "inputs.tags == ''"
