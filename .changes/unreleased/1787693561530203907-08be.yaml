kind: 'Fixed'
body: 'fixed `global/containers/python.3.9-pdm-buster/Dockerfile`, which **could not build**: Debian 10 (buster) is end-of-life and its suites were REMOVED from `deb.debian.org` rather than left to go stale, so all three the base image ships answered `404 Not Found` and `apt-get update` failed the build outright on both architectures. Repointed at `archive.debian.org` over **HTTPS**, which still serves buster, buster-updates and the buster security suite -- apt has carried an https method natively since 1.5, so buster''s 1.8 needs no `apt-transport-https`, and the base image already carries the ca-certificates pip depends on. `Acquire::Check-Valid-Until "false"` is required alongside it -- an archived Release file keeps the `Valid-Until` stamp it was signed with, and apt rejects the suite as expired otherwise, complaining about the release file in wording that reads almost exactly like the 404 this fixes. Signature verification stays ON: the archived Release files are still signed by the buster keys already in the image''s `debian-archive-keyring`, so neither `[trusted=yes]` nor `--allow-unauthenticated` is needed, and reaching for either would drop the last integrity check this image has over an archive it no longer controls. The image is NOT rebased onto a supported Debian, because the container directory name IS the published tag (`python.3.9-pdm-buster` -> `python:3.9-pdm-buster`), so renaming it would break every consumer pinning that tag -- and an archived base is the point for an image whose whole reason to exist is Python 3.9, itself end-of-life since October 2025. The four instructions were also merged into one: the package lists and the dpkg database are deleted at the end, so anything split into a later layer would either restore what was just removed or run against a half-dismantled system'
