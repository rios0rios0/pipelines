name: 'Claude Review'

on:
  workflow_call:
    inputs:
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: |
          JSON array of runner labels (e.g. '["self-hosted"]'); see the `runs_on` input in
          go.yaml for the shape's rationale.
      autoupdate_branch_prefix:
        type: 'string'
        required: false
        default: 'chore/autoupdate-'
        description: |
          Head-branch prefix identifying a scheduled dependency pull request from
          autoupdate, which is not reviewed. Mirrors AUTOUPDATE_BRANCH_PREFIX in the
          basic-checks changelog gate, so one repository exempts the same branches from
          both. An empty string reviews them like any other pull request.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: 'OAuth token used by the Claude Code action'

# ONE review job covering three dimensions -- correctness, security, and software design --
# in one prompt, posting ONE comment per pull request that later runs update in place. The
# shape (tag mode, a prose prompt, an explicit tool allowlist, no plugin, no subagent
# fan-out, a single job) is DELIBERATE and was paid for with five debugging cycles: the full
# forensics, the upstream issues that forced it, and the operational facts live in
# `.docs/claude-review.md`. Read that document before changing this file. Modelled on
# https://github.com/OneRedOak/claude-code-workflows, re-tailored for this repository.
#
# The determinism this file buys, in two sentences: tag mode creates the tracking comment
# BEFORE Claude runs, so a dead run leaves a visibly stuck comment instead of silence; and a
# prose prompt reviewed inline spawns no Task subagents, so the Action's known mid-turn
# session-end bug (anthropics/claude-code-action#1515, #1646) has nothing to kill.
#
# `use_sticky_comment` needs THREE preconditions, and the single-job layout is only the
# first. The action's lookup (create-initial.ts) claims the first comment from ANY Claude
# bot on the pull request, read through an unpaginated `issues.listComments` call:
#   1. a single review job -- parallel jobs race to claim and overwrite one tracking
#      comment (the brief three-job layout posted three comments per push instead, which is
#      why they were merged; split again and sticky must go);
#   2. no other Claude comment precedes ours -- `reusable-claude-mention.yaml` runs the
#      same action with the same identity, so a `@claude` answer posted before the first
#      review comment exists (e.g. on a DRAFT pull request, which the `if:` below skips)
#      is claimed and OVERWRITTEN by the first review run, surviving only in the comment's
#      edit history. The review commenting first on every non-draft PR is what usually
#      protects this;
#   3. the review's comment sits in the first page (30) of comments -- past that the
#      lookup misses it and sticky silently degrades to one comment per push.
# None of the three is fixable from this file; they are properties of the pinned action.
#
# A bare self-hosted runner selected through `runs_on` must be provisioned before this job
# passes -- and NOT with host Node: the Actions runner ships its own (`externals/node*`) and
# executes every JavaScript action with it, on self-hosted hosts too. What a minimal host
# lacks is what `anthropics/claude-code-action` shells OUT to. Every step of that composite
# declares `shell: bash`; `oven-sh/setup-bun` unpacks Bun through `@actions/tool-cache`,
# which resolves `unzip` and throws when it is absent; Bun installs into `$HOME/.bun/bin`,
# so `$HOME` must be writable; `bun install --production` then resolves the action's
# dependencies from the npm registry; and the checkout needs `git`. So: `bash`, `git` and
# `unzip` on `PATH`, a writable `$HOME`, and egress to `github.com`, `registry.npmjs.org`,
# `api.github.com` and `api.anthropic.com`. A missing one does not fail at job selection --
# it fails minutes in, inside the action, with an error that never names the runner.
jobs:
  claude-review:
    # A pull request opened by automation is not reviewed, because there is nothing here
    # for a reviewer to decide: `chore/bump-*` and `bump/*` move a version number and fold
    # the pending changelog fragments into CHANGELOG.md, the autoupdate prefix carries a
    # dependency bump whose whole content is a version this pipeline's own SCA and
    # supply-chain jobs judge on the same commit, and `dependabot/*` carries the same for
    # the action pins autoupdate deliberately will not touch (it skips SHA pins). All four
    # are generated wholesale by a tool and merged unread, so every review of one is a
    # full-diff Claude run spent on a diff nobody reads back.
    #
    # `basic-checks` already exempts exactly these four shapes from the changelog rule
    # (`github/global/stages/10-code-check/basic-checks/action.yaml`), which is why they
    # are spelled the same way here: a repository should not have to teach two jobs two
    # different names for the same automation.
    #
    # It is a job-level `if:` rather than a first step or a gate job for two reasons. A
    # skipped job costs no runner and no tokens, where a job that starts and decides has
    # already paid for the runner; and a gate job would add a SECOND consumer-visible
    # check name to every pull request, where this workflow deliberately publishes one.
    # (Not a `require-checks` concern: that script reads the check runs recorded against
    # a `main` or tag commit at deploy time, where a pull-request-only check never
    # appears at all.) The cost is the expression language:
    # `startsWith` takes one prefix and there is no way to iterate a list, so the two bump
    # shapes are literal and only the autoupdate prefix is an input -- the same split
    # `basic-checks` makes, for the same reason. A consumer that empties the input gets
    # its autoupdate pull requests reviewed rather than every pull request skipped, which
    # is what an unguarded `startsWith(ref, '')` would silently do.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
      && !startsWith(github.event.pull_request.head.ref, 'chore/bump-')
      && !startsWith(github.event.pull_request.head.ref, 'bump/')
      && !startsWith(github.event.pull_request.head.ref, 'dependabot/')
      && !(inputs.autoupdate_branch_prefix != ''
      && startsWith(github.event.pull_request.head.ref, inputs.autoupdate_branch_prefix))
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: 'read'
      pull-requests: 'write'
      issues: 'write'
      id-token: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 1

      - name: 'Run Claude Code Review'
        id: 'claude-review'
        # The provisioning list in the comment above `jobs:` (and README.md's "Claude Review
        # and Claude Mention" section) describes THIS pin's install chain. `dependency-updates.yaml`
        # exists to make this SHA move; re-read both when it does.
        uses: 'anthropics/claude-code-action@a60f3e1db3edbceed2b1e6c6a9d34c36b8a15eba' # v1.0.209
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tag mode: the prompt below is CONTEXT the action injects into its own template,
          # not a command it executes -- which is why it is prose, never a slash command
          # (a `/plugin:command` here loads and silently never runs; see the doc).
          track_progress: true
          # One comment per pull request, updated in place on every push -- see the header
          # comment for the three preconditions this rests on.
          use_sticky_comment: true
          # Post every inline comment IMMEDIATELY. The default (true) buffers any call not
          # carrying `confirmed: true` into /tmp/inline-comments-buffer.jsonl and replays it
          # after the session through a Haiku classifier -- a path with two open upstream
          # bugs (anthropics/claude-code-action#1667: one malformed buffer line discards
          # every buffered comment; #1679: "Posted 0/N" exits green) and whose purpose,
          # filtering test comments from SUBAGENTS, protects nothing here since the prompt
          # forbids subagents. Whether a finding becomes a thread must not depend on the
          # model remembering `confirmed: true`.
          classify_inline_comments: false
          # The complete BASH allowlist and the MCP-server selector -- `Read`/`Grep`/`Glob`
          # need no listing, every segment of a pipe must match, and the five text utilities
          # are the read-only ones (`sed`/`awk`/`find`/`sort`/`uniq` can write or execute).
          # Full semantics: `.docs/claude-review.md`.
          #
          # The prompt below RESTATES this list, and names the toolchains it deliberately
          # excludes, because the action's own template instructs the model to install
          # dependencies, run builds and then report the resulting denials as a permissions
          # problem. Keep the two in step when editing either: `make test-workflow-composition`
          # (Test 13) fails when a granted command is missing from the prompt, or when the
          # prompt calls a granted command denied.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh:*),Bash(git:*),Bash(grep:*),Bash(cat:*),Bash(wc:*),Bash(head:*),Bash(tail:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the principal-engineer reviewer for this repository, conducting ONE
            review that covers three dimensions: correctness, security, and software design.
            Your mandate is pragmatic quality -- determine whether the change definitively
            improves the codebase, and block only on what matters. Assume linters,
            formatters, type checkers and the test suite run as their own CI jobs; never
            report what they would catch.

            Do every pass yourself, sequentially, inside this session. Never dispatch
            background or parallel agents, and never end your turn while any work is
            pending: this session is not resumed, and anything unfinished when your turn
            ends is lost.

            Tools. This job hands you exactly: `Read`, `Grep`, `Glob` and `LS` over the
            checked-out tree; `Bash` restricted to `gh`, `git`, `grep`, `cat`, `wc`, `head`
            and `tail`, where every segment of a pipe must match, so `gh pr diff | sed ...`
            is refused as a whole; the inline-comment tool; and the tool that updates the
            tracking comment. Editing a file is possible and pointless -- this job never
            pushes, so the working tree dies with the runner. The CI tools are listed in the
            allowlist but their server is not installed without `actions: read`, which this
            job does not take, so you cannot read the pipeline's results either.

            Denied on purpose: every language toolchain and build entry point -- `go`,
            `node`, `npm`, `yarn`, `pnpm`, `python`, `pip`, `pdm`, `mvn`, `gradle`, `dart`,
            `flutter`, `dotnet`, `composer`, `bundle`, `terraform`, `terragrunt`, `docker`
            and `make` -- together with installing dependencies and every other binary. That
            is a decision, not a gap in your permissions. This repository's pipeline
            compiles, lints, type-checks, scans and tests the change in dedicated jobs that
            run on the same commit; they are the authority on whether it builds, they report
            on the pull request where the reader already sees them, and a partial second
            verdict from a review session would only contradict them at random.

            The action's instructions above will tell you to plan repository setup and
            linting/testing steps, and to report in your comment when a linter or test suite
            was denied by permissions so that the allowlist can be widened. Both are
            overridden here: plan no setup, install, build, lint or test step; run none of
            them to "verify" a finding; and if you run one anyway and it is denied, do not
            retry it and do not mention it. Never write a caveat, a "note on verification"
            or a limitations section about what you could not compile or run -- the
            permissions are deliberate, the reader did not choose them, and the note is
            noise in a review that is otherwise about the code.

            Review by reading: the diff, the files around it, the git history, and the
            contracts the repository documents for itself. A finding you could only
            establish by executing something is not a finding you can post -- read until it
            reaches >=80 confidence, or drop it in the tracking comment's dropped list like
            any other, with its score and reason.

            Scope: `gh pr diff` is the boundary of the review. A real problem on a line this
            pull request did not modify is out of scope -- leave it out, however tempting,
            and say nothing about files it did not change. Pre-existing issues are out of
            scope. Intentional behaviour changes that match the pull request's stated
            purpose are not findings.

            Run the review as six sequential passes -- the 4-agent pipeline, then security,
            then design:

            1. **CLAUDE.md compliance** -- audit the changes against the repository's
               CLAUDE.md and any CLAUDE.md in the changed directories. Flag only what those
               files call out explicitly; they guide code-writing, so not every instruction
               applies to review.
            2. **Bug scan** -- read the full diff and hunt real defects in the changed
               lines: logic errors, broken edge cases, race conditions, error paths that
               swallow or mis-handle failures. Large bugs only; no nitpicks.
            3. **Git history** -- use `git log` and `git blame` on the modified files to
               catch regressions of earlier fixes and changes that contradict the recorded
               intent.
            4. **Code-comment adherence** -- verify the change honours the constraints and
               warnings documented in the comments of the files it modifies.
            5. **Security** -- examine what the diff newly introduces across: injection
               (SQL/NoSQL, command, template, path traversal), authentication and
               authorization flaws, hardcoded or leaking secrets (argv, logs, published
               artifacts), weak or disabled crypto, unsafe deserialization or eval-like
               execution, downloaded code executed without pinning and checksum
               verification, and sensitive-data exposure. Report only what is exploitable
               in practice; do NOT report denial-of-service or rate-limiting issues. An
               issue only exploitable from the local network can still be HIGH severity.
            6. **Design** -- judge the change against the repository's established
               architecture and patterns: does it fit them or fork a second way of doing
               something the repository already does one way; single responsibility without
               unnecessary abstraction; coherent, consistently named, backward-compatible
               public contracts (a breaking change must be flagged as such and follow the
               repository's breaking-change conventions); naming and documentation that
               match the repository's vocabulary. Net positive over perfection; prefix
               minor, optional polish with "Nit:".

            Then apply the >=80 confidence filter to EVERY candidate finding from EVERY
            pass -- correctness, security and design alike, no exceptions. Score each
            candidate 0-100: 0 = does not survive scrutiny, or is pre-existing; 25 =
            plausible but unverified; 50 = real but minor or unlikely to matter in practice;
            75 = verified and likely hit in practice, or explicitly required by CLAUDE.md;
            100 = certain and frequent. Report only findings scoring >=80, each labeled with
            its dimension (bug / security / design) and its score.

            Post ONE review per run -- never end silently; a silent run is indistinguishable
            from a crashed one.

            EVERY finding that survives the filter MUST be posted as its own inline comment
            thread, anchored to the exact file and line it is about, using the inline
            comment tool -- one thread per finding, no exceptions, so each can be discussed
            and resolved independently. Begin each thread's body with
            `**<dimension> (confidence <score>)**` -- for example `**bug (confidence 85)**`
            -- followed by the finding, the concrete failure or exploitation scenario, and
            the minimal fix. Only a finding with no single anchorable line (a
            repository-wide or cross-file concern) may live in the tracking comment
            instead.

            The tracking comment carries everything else. Open it with two or three
            sentences on what you understood this pull request to change and why, so a
            reader can tell the diff was read. Then: a one-line index of the inline threads
            you posted; what you checked and found clean, per dimension; and every finding
            you raised and then dropped -- one line each with its score and the reason. A
            rejected finding is evidence the filter ran; an omitted one is
            indistinguishable from a check that never happened.

            If you already reviewed this pull request (your earlier review is the comment
            this run updates -- read it back with `gh pr view --comments` before writing),
            do not review it again from scratch: verify each of your previous findings --
            addressed, not addressed, or declined by the author -- keep the dropped-findings
            history, and add nothing new.
          show_full_output: true
          display_report: true
        env:
          # Pins the model without touching `claude_args`: parse-sdk-options.ts resolves
          # `model: options.model || modelFromClaudeArgs`, so this wins and the allowlist
          # stays purely about tools. Without it the CLI default resolves to Sonnet in CI.
          ANTHROPIC_MODEL: 'claude-opus-5'
