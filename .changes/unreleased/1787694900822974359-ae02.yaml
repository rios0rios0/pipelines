kind: 'Fixed'
body: 'fixed `global/scripts/shared/changelog-check.sh` rejecting a legitimate chlog branch. The three platform templates have branched on `.chlog.yaml` since chlog support landed -- an ordinary branch must add a fragment under `.changes/unreleased/`, a `bump/*` / `chore/bump-*` branch must instead carry the merged `CHANGELOG.md` -- but the standalone script that `README.md`, `CLAUDE.md` and `copilot-instructions.md` all name as THE shared changelog validator never learned any of it. It hard-required `CHANGELOG.md` itself to have been modified, so it failed a fragment-only branch that every platform template passes: a second, divergent implementation of one rule, which is a defect this repository has already paid for once with the GitLab inline Dependency-Track upload. No consumer was broken, because the templates are what actually run. The script now mirrors them exactly and says so at the top, together with WHY it is a copy rather than the one implementation: `quality:basic-checks` runs in a minimal image holding only the consumer repository -- `alpine/git` on GitLab, `checkout: self` on Azure DevOps -- and none of the three jobs bootstraps `.scripts-repo`, so routing them here would add a clone of this repository to every merge-request build. It also takes an optional source-branch argument, since the bump-branch flip cannot be read off the detached HEAD a CI checkout leaves behind'
time: '2026-08-25T21:55:00.82291895Z'
