kind: 'Added'
body: 'added a supply-chain security policy to the `Dependency Updates` pull request: every release a pin could move to, and the version in use, is checked against OSV.dev (GitHub reviewed and malware advisories, the OpenSSF malicious-packages feed, the Go vulnerability database, PyPA, RubySec). A release that introduces a known vulnerability is skipped for the newest older one that does not, a known malicious release is never proposed, a pin in use with a known vulnerability gets its fix proposed at once as a `fix(deps)` pull request with the cooldown waived and keeps the run red until it is merged, and every other release waits out a seven-day cooldown. GitHub Actions advisories are evaluated locally because OSV cannot order action versions, every binary in `pinned-versions.sh` names its advisory source with `# osv:` (or `# osv: none`), and an acceptance in `.dependency-updates.json` needs a reason and an expiry date and never covers a malicious package'
