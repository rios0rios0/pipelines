kind: 'Fixed'
body: 'fixed merge/pull-request builds creating projects. `(name, version)` IS a project''s identity, so a pull request whose version file is already bumped mints that version''s project **before** the merge — and keeps it if the merge never happens. This is the single largest contributor to portfolio sprawl: one consuming instance reached **2585 projects across 77 distinct names**, one application accounting for 355 of them. The gate lives in the shared script rather than in each platform''s YAML, so a consumer pinned to an older template revision gets it too, and so `make test-dependency-track` can exercise it offline. Only a POSITIVELY identified pull request is skipped — a branch build that cannot be classified still uploads, because "I could not tell" must not silently mean "nothing was recorded"'
