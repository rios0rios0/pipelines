name: 'Claude Mention'

on:
  workflow_call:
    inputs:
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: |
          JSON array of runner labels (e.g. '["self-hosted"]'); see the `runs_on` input in
          go.yaml for the shape's rationale, and the comment above `jobs:` for what this
          workflow in particular puts on the runner it names.
      allow_fork_pull_requests:
        type: 'boolean'
        required: false
        default: false
        description: |
          Answer `@claude` on pull requests opened from forks. Off by default: the action checks
          the fork's branch out in a job holding `contents: write` and this repository's secrets,
          and restores only a fixed list of paths from the base branch first, so the fork's
          `AGENTS.md` (which the restored `CLAUDE.md` imports) and any nested `CLAUDE.md` become
          the instructions Claude follows. Read the comment above `jobs:` before turning it on.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: 'OAuth token used by the Claude Code action'

# A bare self-hosted runner selected through `runs_on` must be provisioned before these jobs pass
# -- and NOT with host Node: the Actions runner ships its own (`externals/node*`) and executes
# every JavaScript action with it, on self-hosted hosts too. What a minimal host lacks is what
# `anthropics/claude-code-action` shells OUT to. Every step of that composite declares
# `shell: bash`; `oven-sh/setup-bun` unpacks Bun through `@actions/tool-cache`, which resolves
# `unzip` and throws when it is absent; Bun installs into `$HOME/.bun/bin`, so `$HOME` must be
# writable; `bun install --production` then resolves the action's dependencies from the npm
# registry; and the checkout -- plus the PR branch tag mode fetches below -- needs `git`; the fork
# check below needs `gh`. So: `bash`, `git`, `gh` and `unzip` on `PATH`, a writable `$HOME`, and
# egress to `github.com`, `registry.npmjs.org`, `api.github.com` and `api.anthropic.com`. A missing
# one does not fail at job selection -- it fails minutes in, inside the action, with an error that
# never names the runner (a missing `gh` instead fails the fork check on every pull request).
#
# A pull request opened from a FORK is refused unless the caller sets `allow_fork_pull_requests`,
# for the reason `reusable-claude-review.yaml` carries its same-repository guard. Two independent
# things keep an outside contributor from STARTING this job: the `if:` below admits only an OWNER,
# MEMBER or COLLABORATOR, reading the association of whoever wrote the text it matched on (see the
# note there -- the third clause needed a guard to make that true), and the action re-checks the
# actor's write permission itself. Neither stops a maintainer's `@claude` on a fork's pull request
# from running under the FORK's instructions. That run holds `contents: write` and this
# repository's secrets, and tag mode fetches `refs/pull/<n>/head` and checks the fork's branch out
# inside the action's own step (`src/github/operations/branch.ts`) -- after every step of this job,
# so no step here can restore anything over it. The action then restores a fixed `SENSITIVE_PATHS`
# list from the base branch (`src/github/operations/restore-config.ts`): `.claude`, `.mcp.json`,
# `.claude.json`, `.gitmodules`, `.ripgreprc`, `CLAUDE.md`, `CLAUDE.local.md` and `.husky`, and
# nothing else. `AGENTS.md` is not in it, and in the `AGENTS.md` layout the restored `CLAUDE.md` is
# the one line `@AGENTS.md`, which the CLI resolves against the working tree -- so the fork's
# `AGENTS.md` IS the project instructions, and the action's own template tells the model to follow
# them. Nested `CLAUDE.md` files were never covered either, and the CLI loads a root `AGENTS.md` by
# itself wherever the base has no `CLAUDE.md`. The action takes no extra paths
# (anthropics/claude-code-action#1696), so the check runs before anything of the fork's reaches the
# runner. It reads `isCrossRepository`, the field tag mode itself branches on, because an
# `issue_comment` payload names no head repository; the field is fixed when the pull request opens,
# so a push between the check and the action's fetch cannot change the answer. Pull requests from
# this repository's own branches are answered as before -- their authors can already push here.
# What does hold for every pull request: only the ROOT `CLAUDE.md` comes from the base branch, so a
# pull request that edits `AGENTS.md` or a nested `CLAUDE.md` is answered, and reviewed, under the
# instructions it changes.
jobs:
  claude:
    # Each clause admits ONE event shape and reads the association of whoever wrote the text it
    # matched on. The third clause's `github.event.comment == null` is what keeps that true and
    # must not be "simplified" away: an `issue_comment` payload carries BOTH `comment` and
    # `issue`, so without it the third clause also evaluates on every comment -- and it consults
    # `github.event.issue.author_association`, the THREAD AUTHOR's. Any comment by anyone on a
    # maintainer-opened thread whose body or title says `@claude` would then start this job. The
    # action re-checks the actor's write permission and refuses to act, so it is not an
    # escalation, but the job still starts on the runner -- which on a self-hosted host is the
    # whole exposure this workflow's comment above is about.
    if: |
      (github.event.comment != null &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event.review != null &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event.issue != null && github.event.comment == null &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: 'write'
      pull-requests: 'write'
      issues: 'write'
      id-token: 'write'
      actions: 'read'
    steps:
      # The fork check described above `jobs:`. Only an explicit `false` starts Claude: `true`
      # refuses, and anything else -- an API error, a missing `gh`, a pull request the query
      # cannot see -- fails this step, so the check fails closed AND visibly. The refusal is
      # posted where the mention was, because a silent run reads as a crashed one; on a fork's
      # review event the token is read-only, so there it degrades to a warning.
      - name: 'Refuse pull requests from forks'
        id: 'trust'
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_FORKS: ${{ inputs.allow_fork_pull_requests }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          REPOSITORY: ${{ github.repository }}
          # GraphQL variables, not shell ones: kept out of the script so nothing there is a
          # single-quoted `$` that reads like a missed expansion.
          QUERY: 'query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { isCrossRepository } } }'
          REFUSAL: 'Claude does not run on pull requests opened from a fork here: the action checks out the branch of the fork in a job that holds write access and the secrets of this repository, and an `AGENTS.md` or nested `CLAUDE.md` on that branch would become the instructions it follows. Push the branch to this repository to ask again.'
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER}" ] || [ "${ALLOW_FORKS}" = 'true' ]; then
            echo 'answer=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          cross="$(gh api graphql -f owner="${REPOSITORY%%/*}" -f name="${REPOSITORY#*/}" \
            -F number="${PR_NUMBER}" -f query="${QUERY}" \
            --jq '.data.repository.pullRequest.isCrossRepository' 2>/dev/null)" || cross='unknown'
          if [ "${cross}" = 'false' ]; then
            echo 'answer=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'answer=false' >> "${GITHUB_OUTPUT}"
          if [ "${cross}" != 'true' ]; then
            echo "::error::could not tell whether #${PR_NUMBER} comes from a fork (isCrossRepository=${cross}); Claude was not started"
            exit 1
          fi
          echo "::notice::#${PR_NUMBER} is a pull request from a fork; Claude was not started"
          gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${REFUSAL}" >/dev/null \
            || echo '::warning::the refusal could not be posted (a fork pull request event gets a read-only token)'

      - name: 'Checkout repository'
        if: steps.trust.outputs.answer == 'true'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 1

      - name: 'Run Claude Code'
        if: steps.trust.outputs.answer == 'true'
        id: 'claude'
        # The provisioning list in the comment above `jobs:` (and README.md's "Claude Review and
        # Claude Mention" section) describes THIS pin's install chain -- `oven-sh/setup-bun`,
        # `@actions/tool-cache` resolving `unzip`, `$HOME/.bun/bin`, `bun install --production`.
        # `dependency-updates.yaml` exists to make this SHA move; re-read both when it does.
        uses: 'anthropics/claude-code-action@34968b5981d5d170904281aa3df6f3c0d4a28855' # v1.0.249
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # `track_progress` and `prompt` are added and removed TOGETHER, and neither is
          # cosmetic. Tag mode is what makes this a mention responder at all: the action's own
          # template answers the `@claude` that triggered it, and a `prompt:` is appended to
          # that template as <custom_instructions>. But a `prompt:` on a comment or issue event
          # is ALSO what selects agent mode (`src/modes/detector.ts`), where the template is
          # replaced by these instructions and the question being answered is lost -- the same
          # mode trap `.docs/claude-review.md` records for the review, in the other direction.
          # `track_progress: true` forces tag mode back.
          #
          # Its price is an event constraint worth knowing before wiring this to anything else:
          # `validateTrackProgressEvent` accepts `pull_request`, `issues`, `issue_comment`,
          # `pull_request_review_comment` and `pull_request_review`, and THROWS on every other
          # event. Those five are what the documented caller subscribes to (README.md); an
          # exotic event that still satisfies the `if:` above -- `commit_comment` and
          # `discussion_comment` payloads also carry a `comment` object -- now fails loudly
          # instead of reaching an action that would not have answered it anyway.
          track_progress: true
          # No `claude_args`, so the tool surface is exactly what tag mode grants: the four
          # write-side git commands, `Read`/`Grep`/`Glob`/`LS`, the comment tool, and the CI
          # tools that `actions: read` above installs. It is deliberately NOT widened to the
          # review's read-only `gh`/`git`/text helpers: this job holds `contents: write` and
          # checks out a fork's branch, so every command added here is added on that side of
          # the boundary the header comment describes. The prompt below states that surface
          # rather than leaving the model to discover it by denial -- the action's template
          # tells it to install dependencies and run builds, then to report the denials as a
          # permissions problem to be fixed by widening the allowlist.
          prompt: |
            Tools. Your Bash surface here is only what the action grants for committing --
            `git add`, `git commit`, `git rm` and the action's push wrapper. Everything you
            read comes from `Read`, `Grep`, `Glob` and `LS` over the checked-out tree, plus
            whatever the context above already carries -- on a pull request, that includes the
            changed-file list. `gh` is not granted, and neither is `git diff`, `git log` or
            `git status`, so do not reach for them. On a pull request you can also read the
            pipeline's own results with the CI tools
            (`mcp__github_ci__get_ci_status`, `mcp__github_ci__get_workflow_run_details`,
            `mcp__github_ci__download_job_log`).

            Denied on purpose: every language toolchain and build entry point -- `go`, `node`,
            `npm`, `yarn`, `pnpm`, `python`, `pip`, `pdm`, `mvn`, `gradle`, `dart`, `flutter`,
            `dotnet`, `composer`, `bundle`, `terraform`, `terragrunt`, `docker` and `make` --
            together with installing dependencies and every other binary. That is a decision,
            not a gap in your permissions: the repository's pipeline compiles, lints,
            type-checks, scans and tests every push in dedicated jobs, and those jobs -- whose
            results you can read but must not try to replace -- are the authority on whether a
            change builds.

            The action's instructions above will tell you to plan repository setup and
            linting/testing steps, and to report in your comment when a linter or test suite
            was denied by permissions so that the allowlist can be widened. Both are
            overridden here: plan no setup, install, build, lint or test step; run none of them
            to check your own work; if you run one anyway and it is denied, do not retry it and
            do not mention it; and never ask for the allowlist to be widened. Never write a
            caveat, a "note on verification" or a limitations section about what you could not
            compile or run -- the permissions are deliberate, whoever asked did not choose
            them, and the note is noise in an answer that is otherwise about the code. When you do
            change something: commit it, push it, and say what you changed -- the pipeline
            reports whether it builds, on the same pull request, without you claiming either
            way.
        env:
          # Sets the model without touching `claude_args`: parse-sdk-options.ts resolves
          # `model: options.model || modelFromClaudeArgs`, where `options.model` is this
          # variable -- so it wins over `--model` and leaves the tool wiring alone.
          ANTHROPIC_MODEL: 'claude-opus-5-5'
