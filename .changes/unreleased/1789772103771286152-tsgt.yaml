kind: 'Added'
body: 'added `.github/tests/test-sast-gate.sh` and the `make test-sast-gate` target, which assert the property the SAST targets exist for: that they can fail. It runs the real `makefiles/` against stub tool runners with scripted exit codes and checks that each target propagates its runner''s code (including the 123 `xargs` reports for a ShellCheck finding and the 143 of a terminated Semgrep), that `sast` still runs every tool after one has already failed, that it then exits non-zero naming them, that the CodeQL skip stays a skip rather than a failure, that a language fragment''s `SAST_TOOLS_EXTRA` joins the same suite in either include order, that including a fragment emits no "overriding recipe" warning, that `make -n sast` still prints each tool''s real command, and that no recipe reintroduces `-` or `|| true`. The "overriding recipe" check carries a positive control, because exactly one fragment shape emits that warning and it is not the one a reader expects: a prerequisite-only `sast: sca` is silently appended and a `SAST_TOOLS_EXTRA +=` line is silently read, so only a second `sast` RECIPE -- which replaces the whole run-everything-then-report loop -- warns, in either include order. Verified in both directions -- 46 assertions pass against the fix and 22 fail against the code it replaces'
time: '2026-09-18T22:55:03.771293000Z'
