kind: 'Security'
body: '**checksum-verified every binary these pipelines download and execute.** Nothing verified anything before: `gitleaks`, `shellcheck`, `hadolint`, the CodeQL bundle, `flyctl`, `osv-scanner`, `golangci-lint`, ProGuard, `tflint`, `terragrunt`, `stoml`, the GoReleaser `.deb` and the terra CLI were all fetched and run unverified, most of them at whatever version `releases/latest` resolved to that morning. Whoever could answer the request -- upstream, their CDN, or a proxy on the runner''s egress path -- chose the bytes that then executed with the job''s credentials, which on the SAST jobs includes a token that can write to the repository being scanned. Versions and SHA-256 digests now live in `global/scripts/shared/pinned-versions.sh`, and `verify-download.sh` deletes and refuses anything that does not match rather than merely reporting it'
time: '2026-08-25T21:32:41.522856293Z'
