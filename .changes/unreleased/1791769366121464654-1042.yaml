kind: 'Fixed'
body: 'fixed the Go pipelines letting a failed check pass the run. `.github/workflows/go.yaml` gave `style:golangci-lint`, `sast:hadolint` and `sca:govulncheck` a job-level `continue-on-error`, which concludes the run as passed whatever the job does, so a red check blocked nothing: a consumer''s golangci-lint stayed red on its default branch for about seven hours, every run green, while no linter actually ran. All three now fail the run and skip the stages after them. The twins follow: GitLab CI''s `style:golangci-lint` and `sca:govulncheck` lost `allow_failure`, and Azure DevOps'' `sca_govulncheck` lost its job-level `continueOnError`. Azure DevOps'' lint already blocked, and its shared SAST templates, Hadolint among them, stay advisory for every toolchain. A refused report upload is still tolerated, at the upload step. golangci-lint''s timeout went from a fixed `10m` to a `30m` default that `GOLANGCI_LINT_TIMEOUT` overrides, because a clean analysis outran `10m` on a busy self-hosted host, and exit code 4 now says the time ran out rather than that something was found. `make test-workflow-composition` gained Test 16. It fails on any code-check or security job that is advisory without being listed with its reason, in the GitHub workflows and in the Go pipeline''s GitLab CI and Azure DevOps twins. It also pins the 30 jobs of other toolchains that were advisory before the rule, so that list can only shrink. **BREAKING CHANGE:** a Go pipeline whose golangci-lint or govulncheck fails today now fails and skips every later stage, instead of passing; so does one whose Hadolint fails, on GitHub Actions'
breaking: true
