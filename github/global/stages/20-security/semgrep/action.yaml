inputs:
  semgrep_lang:
    required: true
    description: 'Semgrep language to be used as default source'
  pre_script:
    required: false
    default: ''
    description: 'Shell commands run before Semgrep. Useful for configuring SSH so the Terraform parser can clone private modules referenced via `source = "git@..."`.'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: 'Get Scripts'
      # Keep the executable scripts on the same exact commit as this composite.
      # `$/` is GitHub's self-repository reference; it does not resolve a branch.
      uses: '$/github/global/abstracts/scripts-repo'

    - name: 'Pre-steps'
      if: "inputs.pre_script != ''"
      shell: 'bash'
      env:
        PRE_SCRIPT: ${{ inputs.pre_script }}
      run: eval "$PRE_SCRIPT"

    - name: 'Execute'
      shell: 'bash'
      run: $SCRIPTS_DIR/global/scripts/tools/semgrep/run.sh "${{ inputs.semgrep_lang }}"

    # The upload below is `continue-on-error`, so it cannot be what fails a scan that exited 0
    # without writing its report. This step keeps that failure.
    - name: 'Verify Report'
      shell: 'bash'
      env:
        REPORT_DIR: 'build/reports/semgrep'
      run: |
        if [ -z "$(find "$REPORT_DIR" -type f -print -quit 2> /dev/null)" ]; then
          echo "::error::The scan exited 0 without writing a report to $REPORT_DIR/"
          exit 1
        fi

    - name: 'Upload Report'
      uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
      with:
        name: 'semgrep'
        path: 'build/reports/semgrep/'
        if-no-files-found: 'warn'
        overwrite: 'true'
        retention-days: 10
      if: always()
      # A refused upload (e.g. `Artifact storage quota has been hit`) must not fail the job:
      # the report is evidence, and the step above already decided pass or fail.
      continue-on-error: true
