kind: 'Fixed'
body: 'analysed every language on GitLab CI, where CodeQL had analysed none: the shared `sast:codeql` ran in the pipeline''s default Alpine image, which has no `curl` (BusyBox `wget` rejects `--https-only`, so the bundle never downloaded) and cannot start the bundle''s glibc Java runtime; it now runs in the pinned `python:3.13-slim` by default, where Python is analysed, JavaScript installs Node.js there for TypeScript, Gradle runs in `gradle:8.7.0-jdk21`, Maven in `maven:3.8.8-eclipse-temurin-11` (the JavaScript and Maven images are Debian 11, whose packages no longer install) and C# in `.sdk` without building (`CODEQL_BUILD_MODE: ''none''`, since the Linux autobuilder cannot build the .NET Framework projects those pipelines serve); also made the Maven template load at all (it included files that never existed), pointed the job''s report at the per-tool directory `run.sh` writes into, made `run.sh` recreate that directory after the build, because the Java autobuilder''s Gradle `clean` deleted it and the analysis ended in `Could not write SARIF file`, gave the Azure DevOps Python, JavaScript, Java and C# CodeQL jobs the toolchain their other jobs set up, and set up Node.js in the GitHub Actions CodeQL action for a JavaScript analysis on a self-hosted runner'
time: '2026-10-29T22:06:07.718931709Z'
