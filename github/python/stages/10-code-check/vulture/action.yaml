inputs:
  python_version:
    required: false
    default: '3.13'
    description: 'Python version to use'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: 'Setup Python'
      uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' # v7.0.0
      with:
        python-version: '${{ inputs.python_version }}'

    - name: 'Install PDM and dependencies'
      run: |
        python -m pip install --only-binary :all: "pdm==2.29.0"
        pdm install -v
      shell: 'bash'

    - uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    - run: $SCRIPTS_DIR/global/scripts/languages/python/vulture/run.sh
      shell: 'bash'

    # The upload below is `continue-on-error`, so it cannot be what fails a scan that exited 0
    # without writing its report. This step keeps that failure.
    - name: 'Verify Report'
      shell: 'bash'
      env:
        REPORT_DIR: 'build/reports/vulture'
      run: |
        if [ -z "$(find "$REPORT_DIR" -type f -print -quit 2> /dev/null)" ]; then
          echo "::error::The scan exited 0 without writing a report to $REPORT_DIR/"
          exit 1
        fi

    - name: 'Upload Report'
      uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
      with:
        name: 'vulture'
        path: 'build/reports/vulture/'
        if-no-files-found: 'warn'
        overwrite: 'true'
        retention-days: 10
      if: always()
      # A refused upload (e.g. `Artifact storage quota has been hit`) must not fail the job:
      # the report is evidence, and the step above already decided pass or fail.
      continue-on-error: true
