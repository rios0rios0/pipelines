# see the bottom of the file for more information¹
# the parent workflow is responsible for setting up the call events²
on:
  workflow_call:
    inputs:
      install_run_scripts:
        type: 'boolean'
        required: false
        default: false
        description: |
          Run dependency lifecycle scripts (`postinstall`, `prepare`) after installing.
          Installs are `--ignore-scripts` by default: `npm ci` / `yarn install` otherwise
          execute arbitrary code from every package in the transitive tree, as the CI user,
          before any of this project's own code runs. Set this to `true` for projects that
          genuinely need them -- native module builds, `prisma generate`, Playwright browser
          downloads, `husky` -- and the scripts run through `rebuild` afterwards instead.
      sonar_host:
        description: 'SonarQube/SonarCloud host URL (leave empty to skip SonarQube)'
        required: false
        type: string
        default: ''
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: |
          JSON array of runner labels (e.g. '["self-hosted"]'). `runs-on` is a hard selector --
          GitHub matches it against the runner labels and never substitutes, so there is no
          fallback to a self-hosted runner when the hosted minutes are exhausted. A JSON array
          rather than a plain string because a reusable-workflow input cannot be typed as a
          list, and multi-label runners need more than one value.
      codeql_upload:
        type: 'string'
        required: false
        default: 'always'
        description: |
          Whether CodeQL uploads its SARIF to code scanning ('always', 'failure-only' or
          'never'). Uploading requires code scanning to be enabled, which on a private
          repository means GitHub Advanced Security; without it the analysis still succeeds and
          only the upload fails, taking the whole job down with it.
      build_env:
        type: 'string'
        required: false
        default: ''
        description: |
          Dotenv-style lines (KEY=value, one per line) exported before the build and test steps.
          A bundler that refuses to build without an API URL -- rather than silently falling
          back to localhost, deploying, looking fine and having every request refused -- needs
          a value here for CI to pass. The value is a placeholder: these jobs only prove the
          bundle compiles and never publish it.
      e2e_typecheck:
        type: 'boolean'
        required: false
        default: false
        description: |
          Run `yarn e2e:typecheck`. End-to-end specs usually sit outside the root
          `tsconfig.json`, so `yarn build` never type-checks them and a spec can rot --
          renamed selector, changed fixture signature -- until someone runs the browser suite by
          hand. This is a type-check only: it starts no browser, no API and no database.
      node_version:
        type: 'string'
        required: false
        default: '20'
        description: |
          Node.js version handed to `actions/setup-node`. The default is the version every job
          here hardcoded before this input existed, so leaving it unset changes nothing -- but
          Node 20 reached end of life on 30 April 2026, so a consumer on the default is building
          on an unsupported runtime and should name a supported major.
    secrets:
      sonar_token:
        description: 'SonarQube authentication token'
        required: false

# Corepack is what turns `packageManager: yarn@4.x` into a usable `yarn`, and it is enabled
# BEFORE `actions/setup-node` because that action probes `yarn --version` to decide which cache
# layout to restore. Node 25 dropped the bundled Corepack, so `corepack enable` is simply a
# command-not-found there and the job dies on its second step -- which is what a consumer would
# hit the moment they pointed `node_version` at a supported major. It is installed only when it
# is genuinely absent: on the versions that still bundle it, npm refuses to overwrite the shim
# it did not install and fails with `EEXIST`, so an unconditional install would break exactly
# the consumers this is meant to leave alone. `0.34.7` is the last release whose engines span
# Node 20 through 26; `0.35.0` covers neither the 20 defaulted to here nor the 25 that needs it.
# The shims are written to `$RUNNER_TEMP` rather than where `corepack enable` puts them by
# default, which is next to the Node binary -- on a self-hosted runner that is a system path the
# runner user does not own, so the step dies with `Internal Error: EACCES: permission denied,
# symlink '../share/nodejs/corepack/dist/pnpm.js' -> '/usr/bin/pnpm'`. The guard above is what
# lets it get that far: Corepack is present system-wide there, so the install is skipped and the
# enable is left to fail on its own. That directory is appended to `$GITHUB_PATH`, which is what
# keeps the shim visible to `actions/setup-node` and every step after it. Only `yarn` is named
# because the default enables `npm`, `pnpm` and `yarn`, and the shim that failed above is one
# nothing here ever calls.
#
# `mktemp -d` rather than a fixed `$RUNNER_TEMP/corepack`, and the random name is the whole point.
# `$RUNNER_TEMP` is `_work/_temp` on the runner, shared by every job that lands on it, and a
# CONTAINER job writes there as **root** through the same bind mount -- so a fixed name is a fixed
# collision.
#
# The shim a container job leaves behind points at the corepack inside THAT image
# (`../../../__t/node/...`), which resolves to nothing on the host, and the runner cannot wipe
# `_temp` at the next job's start because the files are root-owned and it runs as the runner user.
# corepack then probes the leftover with `fs.existsSync`, which FOLLOWS symlinks and answers false
# for a dangling one, so it skips its own unlink and calls `symlink()` on a path that is already
# there:
#
#     Internal Error: EEXIST: file already exists, symlink
#     '../../../../../../usr/share/nodejs/corepack/dist/yarn.js'
#         -> '/home/.../actions-runner/_work/_temp/corepack/yarn'
#
# Every job that reached this step on that runner failed there until somebody deleted the
# directory by hand. A fresh `mktemp -d` is owned by whoever runs it and cannot inherit a previous
# job's leftover, in a container or out of one -- and it replaces the `mkdir -p` this used to
# need, because `--install-directory` is resolved with `realpath` and does not create what it is
# given.
jobs:
  # first stage
  code_check-basic_checks:
    name: 'code-check > quality:basic-checks'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/10-code-check/basic-checks@main'
        with:
          target_branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
    if: "github.event_name == 'pull_request'"

  code_check-style_eslint:
    name: 'code-check > style:eslint'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Enable Corepack'
        run: |
          command -v corepack > /dev/null 2>&1 || npm i -g --ignore-scripts corepack@0.34.7
          corepack_dir="$(mktemp -d "$RUNNER_TEMP/corepack.XXXXXX")"
          corepack enable --install-directory "$corepack_dir" yarn
          echo "$corepack_dir" >> "$GITHUB_PATH"
        shell: 'bash'

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version: '${{ inputs.node_version }}'
          cache: 'yarn'

      - run: |
          # `--mode=skip-build`: Yarn 2+ enables lifecycle scripts by default, so a plain
          # install executes arbitrary code from the whole transitive tree as the CI user.
          # Projects that need them set `install_run_scripts: true` and get `yarn rebuild`.
          yarn install --immutable --mode=skip-build
          if [ "$INSTALL_RUN_SCRIPTS" = 'true' ]; then
            yarn rebuild
          fi
          yarn lint:ci
        shell: 'bash'
        env:
          INSTALL_RUN_SCRIPTS: '${{ inputs.install_run_scripts }}'
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  # BLOCKING, unlike its `style:eslint` sibling above, and the difference is
  # deliberate. `eslint-config-prettier` -- which almost every JavaScript project
  # installs -- switches OFF every ESLint rule that overlaps with Prettier, so
  # `style:eslint` is already silent about formatting by design. Without this job
  # nothing checks it at all: the two halves cancel out, and a repository can hold
  # a committed `.prettierrc`, a curated `.prettierignore`, hundreds of unformatted
  # files and a green pipeline at the same time. That is not a gate with a gap; it is no
  # gate. `continue-on-error` here would recreate it.
  #
  # A project that does not use Prettier is SKIPPED, not failed -- see the runner.
  code_check-style_format:
    name: 'code-check > style:format'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/javascript/stages/10-code-check/format@main'
        with:
          package_manager: 'yarn'
          node_version: '${{ inputs.node_version }}'
          install_run_scripts: '${{ inputs.install_run_scripts }}'
    if: "!startsWith(github.ref, 'refs/tags/')"


  code_check-quality_knip:
    name: 'code-check > quality:knip'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/javascript/stages/10-code-check/knip@main'
        with:
          package_manager: 'yarn'
          install_run_scripts: '${{ inputs.install_run_scripts }}'
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  # second stage
  security-sast_codeql:
    name: 'security > sast:codeql'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/codeql@main'
        with:
          codeql_language: 'javascript-typescript'
          upload: '${{ inputs.codeql_upload }}'
    needs: [ 'code_check-style_eslint', 'code_check-style_format', 'code_check-quality_knip' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_semgrep:
    name: 'security > sast:semgrep'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      # `$/` resolves this action from the exact commit of this reusable workflow.
      # A consumer pinning yarn.yaml therefore pins the Semgrep composite as well.
      - uses: '$/github/global/stages/20-security/semgrep'
        with:
          semgrep_lang: 'javascript'
    needs: [ 'code_check-style_eslint', 'code_check-style_format', 'code_check-quality_knip' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_gitleaks:
    name: 'security > sast:gitleaks'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/gitleaks@main'
    needs: [ 'code_check-style_eslint', 'code_check-style_format', 'code_check-quality_knip' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_hadolint:
    name: 'security > sast:hadolint'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/hadolint@main'
    needs: [ 'code_check-style_eslint', 'code_check-style_format', 'code_check-quality_knip' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sca_yarn_audit:
    name: 'security > sca:yarn-audit'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Enable Corepack'
        run: |
          command -v corepack > /dev/null 2>&1 || npm i -g --ignore-scripts corepack@0.34.7
          corepack_dir="$(mktemp -d "$RUNNER_TEMP/corepack.XXXXXX")"
          corepack enable --install-directory "$corepack_dir" yarn
          echo "$corepack_dir" >> "$GITHUB_PATH"
        shell: 'bash'

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version: '${{ inputs.node_version }}'
          cache: 'yarn'

      - run: 'yarn npm audit --recursive --severity high'
        shell: 'bash'
    needs: [ 'code_check-style_eslint', 'code_check-style_format', 'code_check-quality_knip' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  # third stage
  tests-test_all:
    name: 'tests > test:all'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Enable Corepack'
        run: |
          command -v corepack > /dev/null 2>&1 || npm i -g --ignore-scripts corepack@0.34.7
          corepack_dir="$(mktemp -d "$RUNNER_TEMP/corepack.XXXXXX")"
          corepack enable --install-directory "$corepack_dir" yarn
          echo "$corepack_dir" >> "$GITHUB_PATH"
        shell: 'bash'

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version: '${{ inputs.node_version }}'
          cache: 'yarn'

      - name: 'Export the build environment'
        if: "inputs.build_env != ''"
        run: 'printf ''%s\n'' "$BUILD_ENV" >> "$GITHUB_ENV"'
        shell: 'bash'
        env:
          BUILD_ENV: '${{ inputs.build_env }}'

      - run: |
          # `--mode=skip-build`: Yarn 2+ enables lifecycle scripts by default, so a plain
          # install executes arbitrary code from the whole transitive tree as the CI user.
          # Projects that need them set `install_run_scripts: true` and get `yarn rebuild`.
          yarn install --immutable --mode=skip-build
          if [ "$INSTALL_RUN_SCRIPTS" = 'true' ]; then
            yarn rebuild
          fi
          yarn test:ci
        shell: 'bash'
        env:
          INSTALL_RUN_SCRIPTS: '${{ inputs.install_run_scripts }}'

      - name: 'Type check the end-to-end specs'
        if: 'inputs.e2e_typecheck'
        run: 'yarn e2e:typecheck'
        shell: 'bash'

      - name: 'Coverage Report'
        if: "always() && hashFiles('coverage/coverage-summary.json') != '' && hashFiles('coverage/coverage-final.json') != ''"
        uses: 'davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73' # v2.13.0
        with:
          json-summary-path: 'coverage/coverage-summary.json'
          json-final-path: 'coverage/coverage-final.json'
          vite-config-path: 'vite.config.ts'

      - name: 'Test Results'
        if: "always() && hashFiles('junit-report.xml') != ''"
        uses: 'dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2' # v3.0.0
        with:
          name: 'Test Results'
          path: 'junit-report.xml'
          reporter: 'java-junit'

      - name: 'Upload Coverage Report'
        if: "always() && hashFiles('coverage/index.html') != ''"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'coverage-report'
          path: 'coverage/'
          retention-days: 30
    needs: [ 'security-sast_codeql', 'security-sast_semgrep', 'security-sast_gitleaks', 'security-sast_hadolint', 'security-sca_yarn_audit' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  tests-test_build:
    name: 'tests > test:build'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Enable Corepack'
        run: |
          command -v corepack > /dev/null 2>&1 || npm i -g --ignore-scripts corepack@0.34.7
          corepack_dir="$(mktemp -d "$RUNNER_TEMP/corepack.XXXXXX")"
          corepack enable --install-directory "$corepack_dir" yarn
          echo "$corepack_dir" >> "$GITHUB_PATH"
        shell: 'bash'

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version: '${{ inputs.node_version }}'
          cache: 'yarn'

      - name: 'Export the build environment'
        if: "inputs.build_env != ''"
        run: 'printf ''%s\n'' "$BUILD_ENV" >> "$GITHUB_ENV"'
        shell: 'bash'
        env:
          BUILD_ENV: '${{ inputs.build_env }}'

      - run: |
          # `--mode=skip-build`: Yarn 2+ enables lifecycle scripts by default, so a plain
          # install executes arbitrary code from the whole transitive tree as the CI user.
          # Projects that need them set `install_run_scripts: true` and get `yarn rebuild`.
          yarn install --immutable --mode=skip-build
          if [ "$INSTALL_RUN_SCRIPTS" = 'true' ]; then
            yarn rebuild
          fi
          yarn build
        shell: 'bash'
        env:
          INSTALL_RUN_SCRIPTS: '${{ inputs.install_run_scripts }}'
    needs: [ 'security-sast_codeql', 'security-sast_semgrep', 'security-sast_gitleaks', 'security-sast_hadolint', 'security-sca_yarn_audit' ]
    if: "!startsWith(github.ref, 'refs/tags/')"


  # management stage (optional)
  management-report_sonarqube:
    name: 'management > report:sonarqube'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    container:
      image: 'sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9'
    needs: [ 'tests-test_all' ]
    if: "inputs.sonar_host != '' && !startsWith(github.ref, 'refs/tags/')"
    continue-on-error: true
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 'Download coverage artifact'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'coverage-report'
          path: 'coverage/'
        continue-on-error: true

      - name: 'Checkout scripts'
        uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

      - name: 'Run SonarQube'
        run: '${{ env.SCRIPTS_DIR }}/global/scripts/tools/sonarqube/run.sh'
        shell: 'bash'
        env:
          SONAR_HOST_URL: ${{ inputs.sonar_host }}
          SONAR_TOKEN: ${{ secrets.sonar_token }}



# 1 - this file MUST be inside ".github/workflows" because of GitHub Actions limitations
# 2 - the recommended events to trigger this workflow and permissions are:
#   on:
#     push:
#       branches:
#         - 'main'
#       tags:
#         - '*'
#     pull_request:
#       branches:
#         - 'main'
#     workflow_dispatch:
#
#   permissions:
#     security-events: 'write' # security-sast_codeql
#     actions: 'read' # security-sast_codeql (required only on a private repository)
#     pull-requests: 'write' # tests-test_all (coverage report comment)
#     checks: 'write' # tests-test_all (test results annotations)
