kind: 'Fixed'
body: '**Azure DevOps cannot report its own default branch, and an earlier draft of this change got that wrong in a way worth recording.** `Build.Repository.DefaultBranch` does not exist — `Build.Repository.*` is Name, Uri, Provider, ID, LocalPath, Clean, Tfvc.Workspace and Git.SubmoduleCheckout, and nothing else — so a condition comparing against it tests an empty string, is always false, and would have silently disabled every Azure upload with no error anywhere. GitHub Actions has the same gap (the default branch lives only in the `github.event.repository` context, not the environment). `DEPENDENCY_TRACK_DEFAULT_BRANCH` supplies it where the platform cannot, accepting either `main` or `refs/heads/main`; without it a branch build on those two platforms still uploads but does not claim the latest flag. Two assertions keep the non-existent variable from being reintroduced'
