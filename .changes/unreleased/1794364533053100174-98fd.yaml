kind: 'Fixed'
body: 'fixed the Azure DevOps release job never tagging a version bump that a batched CI run carried below its newest commit: with `batch: true` on the CI trigger, merges that land while a run is in progress are built together at the newest commit, and the job read only that commit''s message, so a bump merged in the same batch got no tag and no release, and nothing failed. The job now checks out the whole history with every tag, walks the first-parent commits below HEAD back to the commit the CI run queued before it built, and tags every bump on the way that is newer than the newest version tag and has no tag yet, each on its own commit with its own changelog notes, oldest first. A bump whose own run failed its gate is still left to a deliberate re-push of its tag, and a HEAD bump, an existing tag, a tag run, a run with no new bump and a repository with no version tag behave as before, and `make test ONLY=release-batched-bumps` covers each case'
