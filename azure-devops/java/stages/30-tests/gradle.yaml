parameters:
  - name: 'GRADLE_TEST_TASKS'
    type: 'object'
    default: []
  - name: 'GRADLE_PROPERTIES'
    type: object
    default: []

stages:
  - stage: 'tests'
    displayName: 'tests'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    jobs:
      # Does this pull request worsen the shape of the test suite? Pull requests only; advisory
      # unless the target branch's `.test-pyramid` says `blocking true`. See
      # azure-devops/global/stages/30-tests/test-pyramid.yaml and README.md, "Test Pyramid".
      - template: '../../../global/stages/30-tests/test-pyramid.yaml'
        parameters:
          LANGUAGE: 'java'

      - job: 'test_all'
        displayName: 'test:all'
        variables:
          GRADLE_USER_HOME: "$(Pipeline.Workspace)/.gradle"
        steps:
          - template: '../../abstracts/gradle.yaml'
            parameters:
              GRADLE_PROPERTIES: ${{ parameters.GRADLE_PROPERTIES }}
              GRADLE_USER_HOME: $(Pipeline.Workspace)/.gradle

          - task: 'Gradle@3'
            inputs:
              tasks: ${{ join(' ', parameters.GRADLE_TEST_TASKS) }}
              # TODO: fix this to publish
              publishJUnitResults: false
            displayName: 'Run tests'
