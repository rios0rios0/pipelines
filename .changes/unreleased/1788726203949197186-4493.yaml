kind: 'Added'
body: 'added a `node_version` input to `npm.yaml`, the twin of the one `yarn.yaml` has carried since Node 20 reached end of life. All four `actions/setup-node` steps and the Prettier stage hardcoded `20`, so an npm consumer had no way onto a supported runtime short of abandoning the shared workflow and re-declaring every job in its own repository -- which is the drift this library exists to prevent. It defaults to `''20''`, so a consumer that does not set it sees no change at all. What makes the gap invisible rather than loud is npm itself: a project whose `engines` say `>=24` still installs on Node 20, because `npm ci` only WARNS `EBADENGINE` unless `engine-strict` is set, so the mismatch surfaces two jobs later as a test run that dies on an API the runtime does not have. The first consumer to hit it is a React 19 / Vite 8 front-end whose `vitest` and `jsdom` releases declare `^22.12.0 || ^24.0.0 || >=26.0.0` and `^22.22.2 || ^24.15.0 || >=26.0.0`. Knip still pins `20`, for npm and Yarn alike, exactly as it did before'
time: '2026-09-06T20:23:23.949095154Z'
