parameters:
  - name: 'DEPENDS_ON'
    type: object
    default: ''

  # Opt-in: runs `make test-integration` in `test:all` after the unit tests,
  # when the repository's Makefile defines that target (a warning, not a
  # failure, when it does not). Off by default because integration tests
  # usually start services -- containers through the agent's Docker -- that a
  # unit-test job never needed, so turning it on is the consumer's decision.
  # It runs after the unit results are published, so a target that writes the
  # same report files cannot replace them.
  - name: 'RUN_INTEGRATION_TESTS'
    type: 'boolean'
    default: false

stages:
  - stage: 'tests'
    displayName: 'tests'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    ${{ if ne(parameters.DEPENDS_ON, '') }}:
      dependsOn: ${{ parameters.DEPENDS_ON }}
    jobs:
      - job: 'test_all'
        displayName: 'test:all'
        steps:
          - template: '../../abstracts/pdm-python3.14.yaml'
          - script: |
              pdm run test
            displayName: 'Run Tests'

          - task: 'PublishTestResults@2'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'build/reports/junit.xml'
            displayName: 'Publish JUnit XML Results'

          - task: 'PublishCodeCoverageResults@2'
            inputs:
              summaryFileLocation: 'build/reports/cobertura.xml'
            displayName: 'Publish Cobertura XML Results'

          - task: 'PublishPipelineArtifact@1'
            inputs:
              artifactName: 'coverage'
              targetPath: 'build/reports'
            displayName: 'Publish Coverage Files'

          - ${{ if parameters.RUN_INTEGRATION_TESTS }}:
              - script: $(Scripts.Directory)/global/scripts/languages/python/test-integration/run.sh
                displayName: 'Run Integration Tests'

        continueOnError: false
