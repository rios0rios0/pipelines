kind: 'Fixed'
body: 'fixed `quality:phpmd` failing on every PHP repository since setup-php began installing PHPMD `3.0.0`, which replaced the positional `phpmd <paths> <format> <ruleset>` command line with an `analyze` command and read the runner''s `phpmd . json unusedcode` as an undefined command named `.`, exiting 1 before analysing a file. `global/scripts/languages/php/phpmd/run.sh` now calls `phpmd analyze --format json --ruleset unusedcode --no-progress .`, keeps the positional form for a persistent agent still on PHPMD 2, and sends the PHPMD stderr to the job log instead of into the report, where it had hidden that error and left a report that was not JSON. `make test-phpmd` pins both forms, the verdict and the report against a stub `phpmd`'
time: '2026-10-21T13:30:05.785625551Z'
