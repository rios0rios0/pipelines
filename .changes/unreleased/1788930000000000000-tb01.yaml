kind: 'Added'
body: 'added `tests > test:build` to the Dart/Flutter pipeline, the job `npm.yaml` and `yarn.yaml` have carried since those pipelines existed and `dart.yaml` never had. It is a SIBLING of `tests > test:all` -- identical `needs:` and identical `if:`, so the two run in parallel and a pull request gets both verdicts at once -- and it covers what the suite structurally cannot: `test:all` runs on the Dart VM and never reaches dart2js, dart2wasm or the AOT compiler, so a `dart:io` import reachable from web code, an icon tree-shake, a const the release compiler cannot evaluate and a plugin with no web implementation are all invisible to it and all fail the first time somebody builds. Unlike the JavaScript job of the same name it is OPT-IN through the new `test_build_command` input, because Dart has no equivalent of the `build` script every `package.json` declares -- a Flutter app builds an APK, an app bundle, a web bundle or six desktop targets, a pure Dart package builds an executable and a library builds nothing -- so an empty command skips the job rather than guessing a target, adding minutes to every pipeline already consuming this file and building the wrong artifact for most of them. The command runs through the new `github/dart/stages/30-tests/build` action with the toolchain already on `PATH` and dependencies resolved, since `dart_ensure_sdk` prepends to `PATH` in its own shell and a composite action''s steps do not share one; `test_build_node_version` installs Node.js for a command that needs it and installs nothing when empty, rather than relying on whatever a self-hosted runner happens to ship. Both inputs are declared and forwarded by `dart-cloudflare.yaml`, `dart-docker.yaml`, `dart-library.yaml` and `flutter-artifacts.yaml`, for the reason the composition standard gives about `runs_on`: an input a composed workflow does not declare is one its consumers cannot reach at all, while the pipeline goes on looking identical to the base one. `test_build_*` rather than `build_*` so it cannot be confused with the deployment workflows'' `build_command`, which runs at deploy time against the real environment where this runs on every pull request against placeholders'
