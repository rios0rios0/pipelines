kind: 'Fixed'
body: 'fixed `make sast` writing the developer''s global git configuration through a project''s `config.sh`: the CodeQL runner sources it for a Go scan, and a `config.sh` that runs `git config --global` left a URL rewrite carrying its token, or an `Authorization` header with an empty one, in `~/.gitconfig` for every later `git` on the machine. Off CI the runner now points `GIT_CONFIG_GLOBAL` at a file of the scan that includes the developer''s own configuration, so such a write configures the scan''s build and is removed with it, while a `config.sh` that exports its settings (`GIT_CONFIG_COUNT`/`KEY`/`VALUE`) off CI and writes the global configuration only on a CI runner works everywhere, the CI init step included. The GitLab CI Go SAM delivery now sources `config.sh` into the shell that runs `sam build` instead of executing it, which failed with `Permission denied` on a `config.sh` without an executable bit and lost its `GOPRIVATE`; `make test ONLY=go-project-config` holds every place that loads it'
time: '2026-11-18T21:14:14.513691385Z'
