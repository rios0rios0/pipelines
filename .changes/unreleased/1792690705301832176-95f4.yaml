kind: 'Changed'
body: 'changed `go-flyio.yaml` to deploy the image `delivery > docker` pushed instead of building the Dockerfile again on the Fly.io remote builder. The deploy copies the linux/amd64 build of that image from GHCR into `registry.fly.io/<app>` with `crane` -- pinned and checksum-verified, registry to registry, no Docker daemon -- and runs `flyctl deploy --image registry.fly.io/<app>@sha256:<digest>`, so the artifact CI produced is the one that runs. The rebuild took about two of the two and a half minutes a deploy spent, gave production an image with another digest than the one CI pushed, and once stalled in the remote builder for 51 minutes before failing the deploy. What is deployed changes only where `fly.toml` builds something other than `.ci/stages/40-delivery/app.Dockerfile`, the file the delivery job builds: the one consumer known when the default changed builds that same file in both places, while a `fly.toml` naming another Dockerfile now deploys the image of the delivery job instead. `fly_build_from_source: true` restores the build from source. The deployment job now asks for `packages: read` to pull the image, which every caller already grants as `packages: write` for the delivery job, and `40-delivery/docker` and `go-docker.yaml` now output the pushed `image` by digest. The deploy script takes the image as `FLY_IMAGE` on all three platforms, with `FLY_IMAGE_REGISTRY_USERNAME` and `FLY_IMAGE_REGISTRY_PASSWORD`; GitLab CI and Azure DevOps keep building from source unless it is set, because their delivery templates record no digest to hand over'
time: '2026-10-22T17:38:25.301674427Z'
