# Tests and coverage for both toolchains.
#
# Produces `build/reports/junit.xml`, `build/reports/cobertura.xml`,
# `build/reports/lcov.info` and `build/reports/coverage.md`. Dart emits coverage
# as LCOV and nothing else, so the Cobertura report is produced by the runner's
# own stdlib-Python converter -- see
# `global/scripts/languages/dart/test/lcov_to_cobertura.py` for why that is a
# converter here rather than a `pip install` -- and the Markdown summary the
# reusable workflow posts on a pull request comes from the same parse
# (`lcov_to_markdown.py`), which is what keeps the comment and the gate from
# ever disagreeing about what was measured.
inputs:
  flutter_version:
    required: false
    default: ''
    description: 'Pin an exact Flutter version (e.g. 3.47.0). Defaults to the current stable release.'
  dart_sdk_version:
    required: false
    default: 'latest'
    description: 'Pin an exact Dart SDK version. Only used for pure Dart projects.'
  toolchain:
    required: false
    default: 'auto'
    description: "Force the toolchain: 'dart', 'flutter', or 'auto' to detect it from pubspec.yaml."
  coverage_minimum:
    required: false
    default: ''
    description: 'Fail the job when line coverage falls below this percentage (e.g. 80).'
  coverage_exclude:
    required: false
    default: ''
    description: "Glob patterns dropped from the report and the gate (e.g. '*.g.dart *.freezed.dart')."
  coverage_diff_base:
    required: false
    default: ''
    description: >-
      Commit the change is measured against -- a pull request's base SHA. When set, the Markdown
      summary lists the coverage of every source file the change touches; empty omits that section.
  require_tests:
    required: false
    default: 'false'
    description: 'Fail rather than skip when the project has no test/ directory.'
  test_args:
    required: false
    default: ''
    description: 'Extra arguments appended to `dart test` / `flutter test`.'

outputs:
  toolchain:
    description: >-
      The toolchain the suite ran under, `dart` or `flutter`, resolved the way every runner in this
      family resolves it: the `toolchain` input when it is not `auto`, else from `pubspec.yaml`.
      The reusable workflow's `Test Results` step picks the report parser matching it.
    value: ${{ steps.toolchain.outputs.toolchain }}

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    # Skipped on a self-hosted runner, where every path below lives in `$HOME` and therefore
    # persists on local disk between jobs. There the restore is not merely redundant -- `tar`
    # cannot write over the SDK that is already unpacked (`Cannot mkdir: Permission denied`),
    # exits 2, and the action logs `Failed to restore` after downloading the whole archive.
    #
    # Measured on a 12-vCPU self-hosted runner, one workflow run of a Flutter consumer: the
    # archive is 1.67 GB, it arrives at ~8.5 MB/s, and the restore step took 214s, 270s, 308s,
    # 338s and 358s across the five jobs -- four of the five then threw the download away. The
    # post-job step re-tars the same 1.67 GB for another 87-102s and ends in `Failed to save:
    # Unable to reserve cache`. On `style:format` that is 314s of cache around 17.6s of work.
    #
    # The one job whose restore SUCCEEDED still paid 308s for it, and that is the number that
    # settles this: a cold `dart_ensure_sdk` in the same run installed the SDK from Google's
    # archive in 126s. The cache is slower than the download it exists to avoid, so skipping it
    # is a win on a cold self-hosted host as well as on a warm one -- where the SDK is already
    # there and the install costs nothing at all.
    #
    # This is the reasoning `github/golang` already applies to `actions/setup-go`, and the
    # reasoning the codeql stage applies read the other way round: it skips the cache because
    # its runner is thrown away, and these skip it because theirs is not.
    #
    # `!= 'self-hosted'` rather than `== 'github-hosted'` so an empty context keeps today's
    # behaviour instead of silently disabling the cache for hosted consumers.
    - name: 'Cache the Dart/Flutter SDK and pub packages'
      if: "runner.environment != 'self-hosted'"
      uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
      with:
        path: |
          ~/.local/share/flutter
          ~/.local/share/dart-sdk
          ~/.pub-cache
        key: "dart-${{ runner.os }}-${{ inputs.flutter_version }}-${{ inputs.dart_sdk_version }}-${{ hashFiles('**/pubspec.lock') }}"
        restore-keys: "dart-${{ runner.os }}-${{ inputs.flutter_version }}-${{ inputs.dart_sdk_version }}-"

    # Published as the action's `toolchain` output for the reusable workflow's `Test Results`
    # step, which has to hand `dorny/test-reporter` the parser matching the toolchain: only under
    # `flutter-json` does it read a Flutter failure's real message out of the `print` events and
    # match its `#0 ... (file:line:col)` frames, and `inputs.toolchain` is `auto` for exactly the
    # consumers that need it. Resolved BEFORE the tests so it is there whether they pass or not,
    # by the same `dart_detect_toolchain` every runner in this family calls.
    - name: 'Resolve the toolchain'
      id: 'toolchain'
      run: |
        . "$SCRIPTS_DIR/global/scripts/languages/dart/common.sh"
        echo "toolchain=$(dart_detect_toolchain)" >> "$GITHUB_OUTPUT"
      shell: 'bash'
      env:
        DART_TOOLCHAIN: '${{ inputs.toolchain }}'

    - name: 'Run tests with coverage'
      run: $SCRIPTS_DIR/global/scripts/languages/dart/test/run.sh
      shell: 'bash'
      env:
        FLUTTER_VERSION: '${{ inputs.flutter_version }}'
        DART_SDK_VERSION: '${{ inputs.dart_sdk_version }}'
        DART_TOOLCHAIN: '${{ inputs.toolchain }}'
        DART_COVERAGE_MINIMUM: '${{ inputs.coverage_minimum }}'
        DART_COVERAGE_EXCLUDE: '${{ inputs.coverage_exclude }}'
        DART_COVERAGE_DIFF_BASE: '${{ inputs.coverage_diff_base }}'
        DART_REQUIRE_TESTS: '${{ inputs.require_tests }}'
        DART_TEST_ARGS: '${{ inputs.test_args }}'

    - name: 'Upload Report'
      uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
      with:
        name: 'test-results'
        path: 'build/reports/'
        if-no-files-found: 'warn'
        overwrite: 'true'
        retention-days: 10
      if: always()
