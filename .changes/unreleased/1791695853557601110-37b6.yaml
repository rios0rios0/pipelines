kind: 'Added'
body: 'added an opt-in version build argument to the GitHub image delivery (`version_build_arg` on `40-delivery/docker`, `go-docker.yaml` and `go-flyio.yaml`) and to the Fly.io deploy on all three platforms (`FLY_VERSION_BUILD_ARG`, with `FLY_APP_VERSION` to set the value), so a Dockerfile that compiles its version in (`ARG VERSION=dev`, then `-ldflags -X`) reports the build it came from instead of its default -- which every image had reported, because no build passed the argument. The version is the release cut in the run, the tag on a tag build, and the commit''s first 7 characters otherwise, resolved by one helper (`global/scripts/shared/build-version.sh`) so the image pushed to the registry and the one Fly builds from source carry the same string; `go-docker.yaml` now outputs `tag_name` so `go-flyio.yaml` can hand a bump merge''s release to the deploy. Off unless a name is given, since a project may already use `ARG VERSION` for something else; a malformed name or a value that is not one word fails before anything is built, and a Dockerfile that declares no such `ARG` gets a warning. Covered by the new `make test-build-version` and by `make test-deploy-providers`'
time: '2026-10-11T05:17:33.55752194Z'
