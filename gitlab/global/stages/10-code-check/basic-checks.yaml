include:
  # `quality:gitignore` below fetches this repository's scripts; `quality:basic-checks` does not.
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/abstracts/scripts-repo.yaml'

quality:basic-checks:
  stage: 'code check (style/quality)'
  image: 'alpine/git:2.54.0@sha256:6a1fdb962814ca11508ca8d1bab94375b5b7ac4e4a9a40981c29fc32c02f095d'
  variables:
    GIT_DEPTH: 0
  script:
    - |
      TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      SOURCE_BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}"

      echo "=== Rebase Check ==="
      echo "Checking if branch can merge cleanly with '$TARGET_BRANCH'..."

      # A merged results pipeline, like a merge train, runs on the merge commit GitLab
      # prepares, and that commit always contains the target branch: judged by HEAD, every
      # merge request passed there, rebased or not. GitLab names the merge request's own
      # commit in CI_MERGE_REQUEST_SOURCE_BRANCH_SHA in those pipelines only; an ordinary
      # merge request pipeline runs on that commit, so there HEAD is the one to judge.
      SOURCE_REF="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-HEAD}"
      SOURCE_COMMIT=$(git rev-parse --verify --quiet "$SOURCE_REF^{commit}" || true)
      if [ -z "$SOURCE_COMMIT" ]; then
        echo "ERROR: could not resolve the merge request's source commit ('$SOURCE_REF'), so the rebase check cannot run."
        exit 1
      fi

      # A fetch that fails stops the check, rather than leaving it to judge whatever the clone holds.
      if ! git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"; then
        echo "ERROR: could not fetch '$TARGET_BRANCH' from origin, so the rebase check cannot run."
        exit 1
      fi
      TARGET_COMMIT=$(git rev-parse --verify --quiet "refs/remotes/origin/$TARGET_BRANCH^{commit}" || true)
      if [ -z "$TARGET_COMMIT" ]; then
        echo "ERROR: could not resolve 'origin/$TARGET_BRANCH' after fetching it, so the rebase check cannot run."
        exit 1
      fi

      # Guard: if the source commit is already merged into the target branch, skip all checks
      if git merge-base --is-ancestor "$SOURCE_COMMIT" "$TARGET_COMMIT"; then
        echo "Branch head ${SOURCE_COMMIT} is already part of '$TARGET_BRANCH' (likely merged). Skipping all basic checks."
        exit 0
      fi

      if git merge-base --is-ancestor "$TARGET_COMMIT" "$SOURCE_COMMIT"; then
        echo "Branch is up-to-date with '$TARGET_BRANCH'. No rebase needed."
      else
        cannot_check_merge() {
          echo "ERROR: $1, so the rebase check cannot run."
          exit 1
        }

        BEHIND_COUNT=$(git rev-list --count "$SOURCE_COMMIT..$TARGET_COMMIT") ||
          cannot_check_merge "could not count commits behind '$TARGET_BRANCH'"
        GIT_VERSION=$(git --version) || cannot_check_merge "could not determine the Git version"
        GIT_VERSION=${GIT_VERSION#git version }
        GIT_MAJOR=${GIT_VERSION%%.*}
        GIT_MINOR=${GIT_VERSION#*.}
        GIT_MINOR=${GIT_MINOR%%.*}
        case "$GIT_MAJOR:$GIT_MINOR" in
          :*|*:|*[!0-9:]*) cannot_check_merge "could not parse Git version '$GIT_VERSION'" ;;
        esac

        merge_in_worktree() (
          # Older Git needs a real merge. Keep its index and files in a disposable worktree.
          SCRATCH=$(mktemp -d) || exit 2
          if ! git -c core.hooksPath=/dev/null worktree add --quiet --detach "$SCRATCH" "$TARGET_COMMIT"; then
            rmdir "$SCRATCH"
            exit 2
          fi

          MERGE_STATUS=0
          git -C "$SCRATCH" -c core.hooksPath=/dev/null -c rerere.enabled=false \
            -c user.name=CI -c user.email=ci@example.invalid \
            merge --no-commit --no-ff "$SOURCE_COMMIT" >&2 || MERGE_STATUS=$?
          if [ "$MERGE_STATUS" -eq 1 ]; then
            # A failed merge can also return 1 without leaving any unmerged paths.
            CONFLICTED_FILES=$(git -C "$SCRATCH" diff --name-only --diff-filter=U) || MERGE_STATUS=2
            if [ -z "$CONFLICTED_FILES" ]; then
              MERGE_STATUS=2
            fi
          fi
          git worktree remove --force "$SCRATCH" || exit 2
          if [ "$MERGE_STATUS" -eq 1 ]; then
            printf '%s\n' "$CONFLICTED_FILES"
          fi
          exit "$MERGE_STATUS"
        )

        MERGE_STATUS=0
        if [ "$GIT_MAJOR" -gt 2 ] || { [ "$GIT_MAJOR" -eq 2 ] && [ "$GIT_MINOR" -ge 38 ]; }; then
          MERGE_OUTPUT=$(git merge-tree --write-tree --name-only --no-messages "$TARGET_COMMIT" "$SOURCE_COMMIT") ||
            MERGE_STATUS=$?
          if [ "$MERGE_STATUS" -eq 1 ]; then
            # The first line is the resulting tree ID.
            CONFLICTED_FILES=$(printf '%s\n' "$MERGE_OUTPUT" | sed '1d')
          fi
        else
          CONFLICTED_FILES=$(merge_in_worktree) || MERGE_STATUS=$?
        fi

        case "$MERGE_STATUS" in
          0)
            echo "Branch is $BEHIND_COUNT commit(s) behind '$TARGET_BRANCH' but merges cleanly. No rebase needed."
            ;;
          1)
            echo ""
            echo "============================================================"
            echo "  ERROR: Branch conflicts with '$TARGET_BRANCH'."
            echo "  The branch is $BEHIND_COUNT commit(s) behind."
            if [ -n "$CONFLICTED_FILES" ]; then
              echo "  Conflicted files:"
              printf '%s\n' "$CONFLICTED_FILES"
            fi
            echo ""
            echo "  Please rebase your branch:"
            echo "    git fetch origin $TARGET_BRANCH"
            echo "    git rebase origin/$TARGET_BRANCH"
            echo "    git push --force-with-lease"
            echo "============================================================"
            echo ""
            exit 1
            ;;
          *)
            cannot_check_merge "could not test the merge with '$TARGET_BRANCH' (exit $MERGE_STATUS)"
            ;;
        esac
      fi

      echo ""
      echo "=== Changelog Check ==="

      # The prefix autoupdate names its aggregate branch with: `aggregate_branch_prefix`
      # in autoupdate's own configuration, `chore/autoupdate-` by default. Set
      # AUTOUPDATE_BRANCH_PREFIX in the consumer's CI variables for a repository that
      # customised it.
      AUTOUPDATE_PREFIX="${AUTOUPDATE_BRANCH_PREFIX:-chore/autoupdate-}"

      # A repository counts as a chlog user when it commits a config file OR when it
      # merely carries the fragment directory: the config is optional, and chlog falls
      # back to its built-in defaults when none is found. Testing only for .chlog.yaml
      # made a repository that dropped the redundant config fall through to the plain
      # CHANGELOG.md branch below, demanding a hand-edited changelog from a project that
      # generates it from fragments. Mirrors AutoBump's DetectChlog so the two cannot
      # disagree about whether a repository uses chlog.
      if [ -f ".chlog.yaml" ] || [ -f ".chlog.yml" ] || [ -d ".changes/unreleased" ]; then
        echo "Detected chlog-based changelog."

        case "$SOURCE_BRANCH" in
          chore/bump-*|bump/*)
            # Release/bump PRs run `chlog merge`, which moves the unreleased
            # fragments into CHANGELOG.md. They carry no new fragment, so the
            # requirement flips: the PR must update CHANGELOG.md instead.
            echo "Release/bump branch detected ('$SOURCE_BRANCH')."
            echo "Verifying CHANGELOG.md was updated (fragments merged into it)..."

            CHANGELOG_MODIFIED=$(git diff --name-only "origin/$TARGET_BRANCH"...HEAD -- 'CHANGELOG.md' 2>/dev/null || true)
            if [ -z "$CHANGELOG_MODIFIED" ]; then
              echo ""
              echo "============================================================"
              echo "  ERROR: Release/bump PR did not update CHANGELOG.md."
              echo ""
              echo "  On a bump, chlog moves the unreleased fragments into"
              echo "  CHANGELOG.md. This PR must include the updated CHANGELOG.md."
              echo ""
              echo "  Run: chlog merge"
              echo "  See: https://github.com/luizjhonata/chlog"
              echo "============================================================"
              echo ""
              exit 1
            fi

            echo "CHANGELOG.md was updated. OK."
            ;;
          dependabot/*)
          # Dependabot is exempted outright, unlike every other automation branch here, because it is
          # the only one that cannot comply: it never writes a changelog entry and cannot be made to
          # (its branches carry a read-only token). autoupdate is not a substitute -- it deliberately
          # skips SHA pins, which is exactly what these repositories use. See the long note in
          # github/global/stages/10-code-check/basic-checks/action.yaml for the full reasoning.
            echo "Dependency-bot branch detected ('$SOURCE_BRANCH'); changelog fragment not required."
            ;;
          "$AUTOUPDATE_PREFIX"*)
            # autoupdate can legitimately add no fragment. It runs unattended, on a schedule,
            # against the same repositories, and names every dependency it moves: one it
            # already named is updated where it is -- the pending fragment is modified, not
            # added -- and an entry it would restate verbatim is not written again. A run
            # that moved only transitive dependencies writes nothing while something is
            # pending, and a summary only when nothing is. Demanding an added fragment
            # therefore fails a pull request that is right (rios0rios0/autoupdate,
            # `mergeDependencyChanges` and `RecordObservedDependencyChanges`).
            #
            # The other half of that rule IS checkable, and is what is enforced here:
            # omitting the fragment is acceptable only BECAUSE one is already pending, so
            # something must be pending. Nothing added and nothing pending means the
            # change is written down nowhere -- a real miss, or a writer that broke -- and
            # still fails.
            echo "Automation branch detected ('$SOURCE_BRANCH')."

            NEW_FRAGMENTS=$(git diff --name-only --diff-filter=A "origin/$TARGET_BRANCH"...HEAD -- '.changes/unreleased/' 2>/dev/null || true)
            if [ -n "$NEW_FRAGMENTS" ]; then
              echo "Found changelog fragment(s):"
              echo "$NEW_FRAGMENTS"
            else
              # Only a .yaml/.yml file counts as pending. A .gitkeep holding the directory
              # open in git is not an entry, and accepting it would wave through every
              # automation branch in any repository that keeps one.
              PENDING_FRAGMENTS=$(git ls-tree -r --name-only "origin/$TARGET_BRANCH" -- '.changes/unreleased/' 2>/dev/null | grep -E '[.](yaml|yml)$' | head -1 || true)
              if [ -z "$PENDING_FRAGMENTS" ]; then
                echo ""
                echo "============================================================"
                echo "  ERROR: No changelog fragment was added, and none is pending."
                echo ""
                echo "  An automation branch may omit the fragment only when the"
                echo "  target branch already records the same statement as pending."
                echo "  '$TARGET_BRANCH' records none, so this change is written"
                echo "  down nowhere."
                echo ""
                echo "  Run: chlog new --kind <Kind> --body \"<description>\""
                echo "  See: https://github.com/luizjhonata/chlog"
                echo "============================================================"
                echo ""
                exit 1
              fi
              echo "No new fragment, and '$TARGET_BRANCH' already records pending fragment(s):"
              echo "$PENDING_FRAGMENTS"
            fi
            ;;
          *)
            echo "Checking for new fragments in '.changes/unreleased/'..."

            NEW_FRAGMENTS=$(git diff --name-only --diff-filter=A "origin/$TARGET_BRANCH"...HEAD -- '.changes/unreleased/' 2>/dev/null || true)
            if [ -z "$NEW_FRAGMENTS" ]; then
              echo ""
              echo "============================================================"
              echo "  ERROR: No changelog fragment was added."
              echo ""
              echo "  This project uses chlog for changelog management."
              echo "  Every change must include a changelog fragment."
              echo ""
              echo "  Run: chlog new --kind <Kind> --body \"<description>\""
              echo "  Kinds: Added, Changed, Deprecated, Removed, Fixed, Security"
              echo ""
              echo "  See: https://github.com/luizjhonata/chlog"
              echo "============================================================"
              echo ""
              exit 1
            fi

            echo "Found changelog fragment(s):"
            echo "$NEW_FRAGMENTS"
            ;;
        esac
      else
        echo "Checking CHANGELOG.md modifications against '$TARGET_BRANCH'..."

        CHANGED_FILES=$(git diff --name-only "origin/$TARGET_BRANCH"...HEAD -- 'CHANGELOG.md' 2>/dev/null || true)
        if [ -z "$CHANGED_FILES" ]; then
          # The same exemption the chlog path above makes, for a repository that keeps a
          # hand-written CHANGELOG.md: autoupdate leaves it untouched when [Unreleased] on
          # the target branch already records everything the run would have written.
          PENDING_ENTRIES=''
          case "$SOURCE_BRANCH" in
            dependabot/*)
              echo "Dependency-bot branch detected ('$SOURCE_BRANCH'); CHANGELOG.md entry not required."
              exit 0
              ;;
            "$AUTOUPDATE_PREFIX"*)
              PENDING_ENTRIES=$(git show "origin/$TARGET_BRANCH:CHANGELOG.md" 2>/dev/null | awk '/^##[[:space:]]*\[Unreleased\]/{inside=1;next} /^##[[:space:]]*\[/{inside=0} inside && /^[[:space:]]*[-*][[:space:]]/{print;exit}' || true)
              ;;
          esac

          if [ -n "$PENDING_ENTRIES" ]; then
            echo "Automation branch detected ('$SOURCE_BRANCH')."
            echo "No CHANGELOG.md change, and [Unreleased] on '$TARGET_BRANCH' already records entries. OK."
            exit 0
          fi

          echo ""
          echo "============================================================"
          echo "  ERROR: CHANGELOG.md was NOT modified."
          echo ""
          echo "  Every change must include an entry in CHANGELOG.md"
          echo "  under the [Unreleased] section."
          echo ""
          echo "  See: https://keepachangelog.com/en/1.1.0/"
          echo "============================================================"
          echo ""
          exit 1
        fi

        echo "CHANGELOG.md was modified. Validating entry placement..."

        CHANGELOG_CONTENT=$(git show HEAD:CHANGELOG.md 2>/dev/null || true)
        if [ -z "$CHANGELOG_CONTENT" ]; then
          echo "WARNING: could not read CHANGELOG.md from HEAD, skipping placement check."
          exit 0
        fi

        UNRELEASED_LINE=$(echo "$CHANGELOG_CONTENT" | grep -n '^##[[:space:]]*\[Unreleased\]' | head -1 | cut -d: -f1)

        if [ -z "$UNRELEASED_LINE" ]; then
          echo ""
          echo "============================================================"
          echo "  ERROR: CHANGELOG.md does not contain an [Unreleased] section."
          echo ""
          echo "  The changelog must have a '## [Unreleased]' header."
          echo "  All new entries must be added under this section."
          echo ""
          echo "  See: https://keepachangelog.com/en/1.1.0/"
          echo "============================================================"
          echo ""
          exit 1
        fi

        NEXT_VERSION_LINE=$(echo "$CHANGELOG_CONTENT" | grep -n '^##[[:space:]]*\[' | grep -v '\[Unreleased\]' | head -1 | cut -d: -f1)

        DIFF_LINES=$(git diff "origin/$TARGET_BRANCH"...HEAD -- 'CHANGELOG.md' 2>/dev/null || true)
        HUNK_POSITIONS=$(echo "$DIFF_LINES" | grep '^@@' | sed 's/.*+\([0-9]*\).*/\1/' || true)

        HAS_VALID_ENTRIES=false
        HAS_INVALID_ENTRIES=false

        for HUNK_START in $HUNK_POSITIONS; do
          if [ "$HUNK_START" -ge "$UNRELEASED_LINE" ]; then
            if [ -n "$NEXT_VERSION_LINE" ] && [ "$HUNK_START" -ge "$NEXT_VERSION_LINE" ]; then
              HAS_INVALID_ENTRIES=true
            else
              HAS_VALID_ENTRIES=true
            fi
          else
            HAS_VALID_ENTRIES=true
          fi
        done

        if [ "$HAS_INVALID_ENTRIES" = true ] && [ "$HAS_VALID_ENTRIES" = false ]; then
          echo ""
          echo "============================================================"
          echo "  ERROR: CHANGELOG.md entries are NOT under [Unreleased]."
          echo ""
          echo "  New entries were found below an existing version section."
          echo "  This usually happens after an erroneous rebase."
          echo ""
          echo "  Please move your changelog entries under the"
          echo "  '## [Unreleased]' section."
          echo ""
          echo "  See: https://keepachangelog.com/en/1.1.0/"
          echo "============================================================"
          echo ""
          exit 1
        fi

        echo "CHANGELOG.md entries are correctly placed under [Unreleased]."
      fi
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

# The shared `.gitignore` block (`make gitignore`), in a job of its own: `quality:basic-checks` above
# runs with only the project's repository on disk, and this check needs the shared ignore rules.
# It reports a stale or missing block and passes, unless GITIGNORE_CHECK, a CI/CD variable, is
# `enforce` (fail on it) or `off`. Merge requests only, like the drift it reports. See
# `global/scripts/tools/gitignore/ci.sh`.
quality:gitignore:
  stage: 'code check (style/quality)'
  image: 'alpine/git:2.54.0@sha256:6a1fdb962814ca11508ca8d1bab94375b5b7ac4e4a9a40981c29fc32c02f095d'
  script:
    - !reference [ .scripts-repo, before_script ]
    - $SCRIPTS_DIR/global/scripts/tools/gitignore/ci.sh
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
