kind: 'Changed'
body: 'stopped both Claude reusable workflows trying to compile, install or test the code they review. `anthropics/claude-code-action` ships a prompt template that tells the model to "install dependencies, run build commands, etc." and then to explain in its comment when a linter or test suite was denied so that `--allowedTools` can be widened -- so a review on a consumer repository ended with a "Note on verification" reporting that `go build ./...` and `go vet` had been denied, a caveat about a deliberate decision written to a reader who did not make it. Both prompts now state the tool surface they actually hold, name the toolchains they exclude (`go`, `node`, `npm`, `yarn`, `pnpm`, `python`, `pip`, `pdm`, `mvn`, `gradle`, `dart`, `flutter`, `dotnet`, `composer`, `bundle`, `terraform`, `terragrunt`, `docker`, `make`), say the exclusion is a decision rather than a gap because the pipeline compiles, lints and tests the same commit in dedicated jobs, and override the template: no setup or build step planned, no denied command retried or mentioned, and no verification caveat or limitations section written. The review adds the rule that makes it self-consistent -- a finding that could only be established by executing something is dropped into the tracking comment dropped list with its score instead of posted with a disclaimer.'
