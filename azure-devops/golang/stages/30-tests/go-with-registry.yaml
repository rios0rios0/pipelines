parameters:
  - name: 'DEPENDS_ON'
    type: object
    default: ''
  # Extra environment variables forwarded to the test run (e.g. secret-backed
  # settings that Azure Pipelines does not auto-inject into script steps).
  - name: 'TEST_ENV'
    type: object
    default: {}

stages:
  - stage: 'tests'
    displayName: 'tests'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    ${{ if ne(parameters.DEPENDS_ON, '') }}:
      dependsOn: ${{ parameters.DEPENDS_ON }}
    jobs:
      # Does this pull request worsen the shape of the test suite? Pull requests only; advisory
      # unless the target branch's `.test-pyramid` says `blocking true`. See
      # azure-devops/global/stages/30-tests/test-pyramid.yaml and README.md, "Test Pyramid".
      - template: '../../../global/stages/30-tests/test-pyramid.yaml'
        parameters:
          LANGUAGE: 'go'

      - job: 'test_all'
        displayName: 'test:all'
        variables:
          GOPATH: "$(Pipeline.Workspace)/.go"
        steps:
          - task: 'Docker@2'
            displayName: 'Docker Login'
            inputs:
              containerRegistry: "$(CONTAINER_REGISTRY_SERVICE_CONNECTION)"
              command: 'login'

          - template: '../../abstracts/test.yaml'
            parameters:
              TEST_ENV: ${{ parameters.TEST_ENV }}

        continueOnError: false
