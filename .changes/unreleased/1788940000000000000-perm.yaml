kind: 'Security'
body: 'narrowed `tests > test:build` in `dart.yaml` to `contents: read`. Without a block of its own a job in a called workflow runs with the CALLING job''s permissions, and this job runs the largest amount of third-party code in the file -- it resolves the whole dependency tree and then compiles it, plus whatever a consumer passes as `test_build_command`. Measured on a consumer whose caller grants what `promote_release: true` requires, it was handed `Contents: write` and `Actions: write`: a token that can push to the default branch and dispatch a workflow, held by a build, on `pull_request` runs too, where the branch supplies its own copy of the caller. It checks out, installs a toolchain and builds -- it writes no check run, posts no comment and uploads no artifact -- so read is all it needs. `tests-test_all` is deliberately left inheriting: it does need `checks: write` and `pull-requests: write`, and a called workflow''s job may never request more than its caller granted, so hardcoding them would turn every consumer granting only `contents: read` into a permissions error rather than a degraded report'
