parameters:
  - name: 'RUN_BEFORE_CODE_CHECK'
    type: 'string'
    default: 'echo "No before script"'
  - name: 'RUN_AFTER_CODE_CHECK'
    type: 'string'
    default: 'echo "No after script"'
  - name: 'WORKING_DIRECTORY'
    type: 'string'
    default: ''
  - name: 'DEPENDS_ON'
    type: object
    default: ''

stages:
  - stage: 'code_check'
    displayName: 'code check (style/quality)'
    condition: not(startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
    ${{ if ne(parameters.DEPENDS_ON, '') }}:
      dependsOn: ${{ parameters.DEPENDS_ON }}
    jobs:
      - template: '../../../global/stages/10-code-check/basic-checks.yaml'

      - job: 'style_eslint'
        displayName: 'style:eslint'
        steps:
          - template: 'steps/eslint.yaml'
            parameters:
              WORKING_DIRECTORY: "${{ parameters.WORKING_DIRECTORY }}"
              RUN_BEFORE_CODE_CHECK: ${{ parameters.RUN_BEFORE_CODE_CHECK }}
              RUN_AFTER_CODE_CHECK: ${{ parameters.RUN_AFTER_CODE_CHECK }}

      - job: 'quality_knip'
        displayName: 'quality:knip'
        steps:
          - template: '../../abstracts/corepack-node20.18.3-no-cache.yaml'

          # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
          # through `env:` and running it with `eval` keeps it DATA at template-expansion
          # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
          # so a value containing a newline or a quote used to be able to terminate this
          # step and append steps of its own. Through `env:` the shell only expands it at
          # run time, which is the same fix already applied to `pipelines_ref` in
          # .github/workflows/terra.yaml.
          - bash: 'eval "$PIPELINES_HOOK"'
            displayName: 'Before code check'
            workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"
            env:
              PIPELINES_HOOK: ${{ parameters.RUN_BEFORE_CODE_CHECK }}

          - script: |
              if [ -f yarn.lock ]; then
                yarn install --immutable --check-cache
              elif [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi
            displayName: 'Install dependencies'
            workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"

          # Pinned; `npx --yes knip` executes the newest published knip on
          # every run. See global/scripts/shared/pinned-versions.sh.
          - script: 'npm_config_ignore_scripts=true npx --yes knip@6.32.2'
            displayName: 'Run Knip unused code detection'
            workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"

          # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
          # through `env:` and running it with `eval` keeps it DATA at template-expansion
          # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
          # so a value containing a newline or a quote used to be able to terminate this
          # step and append steps of its own. Through `env:` the shell only expands it at
          # run time, which is the same fix already applied to `pipelines_ref` in
          # .github/workflows/terra.yaml.
          - bash: 'eval "$PIPELINES_HOOK"'
            displayName: 'After code check'
            workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"
            env:
              PIPELINES_HOOK: ${{ parameters.RUN_AFTER_CODE_CHECK }}
        continueOnError: true
