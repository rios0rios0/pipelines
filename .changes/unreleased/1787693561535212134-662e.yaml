kind: 'Fixed'
body: 'fixed `make test`, which **could not pass on a Debian or Ubuntu workstation** and had been green in CI for a reason unrelated to the code under test. `yq` is two unrelated programs sharing a name -- mikefarah/yq (Go, `yq eval ''<expr>'' <file>`) and kislyuk/yq (a jq wrapper that reads the expression as a FILENAME and rejects `eval`) -- and which one answers is decided by the machine: GitHub''s `ubuntu-latest` preinstalls the first, while Debian''s and Ubuntu''s own `yq` package and `pip install yq` are the second. `golangci-lint/run.sh` already resolved this correctly, but the two suites covering it called a bare `yq` in their own assertions, so `test-yaml-merge` and `test-docker-multi-arch` failed with `can''t open ''.linters.enable[]''` -- which reads like a broken test rather than the wrong program. Resolution moved into `global/scripts/shared/resolve-yq.sh`, sourced by the production script and by both suites, so there is ONE implementation instead of two that can disagree. This is the gate CONTRIBUTING tells people to run before submitting, so it has to mean the same thing on every machine'
