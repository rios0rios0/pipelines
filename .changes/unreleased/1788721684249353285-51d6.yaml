kind: 'Fixed'
body: 'stopped the shared SonarQube runner from clearing a coverage report path the repository set for itself. It decided whether coverage existed by globbing the workspace root only, so a project that does not live at the root -- the shape the new `working_directory` input serves -- was read as having none, and the "no coverage" branch appended an empty `sonar.javascript.lcov.reportPaths=`, which a Java properties file resolves as the last definition winning. The result was 0% coverage on new code, a failed quality gate on every pull request, and a green job saying only "No coverage files found". Detection now also searches `$SONAR_PROJECT_DIR` (exported by `npm.yaml` and `yarn.yaml` from `working_directory`) and recognises `coverage/*.info`, the name every LCOV reporter writes'
time: '2026-09-06T19:08:04.249242764Z'
