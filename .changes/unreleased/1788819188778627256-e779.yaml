kind: 'Added'
body: 'added a coverage comment to the Dart/Flutter pull-request pipeline: `tests > test:all` in `dart.yaml` now posts one sticky comment per pull request (updated in place on every push) and writes the same table to the job summary of every run, the parity `yarn.yaml` and `npm.yaml` have carried through `vitest-coverage-report-action`. Dart emits LCOV only, and every maintained LCOV comment action needs an `lcov` binary a self-hosted runner cannot `apt-get` or a Docker step the fleet cannot start -- and reads the raw tracefile, so it would count the generated sources `coverage_exclude` drops and paint a number the `coverage_minimum` gate never saw. The runner''s own stdlib `lcov_to_markdown.py` therefore renders `build/reports/coverage.md` from the same parse the Cobertura converter and the gate use, so the comment agrees with both to the decimal; its collapsed file section lists exactly the sources the pull request touches, diffed as two trees against the base SHA the workflow hands to the new `coverage_diff_base` input of the `30-tests/all` action, with repository paths mapped back onto the package''s for a monorepo. It is a report and never a gate: a summary that cannot be rendered, or a base the shallow checkout cannot resolve, is a named warning rather than a red test job. Consumers grant `pull-requests: write`, as the JavaScript pipelines already require; GitLab CI and Azure DevOps keep their native coverage widgets from the Cobertura report and need nothing new'
