kind: 'Added'
body: 'added the pipeline a project''s CI imports as a second source of the language fragments `make gitignore` writes into `.gitignore`, beside the `makefiles/<language>.mk` its `Makefile` includes: a GitHub reusable workflow names its language by its toolchain (`go-binary.yaml` gives `golang`), and a GitHub composite action, an Azure Pipelines template and a GitLab CI include by their directory (`azure-devops/terra/...@pipelines` gives `terra`), so a project with no `Makefile`, or one that includes `common.mk` alone, still gets the rules of the language its CI runs. A workflow that is itself reusable (`workflow_call`) names no language, and `make test ONLY=gitignore` now requires every language directory of the three platforms and every reusable workflow to ship a fragment or be named as needing none'
