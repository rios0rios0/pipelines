kind: 'Removed'
body: '**BREAKING CHANGE:** removed SBOM generation for Terraform and Dart, because `trivy filesystem --format cyclonedx` was its only implementation and neither ecosystem has a native replacement — Terraform has no other CycloneDX generator that reads `.terraform.lock.hcl` provider pins and module `source =` references, and for pub `package:sbom` emits SPDX while `cdxgen` would pull a whole Node.js toolchain into a Dart job. Deleted `global/scripts/languages/{terraform,dart}/cyclonedx/`, the `report:dependency-track` job from the Terraform (Azure DevOps) and Dart (all three platforms) `35-management` stages, the `management > report:sbom` job and its `enable_sbom` input from `dart.yaml` / `dart-cloudflare.yaml`, and the `cyclonedx` target from `makefiles/dart.mk`. Go and Python SBOMs are unaffected — they use `cyclonedx-gomod` and `cyclonedx-py`. Every removal site carries a comment stating why the job is absent, so it is not restored by accident'
breaking: true
