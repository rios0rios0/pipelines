kind: 'Fixed'
body: 'aligned `reusable-claude-review.yaml` with the action''s own `examples/pr-review-comprehensive.yml`. The review declared the `code-review` plugin and invoked it as a slash command, but `track_progress: true` selects tag mode, where `prompt` is injected as context rather than executed -- so the plugin installed, appeared in `slash_commands`, and never ran (a review run spawned 0 subagents against a command that mandates ~7), taking its scope rules and its already-reviewed guard with it. It also passed no `claude_args`, and `install-mcp-server.ts` gates `github_inline_comment` on that list in tag mode as well as agent mode, so no review could post a line-anchored comment. The inert plugin wiring is gone, the official `--allowedTools` string is passed verbatim, the prompt is prose that bounds the review to `gh pr diff` and asks a repeat run to verify the previous findings instead of writing new ones, and `use_sticky_comment: true` now updates the one `claude[bot]` comment instead of adding another on every push.'
time: '2026-08-28T04:26:43.333645364Z'
