kind: 'Fixed'
body: 'analysed Go again: every CodeQL bundle from `codeql-bundle-v2.26.4` carries a Go extractor built with go1.27, so this repository''s own scan (`.github/workflows/codeql.yaml`) put `go` back in its matrix and dropped the waiver job that would have failed `make test` from 2026-11-01; consumers'' Go projects were not analysed on GitLab CI, whose `sast:codeql` ran in the pipeline''s default Alpine image, where the CodeQL bundle cannot start (`java: not found`) and there is no Go, so the Go stage moved the job onto the `.go` image and installed `jq` there; on Azure DevOps the job ran under whatever Go the agent carried (1.24 to 1.26 on a Microsoft-hosted one), so the Go stage installed the pinned Go before it, through the CodeQL template''s new `PRE_STEPS` parameter'
time: '2026-10-29T20:32:50.615595925Z'
