kind: 'Added'
body: 'added opt-in test sharding to `yarn.yaml` as `test_shards`, which `yarn-cloudflare.yaml`, `yarn-docker.yaml` and `yarn-library.yaml` pass on. At `1`, the default, `tests > test:all` runs the suite as before, the job unchanged but for `inputs.test_shards <= 1` in its `if:`. Above 1, `tests > test:all` is skipped, `tests > test:all (shard <i>/<n>)` runs `yarn test:ci:shard --shard=<i>/<n>` once per shard and hands its `coverage/coverage-final.json` on as an artifact, and `tests > test:all (merged)` waits for every shard, fails when one did, merges their coverage with `yarn test:ci:merge` and reports it. A consumer that opts in names `tests > test:all (merged)` instead of `tests > test:all` in its required checks and its `deployment_required_checks`, and one that reports to SonarQube keeps one shard, since that job does not wait for the merge. The project defines both scripts (README.md, "Splitting `test:all` Across Runners"). It is GitHub Actions only, and `make test ONLY=yarn-test-shards` holds it, the default job included'
