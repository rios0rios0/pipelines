kind: 'Changed'
body: 'changed the four Terraform helpers -- `order-check`, `tftest-gen`, `var-catalog` and the terra-test tier''s generic coverage report -- from Python to standard-library-only Go, built from the pipelines checkout on every run, with the same flags, messages, exit codes, rewritten files and reports, so their jobs now need Go instead of `python3`: every template provisions it (the GitLab CI `order:check` job moved from `python:3.13-alpine` to the `golang:1.27.3` image the `terra` template''s `.terra` already uses, the GitHub Actions and Azure DevOps jobs install Go, and the GitHub `tests > test:all` job no longer lets an older `tests/terratest/go.mod` pick a Go too old to build the generator), while running `tftest-gen`, `var-catalog` or `order-check --fix` locally now needs Go 1.25 or newer; the TFLint installer also unpacks its archive with `bsdtar`, BusyBox `unzip` or `gzip` where there is no `unzip`, instead of `python3`'
time: '2026-10-29T21:56:18.157577089Z'
