.pdm:
  image: 'ghcr.io/rios0rios0/pipelines/python:3.14-pdm-trixie@sha256:b47a109dc4a8dbf95e7e627ea775db93e1682da00f4bcece60e9b0d07e5a79e7'
  cache: # relative to the project directory ($CI_PROJECT_DIR)
    key: "$CI_JOB_NAME"
    paths:
      - '.venv'
    when: 'always'
  before_script:
    - pdm install
  tags:
    - 'dev-gitlab-runner-onprem'
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.pdm-prod:
  extends: '.pdm'
  cache:
    key: "$CI_JOB_NAME-prod"
    paths:
      - '.venv'
    when: 'always'
  before_script:
    - pdm install --prod
