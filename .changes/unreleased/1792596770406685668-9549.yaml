kind: 'Removed'
body: 'removed the Go `1.26` line, leaving one Go image: `global/containers/golang.1.26-awscli` became `golang.1.27-awscli`, built on Go `1.27.3`, the Azure DevOps Lambda delivery and deployment jobs and the GitLab CI SAM delivery job now run on `ghcr.io/rios0rios0/pipelines/golang:1.27-awscli`, and `GO_1_26_PINNED_VERSION` is gone. Nothing here needed Go `1.26` itself: the Azure DevOps jobs set `GOTOOLCHAIN=auto`, a newer Go builds every module an older one does, and the GitLab CI job, which runs the image''s own Go, can now build modules that require `1.27`. The published `golang:1.26-awscli` stays in GHCR and keeps pulling, but is no longer rebuilt, so anything pulling it by name should move to `golang:1.27-awscli`. The new tag was published from the fix branch before the GitLab CI pin was written, so the rebuild that follows the merge supersedes that digest until the next scheduled `Dependency Updates` run re-pins it'
time: '2026-10-21T15:32:50.406608001Z'
