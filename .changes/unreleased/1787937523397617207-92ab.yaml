kind: 'Fixed'
body: 'fixed two ways the new Fly.io app auto-creation could be opted into and do nothing. It was gated on `FLY_APP_NAME` alone, so a consumer whose app name lives in the committed `fly.toml` — the configuration `go-flyio.yaml` documents as making `fly_app_name` optional — minted the wider org-scoped token, had the whole step skipped without a word, and still hit `Could not find App` on the first deploy. The name is now resolved from `fly.toml` too (top-level `app` key only, so a same-named key in a later table is not mistaken for it), it never reaches the deploy argv, and a name that resolves from neither source warns instead of skipping silently. Separately, `flyctl apps list` had its stderr discarded and its exit status folded into `grep`, so a failed lookup — an API error, an expired token, a renamed subcommand — was indistinguishable from "the app does not exist": the script announced it was creating an app that already existed, `apps create` was rejected for the name being taken, and the job died telling the operator their token was app-scoped, the one cause it definitely was not. The status is now read separately and the diagnostic kept'
time: '2026-08-28T17:18:43.397372529Z'
