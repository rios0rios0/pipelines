# JavaScript built with npm and deployed to Cloudflare Pages.
#
# `npm.yaml` plus one deployment job, in the same shape `npm-docker.yaml` is `npm.yaml` plus two
# delivery jobs. A consumer that ships an SPA to Pages calls this and writes no pipeline of its own.
#
# **The deploy is a job with `needs:`, never a second workflow.** The alternative a consumer reaches
# for is `on: workflow_run: workflows: [ '<name>' ]`, which couples two files by a DISPLAY NAME and
# fails silently when that name changes: a `workflow_run` naming a workflow that does not exist is
# not an error, it simply never fires. A `needs:` edge cannot drift, and a deploy that does not run
# is a skipped job rather than silence.
#
# The deployment itself is the same `50-deployment/cloudflare` action GitLab and Azure DevOps reach
# through their own templates, so the behaviour is one shared script (`global/scripts/deploy/
# cloudflare/run.sh`) on all three platforms. This file is the GitHub convenience layer over it, not
# a second implementation of it.
#
# **No `base_url` output, deliberately.** Deriving `https://<branch>.<project>.pages.dev` from the
# two values the deploy is performed with looks like it keeps the checked address from drifting from
# the published one, and it does not: the Pages hostname need not follow the project name. A
# consumer that drives its deployment should name the address in a variable a human has verified
# answers, rather than in a guess about somebody else's naming scheme.
on:
  workflow_call:
    inputs:
      sonar_host:
        description: 'SonarQube/SonarCloud host URL (leave empty to skip SonarQube)'
        required: false
        type: string
        default: ''
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: 'JSON array of runner labels (e.g. ''["self-hosted"]''). See npm.yaml.'
      codeql_upload:
        type: 'string'
        required: false
        default: 'always'
        description: "CodeQL SARIF upload mode ('always', 'failure-only' or 'never'). See npm.yaml."
      build_env:
        type: 'string'
        required: false
        default: ''
        description: |
          Dotenv-style lines (KEY=value, one per line) exported before the build and test steps of
          `npm.yaml`, AND before `build_command` in the deployment job below -- a bundler that
          bakes an API origin in at build time needs it in both places, and splitting them is how
          the two drift.

          For values that are NOT secret. A secret passed here is not masked, because a reusable
          workflow's inputs carry no masking from the caller; use `build_env_secrets` for those.
      e2e_typecheck:
        type: 'boolean'
        required: false
        default: false
        description: 'Type-check the end-to-end suite too. See npm.yaml.'
      target:
        type: 'string'
        required: false
        default: 'pages'
        description: "Cloudflare product: `pages` (static/SPA output) or `workers` (edge runtime)."
      pages_project:
        type: 'string'
        required: false
        default: ''
        description: |
          Pages project name, exactly as it appears under Workers & Pages.

          Pass a VARIABLE, never a literal, and this is the one deployment name where that
          distinction has already cost something: `wrangler pages deploy` CREATES a project that
          does not exist, so a stale literal does not fail the run -- renaming the project in the
          dashboard published a second copy of a whole site under the old name and reported success.
      pages_preview_branch:
        type: 'string'
        required: false
        default: 'staging'
        description: |
          Branch name recorded with the deployment on every ref that is not a tag. Pages maps the
          project's production branch to the production URL and every other branch name to a preview
          URL, so this label -- not the ref -- is what keeps a `main` build off the public address.
      pages_production_branch:
        type: 'string'
        required: false
        default: 'main'
        description: 'Branch name recorded with the deployment on a tag, which is what publishes it.'
      output_directory:
        type: 'string'
        required: false
        default: 'dist'
        description: 'Directory of built assets to upload.'
      build_command:
        type: 'string'
        required: false
        default: 'npm run build'
        description: |
          Command that produces `output_directory`, run AFTER the deploy action's own checkout --
          which wipes the workspace, so a build placed in an earlier step is destroyed before the
          upload. That is also what guarantees the uploaded bundle was produced from the commit
          being deployed rather than from whatever the job started on.

          `npm ci` has already run when this starts, so the default is the build script alone.
      build_env_vars:
        type: 'string'
        required: false
        default: ''
        description: |
          `KEY=VARIABLE_NAME` lines, resolved from the caller's repository AND environment variables
          inside the deployment job, then exported like `build_env`.

          This exists because of a constraint that has no way around it: a job that calls a
          reusable workflow **cannot declare `environment:`** -- the key is not allowed there -- so
          its `with:` block is evaluated with no environment selected, and `vars.API_URL` in a
          caller resolves to the REPOSITORY-level variable rather than to staging's. Anything
          scoped per environment therefore cannot be passed as an input at all; it has to be named
          here and read inside the job that declares the environment.

          Pass `API_URL=API_URL` to read `vars.API_URL` for the environment being deployed. A name
          that resolves to nothing fails the step, so a variable set on one environment and
          forgotten on the other is a named error rather than a bundle built against an empty
          string.
      build_env_secret_names:
        type: 'string'
        required: false
        default: ''
        description: |
          `KEY=SECRET_NAME` lines, resolved from whatever secrets reached this workflow and exported
          like `build_env_secrets`, but MASKED.

          For callers using `secrets: inherit`, which passes secrets under THEIR names and therefore
          cannot populate a declared input like `build_env_secrets`. That only works inside one
          organization; a cross-organization caller should use `build_env_secrets` instead.

          **It cannot reach an environment-scoped secret**, because nothing can -- see
          `build_env_vars` for the variable case, which does cross. Unlike `build_env_vars` an
          unresolvable name is NOT a failure: a value like a Sentry DSN is legitimately optional and
          the key is simply left unset.
      deployment_environment:
        type: 'string'
        required: false
        default: ''
        description: |
          GitHub environment the deploy runs under, which is what scopes the credentials and what
          can restrict the refs allowed to deploy. Defaults to `production` on a tag and `staging`
          otherwise.
      deployment_required_checks:
        type: 'string'
        required: false
        default: ''
        description: |
          Newline-separated check names that must have SUCCEEDED before deploying.

          Needed for TAG builds and not much else: every job in `npm.yaml` carries
          `if: !startsWith(github.ref, 'refs/tags/')`, so a tag push skips the whole reusable
          workflow and the `needs:` edge below is satisfied by a run that verified nothing. On a
          branch the dependency is real and this can stay empty.

          Write the names bare (`tests > test:all`). The gate matches a whole trailing ` / ` segment,
          so it does not matter that GitHub records them prefixed with the calling jobs.
    secrets:
      sonar_token:
        description: 'SonarQube authentication token'
        required: false
      cloudflare_api_token:
        required: false
        description: |
          Cloudflare API token with the "Edit Cloudflare Workers" template.

          Not `required: true` on purpose: a declared-required secret a caller cannot supply fails
          workflow validation before any job starts, which is a worse error than a named one in the
          log. It is checked at runtime instead, with a message that names the likely cause.
      cloudflare_account_id:
        required: false
        description: 'Cloudflare account id, from the sidebar of any domain overview page.'
      build_env_secrets:
        required: false
        description: |
          Dotenv-style lines exported before `build_command`, like `build_env` but MASKED -- a
          secret keeps its masking when it is passed into a reusable workflow as a secret, and loses
          it when it is passed as an input.

          This is the one to reach for. Its counterpart `build_env_secret_names` exists for a caller
          using `secrets: inherit`, which passes secrets under THEIR names and so can never populate
          a declared input -- but `inherit` only carries secrets within a single organization, and
          this library is a different owner from most consumers. Explicit is what works.

jobs:
  npm:
    uses: 'rios0rios0/pipelines/.github/workflows/npm.yaml@main'
    with:
      sonar_host: ${{ inputs.sonar_host }}
      runs_on: ${{ inputs.runs_on }}
      codeql_upload: ${{ inputs.codeql_upload }}
      build_env: ${{ inputs.build_env }}
      e2e_typecheck: ${{ inputs.e2e_typecheck }}
    secrets:
      sonar_token: ${{ secrets.sonar_token }}

  # fifth stage
  deployment-cloudflare:
    name: 'deployment > cloudflare'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # The ref picks the environment, which is what keeps two environments' credentials apart: a run
    # not entitled to `production` cannot read its secrets, and `production` can refuse every ref
    # that is not a tag.
    environment: ${{ inputs.deployment_environment != '' && inputs.deployment_environment || (github.ref_type == 'tag' && 'production' || 'staging') }}
    # Only what is used, and only read. A called workflow can never hold more than its caller grants,
    # so requesting anything spare turns a working consumer into a permissions error --
    # `deployments: write` is the one to resist here, since `wrangler` records the deployment with
    # Cloudflare rather than with GitHub. `checks: read` IS required and is not in the restricted
    # default set.
    permissions:
      contents: 'read'
      checks: 'read'
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.deployment_environment != '' && inputs.deployment_environment || (github.ref_type == 'tag' && 'production' || 'staging') }}
      PAGES_BRANCH: "${{ github.ref_type == 'tag' && inputs.pages_production_branch || inputs.pages_preview_branch }}"
      PAGES_PROJECT: '${{ inputs.pages_project }}'
      # Hoisted to the job because a STEP-LEVEL `if:` cannot read the `secrets` context at all --
      # `if: secrets.x != ''` is a workflow syntax error, not a condition that evaluates to false.
      # An `env:` entry may reference it, and `env` is readable from an `if:`.
      BUILD_ENV_SECRETS: '${{ secrets.build_env_secrets }}'
    steps:
      # Skipped entirely when the caller passes nothing, so a branch deploy pays nothing for a gate
      # whose guarantee `needs:` already carries.
      - if: "inputs.deployment_required_checks != ''"
        uses: 'rios0rios0/pipelines/github/global/stages/50-deployment/require-checks@main'
        with:
          required_checks: '${{ inputs.deployment_required_checks }}'

      # The three `build_env*` inputs all write to `$GITHUB_ENV`, which lives outside the workspace
      # -- so they survive the deploy action's own checkout, and `build_command` sees them.
      #
      # **They are applied in this order and the LAST one wins**: `build_env`, then
      # `build_env_vars`, then `build_env_secret_names`. That is deliberate and load-bearing for
      # one shape in particular: a caller whose `build_env` also feeds the toolchain workflow's
      # test and build jobs (`yarn.yaml` takes the same input) passes a PLACEHOLDER API origin
      # there, because those jobs prove the bundle compiles and never publish it. The real,
      # environment-scoped origin then comes from `build_env_vars` and overrides it here, where the
      # bundle that ships is built.
      - if: "inputs.build_env != ''"
        run: 'printf ''%s\n'' "$BUILD_ENV" >> "$GITHUB_ENV"'
        shell: 'bash'
        env:
          BUILD_ENV: '${{ inputs.build_env }}'

      - if: "env.BUILD_ENV_SECRETS != ''"
        run: 'printf ''%s\n'' "$BUILD_ENV_SECRETS" >> "$GITHUB_ENV"'
        shell: 'bash'

      # Environment-scoped variables, read HERE because this is the first job that has an
      # environment to read them from -- see `build_env_vars` for why a caller cannot pass them.
      #
      # `toJSON(vars)` is evaluated in this job's context, so it carries the repository variables
      # merged with the ones scoped to the environment above. python3 rather than `jq` because the
      # rest of this library already assumes a stdlib python3 and not every self-hosted runner has
      # `jq`.
      - if: "inputs.build_env_vars != ''"
        run: |
          python3 - <<'RESOLVE'
          import json
          import os
          import sys

          available = json.loads(os.environ['ALL_VARS'])
          resolved = []
          missing = []
          for line in os.environ['BUILD_ENV_VARS'].splitlines():
              line = line.strip()
              if not line:
                  continue
              key, _, name = line.partition('=')
              value = available.get(name.strip())
              if not value:
                  missing.append(name.strip())
                  continue
              resolved.append('%s=%s' % (key.strip(), value))

          if missing:
              print('::error::these variables are not set for this environment: %s' % ', '.join(missing))
              sys.exit(1)

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(resolved) + '\n')
          print('resolved %d variable(s) for the build' % len(resolved))
          RESOLVE
        shell: 'bash'
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          BUILD_ENV_VARS: '${{ inputs.build_env_vars }}'

      # Secrets named rather than declared, for callers using `secrets: inherit` -- which passes the
      # caller's secrets under THEIR own names, so a declared `build_env_secrets` input is never
      # populated by it. This reaches repository and organization secrets only; an ENVIRONMENT
      # secret cannot cross a repository boundary by any route, unlike the variables above.
      #
      # `toJSON(secrets)` is a considered exception to "only pass required secrets to this step",
      # not an oversight -- static analysis flags it and is right to in general. Selecting the
      # named ones in the expression is impossible: an input carries a LIST of names and the
      # `secrets` context cannot be iterated in a workflow expression, so either every requested
      # secret is a separate declared input (which `inherit` cannot populate, which is the whole
      # problem) or the selection happens in the step.
      #
      # What bounds it: the exposure is one step, running an inline script from this repository
      # with no third-party action in it; the values go straight into `$GITHUB_ENV` and are never
      # echoed; every one of them stays masked in the log; and the step is skipped entirely unless
      # the caller asked for something. The job already holds the deployment credentials, so this
      # widens nothing it did not already have. **Do not add a `print` of a resolved value here.**
      - if: "inputs.build_env_secret_names != ''"
        run: |
          python3 - <<'RESOLVE'
          import json
          import os

          available = json.loads(os.environ['ALL_SECRETS'])
          resolved = []
          skipped = []
          for line in os.environ['BUILD_ENV_SECRET_NAMES'].splitlines():
              line = line.strip()
              if not line:
                  continue
              key, _, name = line.partition('=')
              value = available.get(name.strip())
              if not value:
                  skipped.append(key.strip())
                  continue
              resolved.append('%s=%s' % (key.strip(), value))

          if resolved:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
                  handle.write('\n'.join(resolved) + '\n')
          print('resolved %d secret(s) for the build' % len(resolved))
          if skipped:
              print('left unset (not present for this environment): %s' % ', '.join(skipped))
          RESOLVE
        shell: 'bash'
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          BUILD_ENV_SECRET_NAMES: '${{ inputs.build_env_secret_names }}'

      # Refused here rather than by `wrangler`, which reports a missing token as an authentication
      # failure against an account it could not identify.
      #
      # Empty almost always means one thing: the credentials are ENVIRONMENT secrets in the calling
      # repository. Those cannot reach this workflow by any route -- not `secrets: inherit` (which
      # only carries secrets within one organization, and this library is a different owner), not an
      # explicit `${{ secrets.X }}` (evaluated in the caller's `uses:` job, which cannot declare an
      # environment), and not the `environment:` on the job below, which applies for protection
      # rules and the deployment record but brings no secrets across a repository boundary.
      # Environment VARIABLES do cross, which is what makes this so easy to misread.
      - run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::cloudflare_api_token or cloudflare_account_id is empty. Hold them as REPOSITORY secrets and pass them explicitly. Environment-scoped secrets cannot reach a reusable workflow in another repository -- not with 'secrets: inherit', not explicitly, and not via the environment declared on the deployment job."
            exit 1
          fi
        shell: 'bash'
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.cloudflare_api_token }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.cloudflare_account_id }}'

      # Refused here rather than left to the deploy action, which reaches the same conclusion only
      # after checking the repository out, installing the toolchain and running the whole build --
      # and `wrangler` would not refuse it at all for `pages`, it would create a project named after
      # an empty string.
      - if: "inputs.target == 'pages'"
        run: |
          if [ -z "$PAGES_PROJECT" ]; then
            echo "::error::pages_project is empty. Pass the Cloudflare Pages project name, from a repository variable rather than a literal -- 'wrangler pages deploy' CREATES a project that does not exist, so a stale name forks the site in two instead of failing."
            exit 1
          fi
          echo "deploying the $DEPLOY_ENVIRONMENT environment under the $PAGES_BRANCH pages branch"
        shell: 'bash'

      - uses: 'rios0rios0/pipelines/github/global/stages/50-deployment/cloudflare@main'
        with:
          cloudflare_api_token: '${{ secrets.cloudflare_api_token }}'
          cloudflare_account_id: '${{ secrets.cloudflare_account_id }}'
          target: '${{ inputs.target }}'
          project_name: "${{ env.PAGES_PROJECT }}"
          output_directory: '${{ inputs.output_directory }}'
          branch: "${{ env.PAGES_BRANCH }}"
          production_branch: '${{ inputs.pages_production_branch }}'
          environment: "${{ env.DEPLOY_ENVIRONMENT }}"
          # `npm ci` rather than `npm install`: it installs exactly what `package-lock.json`
          # records and fails when the lockfile and `package.json` disagree, so a deploy cannot
          # quietly resolve a different tree than the one the tests ran against. Nothing has to be
          # bootstrapped first -- npm ships with the Node the action supplies, which is the whole
          # reason this file is shorter than its Yarn sibling.
          build_command: |
            npm ci
            ${{ inputs.build_command }}
    needs: [ 'npm' ]
    # `!failure()` rather than `success()` so a skipped upstream job does not take the deploy with
    # it -- on a tag every job inside `npm.yaml` skips, and a bare `needs:` would stop production
    # shipping altogether. A genuine CI failure on a branch still blocks. A pull request never
    # deploys.
    if: "!failure() && github.event_name != 'pull_request' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))"
