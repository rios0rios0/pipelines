kind: 'Fixed'
body: 'fixed `sca:govulncheck` failing on every Go consumer after the pinned Go toolchain moved to `1.27`: the install was gated on the binary merely existing, so a binary cached by an earlier run was reused forever. `go install` builds govulncheck from source, and it loads the standard library with the source-processing packages of the Go it was BUILT with, so an older binary cannot parse the newer standard library and dies before analysing anything -- reporting zero findings, which reads as a security failure rather than a broken scan. The cached binary is now checked against both the Go on `PATH` and the pinned module version and rebuilt when either differs, which also makes the pin real (a leftover binary of another version used to satisfy the existence test). A failed scan now also echoes the head of its report, since the scan writes to the report file and the log previously carried nothing but an exit code'
