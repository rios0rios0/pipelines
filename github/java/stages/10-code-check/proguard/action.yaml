runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: 'Detect build tool'
      id: 'build_tool'
      shell: 'bash'
      run: |
        if [ -f 'gradlew' ]; then
          echo 'cache=gradle' >> "$GITHUB_OUTPUT"
        elif [ -f 'pom.xml' ]; then
          echo 'cache=maven' >> "$GITHUB_OUTPUT"
        else
          echo 'cache=' >> "$GITHUB_OUTPUT"
        fi

    - name: 'Setup Java'
      uses: 'actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c' # v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: ${{ steps.build_tool.outputs.cache }}

    - uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    - run: $SCRIPTS_DIR/global/scripts/languages/java/proguard/run.sh
      shell: 'bash'

    # The upload below is `continue-on-error`, so it cannot be what fails a scan that exited 0
    # without writing its report. This step keeps that failure.
    - name: 'Verify Report'
      shell: 'bash'
      env:
        REPORT_DIR: 'build/reports/proguard'
      run: |
        if [ -z "$(find "$REPORT_DIR" -type f -print -quit 2> /dev/null)" ]; then
          echo "::error::The scan exited 0 without writing a report to $REPORT_DIR/"
          exit 1
        fi

    - name: 'Upload Report'
      uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
      with:
        name: 'proguard'
        path: 'build/reports/proguard/'
        if-no-files-found: 'warn'
        overwrite: 'true'
        retention-days: 10
      if: always()
      # A refused upload (e.g. `Artifact storage quota has been hit`) must not fail the job:
      # the report is evidence, and the step above already decided pass or fail.
      continue-on-error: true
