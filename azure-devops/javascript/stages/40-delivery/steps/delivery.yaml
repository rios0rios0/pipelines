parameters:
  - name: 'WORKING_DIRECTORY'
    type: 'string'
    default: ''
  - name: 'RUN_BEFORE_DELIVERY'
    type: 'string'
    default: 'echo "No before script"'
  - name: 'RUN_AFTER_DELIVERY'
    type: 'string'
    default: 'echo "No after script"'
  - name: 'DOCKER_BUILD_ARGS'
    type: 'string'
    default: ''
  - name: 'RUN_BEFORE_BUILD'
    type: 'string'
    default: ''
  - name: 'IMAGE_NAME'
    type: 'string'
    default: ''

steps:
  # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
  # through `env:` and running it with `eval` keeps it DATA at template-expansion
  # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
  # so a value containing a newline or a quote used to be able to terminate this
  # step and append steps of its own. Through `env:` the shell only expands it at
  # run time, which is the same fix already applied to `pipelines_ref` in
  # .github/workflows/terra.yaml.
  - bash: 'eval "$PIPELINES_HOOK"'
    workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"
    displayName: 'Run Before'
    env:
      PIPELINES_HOOK: ${{ parameters.RUN_BEFORE_DELIVERY }}

  - script: yarn build
    workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"
    displayName: 'Run Build'

  # The hook's VALUE is shell, supplied by the consumer's pipeline. Passing it
  # through `env:` and running it with `eval` keeps it DATA at template-expansion
  # time: Azure substitutes `${{ }}` into the YAML before the agent ever sees it,
  # so a value containing a newline or a quote used to be able to terminate this
  # step and append steps of its own. Through `env:` the shell only expands it at
  # run time, which is the same fix already applied to `pipelines_ref` in
  # .github/workflows/terra.yaml.
  - bash: 'eval "$PIPELINES_HOOK"'
    workingDirectory: "${{ parameters.WORKING_DIRECTORY }}"
    displayName: 'Run After'
    env:
      PIPELINES_HOOK: ${{ parameters.RUN_AFTER_DELIVERY }}

  - template: '../../../../global/stages/40-delivery/docker.yaml'
    parameters:
      DOCKER_FILE: '.ci/stages/40-delivery/app.Dockerfile'
      CONTAINER_REGISTRY_SERVER: "$(CONTAINER_REGISTRY_SERVER)"
      CONTAINER_REGISTRY_SERVICE_CONNECTION: "$(CONTAINER_REGISTRY_SERVICE_CONNECTION)"
      DOCKER_BUILD_ARGS: "${{ parameters.DOCKER_BUILD_ARGS }}"
      WORKING_DIRECTORY: "${{ parameters.WORKING_DIRECTORY }}"
      RUN_BEFORE_BUILD: "${{ parameters.RUN_BEFORE_BUILD }}"
      IMAGE_NAME: "${{ parameters.IMAGE_NAME }}"
