inputs:
  install_run_scripts:
    required: false
    default: 'false'
    description: |
      Run dependency lifecycle scripts after installing. Installs are
      `--ignore-scripts` by default -- see the note on the install steps.
  package_manager:
    required: false
    default: 'npm'
    description: 'Package manager to use (npm or yarn)'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0

    # Node 25 dropped the bundled Corepack, so `corepack enable` is a command-not-found there.
    # Installed only when genuinely absent: on the versions that still bundle it npm refuses to
    # overwrite the shim it did not install and fails with `EEXIST`. `0.34.7` is the last release
    # whose engines span Node 20 through 26. The shims are written to `$RUNNER_TEMP` and put on
    # `$GITHUB_PATH` rather than left where `corepack enable` puts them by default, which is next
    # to the Node binary -- on a self-hosted runner that is a system path the runner user does
    # not own, so the step dies with `EACCES: permission denied, symlink ... -> '/usr/bin/pnpm'`.
    # Only `yarn` is named because the default also enables the `npm` and `pnpm` shims, neither
    # of which this branch calls.
    #
    # `mktemp -d` rather than a fixed `$RUNNER_TEMP/corepack`, and the random name is the whole
    # point. `$RUNNER_TEMP` is `_work/_temp` on the runner, shared by every job that lands on it,
    # and a CONTAINER job writes there as **root** through the same bind mount -- so a fixed name
    # is a fixed collision.
    #
    # The shim a container job leaves behind points at the corepack inside THAT image
    # (`../../../__t/node/...`), which resolves to nothing on the host, and the runner cannot wipe
    # `_temp` at the next job's start because the files are root-owned and it runs as the runner
    # user. corepack then probes the leftover with `fs.existsSync`, which FOLLOWS symlinks and
    # answers false for a dangling one, so it skips its own unlink and calls `symlink()` on a path
    # that is already there:
    #
    #     Internal Error: EEXIST: file already exists, symlink
    #     '../../../../../../usr/share/nodejs/corepack/dist/yarn.js'
    #         -> '/home/.../actions-runner/_work/_temp/corepack/yarn'
    #
    # Every job that reached this step on that runner failed there until somebody deleted the
    # directory by hand. A fresh `mktemp -d` is owned by whoever runs it and cannot inherit a
    # previous job's leftover, in a container or out of one -- and it replaces the `mkdir -p` this
    # used to need, because `--install-directory` is resolved with `realpath` and does not create
    # what it is given.
    - name: 'Enable Corepack'
      if: inputs.package_manager == 'yarn'
      run: |
        command -v corepack > /dev/null 2>&1 || npm i -g --ignore-scripts corepack@0.34.7
        corepack_dir="$(mktemp -d "$RUNNER_TEMP/corepack.XXXXXX")"
        corepack enable --install-directory "$corepack_dir" yarn
        echo "$corepack_dir" >> "$GITHUB_PATH"
      shell: 'bash'

    - name: 'Setup Node.js'
      uses: 'actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38' # v6.5.0
      with:
        node-version: '20'
        cache: '${{ inputs.package_manager }}'

    # Installed WITHOUT lifecycle scripts. `npm ci` / `yarn install` otherwise run
    # `postinstall` from every package in the transitive tree, as the CI user, before
    # any of this project's own code runs. Knip only needs the dependency graph on
    # disk to resolve imports, so it is the job least likely to need them at all.
    - name: 'Install dependencies (npm)'
      if: inputs.package_manager == 'npm'
      run: |
        npm ci --ignore-scripts
        if [ "$INSTALL_RUN_SCRIPTS" = 'true' ]; then
          npm rebuild
          npm run prepare --if-present
        fi
      shell: 'bash'
      env:
        INSTALL_RUN_SCRIPTS: '${{ inputs.install_run_scripts }}'

    - name: 'Install dependencies (yarn)'
      if: inputs.package_manager == 'yarn'
      run: |
        yarn install --immutable --mode=skip-build
        if [ "$INSTALL_RUN_SCRIPTS" = 'true' ]; then
          yarn rebuild
        fi
      shell: 'bash'
      env:
        INSTALL_RUN_SCRIPTS: '${{ inputs.install_run_scripts }}'

    - uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    - run: $SCRIPTS_DIR/global/scripts/languages/javascript/knip/run.sh
      shell: 'bash'

    - name: 'Upload Report'
      uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
      with:
        name: 'knip'
        path: 'build/reports/knip/'
        if-no-files-found: 'error'
        overwrite: 'true'
        retention-days: 10
      if: always()
