kind: 'Added'
body: 'added `TERRA_TEST_ROOTS` to the terra-test tier: an opt-in, space-separated list of directories (e.g. `stacks`) searched at any depth for root modules that own a `tests/*.tftest.hcl`, whose `terraform test` suites no tier ran before; every platform can set it the way it already expresses options -- the new `terra_test_roots` input of the GitHub Actions `terra.yaml` (a called workflow''s jobs never see the caller''s environment, so an input is the only way in), a new `TERRA_TEST_ROOTS` parameter threaded through the Azure DevOps `terra.yaml` into its tests stage and mapped into the step only when non-empty, so a pipeline variable of that name keeps working instead of being shadowed by an empty `env:` entry, and a GitLab CI variable that `test:all` deliberately leaves undeclared, since a job-level variable would outrank the consumer''s; each root is initialised `-backend=false` and without the `-upgrade` the module loop uses, so a committed lock file decides its providers and is never rewritten, writes a JUnit named after its path that `terra-tests.xml` and `junit-terra-all.xml` both pick up, fails the job on a failing case and stays out of the module breadth figures; a root whose test would apply with its real providers -- a `run` block with no `command`, or `command = apply`, in a file with no `mock_provider`, among every file `terraform test` reads there, the `*.tftest.hcl` beside its `.tf` files included -- is refused before `init` instead of run, because under `-backend=false` a cancelled job would orphan whatever the apply created: the job log names each file and run block, the refusal is written as a failed JUnit case so every report agrees with the exit code, the next root still runs, and the check tokenizes the files in POSIX `awk` so comments, strings, heredocs and nested blocks can neither hide an apply nor fake a `command = plan`, refuses a `*.tftest.json` it cannot read, and never touches the module loop; `test-all/run.sh` asks the same `roots.sh` selection, which ignores `tests/e2e/` and vendored `.terraform/` and `.terragrunt-cache/` copies, so a repository whose only tests sit under those roots is detected; empty by default, so nothing changes for a consumer that does not set it, and `make test-terra-test-roots` covers it'
