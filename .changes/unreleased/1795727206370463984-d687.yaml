kind: 'Fixed'
body: 'fixed the Azure DevOps rebase check of `quality:basic-checks`, which passed every pull request, rebased or not: it compared the merge commit a pull request build checks out, `refs/pull/<id>/merge`, which always contains the target branch, and its fetch of the target branch failed unnoticed because the checkout keeps no credentials. It now judges the pull request''s source commit (`System.PullRequest.SourceCommitId`, else the merge commit''s second parent), fetches the target with the job''s `System.AccessToken` passed through the environment rather than a command line, and fails when it cannot fetch the target or resolve either commit. A pull request behind its target therefore fails until it is rebased, as the check always meant; `make test ONLY=azure-devops-rebase-check` holds it'
