.sdk:
  image: 'mcr.microsoft.com/dotnet/sdk:8.0@sha256:6ba9644da07bb5b560a402acec9ca38711a0762969f1b61da261df5c9f6f85da'
  cache: # relative to the project directory ($CI_PROJECT_DIR)
    key: "$CI_JOB_NAME"
    paths:
      - 'packages'
    when: 'always'
  before_script:
    - export PATH="$PATH:/root/.dotnet/tools"
    - export SLN_FILE=$(find . -name "*.sln" -print -quit)
    - dotnet restore --packages packages $SLN_FILE
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
