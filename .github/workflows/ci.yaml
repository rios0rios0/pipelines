name: 'CI - Pipeline Templates Validation'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 'Validate Templates and Scripts'
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Setup Go 1.25'
        uses: 'actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e' # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: 'go.sum'
          # See `github/golang/stages/10-code-check/golangci-lint/action.yaml` for the measured
          # reason this is gated: on a self-hosted runner GOMODCACHE and GOCACHE persist on local
          # disk, the restore untars over files that already exist, `tar` exits 2 and the entire
          # download is discarded. `runs-on` is hard-coded to a hosted runner in this file, so the
          # expression is a no-op today. It is written anyway so the rule `make
          # test-runner-cache-gating` enforces needs no exemption list, and so that adding a
          # `runs_on` input here later cannot silently reintroduce the defect.
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: 'Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-yaml make

      - name: 'Check required files'
        run: |
          echo "Checking required files..."
          for f in CONTRIBUTING.md CHANGELOG.md README.md Makefile clone.sh; do
            test -f "$f" && echo "  ✓ $f" || { echo "  ✗ $f is missing"; exit 1; }
          done
          for f in .github/tests/test-go-validation.sh .github/tests/test-go-tool-staleness.sh .github/tests/test-lambda-templates.sh .github/tests/test-sonarqube-auto-derive.sh .github/tests/test-release-tag-idempotency.sh .github/tests/test-docker-multi-arch.sh .github/tests/test-dart-pipeline.sh; do
            test -f "$f" && echo "  ✓ $f" || { echo "  ✗ $f is missing"; exit 1; }
          done

      - name: 'Validate YAML syntax'
        run: |
          echo "Validating YAML files across all providers..."
          errors=0
          for template in $(find github gitlab azure-devops global .github/workflows .docs/examples -name '*.yaml' -o -name '*.yml' 2>/dev/null); do
            if python3 -c "
          import yaml
          # Handle custom YAML tags used by GitLab CI (e.g., !reference)
          class CustomSafeLoader(yaml.SafeLoader):
              pass
          def default_constructor(loader, tag_suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  return loader.construct_scalar(node)
              elif isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              elif isinstance(node, yaml.MappingNode):
                  return loader.construct_mapping(node)
          CustomSafeLoader.add_multi_constructor('!', default_constructor)
          yaml.load(open('$template'), Loader=CustomSafeLoader)
          " 2>/dev/null; then
              echo "  ✓ $template"
            else
              echo "  ✗ $template -- invalid YAML"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors YAML validation error(s)"
            exit 1
          fi

      - name: 'Validate script permissions'
        run: |
          echo "Checking script permissions..."
          errors=0
          for script in $(find global/scripts -name "run.sh" -type f); do
            if [ ! -x "$script" ]; then
              echo "  ✗ $script is not executable"
              errors=$((errors + 1))
            else
              echo "  ✓ $script"
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors permission error(s) -- run: chmod +x <script>"
            exit 1
          fi

      - name: 'Run all validation tests'
        run: make test

  lint-scripts:
    name: 'Lint Shell Scripts'
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      # This repository lints itself with the same runner it ships to consumers, rather than
      # with a second implementation maintained here. That closes two gaps at once.
      #
      # SCOPE: the loop this replaces iterated `find global/scripts`, so `.github/tests/` --
      # the largest body of shell in the repository -- was never linted by CI at all. Ten
      # warnings accumulated there unread, visible only to somebody invoking the runner by
      # hand. The runner scans from the repository root, excluding `.git`, `node_modules`,
      # `vendor` and `.codeql-db`.
      #
      # VERSION: `apt-get install shellcheck` took whatever the Ubuntu image shipped that day.
      # The runner installs a version pinned in `pinned-versions.sh` and checksum-verified by
      # `verify-download.sh` -- which is this repository's own supply-chain rule, and the
      # reason the runner gives for pinning applies exactly here: a new ShellCheck release
      # adds checks, so an unchanged script could pass in the morning and fail in the
      # afternoon with nothing in the diff to explain it.
      #
      # Severity is unchanged (`--severity=warning`), and the runner already exits non-zero on
      # a finding, so the gate keeps failing the build the way the loop did.
      - name: 'Run ShellCheck'
        run: ./global/scripts/tools/shellcheck/run.sh
        env:
          SCRIPTS_DIR: ${{ github.workspace }}
