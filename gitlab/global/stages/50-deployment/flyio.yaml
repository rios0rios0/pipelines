include:
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/abstracts/default-variables.yaml'
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/abstracts/scripts-repo.yaml'

# Deploy to Fly.io.
#
# Required CI/CD variables (mask FLY_API_TOKEN):
#   FLY_API_TOKEN
# Optional:
#   FLY_APP_NAME (when fly.toml does not declare it), FLY_CONFIG, FLY_STRATEGY
#   FLY_ORG -- set it to have the deploy CREATE the app when it does not exist
#   yet, so a new environment's first pipeline is not red. It requires an
#   ORG-SCOPED token (`flyctl tokens create org`), which manages every app in
#   the organisation; an app-scoped deploy token cannot create apps. Leave it
#   unset to keep the tighter app-scoped token and create apps by hand.
#
# No Docker-in-Docker service: the script passes `--remote-only`, so the image
# is built on Fly's builder. That is the whole reason this job can run on an
# ordinary shared runner without privileged mode.
deployment:flyio:
  extends: '.scripts-repo'
  image: 'alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b'
  stage: 'deployment'
  environment:
    name: 'production'
  before_script:
    - apk add --no-cache git curl tar
    - !reference [ '.scripts-repo', 'before_script' ]
  script:
    - $SCRIPTS_DIR/global/scripts/deploy/flyio/run.sh
  artifacts:
    when: 'always'
    paths:
      - "$REPORT_PATH/deploy-flyio/"
  dependencies: [] # prevent from fetching artifacts
  timeout: '45 minutes'
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $FLY_API_TOKEN"
