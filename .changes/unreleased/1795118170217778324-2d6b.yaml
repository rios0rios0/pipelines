kind: 'Fixed'
body: 'fixed the Azure DevOps Go Lambda SAM delivery (`azure-devops/golang/stages/40-delivery/lambda.yaml`) failing `sam package` with `ExpiredToken` after a build that took nearly as long as the service connection''s credentials last: `AWSShellScript@1` takes them as it starts, and those of a connection that assumes a role last 15 minutes unless the pipeline sets `aws.rolecredential.maxduration`, so the `sam build` that ran inside that step spent their lifetime compiling. `sam build` now runs in a plain step of its own (`Build with AWS SAM`) ahead of both packaging steps, which only package, in the same working directory with the same template, Go module cache and `GOTOOLCHAIN`, and with the `AWS_REGION` and `AWS_DEFAULT_REGION` the task used to give it; the three steps run only once the steps before them succeeded, so `sam package` never runs after a failed build, and the environment-variable path checks its credentials after the build, as the ZIP strategy does; `make test ONLY=lambda-templates` holds it'
time: '2026-11-19T19:56:10.217612309Z'
