kind: 'Fixed'
body: 'fixed the SonarQube and Dependency-Track report jobs failing whenever their server was briefly away: on 2026-10-21 a consuming organisation''s SonarQube and Dependency-Track, both behind Cloudflare, were unreachable for about two minutes, and the report jobs that reached them then failed -- `sonar-scanner` with `Connection reset`, `HTTP 500` or `Error 521` depending on the call it was making, the BOM upload with `HTTP 521` -- while the next run of each one reached its server without trouble. `dependency-track/run.sh` now retries an upload answered with no response, `408`, `429` or `5xx` (the upload is an upsert, so sending it again is safe) and fails at once on any other answer, as before. `sonarqube/run.sh` now runs `sonar-scanner` again when one of its `ERROR` or `Caused by` lines names a refused or reset connection, a timeout or a 5xx answer, and never once the quality gate has given its verdict; the output still streams to the job log. Both wait longer before each retry and give up after five minutes by default: `DEPENDENCY_TRACK_ATTEMPTS` / `DEPENDENCY_TRACK_RETRY_DELAY` and `SONARQUBE_ATTEMPTS` / `SONARQUBE_RETRY_DELAY` (defaults `5` and `30` seconds) change that'
time: '2026-10-22T15:37:51.310331845Z'
