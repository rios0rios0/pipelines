kind: 'Added'
body: 'added `--apply` to the dependency-update checker (`make apply-dependency-updates` runs it locally): it rewrites every outdated pin in place and writes the pull request''s title, body and commit message. Each new digest comes from the new release''s asset -- the SHA-256 GitHub recorded for it, or the downloaded bytes for a release older than GitHub''s digests -- and must match the publisher''s checksum manifest, read in GNU or BSD format; before that, the asset template must reproduce the committed digest of the current version. To make that possible every `*_SHA256*` in `pinned-versions.sh` now carries an `# asset:` URL template and every pin whose publisher ships one a `# checksums:` manifest, all thirty checked live against their committed digests, and `run.sh --verify-assets` re-checks them after an edit. A pin that fails any of those checks, or whose upstream names a release with a character unsafe to write into a sourced shell file or a workflow, is left exactly as it was and listed for a person instead of being half-applied'
