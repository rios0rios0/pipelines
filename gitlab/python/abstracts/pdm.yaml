.pdm:
  image: 'ghcr.io/rios0rios0/pipelines/python:3.14-pdm-trixie@sha256:74e5a7163d31d376127cd27dd7aa9217cbb212612d14bd680328c2830892ef65'
  cache: # relative to the project directory ($CI_PROJECT_DIR)
    key: "$CI_JOB_NAME"
    paths:
      - '.venv'
    when: 'always'
  before_script:
    - pdm install
  tags:
    - 'dev-gitlab-runner-onprem'
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.pdm-prod:
  extends: '.pdm'
  cache:
    key: "$CI_JOB_NAME-prod"
    paths:
      - '.venv'
    when: 'always'
  before_script:
    - pdm install --prod
