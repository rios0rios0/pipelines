kind: 'Fixed'
body: 'fixed `isLatest=true` being asserted on every single upload. At most one version per name carries the flag, and a collection project with `AGGREGATE_LATEST_VERSION_CHILDREN` reads its metrics from that child — so a build of an older version silently moved the flag backwards and the parent then reported a risk score belonging to the wrong version. It is now claimed only for the default branch or a tag, detected from each CI''s own variables'
time: '2026-08-25T21:32:41.694470851Z'
