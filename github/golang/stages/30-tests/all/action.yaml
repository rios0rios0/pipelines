inputs:
  database_image:
    description: |
      Container image of a PostgreSQL-compatible database to run the tests against (e.g.
      'postgres:18-alpine'). Empty skips provisioning entirely.
    required: false
    default: ''
  database_url_env:
    description: |
      Name of the environment variable the composed connection URL is exported into. Required
      when `database_image` is set.
    required: false
    default: ''
  coverage_threshold:
    description: 'Minimum total coverage percentage; the step fails below it. 0 disables the gate.'
    required: false
    default: '0'
  integration_parallel:
    description: |
      How many integration test binaries `go test` runs concurrently (its `-p` flag). The default
      1 keeps the phase serial, which is what a suite sharing one fixture (an embedded PostgreSQL
      on a fixed port, for one) requires. Raise it only when the fixtures allocate per-instance
      resources.

      Declared as an INPUT rather than read from the environment because a workflow that `uses:`
      a reusable workflow cannot pass arbitrary environment variables into it -- only `inputs` and
      `secrets` cross that boundary, so an `env:` at the call site would silently never arrive.
    required: false
    default: '1'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    # Hoisted above the database step, which runs one of the scripts it fetches.
    # `SCRIPTS_DIR` is written to `$GITHUB_ENV`, so it is only readable from the
    # steps that come AFTER this one.
    - uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    # Started here with `docker run` rather than declared as a job-level `services:` block,
    # because a service block cannot be omitted by expression -- declaring one unconditionally
    # would force a database on every consumer that does not want one.
    #
    # The script rather than an inline `run:` block: the provisioning has to name
    # `POSTGRES_PASSWORD`, which is the PostgreSQL image's documented contract and cannot be
    # renamed away, and inside a YAML block scalar that name reads as a hard-coded credential
    # in a configuration file to every analyser that parses YAML. In shell it is parsed as
    # shell, where the value is plainly generated rather than written down.
    #
    # Both inputs cross through `env:` rather than being substituted into the script's text,
    # so a consumer's image name is data to the shell and never a fragment of it.
    - name: 'Start the test database'
      if: "inputs.database_image != ''"
      shell: 'bash'
      run: '$SCRIPTS_DIR/global/scripts/languages/golang/test/database.sh'
      env:
        DATABASE_IMAGE: '${{ inputs.database_image }}'
        DATABASE_URL_ENV: '${{ inputs.database_url_env }}'

    - name: 'Setup Go'
      id: 'setup-go'
      uses: 'actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e' # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: 'go.sum'
        # Skipped on a self-hosted runner, where GOMODCACHE and GOCACHE persist on local
        # disk between jobs. There the restore is not merely redundant -- it untars the archive
        # over files that already exist, `tar` exits 2 with `Cannot open: File exists`, the
        # action logs `Failed to restore`, and the entire download is discarded. Measured on a
        # 12-vCPU self-hosted runner: 2.3-2.5 GB pulled at ~8 MB/s, 344-702s PER JOB across four
        # jobs of the same run, against 1s when that job happens to miss the cache.
        #
        # This is the reasoning the codeql stage already applies, read the other way round: it
        # skips the cache because its runner is thrown away, and these skip it because theirs
        # is not.
        #
        # `!= 'self-hosted'` rather than `== 'github-hosted'` so an empty context keeps
        # today's behaviour instead of silently disabling the cache for hosted consumers.
        cache: ${{ runner.environment != 'self-hosted' }}

    # Resolve the directory `go install` actually targets. `go install`
    # honours `$GOBIN` if set, otherwise falls back to `$(go env GOPATH)/bin`.
    # Hardcoding `~/go/bin` would silently miss the binaries on any runner
    # (or future `setup-go` change) where either of those is overridden.
    - name: 'Resolve Go test tool binary directory'
      shell: 'bash'
      run: |
        gobin="$(go env GOBIN)"
        if [ -n "$gobin" ]; then
          go_bin_dir="$gobin"
        else
          go_bin_dir="$(go env GOPATH)/bin"
        fi
        mkdir -p "$go_bin_dir"
        echo "GO_BIN_DIR=$go_bin_dir" >> "$GITHUB_ENV"

    # `actions/setup-go@v6` caches `$GOMODCACHE` (module downloads) and
    # `$GOCACHE` (build/test cache) by default, but it does NOT cache
    # the effective Go binary install directory. Without this step,
    # `test/run.sh` reinstalls `gotestsum`, `gocovmerge`, and
    # `gocover-cobertura` on every run — each `@latest` resolution
    # hits the module proxy and each binary is rebuilt from scratch,
    # which dominates the wall time of a cache-warm test job.
    # Caching the resolved Go bin dir lets the runner skip the
    # `go install` chain entirely when the binaries are already on
    # disk (the script's `[ -x ... ] ||` guards short-circuit).
    # The cache key includes `runner.arch` so amd64 / arm64 runners
    # in the same repo do not restore each other's binaries.
    - name: 'Cache Go test tool binaries'
      uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
      with:
        path: '${{ env.GO_BIN_DIR }}'
        key: '${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-test-tools-v1'
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-test-tools-
          ${{ runner.os }}-${{ runner.arch }}-go-test-tools-

    - run: $SCRIPTS_DIR/global/scripts/languages/golang/test/run.sh
      shell: 'bash'
      env:
        GO_TEST_INTEGRATION_PARALLEL: '${{ inputs.integration_parallel }}'

    # The test runner prints coverage but never fails on it, so without this the number can
    # drift down one merge at a time and nothing notices.
    - name: 'Coverage Gate'
      if: "always() && inputs.coverage_threshold != '0' && hashFiles('coverage.txt') != ''"
      shell: 'bash'
      run: |
        set -euo pipefail

        total="$(go tool cover -func=coverage.txt | awk '/^total:/ {print $3}' | tr -d '%')"
        if [ -z "$total" ]; then
          echo '::error::could not read a total from coverage.txt'
          exit 1
        fi

        echo "total coverage: ${total}% (minimum ${{ inputs.coverage_threshold }}%)"
        if awk -v t="$total" -v m='${{ inputs.coverage_threshold }}' 'BEGIN { exit !(t < m) }'; then
          echo "::error::coverage ${total}% is below the ${{ inputs.coverage_threshold }}% minimum"
          exit 1
        fi

    # Always torn down, including when the tests failed, so a self-hosted runner is not left
    # holding a container and port 5432 for the next job.
    - name: 'Stop the test database'
      if: "always() && inputs.database_image != ''"
      shell: 'bash'
      run: 'docker rm --force pipelines-test-db || true'
