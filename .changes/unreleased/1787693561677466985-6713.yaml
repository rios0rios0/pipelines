kind: 'Fixed'
body: 'added `make test-runner-cache-gating` (`.github/tests/test-runner-cache-gating.sh`), which fails when an `actions/setup-go` is left at its default `cache: true` or an `actions/cache` names a `~/…` path without gating on `runner.environment`. It is the reason this was completable rather than repeatable: five of six Go sites were fixed and the sixth was missed, and three further sites in `terra.yaml` were invisible to a `grep -r` because `github/terra/terra.yaml` is a SYMLINK into `.github/workflows/` and `grep -r` does not follow one. Every assertion is proven to fire against a deliberate violation and proven **not** to fire against the four shapes that are correct, because a checker that reports everything would pass the first half while making the rule impossible to satisfy'
