parameters:
  # Extra environment variables to expose to the test run. Azure Pipelines
  # gates secret variables from the process environment of script steps, so
  # secret-backed settings (tokens, passwords) must be mapped explicitly here
  # or the tests receive empty values. Defaults to none for existing consumers.
  - name: 'TEST_ENV'
    type: object
    default: {}
  # Remove what a Go job never uses from a Microsoft-hosted agent before the
  # tests run: the Android SDK, the .NET SDKs, GHC, Swift, the CodeQL bundles
  # of the tool cache and the pre-pulled Docker images, logging `df -h /`
  # before and after (global/scripts/languages/golang/free-disk-space/run.sh).
  # Off by default: it deletes toolchains from the machine, which a hosted
  # agent throws away after the job and a self-hosted one would keep missing.
  - name: 'FREE_DISK_SPACE'
    type: boolean
    default: false

steps:
  - template: 'go.yaml'

  # Once `go.yaml` has checked the scripts out and set Go up, and before the
  # tests build anything or pull an image: a large module compiled twice and the
  # images of its integration suites are what fill the agent.
  - ${{ if eq(parameters.FREE_DISK_SPACE, true) }}:
      - script: $(Scripts.Directory)/global/scripts/languages/golang/free-disk-space/run.sh
        displayName: 'Free Disk Space'

  - script: $(Scripts.Directory)/global/scripts/languages/golang/test/run.sh
    displayName: 'Run Tests'
    ${{ if gt(length(parameters.TEST_ENV), 0) }}:
      env:
        ${{ each pair in parameters.TEST_ENV }}:
          ${{ pair.key }}: ${{ pair.value }}

  - task: 'PublishTestResults@2'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/junit.xml'
    displayName: 'Publish JUnit XML Results'

  - task: 'PublishCodeCoverageResults@2'
    inputs:
      summaryFileLocation: 'cobertura.xml'
    displayName: 'Publish Cobertura XML Results'

  - task: 'PublishPipelineArtifact@1'
    inputs:
      artifactName: 'coverage'
      targetPath: "$(System.DefaultWorkingDirectory)/coverage.txt"
    displayName: 'Publish Coverage Files'
