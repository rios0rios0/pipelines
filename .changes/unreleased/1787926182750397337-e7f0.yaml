kind: 'Changed'
body: 'merged the three Claude review jobs into a single job whose one prompt covers correctness, security, and software design. The three-job layout worked on its pilot pull request but posted three comments per push -- six after one review-and-fix round -- which was too much noise for the signal. One job posts one comment, and a single job is also what makes `use_sticky_comment` safe again (its lookup claims the first Claude comment, so parallel jobs raced to overwrite one tracking comment), so every later push now updates the same comment in place instead of adding more. The merged prompt runs six sequential in-session passes -- the 4-agent pipeline plus a security pass and a design pass -- and applies the >=80 confidence filter to every finding from every pass, each survivor labeled with its dimension and score and every dropped candidate listed with the reason. Cost drops from three Opus sessions per push to one. `.docs/claude-review.md` records the consolidation rationale.'
