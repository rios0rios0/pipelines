stages:
  - stage: 'management'
    displayName: 'management'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    jobs:
      - template: '../../../global/stages/35-management/sonarqube.yaml'
        parameters:
          # Terraform consumers don't produce a `coverage` artifact, so the
          # default download step emits `##[error]Artifact coverage was not
          # found` and turns the job yellow. Skip it.
          DOWNLOAD_COVERAGE_ARTIFACT: false

      # NOTE: there is no `report:dependency-track` job for Terraform.
      # Dependency-Track ingests CycloneDX, and the BOM here was produced by
      # `trivy fs --format cyclonedx` — the only CycloneDX generator that reads
      # `.terraform.lock.hcl` provider pins and module `source =` references.
      # Trivy has been removed from this repository, and no replacement
      # Terraform BOM generator has been wired yet, so the job was removed
      # rather than left calling a script that no longer exists.
