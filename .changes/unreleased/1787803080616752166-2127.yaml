kind: 'Added'
body: 'added shared ignore rules for the files the pipeline writes into a consumer working tree. `global/gitignore/` holds the canonical lists -- `common` plus one fragment per language -- and `make gitignore` generates them into a delimited block in the consumer own `.gitignore`, while `make gitignore-check` fails when that block is stale. Consumers previously had to know those filenames and track them by hand, so a script that started writing a new report leaked it into every repository at once, silently: across the 17 repositories consuming these makefiles, not one ignored everything the pipeline generates, and `.codeql-db/` was uncommitted-but-unignored in all 17. The rules are GENERATED rather than referenced because Git has no `include` directive for ignore files and refuses to follow a symlinked `.gitignore`; the two mechanisms that do accept an external file, `core.excludesFile` and `$GIT_DIR/info/exclude`, are local to a clone and therefore invisible to CI, to a fresh checkout, and to any bot running `git add -A`. The block sits first in the file because gitignore resolves last-match-wins, so a project own entries below it -- including a `!` negation -- still override it'
