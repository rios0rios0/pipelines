.pdm:
  image: 'ghcr.io/rios0rios0/pipelines/python:3.10-pdm-bullseye@sha256:bd29b1938e1fdc4e6abc3ecffa51f52c87d0985647d3b75ee86d3f2d338dfb27'
  cache: # relative to the project directory ($CI_PROJECT_DIR)
    key: "$CI_JOB_NAME"
    paths:
      - '.venv'
    when: 'always'
  before_script:
    - pdm install
  tags:
    - 'dev-gitlab-runner-onprem'
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.pdm-prod:
  extends: '.pdm'
  cache:
    key: "$CI_JOB_NAME-prod"
    paths:
      - '.venv'
    when: 'always'
  before_script:
    - pdm install --prod
