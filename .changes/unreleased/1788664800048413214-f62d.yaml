kind: 'Fixed'
body: 'fixed `Build & Push python:3.10-pdm-bullseye`, which had been failing with `404 Not Found` on `libperl5.32` and `libglib2.0-dev`: Debian 11 "bullseye" reached end of LTS on 2026-08-31 and its suites were REMOVED from deb.debian.org rather than frozen, so `apt-get install` could no longer resolve a single one of them. Both PDM images moved to Debian 12 "bookworm" (`python:3.10-slim-bookworm`, `python:3.13-slim-bookworm`, digest-pinned as every `FROM` here is) and their folders were renamed with the codename they publish -- `python:3.10-pdm-bullseye` -> `python:3.10-pdm-bookworm`, `python:3.13-pdm-bullseye` -> `python:3.13-pdm-bookworm` -- because the folder name IS the published tag. The 3.13 image installs no apt packages and so had not failed yet; it was moved with its sibling rather than left to hit the same 404 on its next rebuild. Pointing apt at archive.debian.org was rejected: it buys a green build by shipping a base that receives no security updates, which is the right trade only for `python.3.9-pdm-buster`, where consumers are pinned to an EOL Python. The old tags stay published and simply stop being rebuilt'
time: '2026-09-06T03:20:00.048266026Z'
