kind: 'Fixed'
body: 'fixed `quality:basic-checks` failing the scheduled dependency pull requests that [autoupdate](https://github.com/rios0rios0/autoupdate) opens. autoupdate does not restate an entry the target branch already records as pending — it runs unattended against the same repositories, so without that check yesterday''s bullet is written again verbatim on every run until a release moves it away — which means a correct run legitimately carries no fragment and no `CHANGELOG.md` edit, and the changelog gate refused it. A branch carrying the automation prefix (`chore/autoupdate-` by default, `AUTOUPDATE_BRANCH_PREFIX` to override) now needs a new entry **or** one already pending on the target branch. It is not a blanket skip: nothing added and nothing pending still fails, only `.yaml`/`.yml` counts as pending so a `.gitkeep` is not mistaken for an entry, and the exemption does not extend to human branches, where "something was already pending" is a coincidence rather than a defence'
