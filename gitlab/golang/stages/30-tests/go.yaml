include:
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/golang/abstracts/go.yaml'
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/stages/30-tests/test-pyramid.yaml'

test:all:
  extends: '.go'
  stage: 'tests'
  script:
    - !reference [ .scripts-repo, before_script ]
    - $SCRIPTS_DIR/global/scripts/languages/golang/test/run.sh
  coverage: '/total.*?([0-9]{1,3}[.][0-9]{0,2})%/'
  artifacts:
    when: 'always'
    paths:
      - 'coverage.*'
    reports:
      coverage_report:
        coverage_format: 'cobertura'
        path: 'coverage.xml'

test:build:
  extends: '.go'
  stage: 'tests'
  script:
    - mkdir -p ./bin
    - go build -o ./bin ./...
  artifacts:
    paths:
      - 'bin'

# Does this merge request worsen the shape of the test suite? Merge requests only; advisory
# unless the target branch's `.test-pyramid` says `blocking true`. See
# gitlab/global/stages/30-tests/test-pyramid.yaml and README.md, "Test Pyramid".
test:pyramid:
  extends: '.test-pyramid'
  variables:
    TEST_PYRAMID_LANGUAGE: 'go'
