kind: 'Added'
body: 'added the `test_selection` input to `go.yaml`, `go-docker.yaml`, `go-flyio.yaml` and `go-render.yaml`, which the Go test action hands to `run.sh` as `GO_TEST_SELECTION`: `all`, the default, runs every package as before, and `affected` narrows both test phases to the packages a pull request can reach -- those whose files it changed, embedded files included, and every package whose dependency closure, read from `go list -test` under the unit and the integration tags, holds one of them. It runs everything instead, and logs why, when the change touches `go.mod`, `go.sum`, `go.work`, `vendor/`, a Makefile, CI configuration or any other file outside every Go package, or when no merge base with the base branch is found, and a documentation-only change runs nothing and passes. In `affected` mode the test checkout fetches the whole history, the coverage gate reports the partial coverage without enforcing `coverage_threshold`, and an empty test report does not fail the job. On GitLab CI and Azure DevOps the runner reads `GO_TEST_SELECTION` and `GO_TEST_SELECTION_BASE`, and a GitLab merge request falls back to `CI_MERGE_REQUEST_DIFF_BASE_SHA`'
