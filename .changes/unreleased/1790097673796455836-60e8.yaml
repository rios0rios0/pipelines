kind: 'Fixed'
body: 'fixed `quality:knip` on Azure DevOps, which failed on every run since knip was pinned to 6.34.0: the JavaScript stages ran on Node 20.18.3 through the `corepack-node20.18.3` abstracts, while knip 6 requires `^20.19.0 || >=22.12.0`, so the pinned `npx --yes --ignore-scripts knip` step only WARNED `EBADENGINE`, then died loading `oxc-parser`''s native binding with an error pointing at npm''s optional-dependency bug rather than at the runtime. The abstracts are now `corepack-node.yaml` / `corepack-node-no-cache.yaml`, pinning 20.20.2 (the newest Node 20, so the major every Azure JavaScript consumer already runs on does not change) inside the file rather than in its name, so the next bump is a one-line edit with no new file; the five stage templates that include them were updated, and the old `corepack-node20.18.3` names stay as one-line forwards because consumers include these abstracts by path from their own `.ci/` wrappers and a bare rename made Azure fail every such pipeline at expansion time; the pin carries a comment naming knip''s floor so a future bump cannot move it back below 20.19. GitHub Actions never had the problem, because `actions/setup-node` resolves its `''20''` default to the newest 20.x. GitLab CI still runs the JavaScript jobs on `node:18.17.1-bullseye` (yarn) and `node:16.14.0-bullseye` (npm), which knip 6 cannot run on either; that is a separate image bump'
time: '2026-09-22T17:21:13.796399504Z'
