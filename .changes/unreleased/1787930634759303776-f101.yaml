kind: 'Added'
body: 'added a thirteenth assertion to `make test-workflow-composition`, pairing each Claude workflow prompt with the tools its job actually grants. A granted `Bash(...)` command missing from the prompt re-creates the defect the prompts exist to fix (the model meets its own tools by being denied them); a command the prompt calls denied while the allowlist grants it is the same drift reversed. The same assertion pins `prompt` to `track_progress: true`, so the mention responder cannot be flipped into agent mode by an edit that looks like adding context. Both halves read sentences rather than paragraphs, because a prompt states an exclusion wherever it is clearest: the mention responder puts one in its Tools paragraph, where a paragraph-scoped check both failed to read it and counted the denial as a description -- so granting `Bash(gh:*)` would have left the assertion green while the prompt called that tool denied. All six failure shapes were proven to fire against deliberate violations.'
