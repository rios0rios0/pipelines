kind: 'Changed'
body: 'changed `reusable-claude-review.yaml` to skip the pull requests automation opens. A `chore/bump-*` or `bump/*` release pull request moves a version number and folds the pending changelog fragments into `CHANGELOG.md`, and a `chore/autoupdate-*` pull request carries a dependency bump — all three are generated wholesale by a tool and merged unread, so every review of one spent a full-diff Opus run on a diff nobody reads back. The job `if:` now skips them alongside the drafts and fork pull requests it already skipped. The prefixes are the ones `basic-checks` already exempts from the changelog rule, so one repository does not teach two jobs two names for the same automation: the two bump shapes are literal and the autoupdate prefix is the new optional `autoupdate_branch_prefix` input (`chore/autoupdate-` by default, the counterpart of `AUTOUPDATE_BRANCH_PREFIX`), because `startsWith` takes one prefix and a GitHub expression cannot iterate a list. Emptying that input reviews autoupdate pull requests rather than skipping every pull request — `startsWith(ref, "")` is true, so the guard reads the input only behind a non-empty check. `make test-workflow-composition` gains a fourteenth assertion that EVALUATES the expression against nine pull requests whose verdict is known, rather than matching its text, so it survives a reordering or an input rename and still fails when a prefix is dropped. GitHub Copilot cannot be given the same guard and the reason is documented rather than worked around: `copilot_code_review` takes only `review_draft_pull_requests` and `review_on_push`, and a ruleset ref condition targets the base branch, so the feature has no head-branch or author filter'
