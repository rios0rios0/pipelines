inputs:
  fly_api_token:
    description: 'Fly.io deploy token (`flyctl tokens create deploy`). Pass a secret.'
    type: 'string'
    required: true
  app_name:
    description: 'Fly application name. Optional when fly.toml declares it.'
    type: 'string'
    required: false
    default: ''
  org:
    description: |
      Fly.io organization slug. Setting it lets the deploy CREATE the app when it does not exist
      yet, so a new environment's first run is not red. Requires an ORG-SCOPED token
      (`flyctl tokens create org`) -- an app-scoped deploy token cannot create apps. Leave empty
      to keep app-scoped tokens and create apps by hand.
    type: 'string'
    required: false
    default: ''
  machine_count:
    description: |
      Exact number of machines the app runs after a successful deploy, enforced with
      `flyctl scale count`. `1` also passes `--ha=false`, so the deploy does not create Fly's
      default spare. Leave empty to let Fly manage the count.
    type: 'string'
    required: false
    default: ''
  config:
    description: 'Path to the Fly configuration file.'
    type: 'string'
    required: false
    default: 'fly.toml'
  strategy:
    description: 'Deployment strategy (`rolling`, `immediate`, `canary`, `bluegreen`). Left unset, Fly picks its own default.'
    type: 'string'
    required: false
    default: ''
  image:
    description: |
      An image the pipeline already built and pushed, to deploy instead of building one --
      `go-flyio.yaml` passes the one `delivery > docker` pushed, by digest. Its linux/amd64
      image is copied to `registry.fly.io/<app>` with `crane` and deployed by digest, so Fly
      builds nothing. Leave empty to build the Dockerfile from source on Fly's builder
      (`--remote-only`), which is what happens without it.
    type: 'string'
    required: false
    default: ''
  image_registry_username:
    description: |
      User for the registry holding `image`. The default, the workflow's actor, is the user
      `ghcr.io` expects with the job token.
    type: 'string'
    required: false
    default: '${{ github.actor }}'
  image_registry_password:
    description: |
      Password for the registry holding `image`. The default is the job token, which reads this
      repository's `ghcr.io` packages when the job grants `packages: read`. Pass a secret for any
      other registry. Reaches the script only when `image` is set, and only on stdin from there.
    type: 'string'
    required: false
    default: '${{ github.token }}'
  version_build_arg:
    description: |
      Name of the Dockerfile `ARG` that receives the app's version (e.g. `VERSION`), passed
      to Fly's build with `--build-arg`. Leave empty to pass nothing, which is the default.
      Not passed with `image`, which was built with its version already in it.
    type: 'string'
    required: false
    default: ''
  version:
    description: |
      The version `version_build_arg` receives. Leave empty to derive it: the tag on a tag
      build, the commit's first 7 characters otherwise.
    type: 'string'
    required: false
    default: ''
  environment:
    description: 'Deployment environment label, recorded in the deployment report.'
    type: 'string'
    required: false
    default: 'production'
  dry_run:
    description: 'Resolve and record the deploy command without performing it.'
    type: 'string'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

    - name: 'Get Scripts'
      uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

    # No Docker setup step, on either path. With `image`, the script copies it
    # registry to registry with `crane`; without it, it passes `--remote-only`
    # and Fly's builder builds. Neither needs a daemon on the runner.
    #
    # Every input reaches the script through `env:`, never spliced into `run:`.
    # The registry password is mapped only when there is an image to read, so the
    # job token does not sit in the environment of a deploy that never uses it.
    - name: 'Execute'
      shell: 'bash'
      run: $SCRIPTS_DIR/global/scripts/deploy/flyio/run.sh
      env:
        FLY_API_TOKEN: "${{ inputs.fly_api_token }}"
        FLY_APP_NAME: "${{ inputs.app_name }}"
        FLY_ORG: "${{ inputs.org }}"
        FLY_MACHINE_COUNT: "${{ inputs.machine_count }}"
        FLY_CONFIG: "${{ inputs.config }}"
        FLY_STRATEGY: "${{ inputs.strategy }}"
        FLY_IMAGE: "${{ inputs.image }}"
        FLY_IMAGE_REGISTRY_USERNAME: "${{ inputs.image_registry_username }}"
        FLY_IMAGE_REGISTRY_PASSWORD: "${{ inputs.image != '' && inputs.image_registry_password || '' }}"
        FLY_VERSION_BUILD_ARG: "${{ inputs.version_build_arg }}"
        FLY_APP_VERSION: "${{ inputs.version }}"
        DEPLOY_ENVIRONMENT: "${{ inputs.environment }}"
        DEPLOY_DRY_RUN: "${{ inputs.dry_run }}"

    - name: 'Upload Report'
      uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
      with:
        name: 'deploy-flyio'
        path: 'build/reports/deploy-flyio/'
        if-no-files-found: 'warn'
        overwrite: 'true'
        # Never past the repository's own retention: a longer request is cut to it anyway, with a
        # warning on every run (`.github/tests/test-report-uploads.sh`).
        retention-days: "${{ github.retention_days < 10 && github.retention_days || 10 }}"
      if: always()
      # A refused upload (e.g. `Artifact storage quota has been hit`) must not fail the job:
      # the report is evidence, and the step above already decided pass or fail.
      continue-on-error: true
