kind: 'Added'
body: 'added `deployment > release-guard` to `go-flyio.yaml`, `go-render.yaml`, `yarn-cloudflare.yaml`, `npm-cloudflare.yaml` and `dart-cloudflare.yaml`: a tag run whose tag is older than the highest SemVer tag in the repository no longer deploys to production. A weekly job re-pushing the tags of superseded bumps (medhub-life/backend `2.1.0` and `2.1.1` after `2.1.2`) had started a production deploy of a release weeks old on every push. The deployment job is skipped rather than failed, so no environment is entered and no deployment of the old tag is recorded, and the guard''s job summary says why. The new `allow_rollback` input deploys an older tag on purpose, on a `workflow_dispatch` run only. A re-run of the newest tag, a branch run, a tag that is not SemVer and a repository with no SemVer tag deploy exactly as before, but a caller that rolled back by dispatching the workflow on an older tag must now also pass `allow_rollback: true`'
time: '2026-11-03T05:31:37.304780288Z'
