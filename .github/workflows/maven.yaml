# see the bottom of the file for more information¹
# the parent workflow is responsible for setting up the call events²
on:
  workflow_call:
    inputs:
      sonar_host:
        description: 'SonarQube/SonarCloud host URL (leave empty to skip SonarQube)'
        required: false
        type: string
        default: ''
      codeql_upload:
        description: |
          Whether sast:codeql uploads its SARIF results ('always', 'failure-only' or 'never').
          Set to 'never' on a private repository without GitHub Advanced Security, where code
          scanning is unavailable and only the upload -- not the analysis -- fails.
        required: false
        type: string
        default: 'always'
    secrets:
      NVD_API_KEY:
        required: false
      sonar_token:
        description: 'SonarQube authentication token'
        required: false

jobs:
  # first stage
  code_check-basic_checks:
    name: 'code-check > quality:basic-checks'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/10-code-check/basic-checks@main'
        with:
          target_branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
    if: "github.event_name == 'pull_request'"

  code_check-style_maven_verify:
    name: 'code-check > style:maven-verify'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0

      - name: 'Setup Java'
        uses: 'actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961' # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - run: mvn verify -DskipTests
        shell: 'bash'
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  code_check-quality_proguard:
    name: 'code-check > quality:proguard'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/java/stages/10-code-check/proguard@main'
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  # second stage
  security-sast_codeql:
    name: 'security > sast:codeql'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/codeql@main'
        with:
          codeql_language: 'java-kotlin'
          upload: '${{ inputs.codeql_upload }}'
    needs: [ 'code_check-style_maven_verify', 'code_check-quality_proguard' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_semgrep:
    name: 'security > sast:semgrep'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/semgrep@main'
        with:
          semgrep_lang: 'java'
    needs: [ 'code_check-style_maven_verify', 'code_check-quality_proguard' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_gitleaks:
    name: 'security > sast:gitleaks'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/gitleaks@main'
    needs: [ 'code_check-style_maven_verify', 'code_check-quality_proguard' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_hadolint:
    name: 'security > sast:hadolint'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/hadolint@main'
    needs: [ 'code_check-style_maven_verify', 'code_check-quality_proguard' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sca_dependency_check:
    name: 'security > sca:dependency-check'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/java/stages/20-security/dependency-check@main'
        with:
          nvd_api_key: ${{ secrets.NVD_API_KEY }}
          build_tool: 'maven'
    needs: [ 'code_check-style_maven_verify', 'code_check-quality_proguard' ]
    continue-on-error: true
    # Building the CVE database is the only slow path left, and it is bounded rather than trusted. A
    # cold build now bootstraps from the rate-limit-free NVD datafeed rather than paginating the API,
    # which is what brought this back under a sane ceiling: the API path moved ~30 records/s on a
    # shared runner IP, i.e. >3h for the ~350k-record corpus, so no timeout short of the 6h job cap
    # could have saved it. 45 minutes leaves headroom for the H2 load and the scan itself while still
    # killing a pathological download instead of burning the account's Actions minutes on it.
    timeout-minutes: 45
    if: "!startsWith(github.ref, 'refs/tags/')"


  # third stage
  tests-test_all:
    name: 'tests > test:all'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0

      - name: 'Setup Java'
        uses: 'actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961' # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - run: mvn test
        shell: 'bash'

      - name: 'Test Results'
        if: "always() && hashFiles('target/surefire-reports/*.xml') != ''"
        uses: 'dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2' # v3.0.0
        with:
          name: 'Test Results'
          path: 'target/surefire-reports/*.xml'
          reporter: 'java-junit'

      - name: 'Upload Coverage Report'
        if: "always() && hashFiles('target/site/jacoco/jacoco.xml') != ''"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'coverage-report'
          path: 'target/site/jacoco/'
          retention-days: 30
    needs: [ 'security-sast_codeql', 'security-sast_semgrep', 'security-sast_gitleaks', 'security-sast_hadolint', 'security-sca_dependency_check' ]
    if: "!startsWith(github.ref, 'refs/tags/')"


  # management stage (optional)
  management-report_sonarqube:
    name: 'management > report:sonarqube'
    runs-on: 'ubuntu-latest'
    container:
      image: 'sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9'
    needs: [ 'tests-test_all' ]
    if: "inputs.sonar_host != '' && !startsWith(github.ref, 'refs/tags/')"
    continue-on-error: true
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 'Download coverage artifact'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'coverage-report'
          path: 'target/site/jacoco/'
        continue-on-error: true

      - name: 'Checkout scripts'
        uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

      - name: 'Run SonarQube'
        run: '${{ env.SCRIPTS_DIR }}/global/scripts/tools/sonarqube/run.sh'
        shell: 'bash'
        env:
          SONAR_HOST_URL: ${{ inputs.sonar_host }}
          SONAR_TOKEN: ${{ secrets.sonar_token }}


# 1 - this file MUST be inside ".github/workflows" because of GitHub Actions limitations
# 2 - the recommended events to trigger this workflow and permissions are:
#   on:
#     push:
#       branches:
#         - 'main'
#       tags:
#         - '*'
#     pull_request:
#       branches:
#         - 'main'
#     workflow_dispatch:
#
#   permissions:
#     security-events: 'write' # security-sast_codeql
#     actions: 'read' # security-sast_codeql (required only on a private repository)
#     checks: 'write' # tests-test_all (test results annotations)
