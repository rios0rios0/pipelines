kind: 'Fixed'
body: 'fixed `global/scripts/tools/hadolint/run.sh` so it lints Dockerfiles named `<name>.Dockerfile` or `<name>.dockerfile`. Discovery matched `Dockerfile*` alone, which never matches `.ci/stages/40-delivery/app.Dockerfile` -- the file every delivery template here builds, on GitHub and on Azure DevOps -- so a project laid out the way those templates require shipped its image from a Dockerfile Hadolint had never read -- and where that was its only Dockerfile, the job printed "No Dockerfiles found" and passed. Discovery also skips directories now (a `Dockerfiles/` folder made hadolint exit 1 with "inappropriate type (is a directory)") and BuildKit''s per-Dockerfile `*.dockerignore` files (`Dockerfile.dockerignore` was linted as a Dockerfile and failed with DL1000). A Dockerfile linted for the first time can report findings: the GitHub Actions and Azure DevOps jobs stay advisory, while GitLab CI and a local `make sast` fail on them, as they do for every SAST tool. The new `make test-hadolint-discovery` reads the delivery Dockerfile path from the templates themselves, so renaming either side fails it'
time: '2026-10-10T21:24:37.858556695Z'
