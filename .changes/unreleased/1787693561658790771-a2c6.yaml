kind: 'Fixed'
body: 'declared the `go` leg of that workflow WAIVED rather than analysed, in a job that says so, dated **2026-11-01** and enforced by `make test`. No RELEASED CodeQL bundle can read a `go 1.27` module: the extractor refuses a language version newer than the Go it was itself built with (`package requires newer Go version go1.27 (application built with go1.26)`), and no toolchain step can change that -- `actions/setup-go` demonstrably puts 1.27.0 on `PATH` ("Successfully set up Go version 1.27.0", autobuilder reporting "environment has go1.27.0"), but the extractor is a prebuilt binary inside the bundle. Upstream merged "Go 1.27 is now supported" on 2026-06-25 and `go/extractor/go.mod` reads `go 1.27` on `main`, while `codeql-cli/v2.26.3` -- the newest release -- still reads `go 1.26`. The two alternatives were both refused: `continue-on-error` would produce a GREEN `Analyze (go)` check over an analysis that never ran, which is the silent-pass shape these suites exist to catch, and lowering the module''s directive would buy the green run by giving up what the module is entitled to use. `actions` and `python` stay blocking, the gap is announced as a warning and a step summary, and the suite refuses both a quiet drop and a forgiven failure'
time: '2026-08-25T21:32:41.65870448Z'
