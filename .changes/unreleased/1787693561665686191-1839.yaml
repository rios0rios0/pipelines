kind: 'Fixed'
body: 'fixed a single `go` directive breaking two CI jobs for weeks, in two ways that name neither version involved. `health/go.mod` in `global/containers/tor-proxy.latest` declares `go 1.27.0`, and that directive is a MINIMUM LANGUAGE VERSION -- every `go` invocation refuses one newer than itself, before parsing, so the build, the tidy, the dependency download and any external analyser fail identically on `go.mod requires go >= 1.27.0 (running go X; GOTOOLCHAIN=local)`. `Build & Push tor-proxy:latest` had been failing since **2026-07-27** with `go: errors parsing go.mod`, because its builder was still pinned to `golang:1.19.0-alpine3.16`; `Analyze (go)` -- then GitHub''s DEFAULT-SETUP CodeQL -- failed **ten consecutive runs** on `main` and on every pull request from 2026-08-20, because its runner ships Go 1.26.6 and sets `GOTOOLCHAIN=local` on purpose, so `go mod tidy`, `go get` and finally the extractor''s own `packages.Load` all died on that line, extraction failed for the only Go project in the repository, and CodeQL reported a *configuration error* rather than a finding. **Both were fixed upward and the direction is the point:** the module states what it needs and the toolchains follow it. The builder is now `golang:1.27.0-alpine3.24`, digest-pinned as every `FROM` here is, and the directive was left exactly where it was -- lowering it would have bought a green run by giving up whatever the module is entitled to use, and would have to be paid again on every future Go release'
time: '2026-08-25T21:32:41.66563542Z'
