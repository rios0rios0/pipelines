kind: 'Fixed'
body: 'moved the GitLab CI `.npm`, `.yarn` and `.maven` images off Debian 11, whose packages no longer install since its security updates left the Debian mirrors, which had stopped `report:dependency-track` and the Maven `sca:dependency-check` at their `apt-get install` with a 404: `.npm` now runs `node:16.20.2-bookworm` (the last Node 16; 16.14.0 was never built on Debian 12), `.yarn` the same Node 18.17.1 on `node:18.17.1-bookworm`, now pinned by digest, and `.maven` the same Maven 3.8 and JDK 11 on `maven:3.8.8-eclipse-temurin-11`; also pinned the GitLab CI SonarQube scanner, which ran `sonar-scanner-cli:latest`, to the build the other platforms run, made `make test-supply-chain` read an image given as a mapping (`name:`), where both unpinned images had sat unseen, and recorded the Node 16 and 18 these images keep, both past their end of life, as KI-05'
time: '2026-10-29T22:58:55.980456238Z'
