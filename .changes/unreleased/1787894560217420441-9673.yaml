kind: 'Fixed'
body: 'granted the Claude review the tools its plugin actually needs. `--allowedTools` is the COMPLETE permission set in agent mode rather than an addition to a default one -- `prepareAgentMode` derives every GitHub MCP server from it, and headless CI has no approval prompt, so anything the list omits is denied outright. The four entries copied from the action''s examples are sized for their prose prompts, not for the plugin, whose agents read git history and search the tree: the first agent-mode run logged 22 permission denials (`grep`, `cat`, `git`, `sed`, `find`, every redirect, and every pipe, since each segment of a pipe must be allowed separately) and ended after 18 turns having never read the diff, posting nothing while the job stayed green. The list now grants `Read`, `Grep` and `Glob` -- which do what `cat`, `grep` and `find` were being reached for, with no shell to segment -- plus the `gh` entries from the plugin''s own frontmatter and the `git log`/`blame`/`diff`/`show` its history agent needs.'
