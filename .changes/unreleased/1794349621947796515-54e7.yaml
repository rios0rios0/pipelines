kind: 'Added'
body: 'added `quality:migration-order` to the Go pipeline on all three platforms, run on pull requests only: it fails when a new goose migration is not newer than the newest migration the target branch already holds in the same directory. goose refuses to apply a migration older than the version a database has reached (`found N missing migrations before current version`), so two branches that named their migrations when they started and merged in the opposite order left a file that passed review and the tests, then stopped the first deploy after the merge. The goose directories are read from the files (`-- +goose Up`, `goose.AddMigration...`, with `testdata` and `vendor` skipped), the target branch is fetched first (one commit deep on a shallow checkout), versions are compared as goose reads them (timestamps or sequential numbers, leading zeros included, at any length), `GOOSE_MIGRATION_DIRS` replaces the detection or turns the check off with `none`, and `make migration-order` (`golang.mk`) runs it locally. `make test ONLY=migration-order` covers the verdict, the detection, the fetch and the wiring'
