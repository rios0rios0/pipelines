kind: 'Added'
body: 'added the `ansible-lint` target to `common.mk` and its runner `global/scripts/tools/ansible-lint/run.sh`, so an Ansible project lints from its own `lint` with the pinned ansible-lint `26.11.0` rather than a locally installed one: the wheel is verified against a committed SHA-256 and installed into a virtualenv of its own, run with that virtualenv first on `PATH` and with no schema refresh or release lookup, against the `.ansible-lint` of the project, writing `build/reports/ansible-lint/ansible-lint.sarif` and failing on violations; a project with no Ansible content skips with an empty report, and the shared ignore rules now cover the `.ansible/` cache that ansible-lint keeps at the project root'
time: '2026-11-13T01:27:36.495297092Z'
