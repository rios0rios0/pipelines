kind: 'Fixed'
body: 'added a `go_version_file` input to `github/global/stages/20-security/codeql`, so the Go analysis installs the toolchain the module asks for instead of hoping the runner image already carries it. It takes a FILE rather than a version deliberately: a pin here would only move the drift into this repository, where reading the module''s own directive means the analysis can never be older than the code and the next Go bump needs no change at all. The step runs before `init`, because the extractor resolves `go` from `PATH` at build time and a toolchain installed afterwards is one nothing used; a missing file is not an error, since failing there would turn "your go.mod moved" into a broken security scan. Every consumer of that action gets the same fix -- the bug was never specific to this repository, only observed here first. The input is threaded through `go.yaml`, `go-docker.yaml`, `go-binary.yaml`, `go-library.yaml` and `go-render.yaml` so it is actually REACHABLE: it shipped first as an input on the action alone while `go.yaml` still called it with two arguments, which meant every consumer going through the reusable workflows kept the old behaviour and only this repository''s own self-scan was fixed. The action also SEARCHES for the module when the named file is absent and uses it when exactly one exists, so a repository whose `go.mod` is not at the root needs no configuration at all; several modules are reported as ambiguous rather than guessed at, because setting the toolchain from a module that is not the one under analysis is a wrong answer wearing the costume of a right one'
