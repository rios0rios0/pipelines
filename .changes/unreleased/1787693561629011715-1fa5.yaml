kind: 'Security'
body: 'removed every script-injection path SonarCloud reports in the Azure DevOps templates -- 78 findings, all of them BLOCKER, and the reason the project was rated **E** on security. Azure substitutes `${{ }}` into the YAML *before* the agent runs it, so a template parameter or predefined variable interpolated into a `script:` / `inlineScript:` body was script rather than data. Every one now reaches the shell through `env:`, which expands it at run time. `$(Build.SourceBranchName)` is what makes this concrete rather than theoretical: it is a branch name, so anyone who can open a pull request chooses it, and it was being expanded inside the steps that hold the container registry, AWS and Azure credentials. The `RUN_BEFORE_*` / `RUN_AFTER_*` / `BUILD_COMMAND` hooks still run consumer-supplied shell -- that is their purpose -- but through `env:` and `eval`, so a value can no longer terminate the step and append steps of its own. Three hook sites SonarCloud had not yet reported were fixed with them'
