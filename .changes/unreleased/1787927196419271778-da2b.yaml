kind: 'Changed'
body: 'made the Claude review post every surviving finding as its own inline comment thread, deterministically. The prompt now mandates one thread per finding -- anchored to the exact file and line, opening with the dimension and confidence score -- with the tracking comment carrying the summary, thread index, per-dimension clean verdicts and dropped list; and `classify_inline_comments: false` posts each thread immediately instead of buffering it through the after-session Haiku classifier, a path with two open upstream bugs (anthropics/claude-code-action#1667 discards every buffered comment on one malformed line; #1679 exits green after posting none) whose subagent-filtering purpose protects nothing in a prompt that forbids subagents. Also recorded the two further `use_sticky_comment` preconditions the review itself surfaced at confidence 80: the lookup claims the first comment from any Claude bot (so a `@claude` answer on a draft pull request is claimed and overwritten by the first review run) and reads only the first page of 30 comments (past that, sticky silently degrades to one comment per push).'
