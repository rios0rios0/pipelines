inputs:
  python_version:
    required: false
    default: '3.13'
    description: 'Python version to use'
  command:
    required: true
    description: 'PDM command to run (e.g., "isort --check-only .", "black --check .")'

runs:
  using: 'composite'
  steps:
    - name: 'Checkout code'
      uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0

    - name: 'Setup Python'
      uses: 'actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1' # v6.3.0
      with:
        python-version: '${{ inputs.python_version }}'

    - name: 'Install PDM and dependencies'
      run: |
        python -m pip install "pdm==2.28.1"
        pdm install -v
      shell: 'bash'

    - name: 'Run lint command'
      run: pdm run ${{ inputs.command }}
      shell: 'bash'
