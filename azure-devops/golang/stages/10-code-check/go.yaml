parameters:
  - name: 'DEPENDS_ON'
    type: object
    default: ''

stages:
  - stage: 'code_check'
    displayName: 'code check (style/quality)'
    condition: not(startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
    ${{ if ne(parameters.DEPENDS_ON, '') }}:
      dependsOn: ${{ parameters.DEPENDS_ON }}
    jobs:
      - template: '../../../global/stages/10-code-check/basic-checks.yaml'

      - job: 'style_golangci_lint'
        displayName: 'style:golangci-lint'
        variables:
          GOPATH: "$(Pipeline.Workspace)/.go"
          # Keep the Go build cache inside GOPATH so the Cache@2 task (which caches
          # $(GOPATH)) persists it too, avoiding a full cold recompile every run.
          GOCACHE: "$(Pipeline.Workspace)/.go/build-cache"
        steps:
          # $(Scripts.Directory) was already defined in the line below
          - template: '../../abstracts/go.yaml'

          # Install yq for golangci-lint config merging
          - script: |
              sudo apt-get update && \
              sudo apt-get install -y yq
            displayName: 'Install yq'

          - script: $(Scripts.Directory)/global/scripts/languages/golang/golangci-lint/run.sh
            displayName: 'Run GolangCI-Lint'

          # This job is the only Go job whose GOCACHE lives inside $(GOPATH), so its post-job
          # `Cache@2` save tars the module cache AND the build cache together. On a large module
          # the two outgrow the agent: the save aborts with `tar: Wrote only N of M bytes` after
          # a `Free disk space on / is lower than 5%` warning.
          #
          # That matters more than the yellow job it produces. A cache save is ALL-OR-NOTHING,
          # so when the archive fails nothing is stored -- including the module cache -- and the
          # next run re-downloads every dependency. The cache stops paying for itself precisely
          # on the repositories that need it most.
          #
          # So when the disk is already tight, drop the build cache and keep the module cache.
          # It is the right one to sacrifice: it is the larger of the two, and any source or
          # toolchain change invalidates it anyway, whereas `pkg/mod` is a pure network cost.
          # When there is room, both are kept and nothing changes.
          #
          # `condition: always()` so it still runs when the linter reported findings -- a red
          # lint result is exactly when the agent has done the most work and has least room left.
          - script: $(Scripts.Directory)/global/scripts/languages/golang/cache-trim/run.sh
            displayName: 'Trim the Go build cache when the agent is low on disk'
            condition: always()
            continueOnError: true
