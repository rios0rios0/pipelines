# see the bottom of the file for more information¹
# the parent workflow is responsible for setting up the call events²
on:
  workflow_call:
    inputs:
      cross_compile:
        type: 'boolean'
        required: false
        default: false
        description: 'Enable cross-compilation check for 6 OS/arch targets (runs in parallel via matrix)'
      sonar_host:
        description: 'SonarQube/SonarCloud host URL (leave empty to skip SonarQube)'
        required: false
        type: string
        default: ''
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: |
          JSON array of runner labels (e.g. '["self-hosted"]'). `runs-on` is a hard selector --
          GitHub matches it against the runner labels and never substitutes, so there is no
          fallback to a self-hosted runner when the hosted minutes are exhausted. Naming the
          runner here rather than in each caller's job list makes moving a whole pipeline one
          switch. A JSON array rather than a plain string because a reusable-workflow input
          cannot be typed as a list, and multi-label runners need more than one value.
      codeql_upload:
        type: 'string'
        required: false
        default: 'always'
        description: |
          Whether CodeQL uploads its SARIF to code scanning ('always', 'failure-only' or
          'never'). Uploading requires code scanning to be enabled, which on a private
          repository means GitHub Advanced Security; without it the analysis still succeeds and
          only the upload fails, taking the whole job down with it. Set 'never' on such a
          repository to keep the scan as a build-breaking check without the alerts.
      database_image:
        type: 'string'
        required: false
        default: ''
        description: |
          Container image of a PostgreSQL-compatible database to run the tests against (e.g.
          'postgres:18-alpine'). Empty skips it entirely. Provisioned inside the test stage with
          `docker run` rather than a `services:` block, because a service block cannot be
          omitted by expression -- declaring one unconditionally would force a database on every
          consumer that does not want one.
      database_url_env:
        type: 'string'
        required: false
        default: ''
        description: |
          Name of the environment variable the composed connection URL is exported into (e.g.
          'MEDHUB_TEST_DATABASE_URL'). Required when `database_image` is set. Deliberately named
          by the caller: a test harness that truncates tables between tests must never be able
          to read the variable an application uses.
      coverage_threshold:
        type: 'number'
        required: false
        default: 0
        description: |
          Minimum total coverage percentage; the test job fails below it. 0 disables the gate.
          Without this the number can drift down one merge at a time and nothing notices.
      openapi_sync_path:
        type: 'string'
        required: false
        default: ''
        description: |
          Path to a committed OpenAPI document generated from source annotations. When set, a
          code-check job regenerates it and fails on any diff. Empty skips the job. Annotations
          are comments, so nothing in the compiler objects when the committed document drifts.
      openapi_sync_command:
        type: 'string'
        required: false
        default: 'make swagger'
        description: 'Command that regenerates the document named by `openapi_sync_path`.'
    secrets:
      sonar_token:
        description: 'SonarQube authentication token'
        required: false

# `ubuntu-latest` carries the Go toolchain, Make and Docker; a bare self-hosted runner selected
# through `runs_on` carries none of them and must be provisioned before these jobs will pass.
jobs:
  # first stage
  code_check-basic_checks:
    name: 'code-check > quality:basic-checks'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/10-code-check/basic-checks@main'
        with:
          target_branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
    if: "github.event_name == 'pull_request'"

  code_check-style_golangci_lint:
    name: 'code-check > style:golangci-lint'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/golang/stages/10-code-check/golangci-lint@main'
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"

  code_check-docs_openapi_sync:
    name: 'code-check > docs:openapi-sync'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/golang/stages/10-code-check/openapi-sync@main'
        with:
          command: '${{ inputs.openapi_sync_command }}'
          path: '${{ inputs.openapi_sync_path }}'
    if: "inputs.openapi_sync_path != '' && !startsWith(github.ref, 'refs/tags/')"

  code_check-cross_compile:
    name: 'code-check > quality:cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: 'linux'
            goarch: 'amd64'
          - goos: 'linux'
            goarch: 'arm64'
          - goos: 'darwin'
            goarch: 'amd64'
          - goos: 'darwin'
            goarch: 'arm64'
          - goos: 'windows'
            goarch: 'amd64'
          - goos: 'windows'
            goarch: 'arm64'
    steps:
      - uses: 'rios0rios0/pipelines/github/golang/stages/10-code-check/cross-compile@main'
        with:
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
    if: "inputs.cross_compile && !startsWith(github.ref, 'refs/tags/')"


  # second stage
  security-sast_codeql:
    name: 'security > sast:codeql'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/codeql@main'
        with:
          codeql_language: 'go'
          upload: '${{ inputs.codeql_upload }}'
    needs: [ 'code_check-style_golangci_lint' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_semgrep:
    name: 'security > sast:semgrep'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/semgrep@main'
        with:
          semgrep_lang: 'golang'
    needs: [ 'code_check-style_golangci_lint' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_gitleaks:
    name: 'security > sast:gitleaks'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/gitleaks@main'
    needs: [ 'code_check-style_golangci_lint' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_hadolint:
    name: 'security > sast:hadolint'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/hadolint@main'
    needs: [ 'code_check-style_golangci_lint' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sca_govulncheck:
    name: 'security > sca:govulncheck'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/golang/stages/20-security/govulncheck@main'
    needs: [ 'code_check-style_golangci_lint' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  # third stage
  tests-test_all:
    name: 'tests > test:all'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/golang/stages/30-tests/all@main'
        with:
          database_image: '${{ inputs.database_image }}'
          database_url_env: '${{ inputs.database_url_env }}'
          coverage_threshold: '${{ inputs.coverage_threshold }}'

      - name: 'Test Results'
        if: "always() && hashFiles('junit.xml') != ''"
        uses: 'dorny/test-reporter@v3'
        with:
          name: 'Test Results'
          path: 'junit.xml'
          reporter: 'java-junit'

      - name: 'Upload Coverage Report'
        if: "always() && hashFiles('coverage.txt') != ''"
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'coverage-report'
          path: |
            coverage.txt
            cobertura.xml
          if-no-files-found: ignore
          retention-days: 30
    needs: [ 'security-sast_codeql', 'security-sast_semgrep', 'security-sast_gitleaks', 'security-sast_hadolint', 'security-sca_govulncheck' ]
    if: "!startsWith(github.ref, 'refs/tags/')"


  # management stage (optional)
  management-report_sonarqube:
    name: 'management > report:sonarqube'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    container:
      image: 'sonarsource/sonar-scanner-cli:6.2.1'
    needs: [ 'tests-test_all' ]
    if: "inputs.sonar_host != '' && !startsWith(github.ref, 'refs/tags/')"
    continue-on-error: true
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 'Download coverage artifact'
        uses: 'actions/download-artifact@v8'
        with:
          name: 'coverage-report'
          path: '.'
        continue-on-error: true

      - name: 'Checkout scripts'
        uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

      - name: 'Run SonarQube'
        run: '${{ env.SCRIPTS_DIR }}/global/scripts/tools/sonarqube/run.sh'
        shell: 'bash'
        env:
          SONAR_HOST_URL: ${{ inputs.sonar_host }}
          SONAR_TOKEN: ${{ secrets.sonar_token }}


# 1 - this file MUST be inside ".github/workflows" because of GitHub Actions limitations
# 2 - the recommended events to trigger this workflow and permissions are:
# on:
#   push:
#     branches:
#       - 'main'
#     tags:
#       - '*'
#   pull_request:
#     branches:
#       - 'main'
#   workflow_dispatch:
#
# permissions:
#   checks: 'write' # code_check-style_golangci_lint, tests-test_all (test results annotations)
#   security-events: 'write' # security-sast_codeql
#   actions: 'read' # security-sast_codeql (required only on a private repository)
