# Checks out the shared `global/scripts/` tree that the steps around it run,
# and publishes its location as the output variable `Scripts.Directory`.
#
# The clone used to take no ref at all, so it always landed on whatever the
# default branch held at that moment. That made the pin a consumer thought they
# had illusory: `resources.repositories` names a `ref` for the TEMPLATES, but
# the SCRIPTS those templates execute came from `main` regardless. Setting the
# `PIPELINES_REF` variable in the pipeline (to a tag such as `4.23.0`, or to a
# commit SHA) now pins the scripts too.
#
# The default is still `main`, so nothing changes for a consumer who has not
# opted in.
steps:
  - script: |
      set -euo pipefail

      PIPELINES_REF="${PIPELINES_REF:-main}"
      PIPELINES_REPO="${PIPELINES_REPO:-https://github.com/rios0rios0/pipelines.git}"

      SCRIPTS_DIR="$(mktemp -d)/pipelines"
      mkdir -p "$SCRIPTS_DIR"

      # `git init` + `git fetch <ref>` rather than `git clone --branch <ref>`:
      # `--branch` accepts a branch or a tag but rejects a raw commit SHA, and
      # a SHA is the only form of this value that is genuinely immutable. This
      # shape accepts all three.
      git init --quiet "$SCRIPTS_DIR"
      git -C "$SCRIPTS_DIR" remote add origin "$PIPELINES_REPO"
      git -C "$SCRIPTS_DIR" fetch --quiet --depth 1 --no-tags origin "$PIPELINES_REF"
      git -C "$SCRIPTS_DIR" checkout --quiet FETCH_HEAD

      # A ref is a label and a label can be moved; the commit is what ran.
      # Print it so a job log alone answers "which scripts did this execute?".
      echo "Checked out pipelines@${PIPELINES_REF} ($(git -C "$SCRIPTS_DIR" rev-parse HEAD))"

      echo "##vso[task.setvariable variable=Directory;isOutput=true]$SCRIPTS_DIR"
    name: 'Scripts'
    displayName: 'Checkout pipelines scripts'
    # Deliberately NO `env:` mapping. Azure DevOps already exposes every
    # pipeline variable to the script as an environment variable, so
    # `${PIPELINES_REF:-main}` above picks a consumer's setting up on its own.
    # Mapping it explicitly as `PIPELINES_REF: $(PIPELINES_REF)` would be worse
    # than redundant: an undefined `$(VAR)` is not empty in Azure, it is left
    # as the LITERAL text `$(PIPELINES_REF)`, which would sail past the `:-`
    # default and be passed to `git fetch` as a ref name -- failing every
    # pipeline that had not defined the variable.
