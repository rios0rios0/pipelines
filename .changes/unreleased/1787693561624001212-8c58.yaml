kind: 'Security'
body: 'pinned `pdm` and refused source distributions in the three PDM container images. An sdist runs its `setup.py` during the image build, and an unversioned install baked whatever PyPI served that day into the image. The Python 3.9 image is held at `2.26.9` rather than the `2.28.1` the other two use, because PDM dropped Python 3.9 in `2.27` and pip would refuse the newer pin outright'
time: '2026-08-25T21:32:41.623964738Z'
