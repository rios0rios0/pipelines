body: 'changed the GitLab PDM abstract to `ghcr.io/rios0rios0/pipelines/python:3.10-pdm-bookworm`, following the image off Debian 11. The tag had to exist before it could be referenced: `test-supply-chain.sh` rejects a bare `image:` and the `Dependency Updates` gate resolves every pinned tag against the live registry, so keeping the new tag name with the old image''s content-addressed digest would have gone on pulling bullseye. Both new tags were therefore published from the fix branch before the pin was written; the rebuild that follows the merge will supersede these digests, so expect the gate to report exactly these two references once'
