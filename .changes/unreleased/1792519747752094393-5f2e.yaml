kind: 'Fixed'
body: 'fixed the GitHub Actions `sast:codeql` job passing whatever CodeQL found: `github/codeql-action/analyze` fails only when the analysis does, so with `codeql_upload: ''never''` (or an upload code scanning refused) nothing read the report. The job now runs the `security-and-quality` suite `make codeql` runs, reads a project''s `codeql-config.yml`, and fails on every finding `.codeql-false-positives` does not list through `global/scripts/tools/codeql/gate.sh` -- the gate `run.sh` now calls for `make codeql`, GitLab CI and Azure DevOps too, which also stopped reading an unparsable report as zero findings and lists each remaining finding with its fingerprint. The SARIF upload became a separate best-effort step after the gate that can never fail the job. GitHub consumers can see findings fail a job that used to pass, and the wider suite takes longer'
time: '2026-10-20T18:09:07.751969559Z'
