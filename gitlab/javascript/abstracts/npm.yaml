# Node 24 (Krypton), supported until 2028-04-30, on Debian 13. Not the Node 26 that became LTS on
# 2026-10-28: Node 25 dropped corepack from its distribution, and `node:26.13.0-trixie` ships
# neither corepack nor the Yarn 1 launcher the jobs that extend `.yarn` call. This ran Node 16,
# past its end of life since 2023-09-11 (KI-05 in `.docs/known-issues.md`): first on Debian 11,
# whose security updates left the mirrors when its LTS ended (KI-04), then on Debian 12. The
# release follows `NODE_PINNED_VERSION` in global/scripts/shared/pinned-versions.sh, held to the 24
# line: the scheduled dependency update moves this tag to each new Node 24 release once it is a
# week old, and at once to one fixing a known vulnerability. Moving to another line stays a
# decision for the JavaScript pipeline: it is the Node every consumer's SBOM is built on. `.yarn`
# runs the same image.
.npm:
  image: 'node:24.22.1-trixie@sha256:f1e034976f948cf212ef1f659c12e5dd58ac7eab947831813e81a62401ca38be'
  cache: # relative to the project directory ($CI_PROJECT_DIR)
    key: "$CI_JOB_NAME"
    paths:
      - 'node_modules'
    when: 'always'
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
