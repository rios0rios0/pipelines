# see the bottom of the file for more information¹
# the parent workflow is responsible for setting up the call events²
on:
  workflow_call:
    inputs:
      install_run_scripts:
        type: 'boolean'
        required: false
        default: false
        description: |
          Run dependency lifecycle scripts (`postinstall`, `prepare`) after installing.
          Installs are `--ignore-scripts` by default: `npm ci` / `yarn install` otherwise
          execute arbitrary code from every package in the transitive tree, as the CI user,
          before any of this project's own code runs. Set this to `true` for projects that
          genuinely need them -- native module builds, `prisma generate`, Playwright browser
          downloads, `husky` -- and the scripts run through `rebuild` afterwards instead.
      sonar_host:
        description: 'SonarQube/SonarCloud host URL (leave empty to skip SonarQube)'
        required: false
        type: string
        default: ''
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: |
          JSON array of runner labels (e.g. '["self-hosted"]'). `runs-on` is a hard selector --
          GitHub matches it against the runner labels and never substitutes, so there is no
          fallback to a self-hosted runner when the hosted minutes are exhausted. A JSON array
          rather than a plain string because a reusable-workflow input cannot be typed as a
          list, and multi-label runners need more than one value.
      codeql_upload:
        type: 'string'
        required: false
        default: 'always'
        description: |
          Whether CodeQL uploads its SARIF to code scanning ('always', 'failure-only' or
          'never'). Uploading requires code scanning to be enabled, which on a private
          repository means GitHub Advanced Security; without it the analysis still succeeds and
          only the upload fails, taking the whole job down with it.
      build_env:
        type: 'string'
        required: false
        default: ''
        description: |
          Dotenv-style lines (KEY=value, one per line) exported before the build and test steps.
          A bundler that refuses to build without an API URL -- rather than silently falling
          back to localhost, deploying, looking fine and having every request refused -- needs
          a value here for CI to pass. The value is a placeholder: these jobs only prove the
          bundle compiles and never publish it.
      e2e_typecheck:
        type: 'boolean'
        required: false
        default: false
        description: |
          Run `npm run e2e:typecheck`. End-to-end specs usually sit outside the root
          `tsconfig.json`, so `npm run build` never type-checks them and a spec can rot --
          renamed selector, changed fixture signature -- until someone runs the browser suite by
          hand. This is a type-check only: it starts no browser, no API and no database.
      working_directory:
        type: 'string'
        required: false
        default: '.'
        description: |
          Path of the JavaScript project inside the repository, relative to the root and WITHOUT
          a trailing slash. `.` -- the default -- is the repository root, so a consumer that does
          not pass this sees no change whatsoever.

          Set it when `package.json` does not sit at the top of the repository: a frontend under
          `app/` beside a Rails API under `api/`, a site under `web/`. Every command that reads
          the project's own manifest then runs there -- the install, `lint:ci`, Prettier, Knip,
          the audit, `test:ci` and `build` -- `actions/setup-node` caches against that project's
          lockfile, and the coverage, JUnit and artifact paths are read from there too.

          The REPOSITORY-WIDE checks deliberately ignore it and keep running from the root:
          Gitleaks reads the whole history, Semgrep and CodeQL analyse every source file wherever
          it lives, Hadolint looks for Dockerfiles anywhere, and basic-checks reads the changelog
          and the branch. Scoping those to a subfolder would silently shrink the security surface
          of a repository that adopted this input for an unrelated reason -- and a monorepo is
          precisely the shape where the file nobody scanned is in the other directory.
    secrets:
      sonar_token:
        description: 'SonarQube authentication token'
        required: false

# Resolved once here rather than in nine `format()` calls spread across the report and artifact
# steps below. `env` at the workflow level is one of the few places a reusable workflow may read
# `inputs` outside a job, and the alternative is the same path arithmetic copied into every step
# that names a file -- where one copy eventually stops matching the others.
#
# The paths are what a JavaScript project writes BESIDE its own `package.json`, so they follow
# `working_directory` and nothing else does: the checks that scan the repository read no path
# from here at all.
env:
  COVERAGE_DIR: '${{ inputs.working_directory }}/coverage'
  COVERAGE_SUMMARY_PATH: '${{ inputs.working_directory }}/coverage/coverage-summary.json'
  COVERAGE_FINAL_PATH: '${{ inputs.working_directory }}/coverage/coverage-final.json'
  COVERAGE_INDEX_PATH: '${{ inputs.working_directory }}/coverage/index.html'
  JUNIT_REPORT_PATH: '${{ inputs.working_directory }}/junit-report.xml'
  VITE_CONFIG_PATH: '${{ inputs.working_directory }}/vite.config.ts'

jobs:
  # first stage
  code_check-basic_checks:
    name: 'code-check > quality:basic-checks'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/10-code-check/basic-checks@main'
        with:
          target_branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
    if: "github.event_name == 'pull_request'"

  code_check-style_eslint:
    name: 'code-check > style:eslint'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          # Named explicitly because the action only looks for a lockfile in the WORKSPACE
          # ROOT when this is empty, and fails the job outright with "Dependencies lock file
          # is not found" for a project one directory down -- on its second step, before
          # anything has run. With `working_directory` left at `.` these are the same files
          # it would have found on its own.
          cache-dependency-path: |
            ${{ inputs.working_directory }}/package-lock.json
            ${{ inputs.working_directory }}/npm-shrinkwrap.json

      - run: |
          # `--ignore-scripts`: `npm ci` otherwise runs `postinstall` from every package in
          # the transitive tree, as the CI user, before any of this project's code runs --
          # the npm supply-chain execution path. Projects that genuinely need those scripts
          # set `install_run_scripts: true`, and they run through `npm rebuild` below, after
          # the tree is on disk and the lockfile has been honoured.
          npm ci --ignore-scripts
          if [ "$INSTALL_RUN_SCRIPTS" = 'true' ]; then
            npm rebuild
            npm run prepare --if-present
          fi
          npm run lint:ci
        shell: 'bash'
        working-directory: '${{ inputs.working_directory }}'
        env:
          INSTALL_RUN_SCRIPTS: '${{ inputs.install_run_scripts }}'
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  # BLOCKING, unlike its `style:eslint` sibling above, and the difference is
  # deliberate. `eslint-config-prettier` -- which almost every JavaScript project
  # installs -- switches OFF every ESLint rule that overlaps with Prettier, so
  # `style:eslint` is already silent about formatting by design. Without this job
  # nothing checks it at all: the two halves cancel out, and a repository can hold
  # a committed `.prettierrc`, a curated `.prettierignore`, hundreds of unformatted
  # files and a green pipeline at the same time. That is not a gate with a gap; it is no
  # gate. `continue-on-error` here would recreate it.
  #
  # A project that does not use Prettier is SKIPPED, not failed -- see the runner.
  code_check-style_format:
    name: 'code-check > style:format'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/javascript/stages/10-code-check/format@main'
        with:
          package_manager: 'npm'
          working_directory: '${{ inputs.working_directory }}'
          install_run_scripts: '${{ inputs.install_run_scripts }}'
    if: "!startsWith(github.ref, 'refs/tags/')"


  code_check-quality_knip:
    name: 'code-check > quality:knip'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/javascript/stages/10-code-check/knip@main'
        with:
          package_manager: 'npm'
          working_directory: '${{ inputs.working_directory }}'
          install_run_scripts: '${{ inputs.install_run_scripts }}'
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  # second stage
  security-sast_codeql:
    name: 'security > sast:codeql'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/codeql@main'
        with:
          codeql_language: 'javascript-typescript'
          upload: '${{ inputs.codeql_upload }}'
    needs: [ 'code_check-style_eslint', 'code_check-style_format', 'code_check-quality_knip' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_semgrep:
    name: 'security > sast:semgrep'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/semgrep@main'
        with:
          semgrep_lang: 'javascript'
    needs: [ 'code_check-style_eslint', 'code_check-style_format', 'code_check-quality_knip' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_gitleaks:
    name: 'security > sast:gitleaks'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/gitleaks@main'
    needs: [ 'code_check-style_eslint', 'code_check-style_format', 'code_check-quality_knip' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sast_hadolint:
    name: 'security > sast:hadolint'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/20-security/hadolint@main'
    needs: [ 'code_check-style_eslint', 'code_check-style_format', 'code_check-quality_knip' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"

  security-sca_npm_audit:
    name: 'security > sca:npm-audit'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          # Named explicitly because the action only looks for a lockfile in the WORKSPACE
          # ROOT when this is empty, and fails the job outright with "Dependencies lock file
          # is not found" for a project one directory down -- on its second step, before
          # anything has run. With `working_directory` left at `.` these are the same files
          # it would have found on its own.
          cache-dependency-path: |
            ${{ inputs.working_directory }}/package-lock.json
            ${{ inputs.working_directory }}/npm-shrinkwrap.json

      - run: |
          # `--ignore-scripts`: `npm ci` otherwise runs `postinstall` from every package in
          # the transitive tree, as the CI user, before any of this project's code runs --
          # the npm supply-chain execution path. Projects that genuinely need those scripts
          # set `install_run_scripts: true`, and they run through `npm rebuild` below, after
          # the tree is on disk and the lockfile has been honoured.
          npm ci --ignore-scripts
          if [ "$INSTALL_RUN_SCRIPTS" = 'true' ]; then
            npm rebuild
            npm run prepare --if-present
          fi
          npm audit --audit-level=high
        shell: 'bash'
        working-directory: '${{ inputs.working_directory }}'
        env:
          INSTALL_RUN_SCRIPTS: '${{ inputs.install_run_scripts }}'
    needs: [ 'code_check-style_eslint', 'code_check-style_format', 'code_check-quality_knip' ]
    continue-on-error: true
    if: "!startsWith(github.ref, 'refs/tags/')"


  # third stage
  tests-test_all:
    name: 'tests > test:all'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          # Named explicitly because the action only looks for a lockfile in the WORKSPACE
          # ROOT when this is empty, and fails the job outright with "Dependencies lock file
          # is not found" for a project one directory down -- on its second step, before
          # anything has run. With `working_directory` left at `.` these are the same files
          # it would have found on its own.
          cache-dependency-path: |
            ${{ inputs.working_directory }}/package-lock.json
            ${{ inputs.working_directory }}/npm-shrinkwrap.json

      - name: 'Export the build environment'
        if: "inputs.build_env != ''"
        run: 'printf ''%s\n'' "$BUILD_ENV" >> "$GITHUB_ENV"'
        shell: 'bash'
        env:
          BUILD_ENV: '${{ inputs.build_env }}'

      - run: |
          # `--ignore-scripts`: `npm ci` otherwise runs `postinstall` from every package in
          # the transitive tree, as the CI user, before any of this project's code runs --
          # the npm supply-chain execution path. Projects that genuinely need those scripts
          # set `install_run_scripts: true`, and they run through `npm rebuild` below, after
          # the tree is on disk and the lockfile has been honoured.
          npm ci --ignore-scripts
          if [ "$INSTALL_RUN_SCRIPTS" = 'true' ]; then
            npm rebuild
            npm run prepare --if-present
          fi
          npm run test:ci
        shell: 'bash'
        working-directory: '${{ inputs.working_directory }}'
        env:
          INSTALL_RUN_SCRIPTS: '${{ inputs.install_run_scripts }}'

      - name: 'Type check the end-to-end specs'
        if: 'inputs.e2e_typecheck'
        run: 'npm run e2e:typecheck'
        shell: 'bash'
        working-directory: '${{ inputs.working_directory }}'

      # Every path here is read through `env`, which resolves it against `working_directory`.
      # A literal `coverage/` would keep the `hashFiles()` guard permanently false for a project
      # in a subfolder -- so the step would SKIP rather than fail, and the coverage comment would
      # simply stop appearing with nothing in the log to say why.
      - name: 'Coverage Report'
        if: "always() && hashFiles(env.COVERAGE_SUMMARY_PATH) != '' && hashFiles(env.COVERAGE_FINAL_PATH) != ''"
        uses: 'davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73' # v2.13.0
        with:
          json-summary-path: '${{ env.COVERAGE_SUMMARY_PATH }}'
          json-final-path: '${{ env.COVERAGE_FINAL_PATH }}'
          vite-config-path: '${{ env.VITE_CONFIG_PATH }}'

      - name: 'Test Results'
        if: "always() && hashFiles(env.JUNIT_REPORT_PATH) != ''"
        uses: 'dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2' # v3.0.0
        with:
          name: 'Test Results'
          path: '${{ env.JUNIT_REPORT_PATH }}'
          reporter: 'java-junit'

      - name: 'Upload Coverage Report'
        if: "always() && hashFiles(env.COVERAGE_INDEX_PATH) != ''"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'coverage-report'
          path: '${{ env.COVERAGE_DIR }}/'
          retention-days: 30
    needs: [ 'security-sast_codeql', 'security-sast_semgrep', 'security-sast_gitleaks', 'security-sast_hadolint', 'security-sca_npm_audit' ]
    if: "!startsWith(github.ref, 'refs/tags/')"

  tests-test_build:
    name: 'tests > test:build'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          # Named explicitly because the action only looks for a lockfile in the WORKSPACE
          # ROOT when this is empty, and fails the job outright with "Dependencies lock file
          # is not found" for a project one directory down -- on its second step, before
          # anything has run. With `working_directory` left at `.` these are the same files
          # it would have found on its own.
          cache-dependency-path: |
            ${{ inputs.working_directory }}/package-lock.json
            ${{ inputs.working_directory }}/npm-shrinkwrap.json

      - name: 'Export the build environment'
        if: "inputs.build_env != ''"
        run: 'printf ''%s\n'' "$BUILD_ENV" >> "$GITHUB_ENV"'
        shell: 'bash'
        env:
          BUILD_ENV: '${{ inputs.build_env }}'

      - run: |
          # `--ignore-scripts`: `npm ci` otherwise runs `postinstall` from every package in
          # the transitive tree, as the CI user, before any of this project's code runs --
          # the npm supply-chain execution path. Projects that genuinely need those scripts
          # set `install_run_scripts: true`, and they run through `npm rebuild` below, after
          # the tree is on disk and the lockfile has been honoured.
          npm ci --ignore-scripts
          if [ "$INSTALL_RUN_SCRIPTS" = 'true' ]; then
            npm rebuild
            npm run prepare --if-present
          fi
          npm run build
        shell: 'bash'
        working-directory: '${{ inputs.working_directory }}'
        env:
          INSTALL_RUN_SCRIPTS: '${{ inputs.install_run_scripts }}'
    needs: [ 'security-sast_codeql', 'security-sast_semgrep', 'security-sast_gitleaks', 'security-sast_hadolint', 'security-sca_npm_audit' ]
    if: "!startsWith(github.ref, 'refs/tags/')"


  # management stage (optional)
  management-report_sonarqube:
    name: 'management > report:sonarqube'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    container:
      image: 'sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9'
    needs: [ 'tests-test_all' ]
    if: "inputs.sonar_host != '' && !startsWith(github.ref, 'refs/tags/')"
    continue-on-error: true
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Unpacked where the project wrote it, so a `sonar-project.properties` naming
      # `<project>/coverage/...` finds it. The scan itself still runs from the repository root.
      - name: 'Download coverage artifact'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'coverage-report'
          path: '${{ env.COVERAGE_DIR }}/'
        continue-on-error: true

      - name: 'Checkout scripts'
        uses: 'rios0rios0/pipelines/github/global/abstracts/scripts-repo@main'

      # `SONAR_PROJECT_DIR` is what makes the sentence above true. The runner decides whether
      # coverage exists by globbing `coverage/*`, `build/reports/coverage*` and friends, and
      # when it finds none it appends EMPTY `sonar.*.reportPaths` values -- which, this being a
      # Java properties file where the last definition wins, overrides the path the repository
      # set for itself. Without this variable a project in a subfolder is read as having no
      # coverage at all and reports 0% on new code, failing a default quality gate while the
      # job stays green. `sonar.sources` is untouched: the SCAN is still repository-wide.
      - name: 'Run SonarQube'
        run: '${{ env.SCRIPTS_DIR }}/global/scripts/tools/sonarqube/run.sh'
        shell: 'bash'
        env:
          SONAR_HOST_URL: ${{ inputs.sonar_host }}
          SONAR_TOKEN: ${{ secrets.sonar_token }}
          SONAR_PROJECT_DIR: '${{ inputs.working_directory }}'


# 1 - this file MUST be inside ".github/workflows" because of GitHub Actions limitations
# 2 - the recommended events to trigger this workflow and permissions are:
#   on:
#     push:
#       branches:
#         - 'main'
#       tags:
#         - '*'
#     pull_request:
#       branches:
#         - 'main'
#     workflow_dispatch:
#
#   permissions:
#     security-events: 'write' # security-sast_codeql
#     actions: 'read' # security-sast_codeql (required only on a private repository)
#     pull-requests: 'write' # tests-test_all (coverage report comment)
#     checks: 'write' # tests-test_all (test results annotations)
