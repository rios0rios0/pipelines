.sdk:
  image: 'mcr.microsoft.com/dotnet/sdk:8.0@sha256:ec9c0a0dc5f60adc2065762050638dd5ed5facfc53716d4580a42d86027c8e80'
  cache: # relative to the project directory ($CI_PROJECT_DIR)
    key: "$CI_JOB_NAME"
    paths:
      - 'packages'
    when: 'always'
  before_script:
    - export PATH="$PATH:/root/.dotnet/tools"
    - export SLN_FILE=$(find . -name "*.sln" -print -quit)
    - dotnet restore --packages packages $SLN_FILE
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
