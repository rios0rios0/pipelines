.gradle:
  image: 'gradle:8.7.0-jdk21-alpine@sha256:d6ea1c746d8365fae41c70d5812c28c8fca88c905b69d5f9da57ad4cc0218ab1'
  cache: # relative to the project directory ($CI_PROJECT_DIR)
    key: "$CI_JOB_NAME"
    when: 'always'
  before_script:
    - export GRADLE_PROJECT_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME="$(pwd)/.gradle-home"
  tags:
    - 'dev-gitlab-runner-onprem'
  rules:
    - if: "$CI_MERGE_REQUEST_IID"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
