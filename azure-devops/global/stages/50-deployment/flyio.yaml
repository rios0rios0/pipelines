parameters:
  - name: 'FLY_API_TOKEN'
    type: 'string'
    default: "$(FLY_API_TOKEN)"
  - name: 'APP_NAME'
    type: 'string'
    default: ''
  # Set to create the app when it does not exist yet. Requires an ORG-SCOPED token
  # (`flyctl tokens create org`); an app-scoped deploy token cannot create apps.
  - name: 'ORG'
    type: 'string'
    default: ''
  # Exact machine count after a successful deploy; `1` also passes `--ha=false`.
  - name: 'MACHINE_COUNT'
    type: 'string'
    default: ''
  - name: 'CONFIG'
    type: 'string'
    default: 'fly.toml'
  - name: 'STRATEGY'
    type: 'string'
    default: ''
  # Name of the Dockerfile `ARG` that receives the app's version (e.g. `VERSION`);
  # empty passes nothing. `APP_VERSION` sets the value; empty derives it: the tag
  # on a tag build, the commit's first 7 characters otherwise.
  - name: 'VERSION_BUILD_ARG'
    type: 'string'
    default: ''
  - name: 'APP_VERSION'
    type: 'string'
    default: ''
  # An image already built and pushed, to deploy instead of building one: its
  # linux/amd64 build is copied to registry.fly.io/<app> with crane and deployed
  # by digest. Name it by digest. The credentials are for the registry holding
  # it; pass the password as a secret variable, `$(NAME)`. Its default is empty
  # rather than a macro because it is optional -- a public image needs none --
  # and an undefined macro would arrive as its own literal text, a password that
  # is wrong instead of absent. Empty IMAGE, the default, builds from source on
  # Fly's builder: unlike `go-flyio.yaml` on GitHub Actions, this template is not
  # composed after a delivery stage, and the Azure DevOps delivery template
  # pushes tags without recording a digest, so it has no image to hand over.
  - name: 'IMAGE'
    type: 'string'
    default: ''
  - name: 'IMAGE_REGISTRY_USERNAME'
    type: 'string'
    default: ''
  - name: 'FLY_IMAGE_REGISTRY_PASSWORD'
    type: 'string'
    default: ''
  - name: 'ENVIRONMENT'
    type: 'string'
    default: 'production'
  - name: 'DRY_RUN'
    type: 'boolean'
    default: false

jobs:
  - job: 'deployment_flyio'
    displayName: 'deployment:flyio'
    timeoutInMinutes: 45
    steps:
      - template: '../../abstracts/scripts-repo.yaml'

      # No Docker task: with IMAGE the script copies it registry to registry with
      # crane, and without it the script passes `--remote-only`, so the image is
      # built on Fly's builder. That keeps this job runnable on a self-hosted
      # agent with no Docker daemon, which is the common case on Azure DevOps.
      - script: $(Scripts.Directory)/global/scripts/deploy/flyio/run.sh
        displayName: 'Deploy to Fly.io'
        env:
          FLY_API_TOKEN: ${{ parameters.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ parameters.APP_NAME }}
          FLY_ORG: ${{ parameters.ORG }}
          FLY_MACHINE_COUNT: ${{ parameters.MACHINE_COUNT }}
          FLY_CONFIG: ${{ parameters.CONFIG }}
          FLY_STRATEGY: ${{ parameters.STRATEGY }}
          FLY_IMAGE: ${{ parameters.IMAGE }}
          FLY_IMAGE_REGISTRY_USERNAME: ${{ parameters.IMAGE_REGISTRY_USERNAME }}
          FLY_IMAGE_REGISTRY_PASSWORD: ${{ parameters.FLY_IMAGE_REGISTRY_PASSWORD }}
          FLY_VERSION_BUILD_ARG: ${{ parameters.VERSION_BUILD_ARG }}
          FLY_APP_VERSION: ${{ parameters.APP_VERSION }}
          DEPLOY_ENVIRONMENT: ${{ parameters.ENVIRONMENT }}
          DEPLOY_DRY_RUN: ${{ lower(parameters.DRY_RUN) }}

      - task: 'PublishPipelineArtifact@1'
        inputs:
          artifactName: 'deploy-flyio'
          targetPath: 'build/reports/deploy-flyio'
        displayName: 'Upload Report'
        condition: succeededOrFailed()
