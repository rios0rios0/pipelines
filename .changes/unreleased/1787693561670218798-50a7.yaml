kind: 'Fixed'
body: 'fixed `require-checks` refusing a fully green commit whenever the repository or its organisation had been RENAMED. GitHub answers **301** for the old name, not 404, and `curl -f` fails on 4xx and 5xx only -- so the redirect body (`{"message":"Moved Permanently","url":...}`) was parsed as the answer, `.check_runs` read as null, `length` answered 0, and every required check was reported missing. `github.repository` is resolved when the run is CREATED and the deployment job is the last one in it, so a rename during a long pipeline is enough to hit this, and the log then blames the repository''s tests for a change made in an organisation''s settings. Measured on a consumer whose owner was renamed a minute after its `main` push started: eighteen check runs on the commit, all green, five required names all reported as "no successful". The fetch now follows the redirect (`-L`, confined to https with `--proto`/`--proto-redir` so a bearer token cannot be carried into plain HTTP), and any payload without a `check_runs` ARRAY is refused loudly instead of being folded into an empty list -- an error envelope, a proxy''s HTML error page and a truncated body all fail as the misconfiguration they are, while a genuinely empty page still reads as an untested commit. The refusal quotes what the answer actually said, falling back to the raw first line when the body is not JSON at all -- reading `.message` alone left the line as `It said:` with nothing after it on precisely the answer that branch exists to make legible'
