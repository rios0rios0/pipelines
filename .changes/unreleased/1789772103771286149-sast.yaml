kind: 'Fixed'
breaking: true
body: 'fixed `make sast` and every individual SAST target always exiting 0, so the documented `make lint && make sast` pre-push gate could never fail. Each recipe in `makefiles/common.mk` carried a `-` prefix -- and `codeql` a trailing `|| true` -- which tell Make to ignore the recipe''s exit status, so the targets reported success on findings, on a crash and on termination alike: real runs printed `Error 123 (ignored)` from ShellCheck and `Terminated (ignored)` from an out-of-memory Semgrep and then passed, and the `&&` in the documented gate could never short-circuit because its left side always succeeded. The suppression was added for a sound reason -- so the aggregate ran every tool instead of stopping at the first failure -- and that reason is kept rather than reverted: `sast` now iterates `SAST_TOOLS` plus `SAST_TOOLS_EXTRA`, dispatching one sub-make per tool so the individual recipes stay the single definition, and fails once at the end with a `SAST FAILED: <tools>` line naming which ones found something, or a `SAST PASSED` line when none did. Propagating is safe because every runner under `global/scripts/tools/` already returns a considered code rather than a raw tool code, and each owns a project-level suppression file for triaged findings (`.codeql-false-positives`, `.semgrepignore`, `.semgrepexcluderules`, `.hadolint.yaml`, `.gitleaksignore`). **This changes developer-facing behaviour**: no pipeline template published by this repository calls `make sast` -- they all invoke the runners directly and already saw the real exit code -- but a consumer that wired the target into its own CI, or a developer running it by hand, will now see it fail on findings that were previously reported as a pass. Advisory-versus-blocking stays a call-site decision, as it already is on each platform, via `make sast || true` or the platform''s own `continueOnError` / `continue-on-error` / `allow_failure`. **BREAKING CHANGE:** `make sast` and the individual SAST targets now exit non-zero on findings where they always exited 0, so any job or hook that runs one and keys off its exit code can turn red on findings that were already there and already reported. No pipeline template published by this repository is affected -- `github/`, `gitlab/` and `azure-devops/` all invoke the runners directly and have always seen the real code -- but a consumer that wired the target into its own CI is, and a code search cannot rule out one that was never read. Separately, `sast` carries a recipe now, so a consumer that defines its own `sast:` recipe will get Make''s "overriding recipe for target" warning and should append its target to `SAST_TOOLS_EXTRA` instead'
