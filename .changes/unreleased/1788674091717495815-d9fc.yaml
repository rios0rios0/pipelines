kind: 'Removed'
body: 'removed `global/containers/python.3.9-pdm-buster/` and its row from both image tables, retiring `ghcr.io/rios0rios0/pipelines/python:3.9-pdm-buster`. Every layer of the image had expired: Debian 10 "buster" has been archived since 2024, so the Dockerfile could only build by pointing apt at `archive.debian.org` with `Acquire::Check-Valid-Until "false"` -- a base that receives no security updates by design; Python 3.9 reached end of life in October 2025; and `pdm` had to be held at 2.26.9 because 2.27 dropped 3.9, so the image drifted permanently away from the 2.29.0 in `global/scripts/shared/pinned-versions.sh` that both siblings share. It was kept for "consumers pinned to Python 3.9", and **there are none**: the tag, the folder name, `pipelines/python` and `python:3.9` appear in no other file across 355 local working copies (the rios0rios0, medhub-life, prefy and Azure DevOps clones), in nothing `gh search code` returns for `rios0rios0/pipelines/python` across all of GitHub, and in none of the default-branch trees of the private repositories whose local copy was stale or missing, which were read through the API instead. **BREAKING CHANGE:** the removal is marked breaking even so, because GHCR pull activity could NOT be checked -- listing package versions needs the `read:packages` scope, which the available token does not carry -- and an unseen puller is the one consumer a code search cannot rule out. **The published `python:3.9-pdm-buster` stays in GHCR and keeps pulling**: nothing here deletes a tag, and the digest `main` last published is untouched. What ends is the rebuild -- the tag is now frozen on an end-of-life base and an end-of-life interpreter and will never receive another CVE fix, so anything still pulling it should move to `python:3.13-pdm-bookworm`, or to `python:3.10-pdm-bookworm` where a project genuinely pins 3.10. No first-party pin changed: `gitlab/`, `github/` and `azure-devops/` reference only the awscli, golang and 3.10-pdm images, so the dependency-updates gate is unaffected. Deleting the folder is safe on its own since #665, which taught the Container Images matrix to skip folders a push removed'
