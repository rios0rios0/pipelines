kind: 'Changed'
body: 'changed `dependency-updates.yaml` to open a pull request that bumps every stale pin instead of failing the build. Twice a week it now rewrites each outdated action to the commit its new release tag points at, each image to the digest its tag resolves to now and each tool pin to its new version with every SHA-256 re-derived from the release, keeps the inline copies in step, records the change in the changelog, and opens, updates or closes a single pull request from `chore/dependency-updates` -- it never merges one. A pull request closed without merging is not proposed again until upstream releases something newer, commits pushed to the branch by hand are never overwritten, and a rerun against an unchanged default branch pushes nothing, so approvals are not dismissed for no change. The job stays red only for what a pull request cannot carry: an update it refused to apply, a pin with no annotation, or an upstream it could not reach. A `dependency_updates_token` secret -- a fine-grained personal access token with Contents, Pull requests and Workflows write access -- opens the pull request whenever an update touches `.github/workflows/`, which the default token can never change, and its pull requests start their checks. **BREAKING CHANGE:** the job now requests `contents: write` and `pull-requests: write`, and GitHub checks a called workflow''s permissions against its caller before any job starts, so a `workflow_call` caller granting less now fails at startup even with `report_only: true`; a caller that grants them receives a pull request in its own repository where it used to get a failing job, and a run started by a pull request event keeps the old fail-on-stale behaviour'
breaking: true
