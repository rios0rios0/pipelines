# Dart or Flutter project delivered as a container image.
#
# Suits a server-side Dart application (shelf, dart_frog, a compiled CLI in a
# container) and equally a Flutter web app whose Dockerfile serves `build/web`.
on:
  workflow_call:
    inputs:
      flutter_version:
        required: false
        type: 'string'
        default: ''
      dart_sdk_version:
        required: false
        type: 'string'
        default: 'latest'
      toolchain:
        required: false
        type: 'string'
        default: 'auto'
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: 'JSON array of runner labels (e.g. ''["self-hosted"]''). See dart.yaml.'
      test_build_targets:
        required: false
        type: 'string'
        default: ''
        description: |
          Forwarded to `dart.yaml`: build targets for `tests > test:build` (e.g. 'web'), empty
          auto-detecting from the project's shape. The GitHub spelling of the
          `DART_TEST_BUILD_TARGETS` the GitLab and Azure DevOps templates take.

          Forwarded rather than dropped for the reason the composition standard gives about
          `runs_on` -- an input a composed workflow does not declare is an input its consumers
          cannot reach at all, and the pipeline then looks identical to the base one while
          silently offering less.
      test_build_mode:
        required: false
        type: 'string'
        default: '--debug'
        description: "Forwarded to `dart.yaml`: Flutter build mode for `tests > test:build`."
      test_build_args:
        required: false
        type: 'string'
        default: ''
        description: 'Forwarded to `dart.yaml`: extra arguments for the `tests > test:build` build.'
      test_build_command:
        required: false
        type: 'string'
        default: ''
        description: |
          Forwarded to `dart.yaml`: escape hatch running this command instead of the shared build
          runner, for a build that is a command rather than a target.
      test_build_node_version:
        required: false
        type: 'string'
        default: ''
        description: 'Forwarded to `dart.yaml`: Node.js version for `test_build_command`, empty installing none.'

jobs:
  dart:
    uses: 'rios0rios0/pipelines/.github/workflows/dart.yaml@main'
    with:
      flutter_version: ${{ inputs.flutter_version }}
      dart_sdk_version: ${{ inputs.dart_sdk_version }}
      toolchain: ${{ inputs.toolchain }}
      runs_on: ${{ inputs.runs_on }}
      test_build_targets: ${{ inputs.test_build_targets }}
      test_build_mode: ${{ inputs.test_build_mode }}
      test_build_args: ${{ inputs.test_build_args }}
      test_build_command: ${{ inputs.test_build_command }}
      test_build_node_version: ${{ inputs.test_build_node_version }}

  # fourth stage
  delivery-release:
    name: 'delivery > release'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: 'release'
        uses: 'rios0rios0/pipelines/github/global/stages/40-delivery/release@main'
    needs: [ 'dart' ]
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, 'chore/bump-') || contains(github.event.head_commit.message, 'chore(bump)'))"

  delivery-docker:
    name: 'delivery > docker'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/40-delivery/docker@main'
        with:
          tag_name: "${{ needs.delivery-release.outputs.tag_name }}"
    needs: [ 'dart', 'delivery-release' ]
    if: "!failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))"
