name: 'Claude Review'

on:
  workflow_call:
    inputs:
      runs_on:
        type: 'string'
        required: false
        default: '["ubuntu-latest"]'
        description: |
          JSON array of runner labels (e.g. '["self-hosted"]'); see the `runs_on` input in
          go.yaml for the shape's rationale.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: 'OAuth token used by the Claude Code action'

# Three reviews, one workflow: `claude-review` (correctness + CLAUDE.md), `security-review`
# (exploitable vulnerabilities only) and `design-review` (architecture and API design). The
# shape -- tag mode, prose prompts, an explicit tool allowlist, no plugin and no subagent
# fan-out -- is DELIBERATE and was paid for with four debugging cycles: the full forensics,
# the upstream issues that forced it, and the operational facts live in
# `.docs/claude-review.md`. Read that document before changing this file. Modelled on
# https://github.com/OneRedOak/claude-code-workflows, re-tailored for this repository.
#
# The determinism this file buys, in two sentences: tag mode creates the tracking comment
# BEFORE Claude runs, so a dead run leaves a visibly stuck comment instead of silence; and a
# prose prompt reviewed inline spawns no Task subagents, so the Action's known mid-turn
# session-end bug (anthropics/claude-code-action#1515, #1646) has nothing to kill.
#
# `use_sticky_comment` is deliberately ABSENT: its lookup claims the FIRST Claude comment on
# the pull request, so three parallel jobs would race to overwrite one tracking comment and
# lose two reviews nondeterministically. Three comments per push is the price of three
# deterministic reviews; the re-review discipline in each prompt keeps later pushes short.
#
# A bare self-hosted runner selected through `runs_on` must be provisioned before these jobs
# pass -- and NOT with host Node: the Actions runner ships its own (`externals/node*`) and
# executes every JavaScript action with it, on self-hosted hosts too. What a minimal host
# lacks is what `anthropics/claude-code-action` shells OUT to. Every step of that composite
# declares `shell: bash`; `oven-sh/setup-bun` unpacks Bun through `@actions/tool-cache`,
# which resolves `unzip` and throws when it is absent; Bun installs into `$HOME/.bun/bin`,
# so `$HOME` must be writable; `bun install --production` then resolves the action's
# dependencies from the npm registry; and the checkout needs `git`. So: `bash`, `git` and
# `unzip` on `PATH`, a writable `$HOME`, and egress to `github.com`, `registry.npmjs.org`,
# `api.github.com` and `api.anthropic.com`. A missing one does not fail at job selection --
# it fails minutes in, inside the action, with an error that never names the runner.
jobs:
  claude-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: 'read'
      pull-requests: 'write'
      issues: 'write'
      id-token: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0
        with:
          fetch-depth: 1

      - name: 'Run Claude Code Review'
        id: 'claude-review'
        # The provisioning list in the comment above `jobs:` (and README.md's "Claude Review
        # and Claude Mention" section) describes THIS pin's install chain. `dependency-updates.yaml`
        # exists to make this SHA move; re-read both when it does.
        uses: 'anthropics/claude-code-action@a60f3e1db3edbceed2b1e6c6a9d34c36b8a15eba' # v1.0.209
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tag mode: the prompt below is CONTEXT the action injects into its own template,
          # not a command it executes -- which is why it is prose, never a slash command
          # (a `/plugin:command` here loads and silently never runs; see the doc).
          track_progress: true
          # The complete BASH allowlist and the MCP-server selector -- `Read`/`Grep`/`Glob`
          # need no listing, every segment of a pipe must match, and the five text utilities
          # are the read-only ones (`sed`/`awk`/`find`/`sort`/`uniq` can write or execute).
          # Full semantics: `.docs/claude-review.md`.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh:*),Bash(git:*),Bash(grep:*),Bash(cat:*),Bash(wc:*),Bash(head:*),Bash(tail:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are acting as the principal-engineer reviewer for this repository. Your mandate
            is pragmatic quality: determine whether the change definitively improves the
            codebase, and block only on what matters. Assume linters, formatters, type checkers
            and the test suite run as their own CI jobs -- never report what they would catch.

            Run the 4-agent pipeline yourself, as four sequential passes inside this session.
            Never dispatch background or parallel agents, and never end your turn while any
            work is pending: this session is not resumed, and anything unfinished when your
            turn ends is lost.

            1. **CLAUDE.md compliance** -- audit the changes against the repository's CLAUDE.md
               (and any CLAUDE.md in the changed directories). Flag only what those files call
               out explicitly; they guide code-writing, so not every instruction applies to
               review.
            2. **Bug scan** -- read the full diff (`gh pr diff`) and hunt real defects in the
               changed lines: logic errors, broken edge cases, race conditions, error paths
               that swallow or mis-handle failures. Large bugs only; no nitpicks.
            3. **Git history** -- use `git log` and `git blame` on the modified files to catch
               regressions of earlier fixes and changes that contradict the recorded intent.
            4. **Code-comment adherence** -- read the comments in the modified files and verify
               the change honours the constraints and warnings they document.

            Then apply the >=80 confidence filter to everything the passes produced. Score each
            candidate finding 0-100: 0 = does not survive scrutiny or is pre-existing; 25 =
            plausible but unverified; 50 = real but minor or rare; 75 = verified, likely hit in
            practice, or explicitly required by CLAUDE.md; 100 = certain and frequent. Report
            only findings scoring >=80. Treat as automatic false positives: pre-existing
            issues, real issues on lines this pull request did not modify, anything a linter or
            the test suite would catch, general code-quality preferences CLAUDE.md does not
            demand, and intentional behaviour changes that match the pull request's stated
            purpose.

            Post your review on every run -- never end silently; a silent run is
            indistinguishable from a crashed one. Anchor line-specific findings as inline
            comments; put the overall review in your tracking comment. Open with two or three
            sentences on what you understood this pull request to change and why, so a reader
            can tell the diff was read. When nothing survives the filter, say so explicitly,
            name what you checked and found clean, and list every finding you raised and then
            dropped -- one line each with the reason. A rejected finding is evidence the filter
            ran; an omitted one is indistinguishable from a check that never happened.

            If you already reviewed this pull request (look for your earlier review in
            `gh pr view --comments`), do not review it again from scratch: verify each of your
            previous findings -- addressed, not addressed, or declined by the author -- and add
            nothing new.
          show_full_output: true
          display_report: true
        env:
          # Pins the model without touching `claude_args`: parse-sdk-options.ts resolves
          # `model: options.model || modelFromClaudeArgs`, so this wins and the allowlist
          # stays purely about tools. Without it the CLI default resolves to Sonnet in CI.
          ANTHROPIC_MODEL: 'claude-opus-5'

  security-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: 'read'
      pull-requests: 'write'
      issues: 'write'
      id-token: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0
        with:
          fetch-depth: 1

      - name: 'Run Claude Security Review'
        id: 'security-review'
        uses: 'anthropics/claude-code-action@a60f3e1db3edbceed2b1e6c6a9d34c36b8a15eba' # v1.0.209
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh:*),Bash(git:*),Bash(grep:*),Bash(cat:*),Bash(wc:*),Bash(head:*),Bash(tail:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a senior security engineer conducting a focused security review of this
            pull request. This is not a general code review: examine ONLY the security
            implications newly introduced by this diff (`gh pr diff` is the boundary), and do
            not comment on pre-existing concerns.

            Do all analysis yourself, sequentially, inside this session. Never dispatch
            background or parallel agents, and never end your turn while any work is pending:
            this session is not resumed, and anything unfinished when your turn ends is lost.

            Apply the >=80 confidence filter throughout: report a finding only when you are at
            least 80% confident it is real AND exploitable in practice. Minimize false
            positives; skip theoretical issues, hardening advice, style concerns and
            low-impact findings. Do NOT report denial-of-service or rate-limiting/resource-
            exhaustion issues.

            Phase 1 -- context: identify the security patterns this repository already uses
            (validation, sanitization, secret handling, pinning) so you can spot deviations
            rather than re-litigate the model.
            Phase 2 -- examine the diff against these categories:

            - **Injection**: SQL/NoSQL, command injection in shell or subprocess calls,
              template injection, path traversal, XXE.
            - **Authentication and authorization**: bypass logic, privilege escalation,
              session and token handling flaws, missing checks on protected surfaces.
            - **Secrets and crypto**: hardcoded credentials or tokens, secrets reaching argv
              or logs or artifacts, weak algorithms, disabled verification.
            - **Code execution and deserialization**: eval-like constructs, unsafe
              deserialization, piping a downloaded script straight into a shell, unpinned or
              checksum-free downloads executed on the runner.
            - **Data exposure**: sensitive data in logs or errors, PII mishandling, debug
              surfaces left enabled.

            Even an issue only exploitable from the local network can be HIGH severity.

            Post your review on every run -- never end silently. Anchor findings to their
            lines as inline comments, each with: severity, the concrete exploitation scenario,
            and the minimal fix. Put the overall verdict in your tracking comment, opening
            with two or three sentences on what this pull request changes. When nothing
            survives the filter, say so explicitly, name the categories you checked against
            the diff, and list every candidate you raised and then dropped with the reason.

            If you already posted a security review of this pull request (look for it in
            `gh pr view --comments`), verify each of your previous findings instead of
            re-reviewing, and add nothing new.
          show_full_output: true
          display_report: true
        env:
          ANTHROPIC_MODEL: 'claude-opus-5'

  design-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: 'read'
      pull-requests: 'write'
      issues: 'write'
      id-token: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0
        with:
          fetch-depth: 1

      - name: 'Run Claude Design Review'
        id: 'design-review'
        uses: 'anthropics/claude-code-action@a60f3e1db3edbceed2b1e6c6a9d34c36b8a15eba' # v1.0.209
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh:*),Bash(git:*),Bash(grep:*),Bash(cat:*),Bash(wc:*),Bash(head:*),Bash(tail:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an elite software-design reviewer -- a principal engineer judging the
            design of this change, not its line-level correctness (a separate review covers
            bugs, and a third covers security; do not duplicate either). Your philosophy is
            net positive over perfection: approve what definitively improves the design, and
            raise only what a principal engineer would actually raise. Prefix minor, optional
            polish with "Nit:".

            Do all analysis yourself, sequentially, inside this session. Never dispatch
            background or parallel agents, and never end your turn while any work is pending:
            this session is not resumed, and anything unfinished when your turn ends is lost.

            Review the diff (`gh pr diff` is the boundary) against this hierarchy, using the
            repository's CLAUDE.md and existing structure as the source of truth for its
            conventions:

            1. **Architectural integrity** -- does the change fit the repository's established
               architecture and patterns, or fork a second way of doing something it already
               does one way? Is new logic placed in the layer and directory the repository
               says it belongs in?
            2. **Modularity and simplicity** -- single responsibility, no unnecessary
               abstraction or premature generality; could a simpler design achieve the same
               goal? Is the pull request atomic, or does it bundle unrelated changes?
            3. **Contracts and compatibility** -- are new or changed public interfaces
               (inputs, outputs, job names, file formats, APIs) coherent, consistently named,
               and backward compatible? A breaking change must be flagged as such and follow
               the repository's breaking-change conventions.
            4. **Consistency of the whole** -- naming that matches the repository's
               vocabulary, duplication that should reuse an existing mechanism, documentation
               and examples updated where the repository requires them to move with the code.

            Apply the >=80 confidence filter: raise a design concern only when you are
            confident it is real, grounded in the codebase or an established engineering
            principle you can name, and worth an author's time. List what you considered and
            dropped, one line each with the reason.

            Post your review on every run -- never end silently. Anchor location-specific
            concerns as inline comments; put the overall design verdict in your tracking
            comment, opening with two or three sentences on what this pull request changes
            and the design intent you inferred. When the design is sound, say so explicitly
            and name what you evaluated.

            If you already posted a design review of this pull request (look for it in
            `gh pr view --comments`), verify each of your previous findings instead of
            re-reviewing, and add nothing new.
          show_full_output: true
          display_report: true
        env:
          ANTHROPIC_MODEL: 'claude-opus-5'
