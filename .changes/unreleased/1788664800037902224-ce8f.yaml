kind: 'Added'
body: 'added a build-only mode to the `Container Images` workflow and the Makefile, so a container change can be PROVEN before review instead of after publication: `make build` runs the same buildx recipe as `make build-and-push` with `--output=type=cacheonly` in place of `--push`, and the workflow''s `workflow_dispatch` gained a `push` boolean that selects between them and skips the ghcr login entirely when it is off. It defaults to `false`, and the default costs `main` nothing: the event test short-circuits ahead of the input, so a push to `main` never reads it and publishes exactly as before. The default therefore governs the dispatch form alone, where the two mistakes are not the same size -- publishing a branch over a released tag cannot be undone, while forgetting to tick the box costs one re-dispatch'
