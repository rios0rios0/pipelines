# Compatibility name; see corepack-node20.18.3-no-cache.yaml. Forwards to
# `corepack-node.yaml` with the same `APP_PATH` contract.
parameters:
  - name: 'APP_PATH'
    type: 'string'
    default: "$(System.DefaultWorkingDirectory)"

steps:
  - template: 'corepack-node.yaml'
    parameters:
      APP_PATH: "${{ parameters.APP_PATH }}"
