kind: 'Fixed'
body: 'fixed the Semgrep runner''s `.semgrepignore` being left in a consumer''s working tree as an untracked file that `git add -A` would stage -- it had already come close to being committed that way. The runner copies its default into the project root when the project ships none and removes it on the way out, but four install-failure paths return before that line, and so does any interruption of the scan itself. `.semgrepignore` now ships in the `common` fragment of the shared ignore rules, so `make gitignore` covers it like every other file the pipeline writes. A project that wants to track its own is unaffected: the runner copies the default only when the file is absent, `.gitignore` does not apply to a tracked file, and a new one is added with `git add -f` or re-included with a `!` line below the generated block'
time: '2026-09-18T22:55:03.771293000Z'
