kind: 'Added'
body: 'added `checks.yaml`, a language-agnostic reusable workflow that runs the global `basic-checks` stage (rebase status plus the changelog gate) on its own, for a repository that has no build to attach it to. Every `<toolchain>.yaml` already runs that stage as its first job, so a repository with a pipeline has it by construction — but 44 of the 76 repositories across `rios0rios0`, `medhub-life` and `prefy` have no language pipeline at all, 42 of them chlog users, and had no changelog enforcement whatsoever. That gap is how a scheduled job that hand-edited a generated `CHANGELOG.md` reached 46 open pull requests before anything objected: the gate caught it on 15 of 15 repositories where it runs, in under ten seconds, and was simply absent everywhere else. The job name, `target_branch` expression and `if:` are copied verbatim from the toolchain workflows, so a `require-checks` entry naming `code-check > quality:basic-checks` keeps matching if that repository later grows a build. A branch-protection required context does not: GitHub composes a check-run name from the whole chain of job names, and every `-docker` / `-library` / `-binary` wrapper adds a hop the standalone form has no equivalent for, so the full context string differs'
