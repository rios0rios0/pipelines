name: 'CodeQL'

# This repository's OWN code scanning, moved off GitHub's default setup.
#
# Default setup analyses `actions`, `go` and `python` here and needs no file to do it, which is
# exactly why it was the right choice until it was not: it gives the analysis no environment of
# its own. Its runner ships one Go and the CodeQL action sets `GOTOOLCHAIN=local` on purpose, so
# a module whose `go` directive has moved past that image cannot even be resolved -- ten
# consecutive red runs on `main` and on every pull request, reported as a *configuration error*
# rather than as a finding.
#
# There is no version knob in default setup and no file to put one in. Advanced setup is the
# knob. Nothing about the analysis was weakened by the move: the same three languages, the same
# weekly cadence. It has since grown stricter with the action every consumer runs: the
# `security-and-quality` suite `make codeql` uses, and a gate that fails the job on any finding
# `.codeql-false-positives` does not list. This repository's own root `codeql-config.yml` (which
# drops `actions/unpinned-tag`, see it for why) and root `.codeql-false-positives` (each entry dated
# and explained) are read by this analysis alone: a consumer's scan reads the consumer's root.
#
# **The action is referenced by LOCAL PATH, not `rios0rios0/pipelines/...@main`.** Two reasons,
# both of which cost a CI cycle to learn: `@main` resolves to the action as published on the
# default branch, so a pull request that changes the action tests the OLD copy and reports
# green on code nobody ran; and an external `uses:` has to be pinned to a commit SHA, which
# SonarCloud's `githubactions:S7637` flags as a high-severity finding when it is a branch name.
# A local path is neither -- it is this commit's own code, which is the thing under test.
#
# The local path is also why `actions/checkout` runs here: a `./`-referenced action has to exist
# on disk before the runner can resolve it, and the composite's own checkout happens too late to
# help. The second checkout inside the action is harmless.

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  # Default setup ran weekly. Keeping that cadence matters for a reason unrelated to this
  # repository's own code: CodeQL ships new queries continuously, so a scheduled run is what
  # finds a vulnerability class that was not modelled on the day the code was last touched.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: 'read'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      # `security-events: write` is what the SARIF upload needs, and it is granted to this job
      # rather than to the workflow so a step added later does not inherit it.
      security-events: 'write'
      actions: 'read'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The three default setup was configured with. `go` was waived from 2026-08-21, in a job
        # of its own that announced the gap: the newest CodeQL bundle then, 2.26.3, carried a Go
        # extractor built with go1.26, and that extractor refuses a newer language version --
        # `package requires newer Go version go1.27 (application built with go1.26)` -- while
        # `database create` still exits 0 over the broken types. Every bundle from
        # `codeql-bundle-v2.26.4` (2026-08-26) is built with go1.27, so Go is analysed again, and
        # `make test-go-module-toolchain` (section 4) fails if it leaves this list.
        language: [ 'actions', 'go', 'python' ]
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - uses: './github/global/stages/20-security/codeql'
        with:
          codeql_language: "${{ matrix.language }}"
          # Two Go modules live here: the Go helpers at the root and the tor-proxy health probe.
          # Autobuild extracts both from the repository root under ONE Go, set up from this file
          # with `GOTOOLCHAIN=local`, so it must be the module with the newer `go` directive --
          # the health probe's, whose Go reads the root module too. `make test-go-module-toolchain`
          # (section 3) fails if another module's directive overtakes the one named here.
          #
          # Autobuild runs `make` first, as CodeQL's Go autobuilder does wherever a Makefile
          # exists. Here the default goal is `login`, a `docker login` that fails without a
          # terminal; the autobuilder logs that and goes on to fetch and extract both modules.
          go_version_file: 'global/containers/tor-proxy.latest/health/go.mod'
