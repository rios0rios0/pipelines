include:
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/terra/abstracts/terra.yaml'
  - remote: 'https://raw.githubusercontent.com/rios0rios0/pipelines/main/gitlab/global/abstracts/scripts-repo.yaml'

style:terra-format:
  extends: '.terra'
  stage: 'code check (style/quality)'
  script:
    - terra format
    - git diff --exit-code

style:tflint:
  extends: '.terra'
  stage: 'code check (style/quality)'
  script:
    - "$SCRIPTS_DIR/global/scripts/languages/terraform/tflint/install.sh"
    - tflint --chdir . --recursive

# Enforces the team's file-ordering standard (dependency/inputs in root.hcl,
# .HCL/.ENV grouping in variables.tf, heaviest->lightest providers.tf,
# main.tf-ordered outputs.tf). The checker is a Go helper built from the
# pipelines checkout, so the job runs on the same Go image as '.terra' -- at
# least the `go` directive of this repository's `go.mod`, and git is already
# in it -- but needs no terra CLI or Terraform, so it extends '.scripts-repo'
# rather than '.terra'. Run 'order-check/run.sh --fix' locally to auto-sort.
order:check:
  extends: '.scripts-repo'
  image: 'golang:1.27.4@sha256:08bcb99a38f85a265f9a93d1d3323e2440eec333380f3ea26ee0dec9264bb41c'
  stage: 'code check (style/quality)'
  variables:
    REPORT_PATH: 'build/reports'
  script:
    - "$SCRIPTS_DIR/global/scripts/languages/terraform/order-check/run.sh"
  artifacts:
    when: 'always'
    paths:
      - "${REPORT_PATH}/"
    reports:
      junit: "${REPORT_PATH}/junit-order-check.xml"
