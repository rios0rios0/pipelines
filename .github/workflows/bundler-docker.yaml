on:
  workflow_call:
    inputs:
      working_directory:
        type: 'string'
        required: false
        default: '.'
        description: |
          Path of the Ruby project inside the repository (`.` -- the default -- is the root).
          See bundler.yaml. It scopes the toolchain jobs only: the delivery jobs below stay
          repository-scoped, because a release tag and a Docker build are facts about the
          repository rather than about one directory in it.
      ruby_version:
        type: 'string'
        required: false
        default: ''
        description: |
          Ruby to install, or empty to read it from `<working_directory>/.ruby-version`.
          See bundler.yaml.

jobs:
  bundler:
    uses: 'rios0rios0/pipelines/.github/workflows/bundler.yaml@main'
    with:
      working_directory: '${{ inputs.working_directory }}'
      ruby_version: '${{ inputs.ruby_version }}'

  # fourth stage
  delivery-release:
    name: 'delivery > release'
    runs-on: 'ubuntu-latest'
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: 'release'
        uses: 'rios0rios0/pipelines/github/global/stages/40-delivery/release@main'
    needs: [ 'bundler' ]
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, 'chore/bump-') || contains(github.event.head_commit.message, 'chore(bump)'))"

  delivery-docker:
    name: 'delivery > docker'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'rios0rios0/pipelines/github/global/stages/40-delivery/docker@main'
        with:
          tag_name: "${{ needs.delivery-release.outputs.tag_name }}"
    needs: [ 'bundler', 'delivery-release' ]
    if: "!failure() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))"
