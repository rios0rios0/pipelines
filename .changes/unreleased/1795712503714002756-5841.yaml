kind: 'Fixed'
body: 'fixed `make lint` and every Go lint job dropping most of a project''s own `.golangci.yml`: the merge onto the shared configuration carried `linters.enable`, removed `linters.disable` from it without writing it, and read only the v1 `linters-settings` key. A project''s goimports `local-prefixes` (`formatters.settings`), its v2 `linters.settings`, its `run`, `issues` and exclusions never arrived, and a linter of v2''s default set stayed on whatever it disabled, so a project that needed any of them kept a lint script of its own. Every section of a version 2 file now arrives: `linters.disable` written, the settings and `run`, `issues`, `output` and `severity` deep-merged, exclusion rules and paths added to the shared ones. The merged result is checked with `golangci-lint config verify` before the lint runs. `make test ONLY=yaml-merge` holds it'
time: '2026-11-26T17:01:43.71385381Z'
