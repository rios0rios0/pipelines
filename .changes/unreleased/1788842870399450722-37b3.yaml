body: 'added `promote_release` to the six workflows that deploy on a tag or feed one that does -- `yarn-cloudflare.yaml`, `npm-cloudflare.yaml`, `dart-cloudflare.yaml`, `go-docker.yaml`, `go-flyio.yaml` and `go-render.yaml` -- and the `delivery > release` job to the three Cloudflare ones, which never cut a tag: a bump merged to `main` moved the version and the changelog and created nothing, so the production deploy, which only a tag run reaches, never ran, and the consumers'' changelogs carried versions no tag named. The job is the `*-docker.yaml` family''s, `needs:` the quality gate, and takes the release action''s new `promote` input. The tag the action creates is pushed with the job''s `GITHUB_TOKEN`, and GitHub starts no workflow run from an event that token caused, so until now a human pushed the same tag again by hand to reach production -- the backend''s `0.1.0` sat at exactly that step. `workflow_dispatch` is the one event GitHub exempts, so `global/scripts/shared/promote-release.sh` dispatches the CALLING workflow on `refs/tags/X.Y.Z` with that same token, and the run that starts has `github.ref_type == ''tag''` as a pushed tag''s would; the token reaches curl through a config on stdin, never argv, each refusal names its fix (`actions: write` not granted, no `workflow_dispatch:` at the tag, the file not found at the tag), 5xx and transport failures are retried, and a tag ref is never dispatched again. Off by default: a caller must declare `on: workflow_dispatch:` and grant `actions: write` beside `contents: write`. `make test-release-promotion` runs the script against a stub `curl` and pins the wiring. **BREAKING CHANGE:** the release job is not gated on `promote_release` -- a bump merge cuts a tag whether or not the consumer promotes -- so `yarn-cloudflare.yaml`, `npm-cloudflare.yaml` and `dart-cloudflare.yaml` now require `contents: write` of every caller, where `contents: read` was enough before; a consumer that does not grant it fails the new job on its next bump merge'
