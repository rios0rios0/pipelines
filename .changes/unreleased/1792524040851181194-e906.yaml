kind: 'Security'
body: 'passed through `env:` every value the GitHub Actions composites and reusable workflows still interpolated into a `run:` script, clearing the 21 `actions/code-injection/medium` findings that failed this repository''s CodeQL scan on `main`. The branch, language, path, threshold and binary-name inputs of the basic-checks, Semgrep, openapi-sync, Go test and Go binary stages, and `SCRIPTS_DIR` in the five SonarQube jobs, now reach the shell as data, so a crafted value can no longer run as a command. The inputs that are shell by contract -- `build_command` of the Dart build and the Cloudflare, Netlify and Vercel deployments, and the `command` of openapi-sync and pdm-lint -- run as `eval` on an `env:` value in the step''s own `bash -e -o pipefail` shell, so they behave exactly as before. Pull requests missed them because CodeQL analyses a pull request diff-informed, reporting only findings in the lines it changes; README and CLAUDE.md now say so'
