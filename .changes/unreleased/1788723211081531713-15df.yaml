kind: 'Added'
body: 'added coverage-detection regression tests to `make test-sonarqube`. The suite created no coverage file in any of its 28 scenarios, so `COVERAGE_FOUND` was false throughout and the branch holding the Go and JaCoCo derivations never ran once -- which is how two defects reached `main` in consecutive commits, both landing in the branch that overrides the repositorys own `sonar.*.reportPaths` with an empty value. The four new cases run the real script against a project directory containing a space, a plain subfolder, a root-only repository resolved three ways (`SONAR_PROJECT_DIR` unset, `.`, and pointing at a missing directory), and a tree with no coverage at all; each was verified to fail when its defect is reintroduced'
